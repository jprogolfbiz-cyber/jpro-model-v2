<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#050505" />

  <title>JPro Model V2</title>

  <link rel="manifest" href="manifest.webmanifest" />

  <style>
    :root {
      --bg: #050505;
      --card: #0d0d0d;
      --card2: #111111;
      --border: #252525;
      --border2: #343434;
      --text: #ffffff;
      --muted: #8e8e93;
      --soft: #b7b7bd;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding:
        calc(12px + env(safe-area-inset-top))
        18px
        14px;
      background: rgba(5, 5, 5, 0.96);
      border-bottom: 1px solid #151515;
      backdrop-filter: blur(18px);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1.2px;
    }

    .engine-badge {
      flex-shrink: 0;
      border: 1px solid var(--border2);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .8px;
      color: #d7d7dc;
      background: #0c0c0c;
    }

    .content {
      padding: 20px 16px 10px;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .page-title {
      margin: 0;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -1.4px;
      font-weight: 900;
    }

    .page-subtitle {
      margin: 9px 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .section-title {
      margin: 27px 0 12px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #c5c5ca;
      text-transform: uppercase;
    }

    .card {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      margin-bottom: 11px;
      overflow: hidden;
    }

    .tap-card {
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
    }

    .tap-card:active {
      transform: scale(.985);
      border-color: #555;
    }

    .game-card {
      padding: 17px;
    }

    .game-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .game-name {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .game-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .arrow {
      font-size: 21px;
      color: #777;
      padding-top: 1px;
    }

    .player-card {
      padding: 16px;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .player-name {
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.25px;
    }

    .player-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .prop-count {
      color: #bdbdc2;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: #c9c9ce;
      padding: 0;
      margin: 0 0 18px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }

    .hero {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 19px;
      background:
        linear-gradient(
          180deg,
          #121212 0%,
          #0a0a0a 100%
        );
      margin-bottom: 13px;
    }

    .hero-player {
      font-size: 27px;
      font-weight: 950;
      letter-spacing: -1px;
      line-height: 1.05;
    }

    .hero-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .intel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 17px;
    }

    .intel-box {
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #090909;
      padding: 13px;
    }

    .intel-label {
      font-size: 9px;
      letter-spacing: 1.2px;
      color: var(--muted);
      font-weight: 900;
      text-transform: uppercase;
    }

    .intel-value {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 900;
    }

    .intel-small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .analysis-card {
      padding: 17px;
    }

    .analysis-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    .analysis-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .score-pill {
      flex-shrink: 0;
      border: 1px solid var(--border2);
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .analysis-copy {
      color: #d0d0d4;
      font-size: 13px;
      line-height: 1.55;
    }

    .evidence {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .evidence-box {
      padding: 11px 8px;
      text-align: center;
      border: 1px solid #222;
      border-radius: 11px;
      background: #090909;
    }

    .evidence-value {
      font-size: 15px;
      font-weight: 900;
    }

    .evidence-label {
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .prop-card {
      padding: 17px;
    }

    .prop-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .prop-name {
      font-size: 16px;
      font-weight: 900;
    }

    .prop-projection {
      text-align: right;
    }

    .projection-number {
      font-size: 22px;
      font-weight: 950;
    }

    .projection-label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .range-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 15px;
    }

    .range-box {
      border: 1px solid #222;
      border-radius: 9px;
      background: #090909;
      padding: 9px 4px;
      text-align: center;
    }

    .range-value {
      font-size: 12px;
      font-weight: 850;
    }

    .range-label {
      color: var(--muted);
      font-size: 8px;
      margin-top: 3px;
    }

    .prop-context {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid #202020;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-pill {
      border: 1px solid #292929;
      border-radius: 999px;
      padding: 6px 8px;
      color: #c4c4c8;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .35px;
    }

    .calculator-toggle {
      width: 100%;
      margin-top: 14px;
      border: 1px solid #2c2c2c;
      border-radius: 11px;
      background: #111;
      color: #fff;
      padding: 11px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .7px;
      cursor: pointer;
    }

    .calculator {
      display: none;
      margin-top: 11px;
      padding-top: 13px;
      border-top: 1px solid #202020;
    }

    .calculator.open {
      display: block;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .input-wrap label {
      display: block;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 6px;
      font-weight: 800;
    }

    .input-wrap input {
      width: 100%;
      border: 1px solid #303030;
      border-radius: 10px;
      background: #080808;
      color: #fff;
      padding: 11px;
      outline: none;
    }

    .calc-button {
      width: 100%;
      margin-top: 9px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      padding: 12px;
      font-size: 11px;
      font-weight: 950;
      cursor: pointer;
    }

    .calc-result {
      margin-top: 11px;
      border: 1px solid #242424;
      border-radius: 11px;
      padding: 12px;
      display: none;
      font-size: 12px;
      line-height: 1.55;
      color: #d2d2d6;
    }

    .calc-result.show {
      display: block;
    }

    .risk-list {
      margin: 0;
      padding-left: 18px;
      color: #c8c8cd;
      font-size: 13px;
      line-height: 1.55;
    }

    .risk-list li {
      margin-bottom: 7px;
    }

    .empty {
      padding: 24px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .loading {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 40;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(8, 8, 8, .97);
      border-top: 1px solid #202020;
      padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));
      backdrop-filter: blur(18px);
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: #666;
      padding: 9px 5px;
      font-size: 9px;
      letter-spacing: .7px;
      font-weight: 900;
      cursor: pointer;
    }

    .nav-button.active {
      color: #fff;
    }

    .nav-icon {
      display: block;
      font-size: 17px;
      margin-bottom: 4px;
    }

    @media (max-width: 420px) {
      .page-title {
        font-size: 28px;
      }

      .hero-player {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">JPRO</div>
        <div class="engine-badge" id="engineBadge">
          20K ENGINE
        </div>
      </div>
    </header>

    <main class="content" id="content">
      <div class="loading">
        Loading JPro…
      </div>
    </main>

  </div>

  <nav class="bottom-nav">

    <button
      class="nav-button active"
      id="navGames"
      onclick="showGames()"
    >
      <span class="nav-icon">◫</span>
      GAMES
    </button>

    <button
      class="nav-button"
      id="navMatchups"
      onclick="showMatchups()"
    >
      <span class="nav-icon">◎</span>
      MATCHUPS
    </button>

    <button
      class="nav-button"
      id="navPicks"
      onclick="showPicks()"
    >
      <span class="nav-icon">◆</span>
      JPRO PICKS
    </button>

  </nav>

  <script>

    let jproData = null;
    let currentGame = null;
    let currentPlayerId = null;

    const content =
      document.getElementById("content");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function prettyProp(prop) {

      const labels = {
        passing_yards: "Passing Yards",
        rushing_yards: "Rushing Yards",
        receiving_yards: "Receiving Yards",
        receptions: "Receptions"
      };

      return labels[prop] || prop;
    }

    function setActiveNav(id) {

      document
        .querySelectorAll(".nav-button")
        .forEach(button => {
          button.classList.remove("active");
        });

      const el =
        document.getElementById(id);

      if (el) {
        el.classList.add("active");
      }
    }

    function gameProjections(gameName) {

      return (
        jproData?.projections || []
      ).filter(
        x => x.game === gameName
      );
    }

    function playerProjections(
      gameName,
      playerId
    ) {

      return gameProjections(
        gameName
      ).filter(
        x =>
          String(x.player_id) ===
          String(playerId)
      );
    }

    function uniquePlayers(gameName) {

      const map = new Map();

      gameProjections(
        gameName
      ).forEach(x => {

        const key =
          String(x.player_id);

        if (!map.has(key)) {

          map.set(
            key,
            {
              player_id:
                x.player_id,

              player:
                x.player,

              team:
                x.team,

              opponent:
                x.opponent,

              position:
                x.position,

              game:
                x.game,

              props:
                []
            }
          );
        }

        map.get(
          key
        ).props.push(
          x
        );
      });

      return Array.from(
        map.values()
      ).sort(
        (a, b) =>
          a.team.localeCompare(
            b.team
          )
          ||
          a.player.localeCompare(
            b.player
          )
      );
    }

    function showGames() {

      currentGame = null;
      currentPlayerId = null;

      setActiveNav(
        "navGames"
      );

      const games =
        jproData?.games || [];

      content.innerHTML = `
        <div class="eyebrow">
          ${escapeHtml(
            jproData?.slate ||
            "Current Slate"
          )}
        </div>

        <h1 class="page-title">
          Games
        </h1>

        <div class="page-subtitle">
          Select a matchup to open the JPro player board.
        </div>

        ${
          games.length
          ?
          games.map(game => {

            const projections =
              gameProjections(
                game.game
              );

            const players =
              new Set(
                projections.map(
                  x => x.player_id
                )
              ).size;

            return `
              <div
                class="card game-card tap-card"
                onclick='showGame(
                  ${JSON.stringify(
                    game.game
                  )}
                )'
              >
                <div class="game-top">

                  <div>

                    <div class="game-name">
                      ${escapeHtml(
                        game.game
                      )}
                    </div>

                    <div class="game-meta">
                      ${players} modeled players
                      ·
                      ${projections.length} props
                    </div>

                  </div>

                  <div class="arrow">
                    ›
                  </div>

                </div>
              </div>
            `;
          }).join("")
          :
          `
            <div class="empty">
              No games were found in the current JPro slate.
            </div>
          `
        }
      `;
    }

    function showGame(gameName) {

      currentGame =
        gameName;

      currentPlayerId =
        null;

      setActiveNav(
        "navGames"
      );

      const players =
        uniquePlayers(
          gameName
        );

      content.innerHTML = `
        <button
          class="back-button"
          onclick="showGames()"
        >
          ‹ Back to Games
        </button>

        <div class="eyebrow">
          Player Board
        </div>

        <h1 class="page-title">
          ${escapeHtml(
            gameName
          )}
        </h1>

        <div class="page-subtitle">
          Select a player for full JPro analysis.
        </div>

        ${
          players.length
          ?
          players.map(player => {

            const role =
              player.props[0]?.role || {};

            return `
              <div
                class="card player-card tap-card"
                onclick='showPlayer(
                  ${JSON.stringify(
                    gameName
                  )},
                  ${JSON.stringify(
                    String(
                      player.player_id
                    )
                  )}
                )'
              >

                <div class="player-row">

                  <div>

                    <div class="player-name">
                      ${escapeHtml(
                        player.player
                      )}
                    </div>

                    <div class="player-meta">
                      ${escapeHtml(
                        player.team
                      )}
                      ·
                      ${escapeHtml(
                        player.position
                      )}
                      ·
                      vs
                      ${escapeHtml(
                        player.opponent
                      )}
                    </div>

                  </div>

                  <div class="prop-count">
                    ${player.props.length}
                    PROPS
                    ›
                  </div>

                </div>

                ${
                  role.role_label
                  ?
                  `
                    <div
                      class="prop-context"
                      style="margin-top:12px;
                             padding-top:12px;"
                    >
                      <span class="mini-pill">
                        ROLE ${escapeHtml(
                          role.role_label
                        )}
                        ${Number(
                          role.role_score || 0
                        ).toFixed(1)}
                      </span>
                    </div>
                  `
                  :
                  ""
                }

              </div>
            `;
          }).join("")
          :
          `
            <div class="empty">
              No modeled players found for this game.
            </div>
          `
        }
      `;
    }

    function roleDescription(
      player,
      role
    ) {

      const label =
        role.role_label ||
        "UNKNOWN";

      const score =
        Number(
          role.role_score || 0
        ).toFixed(1);

      const position =
        player.position;

      if (position === "QB") {

        const pass =
          Number(
            role.passing_yards_recent_avg || 0
          ).toFixed(1);

        const rush =
          Number(
            role.rushing_yards_recent_avg || 0
          ).toFixed(1);

        return `
          JPro grades
          ${escapeHtml(player.player)}
          as a
          <strong>${escapeHtml(label)}</strong>
          role (${score}/100).
          His recent pregame sample has produced
          ${pass} passing yards and
          ${rush} rushing yards per game.
        `;
      }

      if (position === "RB") {

        const rush =
          Number(
            role.rushing_yards_recent_avg || 0
          ).toFixed(1);

        const rec =
          Number(
            role.receiving_yards_recent_avg || 0
          ).toFixed(1);

        const catches =
          Number(
            role.receptions_recent_avg || 0
          ).toFixed(1);

        return `
          JPro grades
          ${escapeHtml(player.player)}
          as a
          <strong>${escapeHtml(label)}</strong>
          role (${score}/100).
          His recent pregame production averages
          ${rush} rushing yards,
          ${rec} receiving yards and
          ${catches} receptions per game.
        `;
      }

      const rec =
        Number(
          role.receiving_yards_recent_avg || 0
        ).toFixed(1);

      const catches =
        Number(
          role.receptions_recent_avg || 0
        ).toFixed(1);

      return `
        JPro grades
        ${escapeHtml(player.player)}
        as a
        <strong>${escapeHtml(label)}</strong>
        role (${score}/100).
        His recent pregame production averages
        ${rec} receiving yards and
        ${catches} receptions per game.
      `;
    }

    function matchupDescription(
      player,
      prop
    ) {

      const matchup =
        prop.matchup || {};

      const label =
        matchup.matchup_label ||
        "UNKNOWN";

      const score =
        Number(
          matchup.matchup_score || 0
        ).toFixed(1);

      const allowed =
        Number(
          matchup.allowed_per_game || 0
        ).toFixed(1);

      const league =
        Number(
          matchup.league_per_game || 0
        ).toFixed(1);

      const games =
        Number(
          matchup.current_season_games || 0
        );

      let direction =
        "roughly in line with";

      if (
        Number(
          matchup.allowed_vs_league_ratio || 1
        ) > 1.05
      ) {
        direction =
          "above";
      }

      if (
        Number(
          matchup.allowed_vs_league_ratio || 1
        ) < .95
      ) {
        direction =
          "below";
      }

      return `
        ${escapeHtml(
          player.opponent
        )}'s blended defensive profile is
        <strong>${escapeHtml(label)}</strong>
        for ${escapeHtml(
          prettyProp(
            prop.prop
          ).toLowerCase()
        )} (${score}/100).
        The defense has allowed
        ${allowed} per game in this modeled category,
        ${direction} the ${league} league baseline.
        Current-season information is based on
        ${games} game${games === 1 ? "" : "s"}
        and is shrunk toward historical data.
      `;
    }

    function getPrimaryProp(props) {

      if (!props.length) {
        return null;
      }

      const preferred = [
        "passing_yards",
        "rushing_yards",
        "receiving_yards",
        "receptions"
      ];

      let best = null;
      let bestScore = -Infinity;

      props.forEach(prop => {

        const role =
          Number(
            prop.role?.role_score || 0
          );

        const matchup =
          Number(
            prop.matchup?.matchup_score || 50
          );

        const preference =
          preferred.indexOf(
            prop.prop
          );

        const prefBonus =
          preference >= 0
          ? (4 - preference)
          : 0;

        const score =
          role * .55 +
          matchup * .45 +
          prefBonus;

        if (score > bestScore) {
          bestScore = score;
          best = prop;
        }
      });

      return best;
    }

    function riskFactors(
      player,
      primaryProp
    ) {

      const risks = [];

      const role =
        primaryProp?.role || {};

      const matchup =
        primaryProp?.matchup || {};

      const games =
        Number(
          role.games_sample || 0
        );

      if (games <= 2) {

        risks.push(
          "The 2026 role sample is still small, so early-season usage can move quickly."
        );
      }

      const matchupGames =
        Number(
          matchup.current_season_games || 0
        );

      if (matchupGames <= 2) {

        risks.push(
          "Opponent matchup data includes only two current-season games and therefore uses historical shrinkage."
        );
      }

      const p10 =
        Number(
          primaryProp?.p10 || 0
        );

      const p90 =
        Number(
          primaryProp?.p90 || 0
        );

      if (
        primaryProp &&
        p90 - p10 > 0
      ) {

        risks.push(
          `The 20K simulation range is wide: the 10th–90th percentile runs from ${p10} to ${p90} ${prettyProp(primaryProp.prop).toLowerCase()}.`
        );
      }

      risks.push(
        "Injuries, inactive decisions, game script and unexpected role changes can materially change a pregame projection."
      );

      return risks;
    }

    function toggleCalculator(

        document.getElementById(

    function histogramProbabilities(
      histogram,
      line
    ) {

      let over = 0;
      let under = 0;
      let push = 0;
      let total = 0;

      (
        histogram || []
      ).forEach(entry => {

        const value =
          Number(entry[0]);

        const count =
          Number(entry[1]);

        total += count;

        if (value > line) {
          over += count;
        }
        else if (value < line) {
          under += count;
        }
        else {
          push += count;
        }
      });

      if (!total) {

        return {
          over: 0,
          under: 0,
          push: 0
        };
      }

      return {
        over:
          over / total,

        under:
          under / total,

        push:
          push / total
      };
    }

    function impliedProbability(
      americanOdds
    ) {

      const odds =
        Number(
          americanOdds
        );

      if (!Number.isFinite(odds)) {
        return null;
      }

      if (odds < 0) {

        return (
          Math.abs(odds) /
          (
            Math.abs(odds) +
            100
          )
        );
      }

      if (odds > 0) {

        return (
          100 /
          (
            odds +
            100
          )
        );
      }

      return null;
    }

    function calculateProp(
      index,
      playerId,
      propName
    ) {

      const lineInput =
        document.getElementById(
          `line-${index}`
        );

      const oddsInput =
        document.getElementById(
          `odds-${index}`
        );

      const result =
        document.getElementById(
          `result-${index}`
        );

      const line =
        Number(
          lineInput?.value
        );

      const odds =
        Number(
          oddsInput?.value
        );

      if (
        !Number.isFinite(line)
      ) {

        result.innerHTML =
          "Enter a valid sportsbook line.";

        result.classList.add(
          "show"
        );

        return;
      }

      const prop =
        playerProjections(
          currentGame,
          playerId
        ).find(
          x => x.prop === propName
        );

      if (!prop) {

        result.innerHTML =
          "Projection unavailable.";

        result.classList.add(
          "show"
        );

        return;
      }

      const probs =
        histogramProbabilities(
          prop.simulation_histogram,
          line
        );

      const implied =
        impliedProbability(
          odds
        );

      const overPct =
        probs.over * 100;

      const underPct =
        probs.under * 100;

      const pushPct =
        probs.push * 100;

      let oddsCopy = "";

      if (implied !== null) {

        const overDifference =
          overPct -
          implied * 100;

        const underDifference =
          underPct -
          implied * 100;

        oddsCopy = `
          <br><br>
          Entered price implied probability:
          <strong>
            ${(implied * 100).toFixed(1)}%
          </strong>.
          <br>
          Over model difference:
          <strong>
            ${overDifference >= 0 ? "+" : ""}
            ${overDifference.toFixed(1)}
            pts
          </strong>.
          <br>
          Under model difference:
          <strong>
            ${underDifference >= 0 ? "+" : ""}
            ${underDifference.toFixed(1)}
            pts
          </strong>.
        `;
      }

      result.innerHTML = `
        <strong>
          ${escapeHtml(
            prettyProp(
              propName
            )
          )}
          ${line}
        </strong>
        <br><br>
        Model Over:
        <strong>
          ${overPct.toFixed(1)}%
        </strong>
        <br>
        Model Under:
        <strong>
          ${underPct.toFixed(1)}%
        </strong>
        ${
          pushPct > 0
          ?
          `
            <br>
            Push:
            <strong>
              ${pushPct.toFixed(1)}%
            </strong>
          `
          :
          ""
        }
        ${oddsCopy}
        <br><br>
        <span style="color:#888;">
          Model probabilities come from the stored
          20,000-outcome empirical distribution.
          They are estimates, not guarantees.
        </span>
      `;

      result.classList.add(
        "show"
      );
    }

    function showMatchups() {

            Number(
              a.matchup?.matchup_score ||
              0

          const scoreB =
            Number(
              b.matchup?.matchup_score ||

      const top =
        projections.slice(

          30

      content.innerHTML = `

    async function loadJPro() {

      try {

        const response =
          await fetch(
            `data/jpro-current-projections.json?v=${Date.now()}`,
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );
        }

        jproData =
          await response.json();

        const badge =
          document.getElementById(
            "engineBadge"
          );

        if (
          jproData.matchup_intelligence
          &&
          jproData.role_intelligence
        ) {

          badge.textContent =
            "JPRO INTELLIGENCE";
        }
        else {

          badge.textContent =
            "20K ENGINE";
        }

        showGames();

      }
      catch (error) {

        console.error(error);

        content.innerHTML = `
          <div class="eyebrow">
            JPro
          </div>

          <h1 class="page-title">
            Engine Offline
          </h1>

          <div class="page-subtitle">
            The latest JPro data could not be loaded.
          </div>

          <div class="empty">
            Refresh the app after the GitHub workflow
            has finished publishing the latest JSON.
          </div>
        `;
      }
    }

    if (

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "sw.js"
          ).catch(
            error =>
              console.log(
                "SW:",
                error

        }
      );
    }
