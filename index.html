<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#050505">

<title>JPro Model — Gameday</title>

<style>

*{box-sizing:border-box}

:root{

  --bg:#050505;

  --card:#0d0d0d;

  --card2:#121212;

  --line:#252525;

  --line2:#343434;

  --text:#fff;

  --muted:#999;

  --soft:#cfcfcf;

  --good:#dfffe3;

  --warn:#fff4c2;

}

body{

  margin:0;

  background:var(--bg);

  color:var(--text);

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

  padding-bottom:110px;

}

button,input,select{

  font:inherit;

}

button{

  cursor:pointer;

}

.app{

  width:100%;

  max-width:760px;

  margin:auto;

  padding:18px 16px 30px;

}

.header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:8px 2px 18px;

}

.logo{

  font-weight:1000;

  letter-spacing:-1.5px;

  font-size:27px;

}

.logo span{

  color:#777;

}

.engine{

  border:1px solid var(--line);

  border-radius:999px;

  padding:7px 10px;

  font-size:10px;

  letter-spacing:.7px;

  color:#bbb;

  font-weight:900;

}

.hero{

  border:1px solid var(--line);

  border-radius:20px;

  background:linear-gradient(145deg,#101010,#080808);

  padding:20px;

  margin-bottom:14px;

}

.kicker{

  color:#8f8f8f;

  font-size:10px;

  letter-spacing:1.6px;

  font-weight:1000;

  text-transform:uppercase;

}

.game{

  font-size:32px;

  line-height:1;

  letter-spacing:-1.5px;

  font-weight:1000;

  margin-top:10px;

}

.gameSub{

  color:#aaa;

  font-size:13px;

  line-height:1.5;

  margin-top:9px;

}

.qbs{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:16px;

}

.qb{

  border:1px solid var(--line);

  border-radius:12px;

  background:#090909;

  padding:11px;

}

.qb small{

  color:#777;

  display:block;

  font-size:9px;

  letter-spacing:1px;

  font-weight:900;

}

.qb strong{

  display:block;

  margin-top:4px;

  font-size:13px;

}

.warning{

  margin-top:12px;

  padding:11px 12px;

  border:1px solid #383838;

  border-radius:12px;

  background:#111;

  color:#bdbdbd;

  font-size:11px;

  line-height:1.5;

}

.tabs{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:7px;

  margin:15px 0;

}

.tab{

  border:1px solid var(--line);

  color:#999;

  background:#090909;

  border-radius:12px;

  padding:11px 6px;

  font-size:11px;

  font-weight:900;

}

.tab.active{

  background:#fff;

  color:#000;

  border-color:#fff;

}

.filters{

  display:flex;

  gap:7px;

  overflow:auto;

  padding-bottom:7px;

  scrollbar-width:none;

}

.filters::-webkit-scrollbar{

  display:none;

}

.filter{

  white-space:nowrap;

  border:1px solid var(--line);

  color:#aaa;

  background:#090909;

  border-radius:999px;

  padding:8px 12px;

  font-size:10px;

  font-weight:900;

}

.filter.active{

  color:#000;

  background:#fff;

  border-color:#fff;

}

.search{

  width:100%;

  border:1px solid var(--line);

  background:#0a0a0a;

  color:white;

  border-radius:13px;

  padding:13px;

  outline:none;

  margin:8px 0 13px;

}

.sectionTitle{

  display:flex;

  align-items:end;

  justify-content:space-between;

  margin:17px 2px 9px;

}

.sectionTitle h2{

  margin:0;

  font-size:18px;

  letter-spacing:-.5px;

}

.sectionTitle span{

  color:#777;

  font-size:10px;

}

.card{

  border:1px solid var(--line);

  background:var(--card);

  border-radius:16px;

  padding:15px;

  margin-bottom:10px;

}

.playerTop{

  display:flex;

  justify-content:space-between;

  gap:12px;

  align-items:start;

}

.playerName{

  font-size:17px;

  font-weight:1000;

  letter-spacing:-.4px;

}

.playerMeta{

  color:#888;

  font-size:10px;

  margin-top:3px;

  font-weight:800;

}

.badge{

  display:inline-block;

  border:1px solid #333;

  background:#151515;

  border-radius:999px;

  padding:5px 8px;

  font-size:8px;

  letter-spacing:.6px;

  font-weight:1000;

  white-space:nowrap;

}

.badge.ready{

  background:#f2fff3;

  color:#0b4413;

  border-color:#f2fff3;

}

.badge.review{

  background:#fff9dc;

  color:#5a4900;

  border-color:#fff9dc;

}

.propGrid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:7px;

  margin-top:13px;

}

.metric{

  border:1px solid var(--line);

  border-radius:11px;

  padding:10px;

  background:#090909;

}

.metric small{

  display:block;

  color:#777;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;

  text-transform:uppercase;

}

.metric strong{

  display:block;

  font-size:16px;

  margin-top:4px;

}

.openBtn{

  width:100%;

  margin-top:11px;

  padding:11px;

  border-radius:11px;

  border:1px solid #333;

  background:#161616;

  color:#fff;

  font-weight:900;

  font-size:11px;

}

.openBtn:active{

  transform:scale(.99);

}

.back{

  border:0;

  background:transparent;

  color:#aaa;

  padding:5px 0 13px;

  font-size:12px;

  font-weight:800;

}

.bigName{

  font-size:30px;

  font-weight:1000;

  letter-spacing:-1.2px;

}

.sub{

  color:#8b8b8b;

  font-size:11px;

  margin-top:5px;

}

.analysisCard{

  border:1px solid var(--line);

  background:var(--card);

  border-radius:16px;

  padding:16px;

  margin-top:10px;

}

.analysisCard h3{

  margin:0 0 12px;

  font-size:13px;

  letter-spacing:.3px;

}

.analysisCard p{

  color:#c4c4c4;

  font-size:12px;

  line-height:1.55;

  margin:7px 0;

}

.analysisCard ul{

  margin:7px 0 0;

  padding-left:18px;

}

.analysisCard li{

  color:#bcbcbc;

  font-size:11px;

  line-height:1.5;

  margin:6px 0;

}

.projectionHero{

  display:grid;

  grid-template-columns:1.15fr .85fr;

  gap:8px;

}

.projMain{

  border:1px solid #363636;

  border-radius:15px;

  background:#111;

  padding:15px;

}

.projMain small{

  display:block;

  color:#777;

  font-size:9px;

  font-weight:900;

}

.projMain strong{

  display:block;

  font-size:31px;

  margin-top:4px;

  letter-spacing:-1px;

}

.range{

  display:grid;

  grid-template-columns:repeat(5,1fr);

  gap:5px;

  margin-top:8px;

}

.range div{

  border:1px solid var(--line);

  border-radius:9px;

  padding:8px 3px;

  text-align:center;

  background:#080808;

}

.range small{

  display:block;

  color:#666;

  font-size:7px;

  font-weight:900;

}

.range strong{

  font-size:11px;

}

.tdHero{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.tdBox{

  border:1px solid #363636;

  border-radius:14px;

  padding:14px;

  background:#111;

}

.tdBox small{

  display:block;

  color:#888;

  font-size:8px;

  font-weight:1000;

  letter-spacing:.8px;

}

.tdBox strong{

  display:block;

  font-size:25px;

  margin-top:4px;

}

.tdBox span{

  display:block;

  color:#aaa;

  font-size:10px;

  margin-top:4px;

}

.market{

  border:1px solid #3a3a3a;

  background:#101010;

  border-radius:16px;

  padding:16px;

  margin-top:10px;

}

.market h3{

  margin:0 0 4px;

  font-size:14px;

}

.marketIntro{

  color:#777;

  font-size:10px;

  line-height:1.4;

  margin-bottom:12px;

}

.fieldLabel{

  display:block;

  color:#888;

  font-size:9px;

  font-weight:900;

  margin:10px 0 5px;

  letter-spacing:.6px;

}

.market input,

.market select{

  width:100%;

  border:1px solid #333;

  border-radius:10px;

  background:#080808;

  color:#fff;

  padding:12px;

  outline:none;

}

.marketGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.calcBtn{

  width:100%;

  margin-top:12px;

  border:0;

  background:#fff;

  color:#000;

  border-radius:11px;

  padding:12px;

  font-weight:1000;

}

.result{

  display:none;

  margin-top:12px;

  border-top:1px solid #292929;

  padding-top:12px;

}

.result.show{

  display:block;

}

.resultGrid{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:7px;

}

.resultMetric{

  border:1px solid #292929;

  border-radius:10px;

  padding:10px;

  background:#090909;

}

.resultMetric small{

  display:block;

  color:#777;

  font-size:8px;

  font-weight:900;

}

.resultMetric strong{

  display:block;

  margin-top:4px;

  font-size:15px;

}

.screen{

  margin-top:9px;

  padding:11px;

  border-radius:10px;

  font-size:11px;

  font-weight:1000;

  text-align:center;

}

.screen.pass{

  background:#ecffef;

  color:#104817;

}

.screen.review{

  background:#fff8d5;

  color:#5c4c00;

}

.screen.no{

  background:#1a1a1a;

  color:#aaa;

  border:1px solid #333;

}

.propSelector{

  display:flex;

  gap:6px;

  overflow:auto;

  margin-top:12px;

  padding-bottom:4px;

}

.propChip{

  border:1px solid #2c2c2c;

  background:#0b0b0b;

  color:#999;

  border-radius:999px;

  padding:8px 10px;

  font-size:9px;

  font-weight:900;

  white-space:nowrap;

}

.propChip.active{

  background:#fff;

  color:#000;

}

.tdRank{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}

.tdRankLeft{

  display:flex;

  gap:11px;

  align-items:center;

}

.rank{

  font-size:20px;

  color:#555;

  font-weight:1000;

  width:27px;

}

.tdPct{

  font-size:23px;

  font-weight:1000;

}

.tdOdds{

  color:#888;

  font-size:9px;

  text-align:right;

}

.empty{

  text-align:center;

  color:#777;

  border:1px solid var(--line);

  border-radius:15px;

  padding:30px 15px;

  margin-top:15px;

}

.note{

  color:#777;

  font-size:9px;

  line-height:1.5;

  margin-top:10px;

}

.bottom{

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  background:rgba(5,5,5,.94);

  backdrop-filter:blur(14px);

  border-top:1px solid #242424;

  padding:8px 12px calc(8px + env(safe-area-inset-bottom));

  z-index:50;

}

.bottomInner{

  max-width:760px;

  margin:auto;

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:7px;

}

.navBtn{

  border:0;

  background:transparent;

  color:#666;

  padding:9px 4px;

  font-size:9px;

  font-weight:1000;

  letter-spacing:.6px;

}

.navBtn.active{

  color:#fff;

}

.loading{

  text-align:center;

  color:#777;

  padding:70px 20px;

}

@media(max-width:430px){

  .game{font-size:29px}

  .propGrid{grid-template-columns:repeat(3,1fr)}

}

</style>

</head>

<body>

<div id="app" class="app">

  <div class="loading">Loading JPro Gameday Intelligence…</div>

</div>

<div class="bottom">

  <div class="bottomInner">

    <button class="navBtn active" id="navPlayers" onclick="showPage('players')">PLAYERS</button>

    <button class="navBtn" id="navTD" onclick="showPage('td')">TD BOARD</button>

    <button class="navBtn" id="navPicks" onclick="showPage('picks')">MY PICKS</button>

  </div>

</div>

<script>

let DATA=null;

let GAME_ROWS=[];

let TD_BOARD=[];

let PAGE="players";

let FILTER="ALL";

let SEARCH="";

let CURRENT_PLAYER=null;

let CURRENT_PROP_INDEX=0;

const $=id=>document.getElementById(id);

function esc(v){

  return String(v??"")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;");

}

function n(v,d=1){

  const x=Number(v);

  return Number.isFinite(x)?x.toFixed(d):"—";

}

function odds(v){

  const x=Number(v);

  if(!Number.isFinite(x)) return "—";

  return x>0?`+${Math.round(x)}`:`${Math.round(x)}`;

}

function pct(v){

  const x=Number(v);

  if(!Number.isFinite(x)) return "—";

  return `${x.toFixed(1)}%`;

}

function americanToProb(o){

  o=Number(o);

  if(!Number.isFinite(o)||o===0)return null;

  return o>0 ? 100/(o+100) : (-o)/((-o)+100);

}

function probToAmerican(p){

  if(!Number.isFinite(p)||p<=0||p>=1)return null;

  return p>=.5 ? -100*p/(1-p) : 100*(1-p)/p;

}

function histProbability(hist,line,side){

  if(!Array.isArray(hist)||!hist.length)return null;

  let total=0,hit=0;

  for(const row of hist){

    const value=Number(row[0]);

    const count=Number(row[1]);

    if(!Number.isFinite(value)||!Number.isFinite(count))continue;

    total+=count;

    if(side==="OVER" && value>line) hit+=count;

    if(side==="UNDER" && value<line) hit+=count;

    if(value===line){

      // Pushes are excluded from wins.

    }

  }

  return total ? hit/total : null;

}

function uniquePlayers(){

  const map=new Map();

  for(const p of GAME_ROWS){

    const key=`${p.team}|${p.player}`;

    if(!map.has(key)){

      map.set(key,{

        player:p.player,

        team:p.team,

        opponent:p.opponent,

        position:p.position,

        props:[]

      });

    }

    map.get(key).props.push(p);

  }

  return [...map.values()];

}

function tdFor(player,team){

  return TD_BOARD.find(x=>x.player===player && x.team===team) || null;

}

function roleFor(player){

  const p=player.props[0]||{};

  const a=p.player_analysis_v1||p.player_analysis||{};

  return a.expected_role||{};

}

function matchupFor(player){

  const p=player.props[0]||{};

  const a=p.player_analysis_v1||p.player_analysis||{};

  return a.matchup_intelligence||{};

}

function confidenceFor(player){

  const p=player.props[0]||{};

  const a=p.player_analysis_v1||p.player_analysis||{};

  return a.projection_confidence||{};

}

function statusClass(status){

  if(status==="MODEL_READY")return "ready";

  return "review";

}

function header(){

  const engine=DATA?.jpro_gameday_engine||{};

  const game=DATA?.jpro_gameday_game||{};

  return `

    <div class="header">

      <div class="logo">JPRO <span>MODEL</span></div>

      <div class="engine">GAMEDAY V1.1</div>

    </div>

    <div class="hero">

      <div class="kicker">Tonight • Pregame Intelligence</div>

      <div class="game">EAGLES @ BEARS</div>

      <div class="gameSub">

        ${esc(game.kickoff||"8:15 PM ET")} •

        ${GAME_ROWS.length} model markets •

        ${TD_BOARD.length} TD profiles

      </div>

      <div class="qbs">

        <div class="qb">

          <small>PHILADELPHIA QB</small>

          <strong>${esc(game.expected_starting_qb_away||"Jalen Hurts")}</strong>

        </div>

        <div class="qb">

          <small>CHICAGO EXPECTED QB</small>

          <strong>${esc(game.expected_starting_qb_home||"Case Keenum")}</strong>

        </div>

      </div>

      <div class="warning">

        JPro is using the verified V1.5.1 availability gate and 20K distributions.

        TD V1.1 is experimental. Availability-sensitive markets require extra review,

        and sportsbook prices must be entered manually.

      </div>

    </div>

  `;

}

function tabs(){

  return `

    <div class="tabs">

      <button class="tab ${PAGE==="players"?"active":""}" onclick="showPage('players')">PLAYERS</button>

      <button class="tab ${PAGE==="td"?"active":""}" onclick="showPage('td')">TD BOARD</button>

      <button class="tab ${PAGE==="picks"?"active":""}" onclick="showPage('picks')">MY PICKS</button>

    </div>

  `;

}

function renderPlayers(){

  let players=uniquePlayers();

  if(FILTER!=="ALL"){

    players=players.filter(p=>p.team===FILTER||p.position===FILTER);

  }

  if(SEARCH){

    const q=SEARCH.toLowerCase();

    players=players.filter(p=>

      String(p.player).toLowerCase().includes(q) ||

      String(p.position).toLowerCase().includes(q)

    );

  }

  players.sort((a,b)=>{

    const ra=Number(roleFor(a).score||0);

    const rb=Number(roleFor(b).score||0);

    return rb-ra;

  });

  let html=header()+tabs()+`

    <div class="filters">

      ${["ALL","PHI","CHI","QB","RB","WR","TE"].map(x=>

        `<button class="filter ${FILTER===x?"active":""}" onclick="setFilter('${x}')">${x}</button>`

      ).join("")}

    </div>

    <input

      class="search"

      placeholder="Search player..."

      value="${esc(SEARCH)}"

      oninput="setSearch(this.value)"

    >

    <div class="sectionTitle">

      <h2>Player Analysis</h2>

      <span>${players.length} PLAYERS</span>

    </div>

  `;

  for(const player of players){

    const role=roleFor(player);

    const matchup=matchupFor(player);

    const confidence=confidenceFor(player);

    const td=tdFor(player.player,player.team);

    const first=player.props[0]||{};

    const status=first.jpro_gameday_v1?.market_readiness||"REVIEW";

    html+=`

      <div class="card">

        <div class="playerTop">

          <div>

            <div class="playerName">${esc(player.player)}</div>

            <div class="playerMeta">

              ${esc(player.team)} • ${esc(player.position)} • vs ${esc(player.opponent)}

            </div>

          </div>

          <span class="badge ${statusClass(status)}">

            ${status==="MODEL_READY"?"MODEL READY":"REVIEW"}

          </span>

        </div>

        <div class="propGrid">

          <div class="metric">

            <small>ROLE</small>

            <strong>${n(role.score,0)}</strong>

          </div>

          <div class="metric">

            <small>MATCHUP</small>

            <strong>${n(matchup.score,0)}</strong>

          </div>

          <div class="metric">

            <small>ATTD</small>

            <strong>${td?pct(td.anytime_td_probability_pct):"—"}</strong>

          </div>

        </div>

        <button class="openBtn" onclick='openPlayer(${JSON.stringify(player.team)},${JSON.stringify(player.player)})'>

          OPEN PLAYER ANALYSIS

        </button>

      </div>

    `;

  }

  $("app").innerHTML=html;

}

function renderTD(){

  let board=[...TD_BOARD];

  board.sort((a,b)=>

    Number(b.anytime_td_probability||0)-Number(a.anytime_td_probability||0)

  );

  let html=header()+tabs()+`

    <div class="sectionTitle">

      <h2>Anytime TD Board</h2>

      <span>TD V1.1 • EXPERIMENTAL</span>

    </div>

    <div class="warning">

      Ranked by JPro model probability, not by recommendation.

      Compare each probability with the actual sportsbook price before evaluating a market.

    </div>

  `;

  board.forEach((x,i)=>{

    html+=`

      <div class="card" onclick='openPlayer(${JSON.stringify(x.team)},${JSON.stringify(x.player)})'>

        <div class="tdRank">

          <div class="tdRankLeft">

            <div class="rank">#${i+1}</div>

            <div>

              <div class="playerName">${esc(x.player)}</div>

              <div class="playerMeta">

                ${esc(x.team)} • ${esc(x.position)} •

                ${esc(x.confidence)} CONFIDENCE

              </div>

            </div>

          </div>

          <div>

            <div class="tdPct">${pct(x.anytime_td_probability_pct)}</div>

            <div class="tdOdds">FAIR ${odds(x.anytime_fair_odds)}</div>

          </div>

        </div>

        <div class="propGrid">

          <div class="metric">

            <small>2+ TD</small>

            <strong>${pct(x.two_plus_td_probability_pct)}</strong>

          </div>

          <div class="metric">

            <small>ROLE</small>

            <strong>${n(x.role_score,0)}</strong>

          </div>

          <div class="metric">

            <small>MATCHUP</small>

            <strong>${n(x.matchup_score,0)}</strong>

          </div>

        </div>

      </div>

    `;

  });

  html+=`

    <div class="note">

      TD V1.1 uses historical touchdown rates with sample shrinkage plus conservative

      Role V2 and matchup adjustments. It does not yet contain separately validated

      red-zone or goal-line play-by-play features.

    </div>

  `;

  $("app").innerHTML=html;

}

function openPlayer(team,name){

  const player=uniquePlayers().find(p=>p.team===team&&p.player===name);

  if(!player)return;

  CURRENT_PLAYER=player;

  CURRENT_PROP_INDEX=0;

  PAGE="detail";

  renderPlayerDetail();

  window.scrollTo(0,0);

}

function tdMarketCalculator(td){

  return `

    <div class="market">

      <h3>TD Market Comparison</h3>

      <div class="marketIntro">

        Enter the odds you're actually seeing at your sportsbook.

      </div>

      <label class="fieldLabel">MARKET</label>

      <select id="tdMarketType">

        <option value="ATTD">Anytime TD</option>

        <option value="2TD">2+ Touchdowns</option>

      </select>

      <label class="fieldLabel">AMERICAN ODDS</label>

      <input id="tdOdds" inputmode="numeric" placeholder="Example: +175 or -105">

      <button class="calcBtn" onclick="calculateTDMarket()">COMPARE WITH JPRO</button>

      <div class="result" id="tdResult"></div>

    </div>

  `;

}

function calculateTDMarket(){

  const td=tdFor(CURRENT_PLAYER.player,CURRENT_PLAYER.team);

  if(!td)return;

  const type=$("tdMarketType").value;

  const price=Number($("tdOdds").value);

  if(!Number.isFinite(price)||price===0){

    alert("Enter valid American odds.");

    return;

  }

  const modelProb=

    type==="ATTD"

      ? Number(td.anytime_td_probability)

      : Number(td.two_plus_td_probability);

  const fair=

    type==="ATTD"

      ? td.anytime_fair_odds

      : td.two_plus_fair_odds;

  const implied=americanToProb(price);

  const diff=modelProb-implied;

  let screen="NO EDGE";

  let cls="no";

  if(diff>=.05){

    screen="JPRO SCREEN PASS";

    cls="pass";

  }else if(diff>=.015){

    screen="JPRO REVIEW";

    cls="review";

  }

  const el=$("tdResult");

  el.innerHTML=`

    <div class="resultGrid">

      <div class="resultMetric">

        <small>JPRO PROBABILITY</small>

        <strong>${pct(modelProb*100)}</strong>

      </div>

      <div class="resultMetric">

        <small>MARKET IMPLIED</small>

        <strong>${pct(implied*100)}</strong>

      </div>

      <div class="resultMetric">

        <small>JPRO FAIR ODDS</small>

        <strong>${odds(fair)}</strong>

      </div>

      <div class="resultMetric">

        <small>DIFFERENCE</small>

        <strong>${diff>=0?"+":""}${(diff*100).toFixed(1)} pts</strong>

      </div>

    </div>

    <div class="screen ${cls}">${screen}</div>

    <button class="openBtn" onclick="savePick('TD','${type}',${price},${modelProb})">

      SAVE TO MY PICKS

    </button>

    <div class="note">

      TD V1.1 is experimental and has not yet been separately market-calibrated.

      PASS means the model probability exceeds the raw implied probability by the

      current screening threshold; it does not guarantee the outcome.

    </div>

  `;

  el.classList.add("show");

}

function yardageCalculator(prop){

  return `

    <div class="market">

      <h3>${esc(formatProp(prop.prop))} Market Comparison</h3>

      <div class="marketIntro">

        Uses this player's existing 20,000-outcome simulation distribution.

      </div>

      <label class="fieldLabel">SPORTSBOOK LINE</label>

      <input id="yardLine" type="number" step=".5" inputmode="decimal" placeholder="Example: 74.5">

      <div class="marketGrid">

        <div>

          <label class="fieldLabel">SIDE</label>

          <select id="yardSide">

            <option value="OVER">Over</option>

            <option value="UNDER">Under</option>

          </select>

        </div>

        <div>

          <label class="fieldLabel">ODDS</label>

          <input id="yardOdds" inputmode="numeric" placeholder="-110">

        </div>

      </div>

      <button class="calcBtn" onclick="calculateYardageMarket()">COMPARE WITH JPRO</button>

      <div class="result" id="yardResult"></div>

    </div>

  `;

}

function calculateYardageMarket(){

  const prop=CURRENT_PLAYER.props[CURRENT_PROP_INDEX];

  const line=Number($("yardLine").value);

  const side=$("yardSide").value;

  const price=Number($("yardOdds").value);

  if(!Number.isFinite(line)){

    alert("Enter a sportsbook line.");

    return;

  }

  if(!Number.isFinite(price)||price===0){

    alert("Enter valid American odds.");

    return;

  }

  const modelProb=histProbability(

    prop.simulation_histogram,

    line,

    side

  );

  if(modelProb===null){

    alert("20K simulation distribution unavailable.");

    return;

  }

  const implied=americanToProb(price);

  const diff=modelProb-implied;

  const fair=probToAmerican(modelProb);

  let screen="NO EDGE";

  let cls="no";

  if(diff>=.05){

    screen="JPRO SCREEN PASS";

    cls="pass";

  }else if(diff>=.015){

    screen="JPRO REVIEW";

    cls="review";

  }

  const availabilitySensitive=

    !!prop.jpro_gameday_v1?.availability_sensitive;

  if(availabilitySensitive && screen==="JPRO SCREEN PASS"){

    screen="JPRO PASS — GAMEDAY REVIEW";

    cls="review";

  }

  const el=$("yardResult");

  el.innerHTML=`

    <div class="resultGrid">

      <div class="resultMetric">

        <small>MODEL HIT RATE</small>

        <strong>${pct(modelProb*100)}</strong>

      </div>

      <div class="resultMetric">

        <small>MARKET IMPLIED</small>

        <strong>${pct(implied*100)}</strong>

      </div>

      <div class="resultMetric">

        <small>MODEL FAIR ODDS</small>

        <strong>${odds(fair)}</strong>

      </div>

      <div class="resultMetric">

        <small>DIFFERENCE</small>

        <strong>${diff>=0?"+":""}${(diff*100).toFixed(1)} pts</strong>

      </div>

    </div>

    <div class="screen ${cls}">${screen}</div>

    <button

      class="openBtn"

      onclick="savePick('PROP','${side}',${price},${modelProb},${line})"

    >

      SAVE TO MY PICKS

    </button>

    ${

      availabilitySensitive

      ? `<div class="note">

           This market is availability-sensitive. The baseline 20K distribution was

           preserved rather than applying an unvalidated injury redistribution.

         </div>`

      : ""

    }

  `;

  el.classList.add("show");

}

function savePick(type,side,price,modelProb,line=null){

  const prop=CURRENT_PLAYER.props[CURRENT_PROP_INDEX];

  const picks=JSON.parse(localStorage.getItem("jpro_gameday_picks")||"[]");

  picks.push({

    id:Date.now(),

    player:CURRENT_PLAYER.player,

    team:CURRENT_PLAYER.team,

    type,

    prop:type==="TD" ? side : prop.prop,

    side:type==="TD" ? null : side,

    line,

    odds:price,

    modelProbability:modelProb,

    savedAt:new Date().toISOString()

  });

  localStorage.setItem("jpro_gameday_picks",JSON.stringify(picks));

  alert("Saved to My Picks.");

}

function renderPicks(){

  const picks=JSON.parse(localStorage.getItem("jpro_gameday_picks")||"[]");

  let html=header()+tabs()+`

    <div class="sectionTitle">

      <h2>My Picks</h2>

      <span>${picks.length} SAVED</span>

    </div>

  `;

  if(!picks.length){

    html+=`

      <div class="empty">

        Nothing saved yet.<br><br>

        Open a player, compare the actual sportsbook price,

        then save markets you want to track.

      </div>

    `;

  }

  picks.slice().reverse().forEach(p=>{

    html+=`

      <div class="card">

        <div class="playerTop">

          <div>

            <div class="playerName">${esc(p.player)}</div>

            <div class="playerMeta">${esc(p.team)} • ${esc(formatProp(p.prop))}</div>

          </div>

          <span class="badge">${odds(p.odds)}</span>

        </div>

        <div class="propGrid">

          <div class="metric">

            <small>SIDE</small>

            <strong>${esc(p.side||p.prop)}</strong>

          </div>

          <div class="metric">

            <small>LINE</small>

            <strong>${p.line??"—"}</strong>

          </div>

          <div class="metric">

            <small>MODEL</small>

            <strong>${pct(Number(p.modelProbability)*100)}</strong>

          </div>

        </div>

        <button class="openBtn" onclick="deletePick(${p.id})">REMOVE</button>

      </div>

    `;

  });

  $("app").innerHTML=html;

}

function deletePick(id){

  let picks=JSON.parse(localStorage.getItem("jpro_gameday_picks")||"[]");

  picks=picks.filter(x=>x.id!==id);

  localStorage.setItem("jpro_gameday_picks",JSON.stringify(picks));

  renderPicks();

}

function formatProp(v){

  if(!v)return "PROP";

  const map={

    passing_yards:"Passing Yards",

    rushing_yards:"Rushing Yards",

    receiving_yards:"Receiving Yards",

    receptions:"Receptions"

  };

  return map[v] || String(v)

    .replaceAll("_"," ")

    .replace(/\b\w/g,x=>x.toUpperCase());

}

function setFilter(v){

  FILTER=v;

  renderPlayers();

}

function setSearch(v){

  SEARCH=v;

  renderPlayers();

}

function selectProp(i){

  CURRENT_PROP_INDEX=i;

  renderPlayerDetail();

}

function backToPlayers(){

  PAGE="players";

  CURRENT_PLAYER=null;

  render();

  window.scrollTo(0,0);

}

function showPage(page){

  PAGE=page;

  CURRENT_PLAYER=null;

  render();

  window.scrollTo(0,0);

}

function updateNav(){

  ["Players","TD","Picks"].forEach(x=>{

    const el=$(`nav${x}`);

    if(el)el.classList.remove("active");

  });

  if(PAGE==="players"||PAGE==="detail"){

    $("navPlayers")?.classList.add("active");

  }

  if(PAGE==="td"){

    $("navTD")?.classList.add("active");

  }

  if(PAGE==="picks"){

    $("navPicks")?.classList.add("active");

  }

}

function render(){

  if(PAGE==="players")renderPlayers();

  else if(PAGE==="td")renderTD();

  else if(PAGE==="picks")renderPicks();

  else if(PAGE==="detail")renderPlayerDetail();

  updateNav();

}

async function load(){

  try{

    const res=await fetch(

      `data/jpro-current-projections.json?v=${Date.now()}`,

      {cache:"no-store"}

    );

    if(!res.ok){

      throw new Error(`HTTP ${res.status}`);

    }

    DATA=await res.json();

    const projections=Array.isArray(DATA.projections)

      ? DATA.projections

      : [];

    GAME_ROWS=projections.filter(p=>

      p.jpro_gameday_v1 &&

      p.jpro_gameday_v1.engine==="JPRO_GAMEDAY_ENGINE_V1"

    );

    TD_BOARD=Array.isArray(DATA.jpro_td_board)

      ? DATA.jpro_td_board

      : [];

    if(!GAME_ROWS.length){

      throw new Error("No Eagles/Bears gameday rows found.");

    }

    render();

  }catch(err){

    $("app").innerHTML=`

      <div class="header">

        <div class="logo">JPRO <span>MODEL</span></div>

      </div>

      <div class="empty">

        <strong>Gameday data failed to load.</strong><br><br>

        ${esc(err.message)}

      </div>

    `;

  }

}

load();

</script>
