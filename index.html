<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>JPro Model V2</title>

  <link rel="manifest" href="manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(110px + env(safe-area-inset-bottom));
    }

    .brand {
      font-size: 34px;
      font-weight: 950;
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 2px;
      color: #8d8d8d;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .engine-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 7px 10px;
      border: 1px solid #333;
      border-radius: 999px;
      color: #d0d0d0;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .game-card {
      margin-top: 22px;
      padding: 18px;
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 16px;
    }

    .game-label {
      color: #777;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .game {
      margin-top: 7px;
      font-size: 25px;
      font-weight: 900;
    }

    .game-note {
      margin-top: 7px;
      color: #888;
      font-size: 12px;
      line-height: 1.5;
    }

    .section-title {
      margin: 28px 0 12px;
      font-size: 20px;
      font-weight: 900;
    }

    .status {
      padding: 20px;
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 16px;
      color: #aaa;
    }

    .player-card {
      margin-bottom: 16px;
      padding: 18px;
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 16px;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .player-name {
      font-size: 19px;
      font-weight: 900;
    }

    .player-meta {
      margin-top: 4px;
      color: #888;
      font-size: 11px;
      font-weight: 700;
    }

    .prop-label {
      text-align: right;
      color: #aaa;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .model-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .metric {
      padding: 13px;
      background: #151515;
      border: 1px solid #242424;
      border-radius: 12px;
    }

    .metric-label {
      color: #777;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 900;
    }

    .sportsbook {
      margin-top: 17px;
      padding-top: 17px;
      border-top: 1px solid #292929;
    }

    .sportsbook-title {
      margin-bottom: 11px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-wrap label {
      display: block;
      margin-bottom: 6px;
      color: #777;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      background: #050505;
      color: white;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 800;
      outline: none;
    }

    input:focus {
      border-color: #ffffff;
    }

    .results {
      display: none;
      margin-top: 15px;
    }

    .results.active {
      display: block;
    }

    .side {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #292929;
      border-radius: 12px;
      background: #101010;
    }

    .side-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .side-name {
      font-size: 15px;
      font-weight: 950;
    }

    .hit-rate {
      font-size: 25px;
      font-weight: 950;
    }

    .sim-count {
      margin-top: 6px;
      color: #888;
      font-size: 11px;
    }

    .bar {
      height: 5px;
      margin-top: 10px;
      overflow: hidden;
      background: #292929;
      border-radius: 999px;
    }

    .bar-fill {
      height: 100%;
      background: #ffffff;
      border-radius: 999px;
    }

    .pricing {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .price-box {
      padding: 12px;
      background: #151515;
      border-radius: 10px;
    }

    .price-label {
      color: #777;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .price-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 900;
    }

    .edge-box {
      margin-top: 10px;
      padding: 14px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
    }

    .edge-title {
      color: #888;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .edge-value {
      margin-top: 5px;
      font-size: 20px;
      font-weight: 950;
    }

    .explanation {
      margin-top: 10px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.55;
    }

    .warning {
      margin-top: 12px;
      color: #777;
      font-size: 10px;
      line-height: 1.5;
    }

    .bottom-nav {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      padding:
        12px 10px
        calc(12px + env(safe-area-inset-bottom));
      background: rgba(5,5,5,.96);
      border-top: 1px solid #222;
      backdrop-filter: blur(15px);
    }

    .nav-inner {
      max-width: 760px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
      text-align: center;
    }

    .nav-item {
      color: #666;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .nav-item.active {
      color: white;
    }

    @media (max-width: 370px) {
      .inputs,
      .pricing {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="brand">JPRO</div>

  <div class="subtitle">
    THE JPRO MODEL V2
  </div>

  <div class="engine-badge">
    20K SIMULATION BETTING ENGINE
  </div>

  <div class="game-card">
    <div class="game-label">
      CURRENT GAME
    </div>

    <div class="game" id="game">
      Loading...
    </div>

    <div class="game-note">
      Enter a sportsbook line and American odds.
      JPro prices the line directly from its stored
      20,000 simulated outcomes.
    </div>
  </div>

  <div class="section-title">
    Player Props
  </div>

  <div id="cards">
    <div class="status">
      Loading JPro simulations...
    </div>
  </div>

</div>

<div class="bottom-nav">
  <div class="nav-inner">
    <div class="nav-item active">GAME</div>
    <div class="nav-item">TOP MATCHUPS</div>
    <div class="nav-item">TD BOARD</div>
    <div class="nav-item">JPRO PICKS</div>
  </div>
</div>

<script>

const DATA_URL =
  "data/jpro-current-projections.json?v=" +
  Date.now();

const propNames = {
  passing_yards: "Passing Yards",
  rushing_yards: "Rushing Yards",
  receiving_yards: "Receiving Yards",
  receptions: "Receptions"
};

function fairAmerican(probability) {

  if (
    !Number.isFinite(probability) ||
    probability <= 0 ||
    probability >= 1
  ) {
    return "N/A";
  }

  let odds;

  if (probability >= 0.5) {

    odds =
      -100 *
      probability /
      (1 - probability);

  } else {

    odds =
      100 *
      (1 - probability) /
      probability;
  }

  odds = Math.round(odds);

  return odds > 0
    ? "+" + odds
    : String(odds);
}

function impliedProbability(american) {

  const odds = Number(american);

  if (
    !Number.isFinite(odds) ||
    odds === 0
  ) {
    return null;
  }

  if (odds > 0) {

    return 100 / (odds + 100);

  } else {

    return Math.abs(odds) /
      (Math.abs(odds) + 100);
  }
}

function pct(value) {

  return (
    value * 100
  ).toFixed(1) + "%";
}

function defaultLine(prop) {

  const median =
    Number(prop.median);

  if (!Number.isFinite(median)) {
    return "";
  }

  /*
    Half-point defaults prevent pushes
    for whole-number NFL statistics.
  */

  return (
    Math.floor(median) + 0.5
  ).toFixed(1);
}

function createCard(prop, index) {

  const card =
    document.createElement("div");

  card.className =
    "player-card";

  const line =
    defaultLine(prop);

  card.innerHTML = `
    <div class="player-top">

      <div>
        <div class="player-name">
          ${prop.player}
        </div>

        <div class="player-meta">
          ${prop.team} • ${prop.position}
        </div>
      </div>

      <div class="prop-label">
        ${propNames[prop.prop] || prop.prop}
      </div>

    </div>

    <div class="model-grid">

      <div class="metric">
        <div class="metric-label">
          JPro Projection
        </div>

        <div class="metric-value">
          ${Number(prop.projection).toFixed(1)}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Sim Median
        </div>

        <div class="metric-value">
          ${Number(prop.median).toFixed(1)}
        </div>
      </div>

    </div>

    <div class="sportsbook">

      <div class="sportsbook-title">
        PRICE A SPORTSBOOK LINE
      </div>

      <div class="inputs">

        <div class="input-wrap">

          <label>
            Sportsbook Line
          </label>

          <input
            id="line-${index}"
            type="number"
            step="0.5"
            inputmode="decimal"
            value="${line}"
          >

        </div>

        <div class="input-wrap">

          <label>
            American Odds
          </label>

          <input
            id="odds-${index}"
            type="number"
            step="1"
            inputmode="numeric"
            value="-110"
          >

        </div>

      </div>

      <div
        class="results"
        id="results-${index}"
      >

        <div class="side">

          <div class="side-head">

            <div
              class="side-name"
              id="over-name-${index}"
            >
              OVER
            </div>

            <div
              class="hit-rate"
              id="over-rate-${index}"
            >
              --
            </div>

          </div>

          <div
            class="sim-count"
            id="over-count-${index}"
          ></div>

          <div class="bar">
            <div
              class="bar-fill"
              id="over-bar-${index}"
            ></div>
          </div>

        </div>

        <div class="side">

          <div class="side-head">

            <div
              class="side-name"
              id="under-name-${index}"
            >
              UNDER
            </div>

            <div
              class="hit-rate"
              id="under-rate-${index}"
            >
              --
            </div>

          </div>

          <div
            class="sim-count"
            id="under-count-${index}"
          ></div>

          <div class="bar">
            <div
              class="bar-fill"
              id="under-bar-${index}"
            ></div>
          </div>

        </div>

        <div class="pricing">

          <div class="price-box">

            <div class="price-label">
              Over Fair Odds
            </div>

            <div
              class="price-value"
              id="over-fair-${index}"
            >
              --
            </div>

          </div>

          <div class="price-box">

            <div class="price-label">
              Under Fair Odds
            </div>

            <div
              class="price-value"
              id="under-fair-${index}"
            >
              --
            </div>

          </div>

        </div>

        <div class="edge-box">

          <div class="edge-title">
            Probability Edge vs Entered Price
          </div>

          <div
            class="edge-value"
            id="edge-${index}"
          >
            --
          </div>

          <div
            class="explanation"
            id="explanation-${index}"
          ></div>

        </div>

        <div class="warning">
          Model probability is based on JPro's
          simulated distribution and is not a
          guarantee of the actual game result.
        </div>

      </div>

    </div>
  `;

  return card;
}

function calculate(prop, index) {

  const lineInput =
    document.getElementById(
      `line-${index}`
    );

  const oddsInput =
    document.getElementById(
      `odds-${index}`
    );

  const line =
    Number(lineInput.value);

  const odds =
    Number(oddsInput.value);

  if (!Number.isFinite(line)) {
    return;
  }

  const sims =
    prop.simulation_values;

  if (
    !Array.isArray(sims) ||
    sims.length === 0
  ) {
    return;
  }

  let over = 0;
  let under = 0;
  let pushes = 0;

  for (const value of sims) {

    const result =
      Number(value);

    if (result > line) {

      over++;

    } else if (result < line) {

      under++;

    } else {

      pushes++;
    }
  }

  /*
    For standard .5 player-prop lines,
    pushes will be zero.

    If a whole-number line is entered,
    pushes are removed from the probability
    denominator because the stake would
    ordinarily be returned.
  */

  const decisions =
    over + under;

  if (decisions === 0) {
    return;
  }

  const overProbability =
    over / decisions;

  const underProbability =
    under / decisions;

  const implied =
    impliedProbability(odds);

  const overEdge =
    implied === null
      ? null
      : overProbability - implied;

  const underEdge =
    implied === null
      ? null
      : underProbability - implied;

  document.getElementById(
    `over-name-${index}`
  ).textContent =
    `OVER ${line}`;

  document.getElementById(
    `under-name-${index}`
  ).textContent =
    `UNDER ${line}`;

  document.getElementById(
    `over-rate-${index}`
  ).textContent =
    pct(overProbability);

  document.getElementById(
    `under-rate-${index}`
  ).textContent =
    pct(underProbability);

  document.getElementById(
    `over-count-${index}`
  ).textContent =
    `${over.toLocaleString()} / ` +
    `${sims.length.toLocaleString()} simulations` +
    (
      pushes > 0
        ? ` • ${pushes.toLocaleString()} pushes`
        : ""
    );

  document.getElementById(
    `under-count-${index}`
  ).textContent =
    `${under.toLocaleString()} / ` +
    `${sims.length.toLocaleString()} simulations` +
    (
      pushes > 0
        ? ` • ${pushes.toLocaleString()} pushes`
        : ""
    );

  document.getElementById(
    `over-bar-${index}`
  ).style.width =
    pct(overProbability);

  document.getElementById(
    `under-bar-${index}`
  ).style.width =
    pct(underProbability);

  document.getElementById(
    `over-fair-${index}`
  ).textContent =
    fairAmerican(
      overProbability
    );

  document.getElementById(
    `under-fair-${index}`
  ).textContent =
    fairAmerican(
      underProbability
    );

  const edgeEl =
    document.getElementById(
      `edge-${index}`
    );

  const explanation =
    document.getElementById(
      `explanation-${index}`
    );

  if (implied === null) {

    edgeEl.textContent =
      "Enter valid odds";

    explanation.textContent =
      "Enter the sportsbook's American odds to compare its implied probability with JPro.";

  } else {

    const betterSide =
      overEdge >= underEdge
        ? "OVER"
        : "UNDER";

    const bestEdge =
      Math.max(
        overEdge,
        underEdge
      );

    edgeEl.textContent =
      `${betterSide} ` +
      `${bestEdge >= 0 ? "+" : ""}` +
      `${(bestEdge * 100).toFixed(1)} pts`;

    explanation.textContent =
      `At ${odds > 0 ? "+" : ""}${odds}, ` +
      `the entered price implies ` +
      `${pct(implied)}. ` +
      `JPro's 20K distribution gives the ` +
      `${betterSide.toLowerCase()} side ` +
      `${betterSide === "OVER"
        ? pct(overProbability)
        : pct(underProbability)}.`;
  }

  document.getElementById(
    `results-${index}`
  ).classList.add(
    "active"
  );
}

async function loadJPro() {

  const cards =
    document.getElementById(
      "cards"
    );

  try {

    const response =
      await fetch(
        DATA_URL,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Could not load JPro data."
      );
    }

    const data =
      await response.json();

    document.getElementById(
      "game"
    ).textContent =
      data.game || "Current Game";

    if (
      !Array.isArray(
        data.projections
      ) ||
      data.projections.length === 0
    ) {
      throw new Error(
        "No player projections found."
      );
    }

    cards.innerHTML = "";

    data.projections.forEach(
      (prop, index) => {

        const card =
          createCard(
            prop,
            index
          );

        cards.appendChild(
          card
        );

        const lineInput =
          document.getElementById(
            `line-${index}`
          );

        const oddsInput =
          document.getElementById(
            `odds-${index}`
          );

        const recalc = () =>
          calculate(
            prop,
            index
          );

        lineInput.addEventListener(
          "input",
          recalc
        );

        oddsInput.addEventListener(
          "input",
          recalc
        );

        calculate(
          prop,
          index
        );
      }
    );

  } catch (error) {

    console.error(error);

    cards.innerHTML = `
      <div class="status">
        JPro couldn't load the new simulation
        file yet. Refresh after the latest
        GitHub workflow commit finishes.
      </div>
    `;
  }
}

loadJPro();

</script>

</body>
</html>
