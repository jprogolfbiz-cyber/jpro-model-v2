name: JPro Engine Cloud

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test JPro cloud engine
        run: |
          python --version
          echo "JPRO_CLOUD_ENGINE_READY"

      - name: Create engine status
        run: |
          mkdir -p data
          echo '{"status":"READY","engine":"JPro Cloud Engine","environment":"GitHub Actions"}' > data/engine-status.json

      - name: Save JPro output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: cloud engine test"
          file_pattern: data/engine-status.json
