      # SAVE
      # ============================================================

      - name: Save JPro Gameday Engine V1
        run: |
          git config user.name "JPro Gameday Engine"
          git config user.email "actions@github.com"

          git add data/jpro-current-projections.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Launch JPro Gameday Engine V1 Eagles Bears"
            git push
