      - name: Verify JPro TD Engine V1.1

        run: |

          python <<'PY'

          import json

          import math

          PATH = "data/jpro-current-projections.json"

          print("=" * 78)

          print("VERIFY JPRO TD ENGINE V1.1")

          print("=" * 78)

          with open(

              PATH,

              "r",

              encoding="utf-8"

          ) as f:

              data = json.load(f)

          engine = data.get(

              "jpro_td_engine",

              {}

          )

          if (

              engine.get("version")

              != "JPRO_TD_ENGINE_V1.1"

          ):

              raise RuntimeError(

                  "Wrong TD Engine version."

              )

          if (

              engine.get("status")

              != "EXPERIMENTAL_READY"

          ):

              raise RuntimeError(

                  "TD Engine not ready."

              )

          if (

              engine.get(

                  "yardage_model_used_as_td_probability"

              )

              is not False

          ):

              raise RuntimeError(

                  "TD probability incorrectly "

                  "derived from yardage model."

              )

          if (

              engine.get(

                  "availability_automatic_boost"

              )

              is not False

          ):

              raise RuntimeError(

                  "Unvalidated availability boost found."

              )

          board = data.get(

              "jpro_td_board",

              []

          )

          if not board:

              raise RuntimeError(

                  "TD board is empty."

              )

          seen = set()

          for item in board:

              key = (

                  item.get("team"),

                  item.get("player")

              )

              if key in seen:

                  raise RuntimeError(

                      "Duplicate player on TD board: "

                      + str(key)

                  )

              seen.add(key)

              p1 = item.get(

                  "anytime_td_probability"

              )

              p2 = item.get(

                  "two_plus_td_probability"

              )

              if p1 is None:

                  raise RuntimeError(

                      "Missing ATTD probability."

                  )

              if p2 is None:

                  raise RuntimeError(

                      "Missing 2+ TD probability."

                  )

              if not (

                  0 <= p1 <= 1

              ):

                  raise RuntimeError(

                      "Invalid ATTD probability."

                  )

              if not (

                  0 <= p2 <= 1

              ):

                  raise RuntimeError(

                      "Invalid 2+ probability."

                  )

              if p2 > p1:

                  raise RuntimeError(

                      "2+ probability exceeds ATTD."

                  )

              if (

                  item.get(

                      "sportsbook_anytime_odds"

                  )

                  is not None

              ):

                  raise RuntimeError(

                      "Fake sportsbook odds detected."

                  )

              if (

                  item.get(

                      "sportsbook_two_plus_odds"

                  )

                  is not None

              ):

                  raise RuntimeError(

                      "Fake 2+ sportsbook odds detected."

                  )

              if item.get(

                  "qualified_pick"

              ):

                  raise RuntimeError(

                      "Unpriced TD marked as qualified."

                  )

          print(

              "TD board players:",

              len(board)

          )

          print(

              "Matched historical profiles:",

              engine.get(

                  "matched_player_profiles"

              )

          )

          print(

              "Insufficient profiles:",

              engine.get(

                  "insufficient_player_profiles"

              )

          )

          print(

