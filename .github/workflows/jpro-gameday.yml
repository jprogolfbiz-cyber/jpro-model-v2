name: JPro Gameday Engine V1 - Eagles at Bears

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-gameday:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # JPRO GAMEDAY ENGINE V1
      # PHILADELPHIA EAGLES @ CHICAGO BEARS
      # SEPTEMBER 28, 2026
      #
      # PURPOSE
      # -------
      # 1. Preserve the existing JPro projection model.
      # 2. Preserve every valid 20K simulation distribution.
      # 3. Read the authoritative V1.5.1 availability gate.
      # 4. Apply verified game-specific availability.
      # 5. Set Case Keenum as Chicago's expected starter.
      # 6. Mark projections affected by important absences.
      # 7. Build detailed Player Analysis for every PHI/CHI prop.
      # 8. Never fabricate sportsbook prices.
      # 9. Never fabricate injury redistribution.
      # 10. Fail closed when evidence is insufficient.
      #
      # IMPORTANT
      # ---------
      # This workflow DOES NOT transfer an injured player's yards
      # to another player.
      #
      # That requires the separately validated redistribution model.
      #
      # For tonight, affected markets are explicitly identified as
      # AVAILABILITY_SENSITIVE rather than silently adjusted.
      # ============================================================

      - name: Build Eagles Bears Gameday Intelligence
        run: |
          python <<'PY'
          import json
          import math
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          PATH = "data/jpro-current-projections.json"

          EXPECTED_SIMS = 20000

          TARGET_TEAMS = {
              "PHI",
              "CHI"
          }

          GAME_LABEL = "PHI @ CHI"

          print("=" * 78)
          print("JPRO GAMEDAY ENGINE V1")
          print("PHILADELPHIA EAGLES @ CHICAGO BEARS")
          print("=" * 78)

          if not os.path.exists(PATH):
              raise RuntimeError(
                  f"Missing required file: {PATH}"
              )

          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          projections = data.get(
              "projections",
              []
          )

          if not projections:
              raise RuntimeError(
                  "No projections found."
              )

          # ========================================================
          # VERIFY THE STABLE V1.5.1 FOUNDATION
          # ========================================================

          gate = data.get(
              "jpro_availability_gate",
              {}
          )

          if (
              gate.get("version")
              != "JPRO_AVAILABILITY_GATE_V1.5.1"
              or gate.get("status")
              != "ACTIVE"
          ):
              raise RuntimeError(
                  "JPro Availability Gate V1.5.1 "
                  "must be active before Gameday Engine runs."
              )

          print(
              "Base projection rows:",
              len(projections)
          )

          print(
              "Availability gate:",
              gate.get("version")
          )

          # ========================================================
          # VERIFIED GAMEDAY CONTEXT
          #
          # Snapshot for September 28, 2026.
          #
          # These are explicit game-specific overrides.
          # ========================================================

          CONFIRMED_OUT = {
              "CHI": {
                  "Caleb Williams": {
                      "position": "QB",
                      "reason": "Hamstring",
                      "designation": "OUT"
                  },
                  "Noah Sewell": {
                      "position": "LB",
                      "reason": "Achilles",
                      "designation": "OUT"
                  },
                  "Shemar Turner": {
                      "position": "DL",
                      "reason": "Knee",
                      "designation": "OUT"
                  }
              },

              "PHI": {
                  "Dallas Goedert": {
                      "position": "TE",
                      "reason": "Knee",
                      "designation": "OUT"
                  },
                  "Marquise Brown": {
                      "position": "WR",
                      "reason": "Ankle",
                      "designation": "OUT"
                  },
                  "Hollywood Brown": {
                      "position": "WR",
                      "reason": "Ankle",
                      "designation": "OUT"
                  },
                  "Fred Johnson": {
                      "position": "T",
                      "reason": "Knee",
                      "designation": "OUT"
                  }
              }
          }

          EXPECTED_STARTING_QB = {
              "PHI": {
                  "player": "Jalen Hurts",
                  "confidence": "HIGH",
                  "context": (
                      "Normal expected starting-quarterback "
                      "environment."
                  )
              },

              "CHI": {
                  "player": "Case Keenum",
                  "confidence": "LOWER_THAN_NORMAL",
                  "context": (
                      "Case Keenum is expected to start with "
                      "Caleb Williams ruled out. Keenum has not "
                      "thrown a regular-season pass since 2023, "
                      "so current-role uncertainty is materially "
                      "higher than for an established starter."
                  )
              }
          }

          QUESTIONABLE_CONTEXT = {
              "CHI": {
                  "Tyson Bagent": {
                      "position": "QB",
                      "context": (
                          "Cleared concussion protocol but "
                          "Case Keenum is expected to start."
                      )
                  }
              },

              "PHI": {
                  "Jonathan Greenard": {
                      "position": "LB",
                      "context": "Questionable."
                  }
              }
          }

          FULL_PRACTICE_CONTEXT = {
              "PHI": {
                  "Saquon Barkley":
                      "Finished the week as a full participant.",

                  "DeVonta Smith":
                      "Finished the week as a full participant.",

                  "Tank Bigsby":
                      "Finished the week as a full participant."
              }
          }

          # ========================================================
          # HELPERS
          # ========================================================

          def num(value, default=None):

              try:
                  value = float(value)

                  if (
                      math.isnan(value)
                      or math.isinf(value)
                  ):
                      return default

                  return value

              except Exception:
                  return default


          def round_num(
              value,
              digits=2
          ):
              value = num(value)

              if value is None:
                  return None

              return round(
                  value,
                  digits
              )


          def clean_name(value):

              if value is None:
                  return ""

              return str(value).strip()


          def upper(value):

              if value is None:
                  return ""

              return str(value).strip().upper()


          def histogram_total(histogram):

              if not isinstance(
                  histogram,
                  list
              ):
                  return 0

              total = 0

              for row in histogram:

                  if (
                      isinstance(row, list)
                      and len(row) >= 2
                  ):
                      try:
                          total += int(row[1])
                      except Exception:
                          pass

              return total


          def percentile_from_histogram(
              histogram,
              percentile
          ):

              total = histogram_total(
                  histogram
              )

              if total <= 0:
                  return None

              target = (
                  total
                  * percentile
              )

              running = 0

              ordered = sorted(
                  histogram,
                  key=lambda x: float(x[0])
              )

              for row in ordered:

                  value = float(row[0])
                  count = int(row[1])

                  running += count

                  if running >= target:
                      return value

              return float(
                  ordered[-1][0]
              )


          def get_percentiles(prop):

              histogram = prop.get(
                  "simulation_histogram",
                  []
              )

              if (
                  histogram_total(histogram)
                  == EXPECTED_SIMS
              ):
                  return {
                      "p10":
                          percentile_from_histogram(
                              histogram,
                              0.10
                          ),

                      "p25":
                          percentile_from_histogram(
                              histogram,
                              0.25
                          ),

                      "median":
                          percentile_from_histogram(
                              histogram,
                              0.50
                          ),

                      "p75":
                          percentile_from_histogram(
                              histogram,
                              0.75
                          ),

                      "p90":
                          percentile_from_histogram(
                              histogram,
                              0.90
                          )
                  }

              return {
                  "p10":
                      prop.get("p10"),

                  "p25":
                      prop.get("p25"),

                  "median":
                      prop.get("median"),

                  "p75":
                      prop.get("p75"),

                  "p90":
                      prop.get("p90")
              }


          def availability_v151(prop):

              obj = prop.get(
                  "jpro_availability_v151",
                  {}
              )

              if not isinstance(
                  obj,
                  dict
              ):
                  return {}

              return obj


          def base_eligible(prop):

              obj = availability_v151(
                  prop
              )

              return (
                  obj.get("eligible")
                  is True
                  and obj.get(
                      "gate_version"
                  )
                  == "JPRO_AVAILABILITY_GATE_V1.5.1"
              )


          def get_role(prop):

              role = prop.get(
                  "role",
                  {}
              )

              if not isinstance(
                  role,
                  dict
              ):
                  role = {}

              return role


          def get_matchup(prop):

              matchup = prop.get(
                  "matchup",
                  {}
              )

              if not isinstance(
                  matchup,
                  dict
              ):
                  matchup = {}

              return matchup


          def get_market(prop):

              market = prop.get(
                  "market",
                  {}
              )

              if not isinstance(
                  market,
                  dict
              ):
                  market = {}

              return market


          def find_out_info(
              team,
              player
          ):

              team_map = CONFIRMED_OUT.get(
                  team,
                  {}
              )

              if player in team_map:
                  return team_map[player]

              player_lower = player.lower()

              for name, info in team_map.items():

                  if (
                      name.lower()
                      == player_lower
                  ):
                      return info

              return None


          def find_practice_context(
              team,
              player
          ):

              return (
                  FULL_PRACTICE_CONTEXT
                  .get(team, {})
                  .get(player)
              )


          # ========================================================
          # ABSENCE SENSITIVITY
          #
          # IMPORTANT:
          # This identifies WHERE uncertainty exists.
          #
          # It DOES NOT fabricate redistribution.
          # ========================================================

          def absence_effects(
              team,
              position,
              prop_name,
              player
          ):

              effects = []

              prop_lower = (
                  str(prop_name)
                  .lower()
              )

              # ----------------------------------------------------
              # CHICAGO
              # Caleb Williams OUT / Case Keenum expected starter
              # ----------------------------------------------------

              if team == "CHI":

                  if player == "Case Keenum":

                      effects.append({
                          "type":
                              "STARTING_QB_CHANGE",

                          "severity":
                              "HIGH",

                          "description":
                              (
                                  "Case Keenum is expected to "
                                  "start in place of Caleb Williams."
                              )
                      })

                  elif position in {
                      "WR",
                      "TE",
                      "RB"
                  }:

                      if (
                          "receiv" in prop_lower
                          or "reception" in prop_lower
                      ):
                          effects.append({
                              "type":
                                  "STARTING_QB_CHANGE",

                              "severity":
                                  "HIGH",

                              "description":
                                  (
                                      "Chicago receiving production "
                                      "is sensitive to the change "
                                      "from Caleb Williams to expected "
                                      "starter Case Keenum."
                                  )
                          })

                      elif (
                          position == "RB"
                          and "rush" in prop_lower
                      ):
                          effects.append({
                              "type":
                                  "GAMEPLAN_CHANGE",

                              "severity":
                                  "MODERATE",

                              "description":
                                  (
                                      "Chicago's rushing workload "
                                      "could change with Case Keenum "
                                      "expected to start."
                                  )
                          })

              # ----------------------------------------------------
              # PHILADELPHIA
              # Goedert + Brown OUT
              # ----------------------------------------------------

              if team == "PHI":

                  if (
                      position in {
                          "WR",
                          "TE",
                          "RB"
                      }
                      and (
                          "receiv" in prop_lower
                          or "reception" in prop_lower
                      )
                  ):

                      effects.append({
                          "type":
                              "TEAMMATE_RECEIVING_ABSENCE",

                          "severity":
                              "MODERATE",

                          "description":
                              (
                                  "Dallas Goedert and Marquise "
                                  "Brown are out. Their unavailable "
                                  "receiving opportunity may change "
                                  "the target distribution among "
                                  "remaining Philadelphia players."
                              )
                      })

                  if (
                      position == "QB"
                      and (
                          "pass" in prop_lower
                          or "passing" in prop_lower
                      )
                  ):

                      effects.append({
                          "type":
                              "PASS_CATCHER_AVAILABILITY",

                          "severity":
                              "MODERATE",

                          "description":
                              (
                                  "Jalen Hurts is operating without "
                                  "Dallas Goedert and Marquise Brown, "
                                  "which changes his available "
                                  "pass-catcher group."
                              )
                      })

                  if (
                      "rush" in prop_lower
                      and player == "Saquon Barkley"
                  ):

                      effects.append({
                          "type":
                              "OFFENSIVE_LINE_AVAILABILITY",

                          "severity":
                              "LOW_TO_MODERATE",

                          "description":
                              (
                                  "Philadelphia tackle Fred Johnson "
                                  "is out. Offensive-line availability "
                                  "is relevant context for rushing "
                                  "efficiency."
                              )
                      })

              return effects


          # ========================================================
          # PROJECTION CONFIDENCE
          #
          # This is an evidence-quality label.
          # It is NOT a calibrated probability that the projection
          # will be correct.
          # ========================================================

          def confidence_analysis(
              prop,
              effects
          ):

              role = get_role(prop)

              score = 80

              reasons = []

              current_games = num(
                  role.get(
                      "current_games"
                  ),
                  0
              )

              if current_games <= 2:

                  score -= 10

                  reasons.append(
                      "Limited current-season sample."
                  )

              if effects:

                  high_effect = any(
                      e.get("severity") == "HIGH"
                      for e in effects
                  )

                  moderate_effect = any(
                      e.get("severity")
                      in {
                          "MODERATE",
                          "LOW_TO_MODERATE"
                      }
                      for e in effects
                  )

                  if high_effect:
                      score -= 25

                  elif moderate_effect:
                      score -= 12

                  reasons.append(
                      "Gameday availability changes "
                      "increase projection uncertainty."
                  )

              player = clean_name(
                  prop.get("player")
              )

              if player == "Case Keenum":

                  score = min(
                      score,
                      35
                  )

                  reasons.append(
                      "Expected starting quarterback "
                      "has no regular-season passing "
                      "attempt since 2023."
                  )

              histogram = prop.get(
                  "simulation_histogram",
                  []
              )

              if (
                  histogram_total(histogram)
                  != EXPECTED_SIMS
              ):

                  score -= 30

                  reasons.append(
                      "Valid 20K simulation distribution "
                      "is unavailable."
                  )

              score = max(
                  0,
                  min(
                      100,
                      score
                  )
              )

              if score >= 75:
                  label = "HIGHER"

              elif score >= 55:
                  label = "MODERATE"

              elif score >= 35:
                  label = "LOWER"

              else:
                  label = "INSUFFICIENT"

              if not reasons:
                  reasons.append(
                      "Existing model inputs and 20K "
                      "distribution are available."
                  )

              return {
                  "score":
                      score,

                  "label":
                      label,

                  "meaning":
                      (
                          "Evidence-quality indicator only; "
                          "not a calibrated probability of "
                          "projection accuracy."
                      ),

                  "reasons":
                      reasons
              }


          # ========================================================
          # PLAYER ANALYSIS BUILDER
          # ========================================================

          def build_player_analysis(
              prop,
              effects,
              gameday_eligible
          ):

              player = clean_name(
                  prop.get("player")
              )

              team = upper(
                  prop.get("team")
              )

              opponent = upper(
                  prop.get("opponent")
              )

              position = upper(
                  prop.get("position")
              )

              prop_name = str(
                  prop.get("prop")
                  or ""
              )

              role = get_role(prop)
              matchup = get_matchup(prop)
              market = get_market(prop)

              percentiles = get_percentiles(
                  prop
              )

              projection = round_num(
                  prop.get("projection")
              )

              confidence = confidence_analysis(
                  prop,
                  effects
              )

              base_availability = (
                  availability_v151(prop)
              )

              practice_context = (
                  find_practice_context(
                      team,
                      player
                  )
              )

              # ----------------------------------------------------
              # ROLE INPUTS
              # ----------------------------------------------------

              role_inputs = {}

              interesting_role_keys = [
                  "role_score",
                  "role_label",
                  "role_method",
                  "prior_games",
                  "current_games",
                  "prior_weight",
                  "current_weight",
                  "prior_targets",
                  "current_targets",
                  "blended_targets",
                  "prior_carries",
                  "current_carries",
                  "blended_carries",
                  "target_share",
                  "air_yards_share",
                  "current_target_share",
                  "current_air_yards_share",
                  "prior_target_share",
                  "prior_air_yards_share",
                  "blended_target_share",
                  "blended_air_yards_share"
              ]

              for key in interesting_role_keys:

                  if (
                      key in role
                      and role.get(key)
                      is not None
                  ):
                      role_inputs[key] = role.get(
                          key
                      )

              # ----------------------------------------------------
              # MATCHUP INPUTS
              # ----------------------------------------------------

              matchup_inputs = {}

              interesting_matchup_keys = [
                  "matchup_score",
                  "matchup_label",
                  "allowed",
                  "league",
                  "ratio",
                  "current_games",
                  "historical_games",
                  "current_allowed",
                  "historical_allowed",
                  "league_average"
              ]

              for key in interesting_matchup_keys:

                  if (
                      key in matchup
                      and matchup.get(key)
                      is not None
                  ):
                      matchup_inputs[key] = matchup.get(
                          key
                      )

              # Preserve additional matchup evidence if structure
              # uses slightly different field names.

              for key, value in matchup.items():

                  key_lower = str(key).lower()

                  if (
                      key not in matchup_inputs
                      and any(
                          token in key_lower
                          for token in [
                              "allow",
                              "league",
                              "ratio",
                              "game",
                              "score",
                              "label"
                          ]
                      )
                  ):
                      matchup_inputs[key] = value

              # ----------------------------------------------------
              # EXPLANATION
              # ----------------------------------------------------

              explanation = []

              if projection is not None:

                  explanation.append(
                      (
                          f"JPro's baseline model projects "
                          f"{player} at {projection} for "
                          f"{prop_name}."
                      )
                  )

              role_label = role.get(
                  "role_label",
                  "UNKNOWN"
              )

              role_score = round_num(
                  role.get("role_score")
              )

              if role_score is not None:

                  explanation.append(
                      (
                          f"Expected opportunity is classified "
                          f"{role_label} with a Role V2 score "
                          f"of {role_score}."
                      )
                  )

              matchup_label = matchup.get(
                  "matchup_label",
                  "NEUTRAL"
              )

              matchup_score = round_num(
                  matchup.get(
                      "matchup_score"
                  )
              )

              if matchup_score is not None:

                  explanation.append(
                      (
                          f"Opponent production matchup is "
                          f"{matchup_label} with a matchup "
                          f"score of {matchup_score}."
                      )
                  )

              if (
                  histogram_total(
                      prop.get(
                          "simulation_histogram",
                          []
                      )
                  )
                  == EXPECTED_SIMS
              ):

                  explanation.append(
                      (
                          "The uncertainty range comes from "
                          "20,000 simulated outcomes rather "
                          "than a single deterministic number."
                      )
                  )

              if effects:

                  for effect in effects:
                      explanation.append(
                          effect.get(
                              "description"
                          )
                      )

                  explanation.append(
                      (
                          "JPro Gameday V1 does not fabricate "
                          "a workload redistribution percentage. "
                          "Because the relevant teammate/QB "
                          "situation changed, this projection is "
                          "flagged for additional market review."
                      )
                  )

              if practice_context:

                  explanation.append(
                      practice_context
                  )

              if not gameday_eligible:

                  explanation.append(
                      (
                          "This player is not eligible for "
                          "tonight's JPro market analysis."
                      )
                  )

              # ----------------------------------------------------
              # DATA SOURCES / MODEL INPUT CATEGORIES
              # ----------------------------------------------------

              data_used = [
                  "nflverse historical player statistics",
                  "lagged player production features",
                  "recent rolling production",
                  "Role V2 opportunity blend",
                  "opponent production matchup intelligence",
                  "V1.5.1 current-player availability gate",
                  "20,000-outcome empirical simulation distribution"
              ]

              if effects:
                  data_used.append(
                      "verified gameday availability context"
                  )

              # ----------------------------------------------------
              # RISKS
              # ----------------------------------------------------

              risks = []

              if effects:

                  risks.append(
                      (
                          "Tonight's personnel situation differs "
                          "from the baseline model environment."
                      )
                  )

              if player == "Case Keenum":

                  risks.append(
                      (
                          "Keenum's lack of recent regular-season "
                          "playing data materially increases "
                          "uncertainty."
                      )
                  )

              if team == "CHI":

                  if position in {
                      "WR",
                      "TE",
                      "RB"
                  }:

                      risks.append(
                          (
                              "Chicago skill-player usage and "
                              "efficiency may change with "
                              "Case Keenum expected to start."
                          )
                      )

              if team == "PHI":

                  if position in {
                      "WR",
                      "TE",
                      "RB",
                      "QB"
                  }:

                      risks.append(
                          (
                              "Philadelphia's offensive distribution "
                              "may change with Dallas Goedert and "
                              "Marquise Brown unavailable."
                          )
                      )

              if not risks:

                  risks.append(
                      (
                          "Normal football variance, game script, "
                          "usage changes and late news remain risks."
                      )
                  )

              # ----------------------------------------------------
              # MARKET READINESS
              # ----------------------------------------------------

              if not gameday_eligible:

                  readiness = (
                      "NO_PLAY_UNAVAILABLE"
                  )

              elif (
                  histogram_total(
                      prop.get(
                          "simulation_histogram",
                          []
                      )
                  )
                  != EXPECTED_SIMS
              ):

                  readiness = (
                      "INSUFFICIENT_SIMULATION_DATA"
                  )

              elif (
                  confidence["label"]
                  in {
                      "INSUFFICIENT"
                  }
              ):

                  readiness = (
                      "INSUFFICIENT_GAMEDAY_EVIDENCE"
                  )

              elif effects:

                  readiness = (
                      "REVIEW_AVAILABILITY_SENSITIVE"
                  )

              else:

                  readiness = (
                      "MODEL_READY"
                  )

              return {
                  "version":
                      "JPRO_PLAYER_ANALYSIS_GAMEDAY_V1",

                  "player":
                      player,

                  "team":
                      team,

                  "opponent":
                      opponent,

                  "position":
                      position,

                  "prop":
                      prop_name,

                  "baseline_projection":
                      projection,

                  "gameday_projection":
                      projection,

                  "projection_adjusted":
                      False,

                  "adjustment_reason":
                      (
                          "No unvalidated injury redistribution "
                          "multiplier applied."
                      ),

                  "simulation_count":
                      histogram_total(
                          prop.get(
                              "simulation_histogram",
                              []
                          )
                      ),

                  "distribution": {
                      "p10":
                          round_num(
                              percentiles.get("p10")
                          ),

                      "p25":
                          round_num(
                              percentiles.get("p25")
                          ),

                      "median":
                          round_num(
                              percentiles.get("median")
                          ),

                      "p75":
                          round_num(
                              percentiles.get("p75")
                          ),

                      "p90":
                          round_num(
                              percentiles.get("p90")
                          )
                  },

                  "expected_role": {
                      "label":
                          role_label,

                      "score":
                          role_score,

                      "method":
                          role.get(
                              "role_method"
                          ),

                      "inputs":
                          role_inputs
                  },

                  "matchup_intelligence": {
                      "label":
                          matchup_label,

                      "score":
                          matchup_score,

                      "inputs":
                          matchup_inputs
                  },

                  "availability": {
                      "base_v151":
                          base_availability,

                      "gameday_eligible":
                          bool(
                              gameday_eligible
                          ),

                      "practice_context":
                          practice_context,

                      "effects":
                          effects
                  },

                  "quarterback_context":
                      EXPECTED_STARTING_QB.get(
                          team
                      ),

                  "projection_confidence":
                      confidence,

                  "market_reference": {
                      "model_reference_line":
                          market.get(
                              "model_reference_line"
                          ),

                      "reference_lean":
                          market.get(
                              "model_reference_lean"
                          ),

                      "reference_probability":
                          market.get(
                              "model_reference_probability"
                          ),

                      "sportsbook_line":
                          None,

                      "sportsbook_odds":
                          None
                  },

                  "why_jpro_projects_this":
                      explanation,

                  "data_used":
                      data_used,

                  "risk_factors":
                      risks,

                  "market_readiness":
                      readiness,

                  "important_note":
                      (
                          "Projection confidence describes evidence "
                          "quality, not certainty. A sportsbook line "
                          "and price must still be compared against "
                          "the model distribution."
                      )
              }


          # ========================================================
          # IDENTIFY TONIGHT'S PLAYER UNIVERSE
          # ========================================================

          gameday_rows = []

          gameday_players = set()

          blocked_by_verified_out = set()

          availability_sensitive_rows = 0

          model_ready_rows = 0

          review_rows = 0

          insufficient_rows = 0

          readiness_counts = Counter()

          team_counts = Counter()

          position_counts = Counter()

          # ========================================================
          # APPLY GAMEDAY LAYER
          # ========================================================

          for prop in projections:

              team = upper(
                  prop.get("team")
              )

              opponent = upper(
                  prop.get("opponent")
              )

              if (
                  team not in TARGET_TEAMS
              ):
                  continue

              # Make sure this is actually PHI/CHI context.
              if (
                  opponent
                  and opponent not in TARGET_TEAMS
              ):
                  continue

              player = clean_name(
                  prop.get("player")
              )

              position = upper(
                  prop.get("position")
              )

              prop_name = str(
                  prop.get("prop")
                  or ""
              )

              gameday_players.add(
                  (
                      team,
                      player
                  )
              )

              team_counts[team] += 1

              position_counts[
                  position or "UNKNOWN"
              ] += 1

              base_ok = base_eligible(
                  prop
              )

              verified_out_info = (
                  find_out_info(
                      team,
                      player
                  )
              )

              verified_out = (
                  verified_out_info
                  is not None
              )

              if verified_out:

                  gameday_eligible = False

                  blocked_by_verified_out.add(
                      (
                          team,
                          player
                      )
                  )

              else:

                  gameday_eligible = bool(
                      base_ok
                  )

              effects = absence_effects(
                  team,
                  position,
                  prop_name,
                  player
              )

              analysis = build_player_analysis(
                  prop,
                  effects,
                  gameday_eligible
              )

              readiness = analysis.get(
                  "market_readiness"
              )

              readiness_counts[
                  readiness
              ] += 1

              if readiness == "MODEL_READY":
                  model_ready_rows += 1

              elif (
                  readiness
                  == "REVIEW_AVAILABILITY_SENSITIVE"
              ):
                  review_rows += 1

              else:
                  insufficient_rows += 1

              if effects:
                  availability_sensitive_rows += 1

              # ----------------------------------------------------
              # GAMEDAY OBJECT
              # ----------------------------------------------------

              prop[
                  "jpro_gameday_v1"
              ] = {
                  "game":
                      GAME_LABEL,

                  "engine":
                      "JPRO_GAMEDAY_ENGINE_V1",

                  "base_v151_eligible":
                      bool(base_ok),

                  "verified_out":
                      bool(verified_out),

                  "verified_out_info":
                      verified_out_info,

                  "gameday_eligible":
                      bool(gameday_eligible),

                  "availability_sensitive":
                      bool(effects),

                  "availability_effects":
                      effects,

                  "market_readiness":
                      readiness,

                  "projection_adjusted":
                      False,

                  "baseline_projection":
                      round_num(
                          prop.get(
                              "projection"
                          )
                      ),

                  "gameday_projection":
                      round_num(
                          prop.get(
                              "projection"
                          )
                      ),

                  "simulation_count":
                      histogram_total(
                          prop.get(
                              "simulation_histogram",
                              []
                          )
                      ),

                  "starting_qb_context":
                      EXPECTED_STARTING_QB.get(
                          team
                      )
              }

              # Detailed player explanation.
              prop[
                  "player_analysis"
              ] = analysis

              prop[
                  "player_analysis_v1"
              ] = analysis

              # ----------------------------------------------------
              # REMOVE PICKS ANALYSIS FROM VERIFIED OUT PLAYERS
              # ----------------------------------------------------

              if not gameday_eligible:

                  prop.pop(
                      "picks_analysis",
                      None
                  )

              gameday_rows.append(
                  prop
              )

          if not gameday_rows:

              raise RuntimeError(
                  "No PHI/CHI projections were found."
              )

          # ========================================================
          # CASE KEENUM CHECK
          # ========================================================

          keenum_rows = [
              p
              for p in gameday_rows
              if clean_name(
                  p.get("player")
              ) == "Case Keenum"
          ]

          keenum_projection_available = (
              len(keenum_rows) > 0
          )

          if keenum_projection_available:

              for prop in keenum_rows:

                  prop[
                      "jpro_gameday_v1"
                  ][
                      "expected_starting_qb"
                  ] = True

                  prop[
                      "jpro_gameday_v1"
                  ][
                      "special_uncertainty"
                  ] = (
                      "HIGHER_THAN_NORMAL"
                  )

          # ========================================================
          # BUILD TONIGHT-SPECIFIC GAMEDAY BOARD
          # ========================================================

          gameday_board = []

          for prop in gameday_rows:

              gameday = prop.get(
                  "jpro_gameday_v1",
                  {}
              )

              analysis = prop.get(
                  "player_analysis_v1",
                  {}
              )

              if not gameday.get(
                  "gameday_eligible"
              ):
                  continue

              gameday_board.append({
                  "player_id":
                      prop.get("player_id"),

                  "player":
                      prop.get("player"),

                  "team":
                      prop.get("team"),

                  "opponent":
                      prop.get("opponent"),

                  "position":
                      prop.get("position"),

                  "prop":
                      prop.get("prop"),

                  "projection":
                      prop.get("projection"),

                  "median":
                      analysis.get(
                          "distribution",
                          {}
                      ).get("median"),

                  "p25":
                      analysis.get(
                          "distribution",
                          {}
                      ).get("p25"),

                  "p75":
                      analysis.get(
                          "distribution",
                          {}
                      ).get("p75"),

                  "p10":
                      analysis.get(
                          "distribution",
                          {}
                      ).get("p10"),

                  "p90":
                      analysis.get(
                          "distribution",
                          {}
                      ).get("p90"),

                  "role_label":
                      analysis.get(
                          "expected_role",
                          {}
                      ).get("label"),

                  "role_score":
                      analysis.get(
                          "expected_role",
                          {}
                      ).get("score"),

                  "matchup_label":
                      analysis.get(
                          "matchup_intelligence",
                          {}
                      ).get("label"),

                  "matchup_score":
                      analysis.get(
                          "matchup_intelligence",
                          {}
                      ).get("score"),

                  "projection_confidence":
                      analysis.get(
                          "projection_confidence"
                      ),

                  "availability_sensitive":
                      gameday.get(
                          "availability_sensitive"
                      ),

                  "market_readiness":
                      gameday.get(
                          "market_readiness"
                      ),

                  "player_analysis":
                      analysis
              })

          # ========================================================
          # SORT BOARD
          #
          # MODEL_READY first
          # REVIEW second
          # ========================================================

          readiness_order = {
              "MODEL_READY": 0,
              "REVIEW_AVAILABILITY_SENSITIVE": 1,
              "INSUFFICIENT_GAMEDAY_EVIDENCE": 2,
              "INSUFFICIENT_SIMULATION_DATA": 3,
              "NO_PLAY_UNAVAILABLE": 4
          }

          gameday_board.sort(
              key=lambda x: (
                  readiness_order.get(
                      x.get(
                          "market_readiness"
                      ),
                      99
                  ),
                  -(
                      num(
                          x.get(
                              "role_score"
                          ),
                          0
                      )
                      or 0
                  ),
                  str(
                      x.get("player")
                  )
              )
          )

          # ========================================================
          # TOP-LEVEL GAMEDAY OBJECT
          # ========================================================

          data[
              "jpro_gameday_engine"
          ] = {
              "version":
                  "JPRO_GAMEDAY_ENGINE_V1",

              "status":
                  "READY",

              "game":
                  GAME_LABEL,

              "date":
                  "2026-09-28",

              "kickoff_et":
                  "8:15 PM",

              "teams": [
                  "PHI",
                  "CHI"
              ],

              "expected_starting_qbs":
                  EXPECTED_STARTING_QB,

              "verified_out":
                  CONFIRMED_OUT,

              "questionable_context":
                  QUESTIONABLE_CONTEXT,

              "full_practice_context":
                  FULL_PRACTICE_CONTEXT,

              "base_availability_gate":
                  "JPRO_AVAILABILITY_GATE_V1.5.1",

              "base_model_preserved":
                  True,

              "simulation_engine_preserved":
                  True,

              "injury_redistribution_enabled":
                  False,

              "injury_redistribution_reason":
                  (
                      "No unvalidated workload-transfer "
                      "multipliers are used in Gameday V1."
                  ),

              "projection_rows":
                  len(gameday_rows),

              "unique_players":
                  len(gameday_players),

              "model_ready_rows":
                  model_ready_rows,

              "availability_sensitive_rows":
                  availability_sensitive_rows,

              "review_rows":
                  review_rows,

              "insufficient_rows":
                  insufficient_rows,

              "verified_out_players_found":
                  len(
                      blocked_by_verified_out
                  ),

              "case_keenum_projection_available":
                  keenum_projection_available,

              "case_keenum_note":
                  (
                      "Case Keenum is expected to start for "
                      "Chicago. If the base model does not have "
                      "a defensible Keenum distribution, JPro "
                      "does not fabricate one."
                  ),

              "market_prices_connected":
                  False,

              "market_input_required":
                  True,

              "player_analysis_enabled":
                  True,

              "player_analysis_version":
                  "JPRO_PLAYER_ANALYSIS_GAMEDAY_V1",

              "confidence_note":
                  (
                      "Projection confidence measures evidence "
                      "quality and does not represent certainty "
                      "or guaranteed betting performance."
                  ),

              "generated_at_utc":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }

          data[
              "jpro_gameday_board"
          ] = gameday_board

          data[
              "jpro_gameday_game"
          ] = {
              "game":
                  GAME_LABEL,

              "away_team":
                  "PHI",

              "home_team":
                  "CHI",

              "expected_starting_qb_away":
                  "Jalen Hurts",

              "expected_starting_qb_home":
                  "Case Keenum",

              "kickoff":
                  "2026-09-28 8:15 PM ET"
          }

          # ========================================================
          # SAVE
          # ========================================================

          with open(
              PATH,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  separators=(",", ":")
              )

          # ========================================================
          # OUTPUT
          # ========================================================

          print("")
          print("=" * 78)
          print("GAMEDAY BUILD COMPLETE")
          print("=" * 78)

          print(
              "Game:",
              GAME_LABEL
          )

          print(
              "Gameday projection rows:",
              len(gameday_rows)
          )

          print(
              "Unique players:",
              len(gameday_players)
          )

          print(
              "Model-ready rows:",
              model_ready_rows
          )

          print(
              "Availability-sensitive rows:",
              availability_sensitive_rows
          )

          print(
              "Review rows:",
              review_rows
          )

          print(
              "Other / insufficient rows:",
              insufficient_rows
          )

          print(
              "Verified-out players found:",
              len(
                  blocked_by_verified_out
              )
          )

          print(
              "Case Keenum projection available:",
              keenum_projection_available
          )

          print("")
          print("READINESS COUNTS")

          for key, value in sorted(
              readiness_counts.items()
          ):
              print(
                  " ",
                  key,
                  ":",
                  value
              )

          print("")
          print("TEAM ROWS")

          for key, value in sorted(
              team_counts.items()
          ):
              print(
                  " ",
                  key,
                  ":",
                  value
              )

          print("")
          print("=" * 78)
          print("GAMEDAY BOARD PREVIEW")
          print("=" * 78)

          for item in gameday_board[:40]:

              print("")

              print(
                  item.get("player"),
                  "|",
                  item.get("team"),
                  "|",
                  item.get("position")
              )

              print(
                  "  PROP:",
                  item.get("prop")
              )

              print(
                  "  PROJECTION:",
                  item.get("projection")
              )

              print(
                  "  MEDIAN:",
                  item.get("median")
              )

              print(
                  "  RANGE P25-P75:",
                  item.get("p25"),
                  "-",
                  item.get("p75")
              )

              print(
                  "  ROLE:",
                  item.get("role_label"),
                  item.get("role_score")
              )

              print(
                  "  MATCHUP:",
                  item.get("matchup_label"),
                  item.get("matchup_score")
              )

              confidence = item.get(
                  "projection_confidence",
                  {}
              )

              print(
                  "  CONFIDENCE:",
                  confidence.get("label"),
                  confidence.get("score")
              )

              print(
                  "  AVAILABILITY SENSITIVE:",
                  item.get(
                      "availability_sensitive"
                  )
              )

              print(
                  "  MARKET READINESS:",
                  item.get(
                      "market_readiness"
                  )
              )

          print("")
          print("=" * 78)
          print("JPRO GAMEDAY ENGINE V1 READY")
          print("=" * 78)

          PY

      # ============================================================
      # VERIFY GAMEDAY ENGINE
      # ============================================================

      - name: Verify Eagles Bears Gameday Engine
        run: |
          python <<'PY'
          import json

          PATH = "data/jpro-current-projections.json"
          EXPECTED_SIMS = 20000

          print("=" * 78)
          print("VERIFY JPRO GAMEDAY ENGINE V1")
          print("=" * 78)

          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          engine = data.get(
              "jpro_gameday_engine",
              {}
          )

          if (
              engine.get("version")
              != "JPRO_GAMEDAY_ENGINE_V1"
          ):
              raise RuntimeError(
                  "Wrong Gameday Engine version."
              )

          if (
              engine.get("status")
              != "READY"
          ):
              raise RuntimeError(
                  "Gameday Engine is not READY."
              )

          if (
              engine.get(
                  "base_availability_gate"
              )
              != "JPRO_AVAILABILITY_GATE_V1.5.1"
          ):
              raise RuntimeError(
                  "Wrong availability foundation."
              )

          if (
              engine.get(
                  "injury_redistribution_enabled"
              )
              is not False
          ):
              raise RuntimeError(
                  "Unvalidated redistribution "
                  "must not be enabled."
              )

          projections = data.get(
              "projections",
              []
          )

          gameday_rows = []

          for prop in projections:

              gameday = prop.get(
                  "jpro_gameday_v1"
              )

              if (
                  isinstance(
                      gameday,
                      dict
                  )
                  and gameday.get(
                      "engine"
                  )
                  == "JPRO_GAMEDAY_ENGINE_V1"
              ):
                  gameday_rows.append(
                      prop
                  )

          if not gameday_rows:
              raise RuntimeError(
                  "No gameday projection rows."
              )

          teams = {
              str(
                  p.get("team")
              ).upper()
              for p in gameday_rows
          }

          if not teams.issubset(
              {
                  "PHI",
                  "CHI"
              }
          ):
              raise RuntimeError(
                  "Non-PHI/CHI team entered "
                  "gameday board."
              )

          analyses = 0

          valid_20k = 0

          eligible = 0

          unavailable = 0

          sensitive = 0

          for prop in gameday_rows:

              analysis = prop.get(
                  "player_analysis_v1"
              )

              if not isinstance(
                  analysis,
                  dict
              ):
                  raise RuntimeError(
                      "Missing player analysis for "
                      + str(
                          prop.get("player")
                      )
                      + " / "
                      + str(
                          prop.get("prop")
                      )
                  )

              analyses += 1

              gameday = prop.get(
                  "jpro_gameday_v1",
                  {}
              )

              if gameday.get(
                  "gameday_eligible"
              ):
                  eligible += 1
              else:
                  unavailable += 1

              if gameday.get(
                  "availability_sensitive"
              ):
                  sensitive += 1

              histogram = prop.get(
                  "simulation_histogram",
                  []
              )

              if histogram:

                  total = sum(
                      int(row[1])
                      for row in histogram
                  )

                  if total != EXPECTED_SIMS:
                      raise RuntimeError(
                          "Broken simulation distribution: "
                          + str(
                              prop.get("player")
                          )
                          + " / "
                          + str(
                              prop.get("prop")
                          )
                          + " = "
                          + str(total)
                      )

                  valid_20k += 1

          board = data.get(
              "jpro_gameday_board",
              []
          )

          if not board:
              raise RuntimeError(
                  "Gameday board is empty."
              )

          # --------------------------------------------------------
          # CONFIRMED OUTS MUST NEVER APPEAR AS ELIGIBLE
          # --------------------------------------------------------

          confirmed_out_names = {
              "Caleb Williams",
              "Dallas Goedert",
              "Marquise Brown",
              "Hollywood Brown",
              "Fred Johnson"
          }

          for prop in gameday_rows:

              player = str(
                  prop.get("player")
                  or ""
              ).strip()

              if (
                  player
                  in confirmed_out_names
              ):

                  gameday = prop.get(
                      "jpro_gameday_v1",
                      {}
                  )

                  if gameday.get(
                      "gameday_eligible"
                  ) is True:
                      raise RuntimeError(
                          "Confirmed OUT player "
                          "still eligible: "
                          + player
                      )

          # --------------------------------------------------------
          # NO FAKE SPORTSBOOK PRICES
          # --------------------------------------------------------

          for item in board:

              analysis = item.get(
                  "player_analysis",
                  {}
              )

              market = analysis.get(
                  "market_reference",
                  {}
              )

              if (
                  market.get(
                      "sportsbook_line"
                  )
                  is not None
              ):
                  raise RuntimeError(
                      "Fabricated sportsbook line."
                  )

              if (
                  market.get(
                      "sportsbook_odds"
                  )
                  is not None
              ):
                  raise RuntimeError(
                      "Fabricated sportsbook odds."
                  )

          # --------------------------------------------------------
          # VERIFY BASE PROJECTIONS WERE NOT ALTERED
          # --------------------------------------------------------

          altered = 0

          for prop in gameday_rows:

              gameday = prop.get(
                  "jpro_gameday_v1",
                  {}
              )

              if gameday.get(
                  "projection_adjusted"
              ):
                  altered += 1

          if altered != 0:
              raise RuntimeError(
                  "Gameday V1 unexpectedly "
                  "altered model projections."
              )

          # --------------------------------------------------------
          # FINAL
          # --------------------------------------------------------

          print(
              "Gameday rows:",
              len(gameday_rows)
          )

          print(
              "Player analyses:",
              analyses
          )

          print(
              "Eligible gameday rows:",
              eligible
          )

          print(
              "Unavailable gameday rows:",
              unavailable
          )

          print(
              "Availability-sensitive rows:",
              sensitive
          )

          print(
              "Verified 20K distributions:",
              valid_20k
          )

          print(
              "Gameday board rows:",
              len(board)
          )

          print(
              "Unvalidated projection adjustments:",
              altered
          )

          print("")
          print("=" * 78)
          print("JPRO GAMEDAY ENGINE V1 VERIFIED")
          print("=" * 78)

          print(
              "EAGLES @ BEARS: READY"
          )

          print(
              "PLAYER ANALYSIS: ACTIVE"
          )

          print(
              "V1.5.1 AVAILABILITY: PRESERVED"
          )

          print(
              "20K DISTRIBUTIONS: PRESERVED"
          )

          print(
              "CONFIRMED OUTS: BLOCKED"
          )

          print(
              "CASE KEENUM CONTEXT: ACTIVE"
          )

          print(
              "FAKE SPORTSBOOK PRICES: 0"
          )

          print(
              "UNVALIDATED REDISTRIBUTION: 0"
          )

          PY

