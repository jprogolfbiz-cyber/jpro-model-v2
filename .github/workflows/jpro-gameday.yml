name: JPro Gameday Engine V1.1 - TD Engine

on:

  workflow_dispatch:

permissions:

  contents: write

jobs:

  jpro-gameday-td:

    runs-on: ubuntu-latest

    steps:

      - name: Get JPro

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Install TD Engine Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install nflreadpy pandas numpy pyarrow

      # ============================================================

      # JPRO GAMEDAY TD ENGINE V1.1

      #

      # PURPOSE

      # -------

      # Adds an independent touchdown model to the already-verified

      # Eagles @ Bears Gameday Engine V1.

      #

      # OUTPUTS

      # -------

      # - Anytime TD probability

      # - 2+ TD probability

      # - Model fair American odds

      # - TD confidence

      # - Historical TD evidence

      # - Role evidence

      # - Availability/QB context

      # - Detailed TD Player Analysis

      #

      # IMPORTANT

      # ---------

      # This is TD V1 / EXPERIMENTAL.

      #

      # It does NOT derive TD probability from projected yardage.

      # It does NOT fabricate sportsbook prices.

      # It does NOT pretend to have red-zone data that is absent.

      # It does NOT alter the verified yardage/reception projections.

      # ============================================================

      - name: Build JPro TD Engine V1.1

        run: |

          python <<'PY'

          import json

          import math

          import os

          import re

          import unicodedata

          from collections import defaultdict

          from datetime import datetime, timezone

          import numpy as np

          import pandas as pd

          import nflreadpy as nfl

          PATH = "data/jpro-current-projections.json"

          TARGET_TEAMS = {"PHI", "CHI"}

          print("=" * 78)

          print("JPRO GAMEDAY TD ENGINE V1.1")

          print("EAGLES @ BEARS")

          print("=" * 78)

          # ========================================================

          # LOAD EXISTING GAMEDAY DATA

          # ========================================================

          if not os.path.exists(PATH):

              raise RuntimeError(

                  f"Missing required file: {PATH}"

              )

          with open(PATH, "r", encoding="utf-8") as f:

              data = json.load(f)

          gameday_engine = data.get(

              "jpro_gameday_engine",

              {}

          )

          if (

              gameday_engine.get("version")

              != "JPRO_GAMEDAY_ENGINE_V1"

              or gameday_engine.get("status")

              != "READY"

          ):

              raise RuntimeError(

                  "Verified JPro Gameday Engine V1 "

                  "must be run before TD Engine V1.1."

              )

          projections = data.get(

              "projections",

              []

          )

          if not projections:

              raise RuntimeError(

                  "No projections found."

              )

          gameday_rows = [

              p for p in projections

              if isinstance(

                  p.get("jpro_gameday_v1"),

                  dict

              )

              and p["jpro_gameday_v1"].get(

                  "engine"

              ) == "JPRO_GAMEDAY_ENGINE_V1"

          ]

          if not gameday_rows:

              raise RuntimeError(

                  "No Gameday V1 rows found."

              )

          print(

              "Verified gameday rows:",

              len(gameday_rows)

          )

          # ========================================================

          # HELPERS

          # ========================================================

          def num(value, default=0.0):

              try:

                  value = float(value)

                  if (

                      math.isnan(value)

                      or math.isinf(value)

                  ):

                      return default

                  return value

              except Exception:

                  return default

          def clamp(value, low, high):

              return max(

                  low,

                  min(

                      high,

                      value

                  )

              )

          def normalize_name(name):

              if name is None:

                  return ""

              text = str(name).strip().lower()

              text = unicodedata.normalize(

                  "NFKD",

                  text

              )

              text = "".join(

                  c for c in text

                  if not unicodedata.combining(c)

              )

              text = re.sub(

                  r"[^a-z0-9 ]",

                  "",

                  text

              )

              text = re.sub(

                  r"\s+",

                  " ",

                  text

              ).strip()

              return text

          def american_from_probability(p):

              p = num(p)

              if p <= 0 or p >= 1:

                  return None

              if p >= 0.5:

                  odds = (

                      -100

                      * p

                      / (1 - p)

                  )

              else:

                  odds = (

                      100

                      * (1 - p)

                      / p

                  )

              return int(

                  round(odds)

              )

          def poisson_at_least_one(lam):

              lam = max(

                  num(lam),

                  0

              )

              return (

                  1

                  - math.exp(-lam)

              )

          def poisson_two_plus(lam):

              lam = max(

                  num(lam),

                  0

              )

              return (

                  1

                  - math.exp(-lam)

                  * (1 + lam)

              )

          def safe_mean(values):

              values = [

                  num(x, None)

                  for x in values

              ]

              values = [

                  x for x in values

                  if x is not None

              ]

              if not values:

                  return 0.0

              return float(

                  np.mean(values)

              )

          # ========================================================

          # LOAD HISTORICAL NFL PLAYER DATA

          # ========================================================

          print("")

          print("=" * 78)

          print("LOADING HISTORICAL TOUCHDOWN DATA")

          print("=" * 78)

          seasons = [

              2022,

              2023,

              2024,

              2025,

              2026

          ]

          raw = nfl.load_player_stats(

              seasons

          )

          try:

              stats = raw.to_pandas()

          except Exception:

              stats = pd.DataFrame(raw)

          print(

              "Historical rows:",

              len(stats)

          )

          print(

              "Columns:",

              len(stats.columns)

          )

          # ========================================================

          # FIELD DISCOVERY

          # ========================================================

          name_candidates = [

              "player_display_name",

              "player_name",

              "player",

              "name"

          ]

          team_candidates = [

              "recent_team",

              "team",

              "posteam"

          ]

          position_candidates = [

              "position",

              "position_group"

          ]

          season_candidates = [

              "season"

          ]

          week_candidates = [

              "week"

          ]

          rush_td_candidates = [

              "rushing_tds",

              "rush_tds",

              "rushing_td"

          ]

          rec_td_candidates = [

              "receiving_tds",

              "rec_tds",

              "receiving_td"

          ]

          target_candidates = [

              "targets"

          ]

          carry_candidates = [

              "carries",

              "rushing_attempts"

          ]

          reception_candidates = [

              "receptions"

          ]

          receiving_yards_candidates = [

              "receiving_yards"

          ]

          rushing_yards_candidates = [

              "rushing_yards"

          ]

          def find_column(candidates):

              for key in candidates:

                  if key in stats.columns:

                      return key

              return None

          NAME_COL = find_column(

              name_candidates

          )

          TEAM_COL = find_column(

              team_candidates

          )

          POSITION_COL = find_column(

              position_candidates

          )

          SEASON_COL = find_column(

              season_candidates

          )

          WEEK_COL = find_column(

              week_candidates

          )

          RUSH_TD_COL = find_column(

              rush_td_candidates

          )

          REC_TD_COL = find_column(

              rec_td_candidates

          )

          TARGET_COL = find_column(

              target_candidates

          )

          CARRY_COL = find_column(

              carry_candidates

          )

          RECEPTION_COL = find_column(

              reception_candidates

          )

          REC_YARDS_COL = find_column(

              receiving_yards_candidates

          )

          RUSH_YARDS_COL = find_column(

              rushing_yards_candidates

          )

          print(

              "Name column:",

              NAME_COL

          )

          print(

              "Team column:",

              TEAM_COL

          )

          print(

              "Position column:",

              POSITION_COL

          )

          print(

              "Rushing TD column:",

              RUSH_TD_COL

          )

          print(

              "Receiving TD column:",

              REC_TD_COL

          )

          if NAME_COL is None:

              raise RuntimeError(

                  "Player name column not found."

              )

          if SEASON_COL is None:

              raise RuntimeError(

                  "Season column not found."

              )

          if (

              RUSH_TD_COL is None

              and REC_TD_COL is None

          ):

              raise RuntimeError(

                  "No rushing or receiving "

                  "touchdown fields found."

              )

          # ========================================================

          # NORMALIZE HISTORICAL DATA

          # ========================================================

          stats = stats.copy()

          stats["_name_key"] = (

              stats[NAME_COL]

              .fillna("")

              .map(normalize_name)

          )

          stats["_season"] = (

              pd.to_numeric(

                  stats[SEASON_COL],

                  errors="coerce"

              )

              .fillna(0)

              .astype(int)

          )

          if WEEK_COL:

              stats["_week"] = (

                  pd.to_numeric(

                      stats[WEEK_COL],

                      errors="coerce"

                  )

                  .fillna(0)

                  .astype(int)

              )

          else:

              stats["_week"] = 0

          if RUSH_TD_COL:

              stats["_rush_td"] = (

                  pd.to_numeric(

                      stats[RUSH_TD_COL],

                      errors="coerce"

                  )

                  .fillna(0)

              )

          else:

              stats["_rush_td"] = 0.0

          if REC_TD_COL:

              stats["_rec_td"] = (

                  pd.to_numeric(

                      stats[REC_TD_COL],

                      errors="coerce"

                  )

                  .fillna(0)

              )

          else:

              stats["_rec_td"] = 0.0

          stats["_total_td"] = (

              stats["_rush_td"]

              + stats["_rec_td"]

          )

          stats["_scored_td"] = (

              stats["_total_td"] >= 1

          ).astype(int)

          stats["_scored_2plus"] = (

              stats["_total_td"] >= 2

          ).astype(int)

          # ========================================================

          # PRE-WEEK-3 CUTOFF

          #

          # Do not train tonight using Week 3 results.

          # ========================================================

          historical = stats[

              (

                  stats["_season"] < 2026

              )

              |

              (

                  (

                      stats["_season"] == 2026

                  )

                  &

                  (

                      stats["_week"] < 3

                  )

              )

          ].copy()

          print(

              "Pre-Week-3 rows:",

              len(historical)

          )

          # ========================================================

          # BUILD PLAYER TD PROFILES

          # ========================================================

          profiles = {}

          grouped = historical.groupby(

              "_name_key",

              dropna=False

          )

          for name_key, group in grouped:

              if not name_key:

                  continue

              group = group.sort_values(

                  [

                      "_season",

                      "_week"

                  ]

              )

              career_games = len(group)

              if career_games == 0:

                  continue

              career_td = float(

                  group["_total_td"].sum()

              )

              career_td_games = int(

                  group["_scored_td"].sum()

              )

              career_2plus_games = int(

                  group["_scored_2plus"].sum()

              )

              # ----------------------------------------------------

              # PRIOR SEASON

              # ----------------------------------------------------

              prior = group[

                  group["_season"] == 2025

              ]

              prior_games = len(prior)

              prior_td = float(

                  prior["_total_td"].sum()

              )

              prior_td_rate = (

                  prior_td / prior_games

                  if prior_games > 0

                  else 0.0

              )

              prior_score_rate = (

                  float(

                      prior["_scored_td"].mean()

                  )

                  if prior_games > 0

                  else 0.0

              )

              # ----------------------------------------------------

              # CURRENT SEASON

              # ----------------------------------------------------

              current = group[

                  (

                      group["_season"] == 2026

                  )

                  &

                  (

                      group["_week"] < 3

                  )

              ]

              current_games = len(

                  current

              )

              current_td = float(

                  current["_total_td"].sum()

              )

              current_td_rate = (

                  current_td / current_games

                  if current_games > 0

                  else 0.0

              )

              current_score_rate = (

                  float(

                      current["_scored_td"].mean()

                  )

                  if current_games > 0

                  else 0.0

              )

              # ----------------------------------------------------

              # RECENT GAMES

              # ----------------------------------------------------

              recent = group.tail(8)

              recent_games = len(

                  recent

              )

              recent_td_rate = (

                  float(

                      recent["_total_td"].mean()

                  )

                  if recent_games > 0

                  else 0.0

              )

              recent_score_rate = (

                  float(

                      recent["_scored_td"].mean()

                  )

                  if recent_games > 0

                  else 0.0

              )

              # ----------------------------------------------------

              # OPPORTUNITY DATA

              # ----------------------------------------------------

              avg_targets = 0.0

              avg_carries = 0.0

              avg_receptions = 0.0

              if TARGET_COL:

                  avg_targets = safe_mean(

                      recent[

                          TARGET_COL

                      ].tolist()

                  )

              if CARRY_COL:

                  avg_carries = safe_mean(

                      recent[

                          CARRY_COL

                      ].tolist()

                  )

              if RECEPTION_COL:

                  avg_receptions = safe_mean(

                      recent[

                          RECEPTION_COL

                      ].tolist()

                  )

              # ----------------------------------------------------

              # POSITION

              # ----------------------------------------------------

              position = None

              if POSITION_COL:

                  non_null = (

                      group[

                          POSITION_COL

                      ]

                      .dropna()

                  )

                  if len(non_null):

                      position = str(

                          non_null.iloc[-1]

                      )

              profiles[name_key] = {

                  "career_games":

                      career_games,

                  "career_touchdowns":

                      round(

                          career_td,

                          2

                      ),

                  "career_td_games":

                      career_td_games,

                  "career_2plus_games":

                      career_2plus_games,

                  "career_td_per_game":

                      round(

                          career_td

                          / career_games,

                          4

                      ),

                  "career_score_rate":

                      round(

                          career_td_games

                          / career_games,

                          4

                      ),

                  "career_2plus_rate":

                      round(

                          career_2plus_games

                          / career_games,

                          4

                      ),

                  "prior_games":

                      prior_games,

                  "prior_td_rate":

                      round(

                          prior_td_rate,

                          4

                      ),

                  "prior_score_rate":

                      round(

                          prior_score_rate,

                          4

                      ),

                  "current_games":

                      current_games,

                  "current_td_rate":

                      round(

                          current_td_rate,

                          4

                      ),

                  "current_score_rate":

                      round(

                          current_score_rate,

                          4

                      ),

                  "recent_games":

                      recent_games,

                  "recent_td_rate":

                      round(

                          recent_td_rate,

                          4

                      ),

                  "recent_score_rate":

                      round(

                          recent_score_rate,

                          4

                      ),

                  "recent_avg_targets":

                      round(

                          avg_targets,

                          2

                      ),

                  "recent_avg_carries":

                      round(

                          avg_carries,

                          2

                      ),

                  "recent_avg_receptions":

                      round(

                          avg_receptions,

                          2

                      ),

                  "position":

                      position

              }

          print(

              "Historical TD profiles:",

              len(profiles)

          )

          # ========================================================

          # POSITION PRIORS

          #

          # Used for shrinkage only.

          # ========================================================

          position_prior = {

              "QB": 0.16,

              "RB": 0.31,

              "WR": 0.24,

              "TE": 0.20

          }

          # ========================================================

          # UNIQUE GAMEDAY PLAYERS

          # ========================================================

          player_props = defaultdict(

              list

          )

          for prop in gameday_rows:

              team = str(

                  prop.get("team")

                  or ""

              ).upper()

              if team not in TARGET_TEAMS:

                  continue

              player = str(

                  prop.get("player")

                  or ""

              ).strip()

              if not player:

                  continue

              player_props[

                  (

                      team,

                      player

                  )

              ].append(prop)

          print(

              "Unique gameday players:",

              len(player_props)

          )

          # ========================================================

          # BUILD TD MODEL

          # ========================================================

          td_board = []

          matched_profiles = 0

          insufficient_profiles = 0

          for (

              team,

              player

          ), props in player_props.items():

              # ----------------------------------------------------

              # USE FIRST PROP AS PLAYER CONTEXT

              # ----------------------------------------------------

              first = props[0]

              gameday = first.get(

                  "jpro_gameday_v1",

                  {}

              )

              if not gameday.get(

                  "gameday_eligible"

              ):

                  continue

              position = str(

                  first.get("position")

                  or ""

              ).upper()

              if position not in {

                  "QB",

                  "RB",

                  "WR",

                  "TE"

              }:

                  continue

              key = normalize_name(

                  player

              )

              profile = profiles.get(

                  key

              )

              role = first.get(

                  "role",

                  {}

              )

              if not isinstance(

                  role,

                  dict

              ):

                  role = {}

              role_score = num(

                  role.get(

                      "role_score"

                  ),

                  50

              )

              role_label = role.get(

                  "role_label",

                  "UNKNOWN"

              )

              matchup = first.get(

                  "matchup",

                  {}

              )

              if not isinstance(

                  matchup,

                  dict

              ):

                  matchup = {}

              matchup_score = num(

                  matchup.get(

                      "matchup_score"

                  ),

                  50

              )

              matchup_label = matchup.get(

                  "matchup_label",

                  "NEUTRAL"

              )

              availability_sensitive = any(

                  bool(

                      p.get(

                          "jpro_gameday_v1",

                          {}

                      ).get(

                          "availability_sensitive"

                      )

                  )

                  for p in props

              )

              # ----------------------------------------------------

              # NO PROFILE

              # ----------------------------------------------------

              if profile is None:

                  insufficient_profiles += 1

                  td_analysis = {

                      "version":

                          "JPRO_TD_ENGINE_V1.1",

                      "status":

                          "INSUFFICIENT_EVIDENCE",

                      "player":

                          player,

                      "team":

                          team,

                      "position":

                          position,

                      "anytime_td_probability":

                          None,

                      "two_plus_td_probability":

                          None,

                      "anytime_fair_odds":

                          None,

                      "two_plus_fair_odds":

                          None,

                      "confidence":

                          "INSUFFICIENT",

                      "why_jpro":

                          [

                              (

                                  "JPro could not match enough "

                                  "historical touchdown data for "

                                  "this player."

                              )

                          ],

                      "risk_factors":

                          [

                              (

                                  "TD probability is not shown "

                                  "rather than fabricating a number."

                              )

                          ]

                  }

                  for prop in props:

                      prop[

                          "td_analysis"

                      ] = td_analysis

                  continue

              matched_profiles += 1

              # ----------------------------------------------------

              # SHRUNK BASE TD RATE

              #

              # Current season receives weight, but with only

              # two games it cannot dominate the estimate.

              # ----------------------------------------------------

              prior_games = int(

                  profile[

                      "prior_games"

                  ]

              )

              current_games = int(

                  profile[

                      "current_games"

                  ]

              )

              career_games = int(

                  profile[

                      "career_games"

                  ]

              )

              recent_games = int(

                  profile[

                      "recent_games"

                  ]

              )

              prior_rate = num(

                  profile[

                      "prior_td_rate"

                  ]

              )

              current_rate = num(

                  profile[

                      "current_td_rate"

                  ]

              )

              recent_rate = num(

                  profile[

                      "recent_td_rate"

                  ]

              )

              career_rate = num(

                  profile[

                      "career_td_per_game"

                  ]

              )

              prior_position = (

                  position_prior.get(

                      position,

                      0.20

                  )

              )

              # ----------------------------------------------------

              # EVIDENCE WEIGHTS

              # ----------------------------------------------------

              career_weight = min(

                  career_games / 32,

                  1.0

              ) * 0.20

              prior_weight = min(

                  prior_games / 12,

                  1.0

              ) * 0.35

              current_weight = min(

                  current_games / 6,

                  1.0

              ) * 0.20

              recent_weight = min(

                  recent_games / 8,

                  1.0

              ) * 0.15

              prior_shrink_weight = 0.10

              total_weight = (

                  career_weight

                  + prior_weight

                  + current_weight

                  + recent_weight

                  + prior_shrink_weight

              )

              if total_weight <= 0:

                  base_lambda = (

                      prior_position

                  )

              else:

                  base_lambda = (

                      career_rate

                      * career_weight

                      + prior_rate

                      * prior_weight

                      + current_rate

                      * current_weight

                      + recent_rate

                      * recent_weight

                      + prior_position

                      * prior_shrink_weight

                  ) / total_weight

              # ----------------------------------------------------

              # ROLE ADJUSTMENT

              #

              # Role is used conservatively.

              #

              # 50 = neutral

              # 100 = max +15%

              # 0 = max -15%

              # ----------------------------------------------------

              role_multiplier = (

                  1.0

                  + clamp(

                      (

                          role_score

                          - 50

                      )

                      / 50

                      * 0.15,

                      -0.15,

                      0.15

                  )

              )

              # ----------------------------------------------------

              # MATCHUP ADJUSTMENT

              #

              # Conservative because existing matchup model is

              # production allowed, not TD-specific defense.

              # ----------------------------------------------------

              matchup_multiplier = (

                  1.0

                  + clamp(

                      (

                          matchup_score

                          - 50

                      )

                      / 50

                      * 0.08,

                      -0.08,

                      0.08

                  )

              )

              # ----------------------------------------------------

              # GAMEDAY UNCERTAINTY

              #

              # IMPORTANT:

              # We do NOT automatically boost players because

              # Goedert/Brown are out.

              #

              # We preserve the central estimate and lower

              # confidence instead.

              # ----------------------------------------------------

              gameday_multiplier = 1.0

              adjusted_lambda = (

                  base_lambda

                  * role_multiplier

                  * matchup_multiplier

                  * gameday_multiplier

              )

              adjusted_lambda = clamp(

                  adjusted_lambda,

                  0.01,

                  1.35

              )

              # ----------------------------------------------------

              # PROBABILITIES

              # ----------------------------------------------------

              anytime_probability = (

                  poisson_at_least_one(

                      adjusted_lambda

                  )

              )

              two_plus_probability = (

                  poisson_two_plus(

                      adjusted_lambda

                  )

              )

              # ----------------------------------------------------

              # EVIDENCE CONFIDENCE

              # ----------------------------------------------------

              evidence_score = 35

              if career_games >= 32:

                  evidence_score += 15

              elif career_games >= 16:

                  evidence_score += 10

              elif career_games >= 8:

                  evidence_score += 5

              if prior_games >= 12:

                  evidence_score += 15

              elif prior_games >= 6:

                  evidence_score += 8

              if current_games >= 2:

                  evidence_score += 5

              if recent_games >= 6:

                  evidence_score += 10

              if role_score >= 65:

                  evidence_score += 5

              if availability_sensitive:

                  evidence_score -= 10

              if player == "Case Keenum":

                  evidence_score -= 20

              evidence_score = int(

                  clamp(

                      evidence_score,

                      0,

                      100

                  )

              )

              if evidence_score >= 70:

                  confidence = "HIGHER"

              elif evidence_score >= 50:

                  confidence = "MODERATE"

              elif evidence_score >= 30:

                  confidence = "LOWER"

              else:

                  confidence = "INSUFFICIENT"

              # ----------------------------------------------------

              # FAIL CLOSED

              # ----------------------------------------------------

              if (

                  career_games < 4

                  and prior_games < 4

              ):

                  status = (

                      "INSUFFICIENT_EVIDENCE"

                  )

              elif confidence == "INSUFFICIENT":

                  status = (

                      "INSUFFICIENT_EVIDENCE"

                  )

              elif availability_sensitive:

                  status = (

