name: JPro Availability Engine V1.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  availability-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Availability Engine V1.2
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow

      - name: Audit Weekly Roster Statuses V1.2
        run: |
          python <<'PY'
          import json
          import os
          from collections import Counter, defaultdict

          import nflreadpy as nfl
          import polars as pl


          SEASON = 2026
          OUTPUT = "data/jpro-roster-status-audit.json"

          SKILL_POSITIONS = {"QB", "RB", "WR", "TE"}


          print("=" * 78)
          print("JPRO AVAILABILITY ENGINE V1.2")
          print("WEEKLY ROSTER STATUS AUDIT")
          print("=" * 78)


          def to_pl(data):
              if isinstance(data, pl.DataFrame):
                  return data
              return pl.DataFrame(data)


          def text(value):
              if value is None:
                  return ""
              return str(value).strip()


          def upper(value):
              return text(value).upper()


          def safe_int(value, default=0):
              try:
                  return int(float(value))
              except Exception:
                  return default


          def first_col(columns, choices):
              for choice in choices:
                  if choice in columns:
                      return choice
              return None


          print("")
          print("Loading 2026 weekly rosters...")

          weekly = to_pl(
              nfl.load_rosters_weekly([SEASON])
          )

          print(
              "Rows:",
              weekly.height
          )

          print(
              "Columns:",
              len(weekly.columns)
          )


          columns = set(weekly.columns)

          season_col = first_col(
              columns,
              ["season"]
          )

          week_col = first_col(
              columns,
              ["week", "week_number"]
          )

          id_col = first_col(
              columns,
              ["gsis_id", "player_id", "player_gsis_id"]
          )

          name_col = first_col(
              columns,
              [
                  "full_name",
                  "player_name",
                  "player_display_name",
                  "football_name"
              ]
          )

          team_col = first_col(
              columns,
              [
                  "team",
                  "team_abbr",
                  "recent_team",
                  "club"
              ]
          )

          position_col = first_col(
              columns,
              ["position", "position_group"]
          )

          status_col = first_col(
              columns,
              ["status", "roster_status"]
          )


          required = {
              "season": season_col,
              "week": week_col,
              "player_id": id_col,
              "player_name": name_col,
              "team": team_col,
              "position": position_col,
              "status": status_col
          }


          missing = [
              key
              for key, value in required.items()
              if value is None
          ]


          if missing:
              raise RuntimeError(
                  "Missing required fields: "
                  + ", ".join(missing)
              )


          rows = weekly.to_dicts()


          season_rows = [
              row
              for row in rows
              if safe_int(
                  row.get(season_col)
              ) == SEASON
          ]


          weeks = sorted(
              {
                  safe_int(
                      row.get(week_col)
                  )
                  for row in season_rows
                  if safe_int(
                      row.get(week_col)
                  ) > 0
              }
          )


          if not weeks:
              raise RuntimeError(
                  "No valid 2026 roster weeks found."
              )


          latest_week = max(weeks)


          snapshot = [
              row
              for row in season_rows
              if safe_int(
                  row.get(week_col)
              ) == latest_week
          ]


          print("")
          print("=" * 78)
          print("LATEST SNAPSHOT")
          print("=" * 78)

          print(
              "Season:",
              SEASON
          )

          print(
              "Week:",
              latest_week
          )

          print(
              "Snapshot rows:",
              len(snapshot)
          )


          # ==========================================================
          # STATUS COUNTS
          # ==========================================================

          status_counts = Counter()

          skill_status_counts = Counter()

          status_team_counts = defaultdict(Counter)

          status_examples = defaultdict(list)


          for row in snapshot:

              status = upper(
                  row.get(status_col)
              )

              if not status:
                  status = "<BLANK>"


              team = upper(
                  row.get(team_col)
              )

              position = upper(
                  row.get(position_col)
              )

              player = text(
                  row.get(name_col)
              )


              status_counts[status] += 1


              if position in SKILL_POSITIONS:
                  skill_status_counts[
                      status
                  ] += 1


              if team:
                  status_team_counts[
                      status
                  ][team] += 1


              if (
                  len(
                      status_examples[status]
                  )
                  < 12
              ):
                  status_examples[
                      status
                  ].append(
                      {
                          "player":
                              player,

                          "team":
                              team,

                          "position":
                              position
                      }
                  )


          # ==========================================================
          # PRINT STATUS AUDIT
          # ==========================================================

          print("")
          print("=" * 78)
          print("WEEK 3 STATUS COUNTS")
          print("=" * 78)


          for status, count in (
              status_counts.most_common()
          ):

              print(
                  f"{status}: {count}"
              )


          print("")
          print("=" * 78)
          print("WEEK 3 SKILL-PLAYER STATUS COUNTS")
          print("=" * 78)


          for status, count in (
              skill_status_counts.most_common()
          ):

              print(
                  f"{status}: {count}"
              )


          print("")
          print("=" * 78)
          print("STATUS EXAMPLES")
          print("=" * 78)


          for status, count in (
              status_counts.most_common()
          ):

              print("")
              print(
                  f"STATUS: {status}"
              )

              print(
                  f"TOTAL: {count}"
              )

              print(
                  "SKILL PLAYERS:",
                  skill_status_counts.get(
                      status,
                      0
                  )
              )

              print("EXAMPLES:")


              for example in (
                  status_examples[
                      status
                  ]
              ):

                  print(
                      "   ",
                      example["team"],
                      "|",
                      example["player"],
                      "|",
                      example["position"]
                  )


          # ==========================================================
          # TEAM-BY-STATUS COUNTS
          # ==========================================================

          teams = sorted(
              {
                  upper(
                      row.get(team_col)
                  )
                  for row in snapshot
                  if upper(
                      row.get(team_col)
                  )
              }
          )


          print("")
          print("=" * 78)
          print("TEAM / STATUS COUNTS")
          print("=" * 78)


          for team in teams:

              team_statuses = Counter()


              for row in snapshot:

                  if upper(
                      row.get(team_col)
                  ) != team:
                      continue


                  status = upper(
                      row.get(status_col)
                  )

                  if not status:
                      status = "<BLANK>"


                  team_statuses[
                      status
                  ] += 1


              print("")
              print(
                  team,
                  dict(
                      team_statuses
                  )
              )


          # ==========================================================
          # ACTIVE-CANDIDATE DIAGNOSTIC
          #
          # IMPORTANT:
          # We are NOT approving these yet.
          # This only shows what ACT looks like.
          # ==========================================================

          act_rows = [
              row
              for row in snapshot
              if upper(
                  row.get(status_col)
              ) == "ACT"
          ]


          act_ids = {
              text(
                  row.get(id_col)
              )
              for row in act_rows
              if text(
                  row.get(id_col)
              )
          }


          act_skill = [
              row
              for row in act_rows
              if upper(
                  row.get(position_col)
              )
              in SKILL_POSITIONS
          ]


          act_teams = {
              upper(
                  row.get(team_col)
              )
              for row in act_rows
              if upper(
                  row.get(team_col)
              )
          }


          act_team_counts = Counter(
              upper(
                  row.get(team_col)
              )
              for row in act_rows
              if upper(
                  row.get(team_col)
              )
          )


          print("")
          print("=" * 78)
          print("ACT STATUS DIAGNOSTIC")
          print("=" * 78)

          print(
              "ACT rows:",
              len(act_rows)
          )

          print(
              "Unique ACT players:",
              len(act_ids)
          )

          print(
              "ACT skill players:",
              len(act_skill)
          )

          print(
              "Teams represented by ACT:",
              len(act_teams)
          )


          print("")
          print("ACT PLAYERS PER TEAM")


          for team in sorted(
              act_team_counts
          ):

              print(
                  team,
                  act_team_counts[
                      team
                  ]
              )


          # ==========================================================
          # SAVE AUDIT ONLY
          # ==========================================================

          output = {
              "engine":
                  "JPRO_AVAILABILITY_V1_2_STATUS_AUDIT",

              "status":
                  "AUDIT_ONLY",

              "season":
                  SEASON,

              "snapshot_week":
                  latest_week,

              "snapshot_rows":
                  len(snapshot),

              "status_counts":
                  dict(
                      status_counts
                  ),

              "skill_status_counts":
                  dict(
                      skill_status_counts
                  ),

              "status_examples":
                  dict(
                      status_examples
                  ),

              "act_diagnostic": {
                  "rows":
                      len(act_rows),

                  "unique_players":
                      len(act_ids),

                  "skill_players":
                      len(act_skill),

                  "teams":
                      len(act_teams),

                  "team_counts":
                      dict(
                          sorted(
                              act_team_counts.items()
                          )
                      )
              },

              "important_note":
                  (
                      "V1.2 is an audit only. "
                      "No roster status has yet been approved "
                      "as the JPro betting pool."
                  )
          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  separators=(",", ":")
              )


          print("")
          print("=" * 78)
          print("JPRO AVAILABILITY V1.2 STATUS AUDIT COMPLETE")
          print("=" * 78)

          print(
              "Saved:",
              OUTPUT
          )

          print(
              "NO PROJECTIONS MODIFIED."
          )

          PY

      - name: Verify Availability Status Audit V1.2
        run: |
          python <<'PY'
          import json


          PATH = "data/jpro-roster-status-audit.json"


          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if (
              data.get("engine")
              !=
              "JPRO_AVAILABILITY_V1_2_STATUS_AUDIT"
          ):
              raise RuntimeError(
                  "Wrong V1.2 audit version."
              )


          if (
              data.get("status")
              !=
              "AUDIT_ONLY"
          ):
              raise RuntimeError(
                  "V1.2 must remain audit-only."
              )


          counts = data.get(
              "status_counts",
              {}
          )


          if not counts:
              raise RuntimeError(
                  "No roster status counts found."
              )


          print("=" * 78)
          print("VERIFY JPRO AVAILABILITY V1.2")
          print("=" * 78)

          print(
              "Snapshot week:",
              data.get(
                  "snapshot_week"
              )
          )

          print(
              "Snapshot rows:",
              data.get(
                  "snapshot_rows"
              )
          )


          print("")
          print("STATUS COUNTS")

          for status, count in (
              counts.items()
          ):
              print(
                  status,
                  count
              )


          print("")
          print("SKILL STATUS COUNTS")

          for status, count in (
              data.get(
                  "skill_status_counts",
                  {}
              ).items()
          ):
              print(
                  status,
                  count
              )


          act = data.get(
              "act_diagnostic",
              {}
          )


          print("")
          print("ACT DIAGNOSTIC")

          print(
              "ACT rows:",
              act.get("rows")
          )

          print(
              "Unique ACT players:",
              act.get(
                  "unique_players"
              )
          )

          print(
              "ACT skill players:",
              act.get(
                  "skill_players"
              )
          )

          print(
              "ACT teams:",
              act.get(
                  "teams"
              )
          )


          print("")
          print("=" * 78)
          print("JPRO AVAILABILITY V1.2 VERIFIED")
          print("=" * 78)

          print(
              "AUDIT ONLY — NO PROJECTIONS MODIFIED."
          )

          PY

      - name: Save Availability Status Audit V1.2
        run: |
          git config user.name "JPro Cloud Engine"
          git config user.email "actions@github.com"

          git add data/jpro-roster-status-audit.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "Add JPro Availability V1.2 roster status audit"

            git push
          fi
