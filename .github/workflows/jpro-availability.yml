name: JPro Availability Engine V1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  availability-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce Current Player Universe V1.4
        run: |
          python <<'PY'
          import json
          import os
          from collections import Counter


          PROJECTION_PATH = "data/jpro-current-projections.json"
          UNIVERSE_PATH = "data/jpro-current-player-universe.json"

          ELIGIBLE_STATUS = "CURRENT_ACTIVE_ROSTER"

          BLOCKED_STATUSES = {
              "CURRENT_ROSTER_UNAVAILABLE",
              "DEVELOPMENT_PLAYER",
              "CURRENT_PLAYER_TEAM_MISMATCH",
              "CURRENT_ROSTER_EXCLUDED",
              "NOT_CURRENT_ROSTER"
          }


          print("=" * 78)
          print("JPRO AVAILABILITY ENGINE V1.4")
          print("CURRENT ROSTER ENFORCEMENT GATE")
          print("=" * 78)


          # ==========================================================
          # LOAD FILES
          # ==========================================================

          for path in [
              PROJECTION_PATH,
              UNIVERSE_PATH
          ]:
              if not os.path.exists(path):
                  raise RuntimeError(
                      f"Missing required file: {path}"
                  )


          with open(
              PROJECTION_PATH,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          with open(
              UNIVERSE_PATH,
              "r",
              encoding="utf-8"
          ) as f:
              universe = json.load(f)


          if (
              universe.get("engine")
              != "JPRO_CURRENT_PLAYER_UNIVERSE_V1_3"
          ):
              raise RuntimeError(
                  "V1.4 requires verified V1.3 player universe."
              )


          if isinstance(data, list):
              raise RuntimeError(
                  "Expected jpro-current-projections.json "
                  "to be an object, not a raw list."
              )


          projections = data.get(
              "projections",
              []
          )


          if not projections:
              raise RuntimeError(
                  "No projections found."
              )


          audit_rows = universe.get(
              "projection_audit",
              []
          )


          if not audit_rows:
              raise RuntimeError(
                  "V1.3 projection audit is empty."
              )


          print("")
          print(
              "Projection rows loaded:",
              len(projections)
          )

          print(
              "V1.3 audit rows loaded:",
              len(audit_rows)
          )


          # ==========================================================
          # BUILD AUDIT LOOKUPS
          #
          # Primary key:
          # player_id + team + prop
          #
          # Fallback:
          # player name + team + prop
          # ==========================================================

          def text(value):
              if value is None:
                  return ""
              return str(value).strip()


          def upper(value):
              return text(value).upper()


          def norm(value):
              return text(value).lower().strip()


          def audit_keys(row):

              player_id = text(
                  row.get("player_id")
              )

              player = norm(
                  row.get("player")
              )

              team = upper(
                  row.get("projection_team")
              )

              prop = norm(
                  row.get("prop")
              )

              keys = []

              if player_id:
                  keys.append(
                      (
                          "ID",
                          player_id,
                          team,
                          prop
                      )
                  )

              if player:
                  keys.append(
                      (
                          "NAME",
                          player,
                          team,
                          prop
                      )
                  )

              return keys


          audit_lookup = {}


          for row in audit_rows:

              for key in audit_keys(row):

                  audit_lookup[
                      key
                  ] = row


          # ==========================================================
          # MATCH PROJECTION -> V1.3 AUDIT
          # ==========================================================

          def find_audit(projection):

              player_id = text(
                  projection.get("player_id")
              )

              player = norm(
                  projection.get("player")
                  or projection.get("player_name")
              )

              team = upper(
                  projection.get("team")
              )

              prop = norm(
                  projection.get("prop")
              )


              if player_id:

                  key = (
                      "ID",
                      player_id,
                      team,
                      prop
                  )

                  if key in audit_lookup:
                      return audit_lookup[key]


              if player:

                  key = (
                      "NAME",
                      player,
                      team,
                      prop
                  )

                  if key in audit_lookup:
                      return audit_lookup[key]


              return None


          # ==========================================================
          # ENFORCE
          # ==========================================================

          enforcement_counts = Counter()

          blocked_rows = []

          eligible_rows = []

          unmatched_rows = []


          for projection in projections:

              audit = find_audit(
                  projection
              )


              if audit is None:

                  status = (
                      "ROSTER_AUDIT_MATCH_MISSING"
                  )

                  eligible = False

                  current_team = None

                  roster_status = None

                  roster_classification = None


                  unmatched_rows.append(
                      {
                          "player":
                              projection.get("player"),

                          "team":
                              projection.get("team"),

                          "position":
                              projection.get("position"),

                          "prop":
                              projection.get("prop")
                      }
                  )


              else:

                  status = audit.get(
                      "model_status"
                  )

                  current_team = audit.get(
                      "current_team"
                  )

                  roster_status = audit.get(
                      "roster_status"
                  )

                  roster_classification = audit.get(
                      "roster_classification"
                  )


                  eligible = (
                      status
                      == ELIGIBLE_STATUS
                  )


              # ----------------------------------------------
              # Attach enforcement metadata
              # ----------------------------------------------

              projection[
                  "availability"
              ] = {
                  "engine":
                      "JPRO_AVAILABILITY_V1_4",

                  "model_status":
                      status,

                  "current_team":
                      current_team,

                  "roster_status":
                      roster_status,

                  "roster_classification":
                      roster_classification,

                  "betting_pool_eligible":
                      eligible
              }


              projection[
                  "betting_pool_eligible"
              ] = eligible


              if eligible:

                  projection[
                      "betting_pool_block_reason"
                  ] = None

                  eligible_rows.append(
                      projection
                  )

                  enforcement_counts[
                      "ELIGIBLE"
                  ] += 1


              else:

                  projection[
                      "betting_pool_block_reason"
                  ] = status

                  blocked_rows.append(
                      {
                          "player":
                              projection.get("player"),

                          "projection_team":
                              projection.get("team"),

                          "current_team":
                              current_team,

                          "position":
                              projection.get("position"),

                          "prop":
                              projection.get("prop"),

                          "reason":
                              status,

                          "roster_status":
                              roster_status
                      }
                  )

                  enforcement_counts[
                      status
                  ] += 1


          # ==========================================================
          # UNIQUE PLAYER COUNTS
          # ==========================================================

          player_gate = {}


          for projection in projections:

              pid = text(
                  projection.get("player_id")
              )

              name = norm(
                  projection.get("player")
                  or projection.get("player_name")
              )

              team = upper(
                  projection.get("team")
              )

              key = (
                  pid
                  if pid
                  else f"{name}::{team}"
              )


              if key not in player_gate:

                  player_gate[key] = {
                      "player":
                          projection.get("player")
                          or projection.get("player_name"),

                      "projection_team":
                          projection.get("team"),

                      "current_team":
                          projection.get(
                              "availability",
                              {}
                          ).get(
                              "current_team"
                          ),

                      "position":
                          projection.get("position"),

                      "status":
                          projection.get(
                              "availability",
                              {}
                          ).get(
                              "model_status"
                          ),

                      "eligible":
                          projection.get(
                              "betting_pool_eligible",
                              False
                          )
                  }


          unique_counts = Counter(
              (
                  "ELIGIBLE"
                  if row["eligible"]
                  else row["status"]
              )
              for row in player_gate.values()
          )


          # ==========================================================
          # HARD SAFETY CHECK
          #
          # Every projection MUST have been classified.
          # We fail instead of silently letting an unknown player in.
          # ==========================================================

          if unmatched_rows:

              print("")
              print("=" * 78)
              print("UNMATCHED AUDIT ROWS")
              print("=" * 78)

              for row in unmatched_rows[:30]:
                  print(
                      row["player"],
                      "|",
                      row["team"],
                      "|",
                      row["position"],
                      "|",
                      row["prop"]
                  )

              raise RuntimeError(
                  "V1.4 refused enforcement because "
                  f"{len(unmatched_rows)} projection rows "
                  "could not be matched to V1.3."
              )


          # ==========================================================
          # FILTER JPRO PICKS CANDIDATES
          #
          # We are NOT recalculating probabilities here.
          # We only remove roster-ineligible candidates.
          # ==========================================================

          eligible_player_ids = set()

          eligible_name_team = set()


          for projection in projections:

              if not projection.get(
                  "betting_pool_eligible",
                  False
              ):
                  continue


              pid = text(
                  projection.get("player_id")
              )

              name = norm(
                  projection.get("player")
                  or projection.get("player_name")
              )

              team = upper(
                  projection.get("team")
              )


              if pid:
                  eligible_player_ids.add(
                      pid
                  )


              if name:
                  eligible_name_team.add(
                      (
                          name,
                          team
                      )
                  )


          def candidate_is_eligible(candidate):

              pid = text(
                  candidate.get("player_id")
              )

              name = norm(
                  candidate.get("player")
                  or candidate.get("player_name")
              )

              team = upper(
                  candidate.get("team")
              )


              if (
                  pid
                  and pid in eligible_player_ids
              ):
                  return True


              if (
                  name
                  and (
                      name,
                      team
                  ) in eligible_name_team
              ):
                  return True


              return False


          original_candidates = data.get(
              "jpro_picks_candidates",
              []
          )


          if not isinstance(
              original_candidates,
              list
          ):
              original_candidates = []


          filtered_candidates = [
              candidate
              for candidate in original_candidates
              if candidate_is_eligible(
                  candidate
              )
          ]


          blocked_candidate_count = (
              len(original_candidates)
              -
              len(filtered_candidates)
          )


          data[
              "jpro_picks_candidates"
          ] = filtered_candidates


          # ==========================================================
          # FILTER CANDIDATE GROUPS IF PRESENT
          # ==========================================================

          groups = data.get(
              "jpro_picks_candidate_groups"
          )


          if isinstance(groups, dict):

              for group_name, group_rows in (
                  list(groups.items())
              ):

                  if not isinstance(
                      group_rows,
                      list
                  ):
                      continue


                  groups[
                      group_name
                  ] = [
                      candidate
                      for candidate in group_rows
                      if candidate_is_eligible(
                          candidate
                      )
                  ]


              data[
                  "jpro_picks_candidate_groups"
              ] = groups


          # ==========================================================
          # FILTER ACTUAL PICKS IF PRESENT
          #
          # Currently this should normally be empty.
          # Still enforce the same safety gate.
          # ==========================================================

          existing_picks = data.get(
              "jpro_picks",
              []
          )


          if isinstance(
              existing_picks,
              list
          ):

              data[
                  "jpro_picks"
              ] = [
                  pick
                  for pick in existing_picks
                  if candidate_is_eligible(
                      pick
                  )
              ]


          # ==========================================================
          # SAVE ENGINE METADATA
          # ==========================================================

          data[
              "availability_engine"
          ] = {
              "version":
                  "JPRO_AVAILABILITY_V1_4",

              "status":
                  "ENFORCED",

              "source":
                  "JPRO_CURRENT_PLAYER_UNIVERSE_V1_3",

              "snapshot_week":
                  universe.get(
                      "snapshot_week"
                  ),

              "eligible_status":
                  ELIGIBLE_STATUS,

              "blocked_statuses":
                  sorted(
                      BLOCKED_STATUSES
                  ),

              "projection_rows":
                  len(projections),

              "eligible_projection_rows":
                  len(eligible_rows),

              "blocked_projection_rows":
                  len(blocked_rows),

              "unique_projected_players":
                  len(player_gate),

              "eligible_unique_players":
                  sum(
                      1
                      for row in player_gate.values()
                      if row["eligible"]
                  ),

              "blocked_unique_players":
                  sum(
                      1
                      for row in player_gate.values()
                      if not row["eligible"]
                  ),

              "candidates_before":
                  len(
                      original_candidates
                  ),

              "candidates_after":
                  len(
                      filtered_candidates
                  ),

              "candidates_blocked":
                  blocked_candidate_count,

              "important_note":
                  (
                      "V1.4 does not delete projection "
                      "distributions. It blocks roster-ineligible "
                      "players from the betting pool and JPro "
                      "candidate lists."
                  )
          }


          # ==========================================================
          # WRITE PROJECTIONS
          # ==========================================================

          with open(
              PROJECTION_PATH,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  separators=(",", ":")
              )


          # ==========================================================
          # WRITE SEPARATE ENFORCEMENT AUDIT
          # ==========================================================

          enforcement_audit = {
              "engine":
                  "JPRO_AVAILABILITY_V1_4",

              "status":
                  "ENFORCED",

              "snapshot_week":
                  universe.get(
                      "snapshot_week"
                  ),

              "projection_row_counts":
                  dict(
                      enforcement_counts
                  ),

              "unique_player_counts":
                  dict(
                      unique_counts
                  ),

              "blocked_projection_rows":
                  blocked_rows,

              "player_gate":
                  list(
                      player_gate.values()
                  ),

              "candidate_counts": {
                  "before":
                      len(
                          original_candidates
                      ),

                  "after":
                      len(
                          filtered_candidates
                      ),

                  "blocked":
                      blocked_candidate_count
              }
          }


          with open(
              "data/jpro-availability-enforcement.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  enforcement_audit,
                  f,
                  separators=(",", ":")
              )


          # ==========================================================
          # OUTPUT
          # ==========================================================

          print("")
          print("=" * 78)
          print("V1.4 ENFORCEMENT RESULTS")
          print("=" * 78)

          print(
              "Projection rows:",
              len(projections)
          )

          print(
              "Eligible projection rows:",
              len(eligible_rows)
          )

          print(
              "Blocked projection rows:",
              len(blocked_rows)
          )

          print(
              "Unique projected players:",
              len(player_gate)
          )

          print(
              "Eligible unique players:",
              sum(
                  1
                  for row in player_gate.values()
                  if row["eligible"]
              )
          )

          print(
              "Blocked unique players:",
              sum(
                  1
                  for row in player_gate.values()
                  if not row["eligible"]
              )
          )


          print("")
          print("UNIQUE PLAYER GATE")

          for status, count in (
              unique_counts.most_common()
          ):
              print(
                  f"{status}: {count}"
              )


          print("")
          print("JPRO PICKS CANDIDATES")

          print(
              "Before:",
              len(
                  original_candidates
              )
          )

          print(
              "After:",
              len(
                  filtered_candidates
              )
          )

          print(
              "Blocked:",
              blocked_candidate_count
          )


          print("")
          print("=" * 78)
          print("BLOCKED PLAYER EXAMPLES")
          print("=" * 78)


          blocked_players = [
              row
              for row in player_gate.values()
              if not row["eligible"]
          ]


          for row in blocked_players[:40]:

              print(
                  f"{row['player']} | "
                  f"{row['projection_team']} | "
                  f"{row['position']} | "
                  f"{row['status']}"
              )


          print("")
          print("=" * 78)
          print("JPRO AVAILABILITY V1.4 ENFORCED")
          print("=" * 78)

          print(
              "Projection distributions preserved."
          )

          print(
              "Roster-ineligible players blocked "
              "from betting pool."
          )

          PY

      - name: Verify Availability Enforcement V1.4
        run: |
          python <<'PY'
          import json


          PROJECTION_PATH = "data/jpro-current-projections.json"
          AUDIT_PATH = "data/jpro-availability-enforcement.json"


          with open(
              PROJECTION_PATH,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          with open(
              AUDIT_PATH,
              "r",
              encoding="utf-8"
          ) as f:
              audit = json.load(f)


          engine = data.get(
              "availability_engine",
              {}
          )


          if (
              engine.get("version")
              != "JPRO_AVAILABILITY_V1_4"
          ):
              raise RuntimeError(
                  "V1.4 availability metadata missing."
              )


          if (
              engine.get("status")
              != "ENFORCED"
          ):
              raise RuntimeError(
                  "V1.4 enforcement not active."
              )


          projections = data.get(
              "projections",
              []
          )


          if not projections:
              raise RuntimeError(
                  "Projection data missing after enforcement."
              )


          # Every projection must now have the gate.
          missing_gate = [
              row
              for row in projections
              if "betting_pool_eligible"
              not in row
          ]


          if missing_gate:
              raise RuntimeError(
                  f"{len(missing_gate)} projection rows "
                  "are missing the V1.4 gate."
              )


          # No blocked candidate may survive.
          candidates = data.get(
              "jpro_picks_candidates",
              []
          )


          eligible_ids = {
              str(
                  row.get("player_id")
              ).strip()
              for row in projections
              if row.get(
                  "betting_pool_eligible"
              )
              and row.get(
                  "player_id"
              )
          }


          eligible_name_team = {
              (
                  str(
                      row.get("player")
                      or row.get("player_name")
                      or ""
                  ).strip().lower(),

                  str(
                      row.get("team")
                      or ""
                  ).strip().upper()
              )
              for row in projections
              if row.get(
                  "betting_pool_eligible"
              )
          }


          violations = []


          for candidate in candidates:

              pid = str(
                  candidate.get("player_id")
                  or ""
              ).strip()

              name_team = (
                  str(
                      candidate.get("player")
                      or candidate.get("player_name")
                      or ""
                  ).strip().lower(),

                  str(
                      candidate.get("team")
                      or ""
                  ).strip().upper()
              )


              if (
                  pid
                  and pid in eligible_ids
              ):
                  continue


              if (
                  name_team
                  in eligible_name_team
              ):
                  continue


              violations.append(
                  candidate
              )


          if violations:
              raise RuntimeError(
                  "Roster-ineligible JPro candidates "
                  "survived V1.4."
              )


          unique_counts = audit.get(
              "unique_player_counts",
              {}
          )


          blocked_unique = sum(
              count
              for status, count
              in unique_counts.items()
              if status != "ELIGIBLE"
          )


          print("=" * 78)
          print("VERIFY JPRO AVAILABILITY V1.4")
          print("=" * 78)

          print(
              "Snapshot week:",
              engine.get(
                  "snapshot_week"
              )
          )

          print(
              "Projection rows:",
              engine.get(
                  "projection_rows"
              )
          )

          print(
              "Eligible projection rows:",
              engine.get(
                  "eligible_projection_rows"
              )
          )

          print(
              "Blocked projection rows:",
              engine.get(
                  "blocked_projection_rows"
              )
          )

          print(
              "Unique projected players:",
              engine.get(
                  "unique_projected_players"
              )
          )

          print(
              "Eligible unique players:",
              engine.get(
                  "eligible_unique_players"
              )
          )

          print(
              "Blocked unique players:",
              blocked_unique
          )


          print("")
          print("UNIQUE PLAYER STATUS")


          for status, count in (
              unique_counts.items()
          ):
              print(
                  f"{status}: {count}"
              )


          print("")
          print("JPRO PICKS CANDIDATES")

          print(
              "Before:",
              engine.get(
                  "candidates_before"
              )
          )

          print(
              "After:",
              engine.get(
                  "candidates_after"
              )
          )

          print(
              "Blocked:",
              engine.get(
                  "candidates_blocked"
              )
          )


          print("")
          print("=" * 78)
          print("JPRO AVAILABILITY V1.4 VERIFIED")
          print("=" * 78)

          print(
              "Roster enforcement is ACTIVE."
          )

          print(
              "20K projection distributions remain preserved."
          )

          PY

      - name: Save Availability Enforcement V1.4
        run: |
          git config user.name "JPro Cloud Engine"
          git config user.email "actions@github.com"

          git add \
            data/jpro-current-projections.json \
            data/jpro-availability-enforcement.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "Enforce JPro Availability V1.4"

            git push
          fi
