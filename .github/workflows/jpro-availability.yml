name: JPro Availability Engine V1.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  availability-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Availability Engine V1.3
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow

      - name: Build Current Player Universe V1.3
        run: |
          python <<'PY'
          import json
          import os
          import re
          from collections import Counter, defaultdict

          import nflreadpy as nfl
          import polars as pl


          SEASON = 2026

          OUTPUT = "data/jpro-current-player-universe.json"
          PROJECTION_PATH = "data/jpro-current-projections.json"

          SKILL_POSITIONS = {"QB", "RB", "WR", "TE"}

          # Roster classifications learned from V1.2.
          #
          # ACT = current active roster
          # RES / INA = still tied to current team, but unavailable pool
          # DEV = developmental/practice-squad context
          # RET / CUT / EXE = not part of current usable team pool
          ACTIVE_CODES = {"ACT"}
          UNAVAILABLE_CODES = {"RES", "INA"}
          DEVELOPMENT_CODES = {"DEV"}
          EXCLUDED_CODES = {"RET", "CUT", "EXE"}


          print("=" * 78)
          print("JPRO AVAILABILITY ENGINE V1.3")
          print("CURRENT PLAYER UNIVERSE")
          print("=" * 78)


          def to_pl(data):
              if isinstance(data, pl.DataFrame):
                  return data
              return pl.DataFrame(data)


          def txt(value):
              if value is None:
                  return ""
              return str(value).strip()


          def upper(value):
              return txt(value).upper()


          def safe_int(value, default=0):
              try:
                  return int(float(value))
              except Exception:
                  return default


          def first_col(columns, choices):
              for choice in choices:
                  if choice in columns:
                      return choice
              return None


          def normalize_name(value):
              value = txt(value).lower()

              value = (
                  value
                  .replace("’", "'")
                  .replace("`", "'")
                  .replace(".", "")
                  .replace("'", "")
                  .replace("-", " ")
              )

              value = re.sub(
                  r"\b(jr|sr|ii|iii|iv|v)\b",
                  "",
                  value
              )

              value = re.sub(
                  r"[^a-z0-9 ]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()

              return value


          def classify_status(status):
              status = upper(status)

              if status in ACTIVE_CODES:
                  return "ACTIVE_ROSTER"

              if status in UNAVAILABLE_CODES:
                  return "ROSTER_UNAVAILABLE"

              if status in DEVELOPMENT_CODES:
                  return "DEVELOPMENT"

              if status in EXCLUDED_CODES:
                  return "EXCLUDED"

              return "UNKNOWN"


          # ==========================================================
          # LOAD WEEKLY ROSTERS
          # ==========================================================

          print("")
          print("Loading 2026 weekly rosters...")

          roster = to_pl(
              nfl.load_rosters_weekly([SEASON])
          )

          columns = set(roster.columns)

          season_col = first_col(
              columns,
              ["season"]
          )

          week_col = first_col(
              columns,
              ["week", "week_number"]
          )

          id_col = first_col(
              columns,
              ["gsis_id", "player_id", "player_gsis_id"]
          )

          name_col = first_col(
              columns,
              [
                  "full_name",
                  "player_name",
                  "player_display_name",
                  "football_name"
              ]
          )

          team_col = first_col(
              columns,
              [
                  "team",
                  "team_abbr",
                  "recent_team",
                  "club"
              ]
          )

          position_col = first_col(
              columns,
              ["position", "position_group"]
          )

          status_col = first_col(
              columns,
              ["status", "roster_status"]
          )


          required = {
              "season": season_col,
              "week": week_col,
              "player_id": id_col,
              "player_name": name_col,
              "team": team_col,
              "position": position_col,
              "status": status_col
          }


          missing = [
              key
              for key, value in required.items()
              if value is None
          ]


          if missing:
              raise RuntimeError(
                  "Missing required roster fields: "
                  + ", ".join(missing)
              )


          rows = roster.to_dicts()


          season_rows = [
              row
              for row in rows
              if safe_int(
                  row.get(season_col)
              ) == SEASON
          ]


          weeks = sorted(
              {
                  safe_int(row.get(week_col))
                  for row in season_rows
                  if safe_int(row.get(week_col)) > 0
              }
          )


          if not weeks:
              raise RuntimeError(
                  "No 2026 weekly roster snapshots found."
              )


          latest_week = max(weeks)


          snapshot = [
              row
              for row in season_rows
              if safe_int(
                  row.get(week_col)
              ) == latest_week
          ]


          print("")
          print("Latest roster week:", latest_week)
          print("Snapshot rows:", len(snapshot))


          # ==========================================================
          # BUILD CURRENT PLAYER UNIVERSE
          # ==========================================================

          players = []

          seen_ids = set()

          classification_counts = Counter()
          skill_classification_counts = Counter()
          team_active_counts = Counter()
          team_active_skill_counts = Counter()


          for row in snapshot:

              player_id = txt(
                  row.get(id_col)
              )

              player_name = txt(
                  row.get(name_col)
              )

              team = upper(
                  row.get(team_col)
              )

              position = upper(
                  row.get(position_col)
              )

              roster_status = upper(
                  row.get(status_col)
              )

              classification = classify_status(
                  roster_status
              )


              # GSIS ID is preferred. Name fallback is retained
              # only for audit/matching.
              unique_key = (
                  player_id
                  if player_id
                  else
                  f"{normalize_name(player_name)}::{team}"
              )


              if unique_key in seen_ids:
                  continue


              seen_ids.add(unique_key)


              is_skill = (
                  position in SKILL_POSITIONS
              )

              betting_pool_eligible = (
                  classification == "ACTIVE_ROSTER"
                  and is_skill
              )


              player = {
                  "player_id":
                      player_id,

                  "player":
                      player_name,

                  "normalized_name":
                      normalize_name(player_name),

                  "team":
                      team,

                  "position":
                      position,

                  "roster_status":
                      roster_status,

                  "classification":
                      classification,

                  "is_skill_player":
                      is_skill,

                  "betting_pool_eligible":
                      betting_pool_eligible
              }


              players.append(player)


              classification_counts[
                  classification
              ] += 1


              if is_skill:
                  skill_classification_counts[
                      classification
                  ] += 1


              if classification == "ACTIVE_ROSTER":
                  team_active_counts[
                      team
                  ] += 1


                  if is_skill:
                      team_active_skill_counts[
                          team
                      ] += 1


          # ==========================================================
          # INDEX CURRENT PLAYERS
          # ==========================================================

          by_id = {}

          by_name_team = {}

          by_name = defaultdict(list)


          for player in players:

              pid = player["player_id"]

              if pid:
                  by_id[pid] = player


              name_key = player[
                  "normalized_name"
              ]

              team = player["team"]


              if name_key:
                  by_name_team[
                      (name_key, team)
                  ] = player

                  by_name[
                      name_key
                  ].append(player)


          # ==========================================================
          # LOAD JPRO CURRENT PROJECTIONS
          # ==========================================================

          if not os.path.exists(
              PROJECTION_PATH
          ):
              raise RuntimeError(
                  f"Missing {PROJECTION_PATH}"
              )


          with open(
              PROJECTION_PATH,
              "r",
              encoding="utf-8"
          ) as f:
              projection_data = json.load(f)


          if isinstance(
              projection_data,
              list
          ):
              projections = projection_data

          elif isinstance(
              projection_data,
              dict
          ):
              projections = projection_data.get(
                  "projections",
                  []
              )

          else:
              projections = []


          if not projections:
              raise RuntimeError(
                  "No projections found in current projection JSON."
              )


          print("")
          print("Current projections loaded:", len(projections))


          # ==========================================================
          # MATCH MODEL PLAYERS TO CURRENT ROSTER
          # ==========================================================

          audit = []

          match_counts = Counter()

          stale_examples = []

          team_mismatch_examples = []

          unavailable_examples = []

          development_examples = []


          for projection in projections:

              projection_id = txt(
                  projection.get("player_id")
              )

              projection_name = txt(
                  projection.get("player")
                  or projection.get("player_name")
              )

              projection_team = upper(
                  projection.get("team")
              )

              projection_position = upper(
                  projection.get("position")
              )

              normalized = normalize_name(
                  projection_name
              )


              matched = None
              match_method = None


              # ----------------------------------------------
              # 1. Exact player ID
              # ----------------------------------------------

              if (
                  projection_id
                  and projection_id in by_id
              ):
                  matched = by_id[
                      projection_id
                  ]

                  match_method = "PLAYER_ID"


              # ----------------------------------------------
              # 2. Exact normalized name + team
              # ----------------------------------------------

              if matched is None:

                  key = (
                      normalized,
                      projection_team
                  )

                  if key in by_name_team:
                      matched = by_name_team[
                          key
                      ]

                      match_method = "NAME_TEAM"


              # ----------------------------------------------
              # 3. Unique normalized name
              #
              # This catches a stale team assignment while
              # avoiding ambiguous same-name matches.
              # ----------------------------------------------

              if matched is None:

                  candidates = by_name.get(
                      normalized,
                      []
                  )

                  if len(candidates) == 1:
                      matched = candidates[0]

                      match_method = "UNIQUE_NAME"


              # ----------------------------------------------
              # CLASSIFY PROJECTION
              # ----------------------------------------------

              if matched is None:

                  model_status = (
                      "NOT_CURRENT_ROSTER"
                  )

                  current_team = None
                  roster_status = None
                  roster_classification = None
                  betting_pool_eligible = False

                  match_counts[
                      model_status
                  ] += 1


                  if len(stale_examples) < 30:

                      stale_examples.append(
                          {
                              "player":
                                  projection_name,

                              "projection_team":
                                  projection_team,

                              "position":
                                  projection_position,

                              "prop":
                                  projection.get(
                                      "prop"
                                  )
                          }
                      )


              else:

                  current_team = matched[
                      "team"
                  ]

                  roster_status = matched[
                      "roster_status"
                  ]

                  roster_classification = matched[
                      "classification"
                  ]

                  betting_pool_eligible = matched[
                      "betting_pool_eligible"
                  ]


                  if (
                      projection_team
                      and current_team
                      and projection_team
                      != current_team
                  ):

                      model_status = (
                          "CURRENT_PLAYER_TEAM_MISMATCH"
                      )

                      betting_pool_eligible = False


                      if (
                          len(
                              team_mismatch_examples
                          ) < 30
                      ):
                          team_mismatch_examples.append(
                              {
                                  "player":
                                      projection_name,

                                  "projection_team":
                                      projection_team,

                                  "current_team":
                                      current_team,

                                  "position":
                                      projection_position,

                                  "roster_status":
                                      roster_status
                              }
                          )


                  elif (
                      roster_classification
                      == "ACTIVE_ROSTER"
                  ):

                      model_status = (
                          "CURRENT_ACTIVE_ROSTER"
                      )


                  elif (
                      roster_classification
                      == "ROSTER_UNAVAILABLE"
                  ):

                      model_status = (
                          "CURRENT_ROSTER_UNAVAILABLE"
                      )

                      betting_pool_eligible = False


                      if (
                          len(
                              unavailable_examples
                          ) < 30
                      ):
                          unavailable_examples.append(
                              {
                                  "player":
                                      projection_name,

                                  "team":
                                      current_team,

                                  "position":
                                      projection_position,

                                  "roster_status":
                                      roster_status
                              }
                          )


                  elif (
                      roster_classification
                      == "DEVELOPMENT"
                  ):

                      model_status = (
                          "DEVELOPMENT_PLAYER"
                      )

                      betting_pool_eligible = False


                      if (
                          len(
                              development_examples
                          ) < 30
                      ):
                          development_examples.append(
                              {
                                  "player":
                                      projection_name,

                                  "team":
                                      current_team,

                                  "position":
                                      projection_position,

                                  "roster_status":
                                      roster_status
                              }
                          )


                  else:

                      model_status = (
                          "CURRENT_ROSTER_EXCLUDED"
                      )

                      betting_pool_eligible = False


                  match_counts[
                      model_status
                  ] += 1


              audit.append(
                  {
                      "player_id":
                          projection_id,

                      "player":
                          projection_name,

                      "projection_team":
                          projection_team,

                      "current_team":
                          current_team,

                      "position":
                          projection_position,

                      "prop":
                          projection.get(
                              "prop"
                          ),

                      "match_method":
                          match_method,

                      "roster_status":
                          roster_status,

                      "roster_classification":
                          roster_classification,

                      "model_status":
                          model_status,

                      "betting_pool_eligible":
                          betting_pool_eligible
                  }
              )


          # ==========================================================
          # PLAYER-LEVEL AUDIT
          #
          # Projections contain multiple props per player.
          # We also want unique-player counts.
          # ==========================================================

          unique_model_players = {}

          for row in audit:

              key = (
                  row["player_id"]
                  or
                  (
                      normalize_name(
                          row["player"]
                      )
                      + "::"
                      + row["projection_team"]
                  )
              )

              if key not in unique_model_players:
                  unique_model_players[
                      key
                  ] = row


          unique_status_counts = Counter(
              row["model_status"]
              for row in unique_model_players.values()
          )


          # ==========================================================
          # PRINT CURRENT UNIVERSE
          # ==========================================================

          print("")
          print("=" * 78)
          print("CURRENT 2026 PLAYER UNIVERSE")
          print("=" * 78)

          print(
              "Universe players:",
              len(players)
          )

          print(
              "Active roster players:",
              classification_counts[
                  "ACTIVE_ROSTER"
              ]
          )

          print(
              "Active skill players:",
              skill_classification_counts[
                  "ACTIVE_ROSTER"
              ]
          )

          print(
              "Roster unavailable:",
              classification_counts[
                  "ROSTER_UNAVAILABLE"
              ]
          )

          print(
              "Development:",
              classification_counts[
                  "DEVELOPMENT"
              ]
          )

          print(
              "Excluded:",
              classification_counts[
                  "EXCLUDED"
              ]
          )


          print("")
          print("=" * 78)
          print("ACTIVE ROSTER BY TEAM")
          print("=" * 78)


          for team in sorted(
              team_active_counts
          ):

              print(
                  f"{team}: "
                  f"{team_active_counts[team]} total | "
                  f"{team_active_skill_counts[team]} skill"
              )


          # ==========================================================
          # PRINT MODEL AUDIT
          # ==========================================================

          print("")
          print("=" * 78)
          print("JPRO PROJECTION ROSTER AUDIT")
          print("=" * 78)

          print(
              "Projection rows:",
              len(audit)
          )

          print(
              "Unique projected players:",
              len(unique_model_players)
          )


          print("")
          print("PROP-ROW STATUS COUNTS")

          for key, value in (
              match_counts.most_common()
          ):
              print(
                  f"{key}: {value}"
              )


          print("")
          print("UNIQUE PLAYER STATUS COUNTS")

          for key, value in (
              unique_status_counts.most_common()
          ):
              print(
                  f"{key}: {value}"
              )


          # ==========================================================
          # PRINT PROBLEMS
          # ==========================================================

          print("")
          print("=" * 78)
          print("TEAM MISMATCH EXAMPLES")
          print("=" * 78)


          if team_mismatch_examples:

              for row in team_mismatch_examples:

                  print(
                      f"{row['player']} | "
                      f"MODEL {row['projection_team']} -> "
                      f"CURRENT {row['current_team']} | "
                      f"{row['position']} | "
                      f"{row['roster_status']}"
                  )

          else:
              print("None")


          print("")
          print("=" * 78)
          print("NOT CURRENT ROSTER EXAMPLES")
          print("=" * 78)


          if stale_examples:

              for row in stale_examples:

                  print(
                      f"{row['player']} | "
                      f"{row['projection_team']} | "
                      f"{row['position']} | "
                      f"{row['prop']}"
                  )

          else:
              print("None")


          print("")
          print("=" * 78)
          print("CURRENT ROSTER UNAVAILABLE EXAMPLES")
          print("=" * 78)


          if unavailable_examples:

              for row in unavailable_examples:

                  print(
                      f"{row['team']} | "
                      f"{row['player']} | "
                      f"{row['position']} | "
                      f"{row['roster_status']}"
                  )

          else:
              print("None")


          # ==========================================================
          # SAVE
          # ==========================================================

          output = {
              "engine":
                  "JPRO_CURRENT_PLAYER_UNIVERSE_V1_3",

              "status":
                  "AUDIT_READY",

              "season":
                  SEASON,

              "snapshot_week":
                  latest_week,

              "classification_rules": {
                  "active":
                      sorted(ACTIVE_CODES),

                  "roster_unavailable":
                      sorted(
                          UNAVAILABLE_CODES
                      ),

                  "development":
                      sorted(
                          DEVELOPMENT_CODES
                      ),

                  "excluded":
                      sorted(
                          EXCLUDED_CODES
                      )
              },

              "counts": {
                  "universe_players":
                      len(players),

                  "active_roster_players":
                      classification_counts[
                          "ACTIVE_ROSTER"
                      ],

                  "active_skill_players":
                      skill_classification_counts[
                          "ACTIVE_ROSTER"
                      ],

                  "roster_unavailable":
                      classification_counts[
                          "ROSTER_UNAVAILABLE"
                      ],

                  "development":
                      classification_counts[
                          "DEVELOPMENT"
                      ],

                  "excluded":
                      classification_counts[
                          "EXCLUDED"
                      ],

                  "projection_rows":
                      len(audit),

                  "unique_projected_players":
                      len(
                          unique_model_players
                      )
              },

              "projection_status_counts":
                  dict(match_counts),

              "unique_player_status_counts":
                  dict(
                      unique_status_counts
                  ),

              "team_active_counts":
                  dict(
                      sorted(
                          team_active_counts.items()
                      )
                  ),

              "team_active_skill_counts":
                  dict(
                      sorted(
                          team_active_skill_counts.items()
                      )
                  ),

              "team_mismatch_examples":
                  team_mismatch_examples,

              "not_current_roster_examples":
                  stale_examples,

              "unavailable_examples":
                  unavailable_examples,

              "development_examples":
                  development_examples,

              "players":
                  players,

              "projection_audit":
                  audit,

              "important_note":
                  (
                      "V1.3 audits the live JPro projection "
                      "universe against the latest nflverse "
                      "weekly roster snapshot. It does not "
                      "modify jpro-current-projections.json."
                  )
          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  separators=(",", ":")
              )


          print("")
          print("=" * 78)
          print("JPRO CURRENT PLAYER UNIVERSE V1.3 COMPLETE")
          print("=" * 78)

          print(
              "Saved:",
              OUTPUT
          )

          print(
              "LIVE PROJECTIONS NOT MODIFIED."
          )

          PY

      - name: Verify Current Player Universe V1.3
        run: |
          python <<'PY'
          import json


          PATH = "data/jpro-current-player-universe.json"


          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          if (
              data.get("engine")
              !=
              "JPRO_CURRENT_PLAYER_UNIVERSE_V1_3"
          ):
              raise RuntimeError(
                  "Wrong V1.3 engine version."
              )


          if (
              data.get("status")
              !=
              "AUDIT_READY"
          ):
              raise RuntimeError(
                  "V1.3 universe is not audit-ready."
              )


          counts = data.get(
              "counts",
              {}
          )


          active = counts.get(
              "active_roster_players",
              0
          )

          active_skill = counts.get(
              "active_skill_players",
              0
          )


          if not (
              1500 <= active <= 1800
          ):
              raise RuntimeError(
                  f"Active roster count suspicious: {active}"
              )


          if not (
              400 <= active_skill <= 600
          ):
              raise RuntimeError(
                  "Active skill-player count suspicious: "
                  f"{active_skill}"
              )


          team_counts = data.get(
              "team_active_counts",
              {}
          )


          if len(team_counts) != 32:
              raise RuntimeError(
                  "Expected 32 NFL teams, found "
                  f"{len(team_counts)}"
              )


          status_counts = data.get(
              "unique_player_status_counts",
              {}
          )


          print("=" * 78)
          print("VERIFY CURRENT PLAYER UNIVERSE V1.3")
          print("=" * 78)

          print(
              "Snapshot week:",
              data.get(
                  "snapshot_week"
              )
          )

          print(
              "Active roster players:",
              active
          )

          print(
              "Active skill players:",
              active_skill
          )

          print(
              "Teams:",
              len(team_counts)
          )

          print(
              "Unique projected players:",
              counts.get(
                  "unique_projected_players"
              )
          )


          print("")
          print("MODEL PLAYER STATUS")


          for status, count in (
              status_counts.items()
          ):
              print(
                  f"{status}: {count}"
              )


          print("")
          print("TEAM MISMATCHES:")

          mismatches = data.get(
              "team_mismatch_examples",
              []
          )


          if mismatches:

              for row in mismatches[:20]:

                  print(
                      f"{row['player']} | "
                      f"{row['projection_team']} -> "
                      f"{row['current_team']}"
                  )

          else:
              print("None")


          print("")
          print("NOT CURRENT ROSTER:")

          stale = data.get(
              "not_current_roster_examples",
              []
          )


          if stale:

              for row in stale[:20]:

                  print(
                      f"{row['player']} | "
                      f"{row['projection_team']} | "
                      f"{row['position']}"
                  )

          else:
              print("None")


          print("")
          print("=" * 78)
          print("JPRO CURRENT PLAYER UNIVERSE V1.3 VERIFIED")
          print("=" * 78)

          print(
              "AUDIT PASSED."
          )

          print(
              "LIVE PROJECTIONS REMAIN UNCHANGED."
          )

          PY

      - name: Save Current Player Universe V1.3
        run: |
          git config user.name "JPro Cloud Engine"
          git config user.email "actions@github.com"

          git add data/jpro-current-player-universe.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
