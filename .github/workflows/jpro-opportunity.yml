name: JPro Opportunity Redistribution V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opportunity-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Opportunity Engine
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow

      # ============================================================
      # JPRO OPPORTUNITY REDISTRIBUTION V1.1
      #
      # SCHEMA-SAFE AUDIT ENGINE
      #
      # - Pulls nflverse weekly player stats
      # - Detects changing column names automatically
      # - Normalizes team/player/position fields
      # - Learns teammate participation splits
      # - DOES NOT modify live JPro projections
      # - DOES NOT mark missing players officially inactive
      # ============================================================

      - name: Build Opportunity Redistribution V1
        run: |
          python <<'PY'
          import json
          import math
          import os
          from collections import defaultdict

          import nflreadpy as nfl
          import polars as pl


          OUTPUT_PATH = (
              "data/jpro-opportunity-redistribution.json"
          )

          CURRENT_SEASON = 2026

          HISTORICAL_SEASONS = [
              2022,
              2023,
              2024,
              2025,
              2026
          ]

          MIN_TEAM_GAMES = 4
          MIN_WR_TE_TARGETS = 4.0
          MIN_RB_OPPORTUNITIES = 8.0
          MIN_QB_ATTEMPTS = 15.0
          MIN_SPLIT_GAMES = 2


          print("=" * 76)
          print("JPRO OPPORTUNITY REDISTRIBUTION V1.1")
          print("=" * 76)


          def num(value, default=0.0):
              try:
                  value = float(value)

                  if math.isnan(value):
                      return default

                  if math.isinf(value):
                      return default

                  return value

              except Exception:
                  return default


          def round2(value):
              return round(
                  num(value),
                  2
              )


          def first_existing(columns, choices):
              for choice in choices:
                  if choice in columns:
                      return choice

              return None


          # ========================================================
          # LOAD WEEKLY PLAYER STATS
          # ========================================================

          print("")
          print("Loading nflverse weekly player stats...")

          weekly = nfl.load_player_stats(
              HISTORICAL_SEASONS
          )

          if isinstance(weekly, pl.DataFrame):
              df = weekly
          else:
              df = pl.DataFrame(weekly)

          print("Raw rows:", df.height)
          print("Raw columns:", len(df.columns))

          print("")
          print("=" * 76)
          print("NFLVERSE COLUMN AUDIT")
          print("=" * 76)

          for col in df.columns:
              print(col)


          # ========================================================
          # SCHEMA DETECTION
          # ========================================================

          columns = set(df.columns)

          season_col = first_existing(
              columns,
              [
                  "season",
                  "season_year"
              ]
          )

          week_col = first_existing(
              columns,
              [
                  "week",
                  "week_number"
              ]
          )

          player_id_col = first_existing(
              columns,
              [
                  "player_id",
                  "gsis_id",
                  "player_gsis_id"
              ]
          )

          player_name_col = first_existing(
              columns,
              [
                  "player_display_name",
                  "player_name",
                  "name",
                  "full_name"
              ]
          )

          position_col = first_existing(
              columns,
              [
                  "position",
                  "position_group"
              ]
          )

          team_col = first_existing(
              columns,
              [
                  "recent_team",
                  "team",
                  "team_abbr",
                  "team_abbreviation",
                  "club",
                  "posteam"
              ]
          )


          print("")
          print("=" * 76)
          print("DETECTED SCHEMA")
          print("=" * 76)

          print("Season column:", season_col)
          print("Week column:", week_col)
          print("Player ID column:", player_id_col)
          print("Player name column:", player_name_col)
          print("Position column:", position_col)
          print("Team column:", team_col)


          required_detected = {
              "season": season_col,
              "week": week_col,
              "player_id": player_id_col,
              "player_name": player_name_col,
              "position": position_col,
              "team": team_col
          }

          missing = [
              key
              for key, value
              in required_detected.items()
              if value is None
          ]

          if missing:
              raise RuntimeError(
                  "Unable to detect required schema fields: "
                  + ", ".join(missing)
              )


          # ========================================================
          # NORMALIZE CORE COLUMNS
          # ========================================================

          rename_map = {}

          if season_col != "season":
              rename_map[season_col] = "season"

          if week_col != "week":
              rename_map[week_col] = "week"

          if player_id_col != "player_id":
              rename_map[player_id_col] = "player_id"

          if player_name_col != "player_display_name":
              rename_map[
                  player_name_col
              ] = "player_display_name"

          if position_col != "position":
              rename_map[
                  position_col
              ] = "position"

          if team_col != "recent_team":
              rename_map[
                  team_col
              ] = "recent_team"


          if rename_map:
              print("")
              print("Normalizing schema:")
              print(rename_map)

              df = df.rename(
                  rename_map
              )


          # ========================================================
          # FINAL CORE SCHEMA CHECK
          # ========================================================

          required = [
              "season",
              "week",
              "player_id",
              "player_display_name",
              "position",
              "recent_team"
          ]

          missing_after = [
              col
              for col in required
              if col not in df.columns
          ]

          if missing_after:
              raise RuntimeError(
                  "Schema normalization failed. Missing: "
                  + ", ".join(missing_after)
              )


          # ========================================================
          # OPPORTUNITY COLUMNS
          # ========================================================

          opportunity_columns = [
              "attempts",
              "carries",
              "targets",
              "receptions",
              "target_share",
              "air_yards_share",
              "receiving_air_yards",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "passing_tds",
              "rushing_tds",
              "receiving_tds"
          ]

          available_opportunity = [
              col
              for col in opportunity_columns
              if col in df.columns
          ]

          print("")
          print(
              "Opportunity columns found:",
              available_opportunity
          )


          # ========================================================
          # SKILL POSITIONS
          # ========================================================

          df = df.filter(
              pl.col("position").is_in(
                  ["QB", "RB", "WR", "TE"]
              )
          )

          df = df.filter(
              pl.col("recent_team").is_not_null()
          )

          df = df.filter(
              pl.col("player_id").is_not_null()
          )


          # ========================================================
          # NORMALIZE NUMERIC DATA
          # ========================================================

          numeric_columns = (
              ["season", "week"]
              + available_opportunity
          )

          for col in numeric_columns:
              df = df.with_columns(
                  pl.col(col)
                  .cast(
                      pl.Float64,
                      strict=False
                  )
                  .fill_null(0)
                  .alias(col)
              )


          keep_columns = [
              "season",
              "week",
              "player_id",
              "player_display_name",
              "position",
              "recent_team"
          ] + available_opportunity

          rows = df.select(
              keep_columns
          ).to_dicts()

          print("")
          print(
              "Skill-position rows:",
              len(rows)
          )


          # ========================================================
          # OPPORTUNITY FUNCTION
          # ========================================================

          def opportunities(row):

              position = row.get(
                  "position",
                  ""
              )

              attempts = num(
                  row.get("attempts")
              )

              carries = num(
                  row.get("carries")
              )

              targets = num(
                  row.get("targets")
              )

              if position == "QB":
                  return (
                      attempts
                      + carries
                  )

              if position == "RB":
                  return (
                      carries
                      + targets
                  )

              if position in [
                  "WR",
                  "TE"
              ]:
                  return (
                      targets
                      + carries
                  )

              return 0.0


          # ========================================================
          # GAME KEYS
          # ========================================================

          for row in rows:

              season = int(
                  num(
                      row.get("season")
                  )
              )

              week = int(
                  num(
                      row.get("week")
                  )
              )

              team = str(
                  row.get("recent_team")
              )

              row["_game_key"] = (
                  f"{season}-{week}-{team}"
              )

              row["_opportunities"] = (
                  opportunities(row)
              )


          team_games = defaultdict(list)

          for row in rows:
              team_games[
                  row["_game_key"]
              ].append(row)


          # ========================================================
          # PLAYER-TEAM HISTORY
          # ========================================================

          player_team_rows = defaultdict(
              list
          )

          for row in rows:

              key = (
                  str(
                      row.get("player_id")
                  ),
                  str(
                      row.get("recent_team")
                  )
              )

              player_team_rows[
                  key
              ].append(row)


          # ========================================================
          # PLAYER PROFILES
          # ========================================================

          player_profiles = {}

          for key, history in (
              player_team_rows.items()
          ):

              player_id, team = key

              if len(history) < MIN_TEAM_GAMES:
                  continue

              latest = sorted(
                  history,
                  key=lambda r: (
                      num(
                          r.get("season")
                      ),
                      num(
                          r.get("week")
                      )
                  )
              )[-1]

              position = latest.get(
                  "position"
              )

              games = len(history)

              avg_attempts = (
                  sum(
                      num(
                          r.get("attempts")
                      )
                      for r in history
                  )
                  / games
              )

              avg_carries = (
                  sum(
                      num(
                          r.get("carries")
                      )
                      for r in history
                  )
                  / games
              )

              avg_targets = (
                  sum(
                      num(
                          r.get("targets")
                      )
                      for r in history
                  )
                  / games
              )

              avg_opportunity = (
                  sum(
                      num(
                          r.get(
                              "_opportunities"
                          )
                      )
                      for r in history
                  )
                  / games
              )

              meaningful = False

              if (
                  position == "QB"
                  and
                  avg_attempts
                  >= MIN_QB_ATTEMPTS
              ):
                  meaningful = True

              elif (
                  position == "RB"
                  and
                  avg_opportunity
                  >= MIN_RB_OPPORTUNITIES
              ):
                  meaningful = True

              elif (
                  position in [
                      "WR",
                      "TE"
                  ]
                  and
                  avg_targets
                  >= MIN_WR_TE_TARGETS
              ):
                  meaningful = True


              player_profiles[key] = {

                  "player_id":
                      player_id,

                  "player":
                      latest.get(
                          "player_display_name"
                      ),

                  "team":
                      team,

                  "position":
                      position,

                  "games":
                      games,

                  "avg_attempts":
                      round2(
                          avg_attempts
                      ),

                  "avg_carries":
                      round2(
                          avg_carries
                      ),

                  "avg_targets":
                      round2(
                          avg_targets
                      ),

                  "avg_opportunities":
                      round2(
                          avg_opportunity
                      ),

                  "meaningful_absence_trigger":
                      meaningful
              }


          meaningful_profiles = [
              profile
              for profile
              in player_profiles.values()
              if profile[
                  "meaningful_absence_trigger"
              ]
          ]


          print("")
          print(
              "Meaningful player profiles:",
              len(
                  meaningful_profiles
              )
          )


          # ========================================================
          # TEAM / SEASON MEMBERSHIP
          # ========================================================

          team_season_players = defaultdict(
              set
          )

          team_season_weeks = defaultdict(
              set
          )

          for row in rows:

              team = str(
                  row.get("recent_team")
              )

              season = int(
                  num(
                      row.get("season")
                  )
              )

              week = int(
                  num(
                      row.get("week")
                  )
              )

              player_id = str(
                  row.get("player_id")
              )

              team_season_players[
                  (team, season)
              ].add(
                  player_id
              )

              team_season_weeks[
                  (team, season)
              ].add(
                  week
              )


          # ========================================================
          # PLAYER GAME LOOKUP
          # ========================================================

          player_game_lookup = {}

          for row in rows:

              key = (
                  str(
                      row.get("player_id")
                  ),
                  int(
                      num(
                          row.get("season")
                      )
                  ),
                  int(
                      num(
                          row.get("week")
                      )
                  ),
                  str(
                      row.get("recent_team")
                  )
              )

              player_game_lookup[
                  key
              ] = row


          # ========================================================
          # LEARN TEAMMATE PARTICIPATION SPLITS
          #
          # IMPORTANT:
          #
          # No stat row != confirmed inactive.
          #
          # V1.1 therefore calls this:
          #
          # NO_RECORDED_PARTICIPATION
          #
          # ========================================================

          redistribution = []

          trigger_profiles = [
              profile
              for profile
              in meaningful_profiles
              if profile["position"]
              in [
                  "RB",
                  "WR",
                  "TE"
              ]
          ]


          print(
              "Potential absence triggers:",
              len(
                  trigger_profiles
              )
          )


          for trigger in trigger_profiles:

              trigger_id = str(
                  trigger["player_id"]
              )

              team = str(
                  trigger["team"]
              )

              trigger_history = (
                  player_team_rows.get(
                      (
                          trigger_id,
                          team
                      ),
                      []
                  )
              )

              seasons = sorted(
                  set(
                      int(
                          num(
                              row.get(
                                  "season"
                              )
                          )
                      )
                      for row
                      in trigger_history
                  )
              )


              for season in seasons:

                  team_players = (
                      team_season_players.get(
                          (
                              team,
                              season
                          ),
                          set()
                      )
                  )

                  team_weeks = sorted(
                      team_season_weeks.get(
                          (
                              team,
                              season
                          ),
                          set()
                      )
                  )

                  if not team_weeks:
                      continue


                  trigger_recorded_weeks = set()

                  for week in team_weeks:

                      trigger_key = (
                          trigger_id,
                          season,
                          week,
                          team
                      )

                      if (
                          trigger_key
                          in player_game_lookup
                      ):
                          trigger_recorded_weeks.add(
                              week
                          )


                  trigger_missing_weeks = [
                      week
                      for week
                      in team_weeks
                      if week
                      not in trigger_recorded_weeks
                  ]


                  if (
                      not trigger_recorded_weeks
                      or
                      not trigger_missing_weeks
                  ):
                      continue


                  for teammate_id in team_players:

                      teammate_id = str(
                          teammate_id
                      )

                      if (
                          teammate_id
                          == trigger_id
                      ):
                          continue


                      with_rows = []
                      without_rows = []


                      for week in team_weeks:

                          teammate_key = (
                              teammate_id,
                              season,
                              week,
                              team
                          )

                          teammate_row = (
                              player_game_lookup.get(
                                  teammate_key
                              )
                          )

                          if teammate_row is None:
                              continue

                          if (
                              week
                              in trigger_recorded_weeks
                          ):
                              with_rows.append(
                                  teammate_row
                              )

                          else:
                              without_rows.append(
                                  teammate_row
                              )


                      if (
                          len(with_rows)
                          < MIN_SPLIT_GAMES
                      ):
                          continue

                      if (
                          len(without_rows)
                          < 1
                      ):
                          continue


                      latest_teammate = sorted(
                          (
                              with_rows
                              + without_rows
                          ),
                          key=lambda r: (
                              num(
                                  r.get("season")
                              ),
                              num(
                                  r.get("week")
                              )
                          )
                      )[-1]


                      teammate_position = (
                          latest_teammate.get(
                              "position"
                          )
                      )


                      if teammate_position not in [
                          "QB",
                          "RB",
                          "WR",
                          "TE"
                      ]:
                          continue


                      def avg(sample, column):

                          if not sample:
                              return 0.0

                          return (
                              sum(
                                  num(
                                      r.get(column)
                                  )
                                  for r in sample
                              )
                              / len(sample)
                          )


                      metrics = [
                          "targets",
                          "carries",
                          "attempts",
                          "receiving_air_yards",
                          "receptions",
                          "receiving_yards",
                          "rushing_yards"
                      ]


                      with_values = {
                          metric:
                              avg(
                                  with_rows,
                                  metric
                              )
                          for metric
                          in metrics
                      }

                      without_values = {
                          metric:
                              avg(
                                  without_rows,
                                  metric
                              )
                          for metric
                          in metrics
                      }


                      change = {
                          metric:
                              (
                                  without_values[
                                      metric
                                  ]
                                  -
                                  with_values[
                                      metric
                                  ]
                              )
                          for metric
                          in metrics
                      }


                      with_n = len(
                          with_rows
                      )

                      without_n = len(
                          without_rows
                      )


                      if (
                          without_n >= 6
                          and
                          with_n >= 6
                      ):
                          evidence = (
                              "STRONG_SAMPLE"
                          )

                      elif (
                          without_n >= 3
                          and
                          with_n >= 4
                      ):
                          evidence = (
                              "MODERATE_SAMPLE"
                          )

                      else:
                          evidence = (
                              "LIMITED_SAMPLE"
                          )


                      signal = (
                          max(
                              change["targets"],
                              0
                          ) * 10

                          +

                          max(
                              change["carries"],
                              0
                          ) * 5

                          +

                          max(
                              change[
                                  "receiving_air_yards"
                              ],
                              0
                          ) * 0.08
                      )


                      redistribution.append({

                          "season":
                              season,

                          "team":
                              team,

                          "absent_player_id":
                              trigger_id,

                          "absent_player":
                              trigger["player"],

                          "absent_position":
                              trigger[
                                  "position"
                              ],

                          "absence_definition":
                              (
                                  "NO_RECORDED_"
                                  "PARTICIPATION"
                              ),

                          "teammate_player_id":
                              teammate_id,

                          "teammate_player":
                              latest_teammate.get(
                                  "player_display_name"
                              ),

                          "teammate_position":
                              teammate_position,

                          "games_with":
                              with_n,

                          "games_without":
                              without_n,

                          "evidence":
                              evidence,

                          "with_player": {

                              "targets":
                                  round2(
                                      with_values[
                                          "targets"
                                      ]
                                  ),

                              "carries":
                                  round2(
                                      with_values[
                                          "carries"
                                      ]
                                  ),

                              "attempts":
                                  round2(
                                      with_values[
                                          "attempts"
                                      ]
                                  ),

                              "air_yards":
                                  round2(
                                      with_values[
                                          "receiving_air_yards"
                                      ]
                                  ),

                              "receptions":
                                  round2(
                                      with_values[
                                          "receptions"
                                      ]
                                  ),

                              "receiving_yards":
                                  round2(
                                      with_values[
                                          "receiving_yards"
                                      ]
                                  ),

                              "rushing_yards":
                                  round2(
                                      with_values[
                                          "rushing_yards"
                                      ]
                                  )
                          },

                          "without_player": {

                              "targets":
                                  round2(
                                      without_values[
                                          "targets"
                                      ]
                                  ),

                              "carries":
                                  round2(
                                      without_values[
                                          "carries"
                                      ]
                                  ),

                              "attempts":
                                  round2(
                                      without_values[
                                          "attempts"
                                      ]
                                  ),

                              "air_yards":
                                  round2(
                                      without_values[
                                          "receiving_air_yards"
                                      ]
                                  ),

                              "receptions":
                                  round2(
                                      without_values[
                                          "receptions"
                                      ]
                                  ),

                              "receiving_yards":
                                  round2(
                                      without_values[
                                          "receiving_yards"
                                      ]
                                  ),

                              "rushing_yards":
                                  round2(
                                      without_values[
                                          "rushing_yards"
                                      ]
                                  )
                          },

                          "change": {

                              "targets":
                                  round2(
                                      change[
                                          "targets"
                                      ]
                                  ),

                              "carries":
                                  round2(
                                      change[
                                          "carries"
                                      ]
                                  ),

                              "attempts":
                                  round2(
                                      change[
                                          "attempts"
                                      ]
                                  ),

                              "air_yards":
                                  round2(
                                      change[
                                          "receiving_air_yards"
                                      ]
                                  ),

                              "receptions":
                                  round2(
                                      change[
                                          "receptions"
                                      ]
                                  ),

                              "receiving_yards":
                                  round2(
                                      change[
                                          "receiving_yards"
                                      ]
                                  ),

                              "rushing_yards":
                                  round2(
                                      change[
                                          "rushing_yards"
                                      ]
                                  )
                          },

                          "opportunity_signal":
                              round2(
                                  signal
                              )
                      })


          redistribution.sort(
              key=lambda item: (
                  item.get(
                      "opportunity_signal",
                      0
                  ),
                  item.get(
                      "games_without",
                      0
                  )
              ),
              reverse=True
          )


          # ========================================================
          # CURRENT PLAYER PROFILES
          # ========================================================

          current_rows = [
              row
              for row in rows
              if int(
                  num(
                      row.get("season")
                  )
              )
              == CURRENT_SEASON
          ]


          latest_week = max(
              [
                  int(
                      num(
                          row.get("week")
                      )
                  )
                  for row
                  in current_rows
              ],
              default=0
          )


          current_player_team = defaultdict(
              list
          )

          for row in current_rows:

              current_player_team[
                  (
                      str(
                          row.get("player_id")
                      ),
                      str(
                          row.get("recent_team")
                      )
                  )
              ].append(row)


          current_profiles = []


          for key, history in (
              current_player_team.items()
          ):

              player_id, team = key

              latest = sorted(
                  history,
                  key=lambda r:
                      num(
                          r.get("week")
                      )
              )[-1]

              games = len(history)


              current_profiles.append({

                  "player_id":
                      player_id,

                  "player":
                      latest.get(
                          "player_display_name"
                      ),

                  "team":
                      team,

                  "position":
                      latest.get(
                          "position"
                      ),

                  "games_recorded":
                      games,

                  "avg_targets":
                      round2(
                          sum(
                              num(
                                  r.get(
                                      "targets"
                                  )
                              )
                              for r in history
                          )
                          / games
                      ),

                  "avg_carries":
                      round2(
                          sum(
                              num(
                                  r.get(
                                      "carries"
                                  )
                              )
                              for r in history
                          )
                          / games
                      ),

                  "avg_attempts":
                      round2(
                          sum(
                              num(
                                  r.get(
                                      "attempts"
                                  )
                              )
                              for r in history
                          )
                          / games
                      ),

                  "avg_opportunities":
                      round2(
                          sum(
                              num(
                                  r.get(
                                      "_opportunities"
                                  )
                              )
                              for r in history
                          )
                          / games
                      )
              })


          # ========================================================
          # SUMMARY
          # ========================================================

          strong_count = sum(
              1
              for row in redistribution
              if row["evidence"]
              == "STRONG_SAMPLE"
          )

          moderate_count = sum(
              1
              for row in redistribution
              if row["evidence"]
              == "MODERATE_SAMPLE"
          )

          limited_count = sum(
              1
              for row in redistribution
              if row["evidence"]
