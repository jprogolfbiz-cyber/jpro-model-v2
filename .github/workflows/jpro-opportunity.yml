name: JPro Opportunity Redistribution V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opportunity-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Opportunity Engine
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow

      # ============================================================
      # JPRO OPPORTUNITY REDISTRIBUTION V1
      #
      # PURPOSE:
      # Learn historical teammate-out opportunity changes.
      #
      # IMPORTANT:
      # V1 IS AN AUDIT / LEARNING LAYER.
      #
      # It DOES NOT modify live projections.
      # It DOES NOT fabricate injury statuses.
      # It DOES NOT automatically mark anyone inactive.
      #
      # It creates:
      #
      # data/jpro-opportunity-redistribution.json
      #
      # ============================================================

      - name: Build Opportunity Redistribution V1
        run: |
          python <<'PY'
          import json
          import math
          import os
          from collections import defaultdict

          import nflreadpy as nfl
          import polars as pl


          # ========================================================
          # CONFIG
          # ========================================================

          OUTPUT_PATH = (
              "data/"
              "jpro-opportunity-redistribution.json"
          )

          CURRENT_SEASON = 2026

          HISTORICAL_SEASONS = [
              2022,
              2023,
              2024,
              2025,
              2026
          ]

          # Minimum historical participation before
          # treating somebody as a meaningful teammate.
          MIN_TEAM_GAMES = 4

          # Minimum average opportunity required for a player
          # to become an "absence trigger".
          MIN_WR_TE_TARGETS = 4.0
          MIN_RB_OPPORTUNITIES = 8.0
          MIN_QB_ATTEMPTS = 15.0

          # Minimum games with / without teammate before
          # we display stronger historical evidence.
          MIN_SPLIT_GAMES = 2


          print("=" * 76)
          print("JPRO OPPORTUNITY REDISTRIBUTION V1")
          print("=" * 76)

          print("")
          print(
              "Historical seasons:",
              HISTORICAL_SEASONS
          )


          # ========================================================
          # HELPERS
          # ========================================================

          def num(value, default=0.0):
              try:
                  value = float(value)

                  if math.isnan(value):
                      return default

                  if math.isinf(value):
                      return default

                  return value

              except Exception:
                  return default


          def safe_div(a, b):
              a = num(a)
              b = num(b)

              if b == 0:
                  return 0.0

              return a / b


          def round2(value):
              return round(
                  num(value),
                  2
              )


          def round3(value):
              return round(
                  num(value),
                  3
              )


          # ========================================================
          # LOAD NFLVERSE WEEKLY PLAYER DATA
          # ========================================================

          print("")
          print("Loading nflverse player stats...")

          weekly = nfl.load_player_stats(
              HISTORICAL_SEASONS
          )

          if isinstance(weekly, pl.DataFrame):
              df = weekly
          else:
              df = pl.DataFrame(weekly)

          print(
              "Raw rows:",
              df.height
          )

          print(
              "Raw columns:",
              len(df.columns)
          )


          # ========================================================
          # REQUIRED COLUMNS
          # ========================================================

          required = [
              "season",
              "week",
              "player_id",
              "player_display_name",
              "position",
              "recent_team"
          ]

          missing = [
              col
              for col in required
              if col not in df.columns
          ]

          if missing:
              raise RuntimeError(
                  "Missing required columns: "
                  + ", ".join(missing)
              )


          # ========================================================
          # OPPORTUNITY COLUMNS
          # ========================================================

          opportunity_columns = [
              "attempts",
              "carries",
              "targets",
              "receptions",
              "target_share",
              "air_yards_share",
              "receiving_air_yards",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "passing_tds",
              "rushing_tds",
              "receiving_tds"
          ]

          available_opportunity = [
              col
              for col in opportunity_columns
              if col in df.columns
          ]

          print("")
          print(
              "Opportunity columns found:",
              available_opportunity
          )


          # ========================================================
          # KEEP SKILL POSITIONS
          # ========================================================

          df = df.filter(
              pl.col("position").is_in(
                  ["QB", "RB", "WR", "TE"]
              )
          )

          df = df.filter(
              pl.col("recent_team").is_not_null()
          )

          df = df.filter(
              pl.col("player_id").is_not_null()
          )


          # ========================================================
          # NORMALIZE NUMERIC COLUMNS
          # ========================================================

          numeric_columns = [
              "season",
              "week"
          ] + available_opportunity

          for col in numeric_columns:
              if col in df.columns:
                  df = df.with_columns(
                      pl.col(col)
                      .cast(
                          pl.Float64,
                          strict=False
                      )
                      .fill_null(0)
                      .alias(col)
                  )


          # ========================================================
          # BUILD PYTHON ROWS
          # ========================================================

          keep_columns = [
              "season",
              "week",
              "player_id",
              "player_display_name",
              "position",
              "recent_team"
          ] + available_opportunity

          rows = df.select(
              keep_columns
          ).to_dicts()

          print(
              "Skill-position rows:",
              len(rows)
          )


          # ========================================================
          # HELPER: PLAYER OPPORTUNITY
          # ========================================================

          def opportunities(row):
              position = row.get(
                  "position",
                  ""
              )

              attempts = num(
                  row.get("attempts")
              )

              carries = num(
                  row.get("carries")
              )

              targets = num(
                  row.get("targets")
              )

              if position == "QB":
                  return attempts + carries

              if position == "RB":
                  return carries + targets

              if position in [
                  "WR",
                  "TE"
              ]:
                  return targets + carries

              return 0.0


          # ========================================================
          # CREATE GAME KEY
          # ========================================================

          for row in rows:
              row["_game_key"] = (
                  str(
                      int(
                          num(
                              row.get("season")
                          )
                      )
                  )
                  + "-"
                  + str(
                      int(
                          num(
                              row.get("week")
                          )
                      )
                  )
                  + "-"
                  + str(
                      row.get(
                          "recent_team"
                      )
                  )
              )

              row["_opportunities"] = (
                  opportunities(row)
              )


          # ========================================================
          # GROUP TEAM GAMES
          # ========================================================

          team_games = defaultdict(list)

          for row in rows:
              team_games[
                  row["_game_key"]
              ].append(row)

          print(
              "Team-game groups:",
              len(team_games)
          )


          # ========================================================
          # PLAYER TEAM HISTORY
          # ========================================================

          player_team_rows = defaultdict(
              list
          )

          for row in rows:
              key = (
                  row.get("player_id"),
                  row.get("recent_team")
              )

              player_team_rows[
                  key
              ].append(row)


          # ========================================================
          # BASE PLAYER PROFILES
          # ========================================================

          player_profiles = {}

          for key, history in (
              player_team_rows.items()
          ):
              player_id, team = key

              if len(history) < MIN_TEAM_GAMES:
                  continue

              latest = sorted(
                  history,
                  key=lambda r: (
                      num(r.get("season")),
                      num(r.get("week"))
                  )
              )[-1]

              position = latest.get(
                  "position"
              )

              avg_attempts = (
                  sum(
                      num(
                          r.get("attempts")
                      )
                      for r in history
                  )
                  / len(history)
              )

              avg_carries = (
                  sum(
                      num(
                          r.get("carries")
                      )
                      for r in history
                  )
                  / len(history)
              )

              avg_targets = (
                  sum(
                      num(
                          r.get("targets")
                      )
                      for r in history
                  )
                  / len(history)
              )

              avg_opportunity = (
                  sum(
                      num(
                          r.get(
                              "_opportunities"
                          )
                      )
                      for r in history
                  )
                  / len(history)
              )

              meaningful = False

              if (
                  position == "QB"
                  and avg_attempts
                  >= MIN_QB_ATTEMPTS
              ):
                  meaningful = True

              elif (
                  position == "RB"
                  and avg_opportunity
                  >= MIN_RB_OPPORTUNITIES
              ):
                  meaningful = True

              elif (
                  position in [
                      "WR",
                      "TE"
                  ]
                  and avg_targets
                  >= MIN_WR_TE_TARGETS
              ):
                  meaningful = True

              player_profiles[
                  key
              ] = {
                  "player_id":
                      player_id,

                  "player":
                      latest.get(
                          "player_display_name"
                      ),

                  "team":
                      team,

                  "position":
                      position,

                  "games":
                      len(history),

                  "avg_attempts":
                      round2(
                          avg_attempts
                      ),

                  "avg_carries":
                      round2(
                          avg_carries
                      ),

                  "avg_targets":
                      round2(
                          avg_targets
                      ),

                  "avg_opportunities":
                      round2(
                          avg_opportunity
                      ),

                  "meaningful_absence_trigger":
                      meaningful
              }


          meaningful_profiles = [
              profile
              for profile
              in player_profiles.values()
              if profile[
                  "meaningful_absence_trigger"
              ]
          ]

          print(
              "Meaningful player profiles:",
              len(meaningful_profiles)
          )


          # ========================================================
          # TEAM-SEASON PLAYER MEMBERSHIP
          #
          # This gives us the set of teammates who had
          # recorded participation for that team/season.
          # ========================================================

          team_season_players = defaultdict(
              set
          )

          for row in rows:
              team = row.get(
                  "recent_team"
              )

              season = int(
                  num(
                      row.get("season")
                  )
              )

              team_season_players[
                  (team, season)
              ].add(
                  row.get("player_id")
              )


          # ========================================================
          # PLAYER GAME LOOKUP
          # ========================================================

          player_game_lookup = {}

          for row in rows:
              key = (
                  row.get("player_id"),
                  int(
                      num(
                          row.get("season")
                      )
                  ),
                  int(
                      num(
                          row.get("week")
                      )
                  ),
                  row.get("recent_team")
              )

              player_game_lookup[
                  key
              ] = row


          # ========================================================
          # LEARN TEAMMATE-OUT SPLITS
          #
          # IMPORTANT:
          #
          # Weekly stat absence is NOT the same thing as
          # official inactive status.
          #
          # Therefore V1 calls these:
          #
          # "NO_RECORDED_PARTICIPATION"
          #
          # rather than "INACTIVE".
          # ========================================================

          redistribution = []

          trigger_profiles = [
              p
              for p
              in meaningful_profiles
              if p["position"]
              in ["RB", "WR", "TE"]
          ]

          print(
              "Absence triggers:",
              len(trigger_profiles)
          )

          for trigger in trigger_profiles:

              trigger_id = trigger[
                  "player_id"
              ]

              team = trigger[
                  "team"
              ]

              # Seasons where trigger appeared
              # for this team.
              trigger_history = (
                  player_team_rows.get(
                      (
                          trigger_id,
                          team
                      ),
                      []
                  )
              )

              seasons = sorted(
                  set(
                      int(
                          num(
                              row.get(
                                  "season"
                              )
                          )
                      )
                      for row
                      in trigger_history
                  )
              )

              for season in seasons:

                  team_players = (
                      team_season_players.get(
                          (
                              team,
                              season
                          ),
                          set()
                      )
                  )

                  # Weeks where team had at least one
                  # skill-position stat row.
                  team_weeks = sorted(
                      set(
                          int(
                              num(
                                  row.get(
                                      "week"
                                  )
                              )
                          )
                          for row
                          in rows
                          if (
                              row.get(
                                  "recent_team"
                              )
                              == team
                              and int(
                                  num(
                                      row.get(
                                          "season"
                                      )
                                  )
                              )
                              == season
                          )
                      )
                  )

                  trigger_active_weeks = set()

                  for week in team_weeks:
                      lookup_key = (
                          trigger_id,
                          season,
                          week,
                          team
                      )

                      if (
                          lookup_key
                          in player_game_lookup
                      ):
                          trigger_active_weeks.add(
                              week
                          )

                  trigger_missing_weeks = [
                      week
                      for week
                      in team_weeks
                      if week
                      not in trigger_active_weeks
                  ]

                  if not trigger_missing_weeks:
                      continue

                  if not trigger_active_weeks:
                      continue


                  # ----------------------------------------------
                  # Compare every teammate.
                  # ----------------------------------------------

                  for teammate_id in team_players:

                      if (
                          teammate_id
                          == trigger_id
                      ):
                          continue

                      with_rows = []
                      without_rows = []

                      for week in team_weeks:

                          teammate_key = (
                              teammate_id,
                              season,
                              week,
                              team
                          )

                          teammate_row = (
                              player_game_lookup.get(
                                  teammate_key
                              )
                          )

                          if teammate_row is None:
                              continue

                          if (
                              week
                              in trigger_active_weeks
                          ):
                              with_rows.append(
                                  teammate_row
                              )

                          else:
                              without_rows.append(
                                  teammate_row
                              )


                      if (
                          len(with_rows)
                          < MIN_SPLIT_GAMES
                      ):
                          continue

                      if (
                          len(without_rows)
                          < 1
                      ):
                          continue


                      latest_teammate = (
                          sorted(
                              with_rows
                              + without_rows,
                              key=lambda r: (
                                  num(
                                      r.get(
                                          "season"
                                      )
                                  ),
                                  num(
                                      r.get(
                                          "week"
                                      )
                                  )
                              )
                          )[-1]
                      )

                      teammate_position = (
                          latest_teammate.get(
                              "position"
                          )
                      )

                      if teammate_position not in [
                          "QB",
                          "RB",
                          "WR",
                          "TE"
                      ]:
                          continue


                      def avg(
                          sample,
                          column
                      ):
                          if not sample:
                              return 0.0

                          return (
                              sum(
                                  num(
                                      r.get(column)
                                  )
                                  for r in sample
                              )
                              / len(sample)
                          )


                      with_targets = avg(
                          with_rows,
                          "targets"
                      )

                      without_targets = avg(
                          without_rows,
                          "targets"
                      )

                      with_carries = avg(
                          with_rows,
                          "carries"
                      )

                      without_carries = avg(
                          without_rows,
                          "carries"
                      )

                      with_attempts = avg(
                          with_rows,
                          "attempts"
                      )

                      without_attempts = avg(
                          without_rows,
                          "attempts"
                      )

                      with_air = avg(
                          with_rows,
                          "receiving_air_yards"
                      )

                      without_air = avg(
                          without_rows,
                          "receiving_air_yards"
                      )

                      with_rec_yards = avg(
                          with_rows,
                          "receiving_yards"
                      )

                      without_rec_yards = avg(
                          without_rows,
                          "receiving_yards"
                      )

                      with_rush_yards = avg(
                          with_rows,
                          "rushing_yards"
                      )

                      without_rush_yards = avg(
                          without_rows,
                          "rushing_yards"
                      )

                      with_receptions = avg(
                          with_rows,
                          "receptions"
                      )

                      without_receptions = avg(
                          without_rows,
                          "receptions"
                      )

                      target_delta = (
                          without_targets
                          - with_targets
                      )

                      carry_delta = (
                          without_carries
                          - with_carries
                      )

                      attempt_delta = (
                          without_attempts
                          - with_attempts
                      )

                      air_delta = (
                          without_air
                          - with_air
                      )

                      receiving_yards_delta = (
                          without_rec_yards
                          - with_rec_yards
                      )

                      rushing_yards_delta = (
                          without_rush_yards
                          - with_rush_yards
                      )

                      receptions_delta = (
                          without_receptions
                          - with_receptions
                      )


                      # ------------------------------------------
                      # EVIDENCE STRENGTH
                      #
                      # Not predictive confidence.
                      # Describes sample depth only.
                      # ------------------------------------------

                      without_n = len(
                          without_rows
                      )

                      with_n = len(
                          with_rows
                      )

                      if (
                          without_n >= 6
                          and with_n >= 6
                      ):
                          evidence = "STRONG_SAMPLE"

                      elif (
                          without_n >= 3
                          and with_n >= 4
                      ):
                          evidence = "MODERATE_SAMPLE"

                      else:
                          evidence = "LIMITED_SAMPLE"


                      # ------------------------------------------
                      # OPPORTUNITY SIGNAL
                      #
                      # Ranking score only.
                      # Not a probability.
                      # ------------------------------------------

                      signal = (
                          max(
                              target_delta,
                              0
                          ) * 10
                          +
                          max(
                              carry_delta,
                              0
                          ) * 5
                          +
                          max(
                              air_delta,
                              0
                          ) * 0.08
                      )

                      redistribution.append(
                          {
                              "season":
                                  season,

                              "team":
                                  team,

                              "absent_player_id":
                                  trigger_id,

                              "absent_player":
                                  trigger[
                                      "player"
                                  ],

                              "absent_position":
                                  trigger[
                                      "position"
                                  ],

                              "absence_definition":
                                  (
                                      "NO_RECORDED_"
                                      "PARTICIPATION"
                                  ),

                              "teammate_player_id":
                                  teammate_id,

                              "teammate_player":
                                  latest_teammate.get(
                                      "player_display_name"
                                  ),

                              "teammate_position":
                                  teammate_position,

                              "games_with":
                                  with_n,

                              "games_without":
                                  without_n,

                              "evidence":
                                  evidence,

                              "with_player": {
                                  "targets":
                                      round2(
                                          with_targets
                                      ),

                                  "carries":
                                      round2(
                                          with_carries
                                      ),

                                  "attempts":
                                      round2(
                                          with_attempts
                                      ),

                                  "air_yards":
                                      round2(
                                          with_air
                                      ),

                                  "receptions":
                                      round2(
                                          with_receptions
                                      ),

                                  "receiving_yards":
                                      round2(
                                          with_rec_yards
                                      ),

                                  "rushing_yards":
                                      round2(
                                          with_rush_yards
                                      )
                              },

                              "without_player": {
                                  "targets":
                                      round2(
                                          without_targets
                                      ),

                                  "carries":
                                      round2(
                                          without_carries
                                      ),

                                  "attempts":
                                      round2(
                                          without_attempts
                                      ),

                                  "air_yards":
                                      round2(
                                          without_air
                                      ),

                                  "receptions":
                                      round2(
                                          without_receptions
                                      ),

                                  "receiving_yards":
                                      round2(
                                          without_rec_yards
                                      ),

                                  "rushing_yards":
                                      round2(
                                          without_rush_yards
                                      )
                              },

                              "change": {
                                  "targets":
                                      round2(
                                          target_delta
                                      ),

                                  "carries":
                                      round2(
                                          carry_delta
                                      ),

                                  "attempts":
                                      round2(
                                          attempt_delta
                                      ),

                                  "air_yards":
                                      round2(
                                          air_delta
                                      ),

                                  "receptions":
                                      round2(
                                          receptions_delta
                                      ),

                                  "receiving_yards":
                                      round2(
                                          receiving_yards_delta
                                      ),

                                  "rushing_yards":
                                      round2(
                                          rushing_yards_delta
                                      )
                              },

                              "opportunity_signal":
                                  round2(
                                      signal
                                  )
                          }
                      )


          # ========================================================
          # SORT REDISTRIBUTION RESULTS
          # ========================================================

          redistribution.sort(
              key=lambda x: (
                  x.get(
                      "opportunity_signal",
                      0
                  ),
                  x.get(
                      "games_without",
                      0
                  )
              ),
              reverse=True
          )


          # ========================================================
          # CURRENT PLAYER PROFILES
          # ========================================================

          current_rows = [
              row
              for row in rows
              if int(
                  num(
                      row.get("season")
                  )
              )
              == CURRENT_SEASON
          ]

          latest_week = max(
              [
                  int(
                      num(
                          row.get("week")
                      )
                  )
                  for row in current_rows
              ],
              default=0
          )

          current_profiles = []

          current_player_team = defaultdict(
              list
          )

          for row in current_rows:
              current_player_team[
                  (
                      row.get("player_id"),
                      row.get("recent_team")
                  )
              ].append(row)

          for key, history in (
              current_player_team.items()
          ):
              player_id, team = key

              latest = sorted(
                  history,
                  key=lambda r:
                      num(
                          r.get("week")
                      )
              )[-1]

              current_profiles.append(
                  {
                      "player_id":
                          player_id,

                      "player":
                          latest.get(
                              "player_display_name"
                          ),

                      "team":
                          team,

                      "position":
                          latest.get(
                              "position"
                          ),

                      "games_recorded":
                          len(history),

                      "avg_targets":
                          round2(
                              sum(
                                  num(
                                      r.get(
                                          "targets"
                                      )
                                  )
                                  for r in history
                              )
                              / len(history)
                          ),

                      "avg_carries":
                          round2(
                              sum(
                                  num(
                                      r.get(
                                          "carries"
                                      )
                                  )
                                  for r in history
                              )
                              / len(history)
                          ),

                      "avg_attempts":
                          round2(
                              sum(
                                  num(
                                      r.get(
                                          "attempts"
                                      )
                                  )
                                  for r in history
                              )
                              / len(history)
                          ),

                      "avg_opportunities":
                          round2(
                              sum(
                                  num(
                                      r.get(
                                          "_opportunities"
                                      )
                                  )
                                  for r in history
                              )
                              / len(history)
                          )
                  }
              )


          # ========================================================
          # SUMMARY
          # ========================================================

          strong_count = sum(
              1
              for row in redistribution
              if row["evidence"]
              == "STRONG_SAMPLE"
          )

          moderate_count = sum(
              1
              for row in redistribution
              if row["evidence"]
              == "MODERATE_SAMPLE"
          )

          limited_count = sum(
              1
              for row in redistribution
              if row["evidence"]
              == "LIMITED_SAMPLE"
          )


          output = {
              "engine":
                  "JPRO_OPPORTUNITY_REDISTRIBUTION_V1",

              "status":
                  "AUDIT_READY",

              "current_season":
                  CURRENT_SEASON,

              "latest_week_in_source":
                  latest_week,

              "historical_seasons":
                  HISTORICAL_SEASONS,

