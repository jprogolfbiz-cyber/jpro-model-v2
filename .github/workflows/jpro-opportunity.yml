      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Opportunity Redistribution V1
        run: |
          python <<'PY'
          import json
          import os


          PATH = (
              "data/"
              "jpro-opportunity-redistribution.json"
          )


          print("=" * 76)
          print("VERIFY OPPORTUNITY REDISTRIBUTION V1.1")
          print("=" * 76)


          if not os.path.exists(PATH):
              raise RuntimeError(
                  "Opportunity output missing."
              )


          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          if (
              data.get("engine")
              !=
              "JPRO_OPPORTUNITY_REDISTRIBUTION_V1_1"
          ):
              raise RuntimeError(
                  "Wrong engine version."
              )


          if (
              data.get("status")
              != "AUDIT_READY"
          ):
              raise RuntimeError(
                  "Wrong engine status."
              )


          schema = data.get(
              "schema",
              {}
          )


          if not schema.get(
              "team_source_column"
          ):
              raise RuntimeError(
                  "Team schema was not detected."
              )


          relationships = data.get(
              "redistribution_relationships",
              []
          )


          profiles = data.get(
              "current_player_profiles",
              []
          )


          if not profiles:
              raise RuntimeError(
                  "No current player profiles."
              )


          if not relationships:
              raise RuntimeError(
                  "No redistribution relationships."
              )


          valid_evidence = {
              "STRONG_SAMPLE",
              "MODERATE_SAMPLE",
              "LIMITED_SAMPLE"
          }


          for row in relationships:

              if (
                  row.get("evidence")
                  not in valid_evidence
              ):
                  raise RuntimeError(
                      "Invalid evidence label."
                  )


              if (
                  row.get(
                      "absence_definition"
                  )
                  !=
                  "NO_RECORDED_PARTICIPATION"
              ):
                  raise RuntimeError(
                      "Invalid absence definition."
                  )


              if (
                  str(
                      row.get(
                          "absent_player_id"
                      )
                  )
                  ==
                  str(
                      row.get(
                          "teammate_player_id"
                      )
                  )
              ):
                  raise RuntimeError(
                      "Player matched to self."
                  )


          summary = data.get(
              "summary",
              {}
          )


          print(
              "Team source column:",
              schema.get(
                  "team_source_column"
              )
          )

          print(
              "Skill rows:",
              summary.get(
                  "skill_position_rows"
              )
          )

          print(
              "Current profiles:",
              len(profiles)
          )

          print(
              "Redistribution relationships:",
              len(relationships)
          )

          print(
              "Strong sample:",
              summary.get(
                  "strong_sample_relationships"
              )
          )

          print(
              "Moderate sample:",
              summary.get(
                  "moderate_sample_relationships"
              )
          )

          print(
              "Limited sample:",
              summary.get(
                  "limited_sample_relationships"
              )
          )


          print("")
          print("=" * 76)
          print(
              "JPRO OPPORTUNITY "
              "REDISTRIBUTION V1.1 VERIFIED"
          )
          print("=" * 76)

          PY


