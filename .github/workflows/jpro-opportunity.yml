          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              OUTPUT_PATH,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  separators=(",", ":")
              )


          # ========================================================
          # PREVIEW
          # ========================================================

          print("")
          print("=" * 76)
