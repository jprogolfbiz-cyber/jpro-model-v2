name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy scikit-learn pyarrow

      - name: Build JPro full slate
        run: |
          mkdir -p data

          python <<'PY'
          import json
          import numpy as np
          import pandas as pd
          import nflreadpy as nfl

          from datetime import datetime, timezone
          from sklearn.compose import ColumnTransformer
          from sklearn.impute import SimpleImputer
          from sklearn.linear_model import Ridge
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          # ==================================================
          # JPRO SETTINGS
          # ==================================================

          np.random.seed(20260922)

          SEASON = 2026
          WEEK = 3
          SIMS = 20000

          print("=" * 70)
          print("JPRO MODEL V2 — FULL SLATE ENGINE")
          print("=" * 70)

          print("SEASON:", SEASON)
          print("WEEK:", WEEK)
          print("SIMULATIONS PER PROP:", SIMS)

          # ==================================================
          # LOAD 2026 NFL SCHEDULE
          # ==================================================

          print("")
          print("LOADING NFL SCHEDULE...")

          schedule = nfl.load_schedules([SEASON])

          if hasattr(schedule, "to_pandas"):
              schedule = schedule.to_pandas()

          schedule = pd.DataFrame(schedule)

          print("SCHEDULE ROWS:", len(schedule))
          print("SCHEDULE COLUMNS:", list(schedule.columns))

          required_schedule = [
              "season",
              "week",
              "away_team",
              "home_team"
          ]

          missing_schedule = [
              c
              for c in required_schedule
              if c not in schedule.columns
          ]

          if missing_schedule:
              raise RuntimeError(
                  f"Schedule missing columns: {missing_schedule}"
              )

          schedule["season"] = pd.to_numeric(
              schedule["season"],
              errors="coerce"
          )

          schedule["week"] = pd.to_numeric(
              schedule["week"],
              errors="coerce"
          )

          week_games = schedule[
              (schedule["season"] == SEASON) &
              (schedule["week"] == WEEK)
          ].copy()

          # Keep regular-season rows if game_type exists.
          if "game_type" in week_games.columns:

              regular = week_games[
                  week_games["game_type"].astype(str).str.upper().isin(
                      ["REG", "REGULAR", "REGULAR SEASON"]
                  )
              ].copy()

              if not regular.empty:
                  week_games = regular

          week_games = week_games.dropna(
              subset=[
                  "away_team",
                  "home_team"
              ]
          ).copy()

          if week_games.empty:
              raise RuntimeError(
                  f"No games found for {SEASON} Week {WEEK}"
              )

          print("")
          print(
              "WEEK",
              WEEK,
              "GAMES FOUND:",
              len(week_games)
          )

          # ==================================================
          # BUILD GAME MAP
          # ==================================================

          games = []
          team_to_game = {}

          for _, row in week_games.iterrows():

              away = str(
                  row["away_team"]
              ).strip()

              home = str(
                  row["home_team"]
              ).strip()

              game_name = f"{away} @ {home}"

              game = {
                  "game": game_name,
                  "away_team": away,
                  "home_team": home
              }

              if (
                  "gameday" in week_games.columns
                  and pd.notna(row.get("gameday"))
              ):
                  game["gameday"] = str(
                      row.get("gameday")
                  )

              if (
                  "gametime" in week_games.columns
                  and pd.notna(row.get("gametime"))
              ):
                  game["gametime"] = str(
                      row.get("gametime")
                  )

              if (
                  "weekday" in week_games.columns
                  and pd.notna(row.get("weekday"))
              ):
                  game["weekday"] = str(
                      row.get("weekday")
                  )

              games.append(game)

              team_to_game[away] = game_name
              team_to_game[home] = game_name

              print("GAME:", game_name)

          slate_teams = sorted(
              team_to_game.keys()
          )

          print("")
          print(
              "SLATE TEAMS:",
              len(slate_teams)
          )

          print(
              ", ".join(slate_teams)
          )

          # ==================================================
          # LOAD REAL NFL PLAYER DATA
          # ==================================================

          print("")
          print("LOADING NFL PLAYER DATA...")

          df = nfl.load_player_stats(
              [2022, 2023, 2024, 2025, 2026]
          )

          if hasattr(df, "to_pandas"):
              df = df.to_pandas()

          df = pd.DataFrame(df)

          if (
              "recent_team" not in df.columns
              and "team" in df.columns
          ):
              df["recent_team"] = df["team"]

          targets = [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          required = [
              "player_id",
              "player_display_name",
              "position",
              "season",
              "week",
              "recent_team"
          ] + targets

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise RuntimeError(
                  f"Missing required player columns: {missing}"
              )

          for col in targets:

              df[col] = pd.to_numeric(
                  df[col],
                  errors="coerce"
              ).fillna(0.0)

          df["season"] = pd.to_numeric(
              df["season"],
              errors="coerce"
          )

          df["week"] = pd.to_numeric(
              df["week"],
              errors="coerce"
          )

          df = df.dropna(
              subset=[
                  "player_id",
                  "season",
                  "week",
                  "recent_team"
              ]
          ).copy()

          df["recent_team"] = (
              df["recent_team"]
              .astype(str)
              .str.strip()
          )

          df = df.sort_values(
              [
                  "player_id",
                  "season",
                  "week"
              ]
          ).reset_index(
              drop=True
          )

          print(
              "REAL NFL PLAYER ROWS:",
              len(df)
          )

          # ==================================================
          # LEAKAGE-SAFE PLAYER FEATURES
          # ==================================================

          print("")
          print("BUILDING LEAKAGE-SAFE FEATURES...")

          group = df.groupby(
              "player_id",
              group_keys=False
          )

          for stat in targets:

              df[f"{stat}_lag1"] = (
                  group[stat].shift(1)
              )

              df[f"{stat}_avg3"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                      .rolling(
                          3,
                          min_periods=1
                      )
                      .mean()
                  )
              )

              df[f"{stat}_avg5"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                      .rolling(
                          5,
                          min_periods=1
                      )
                      .mean()
                  )
              )

              df[f"{stat}_std5"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                      .rolling(
                          5,
                          min_periods=2
                      )
                      .std()
                  )
              )

          df["games_before"] = (
              group.cumcount()
          )

          model_df = df[
              df["games_before"] >= 3
          ].copy()

          print(
              "MODEL ROWS:",
              len(model_df)
          )

          # ==================================================
          # MODEL FEATURES
          # ==================================================

          feature_cols = [
              "season",
              "week",
              "games_before",

              "passing_yards_lag1",
              "passing_yards_avg3",
              "passing_yards_avg5",
              "passing_yards_std5",

              "rushing_yards_lag1",
              "rushing_yards_avg3",
              "rushing_yards_avg5",
              "rushing_yards_std5",

              "receiving_yards_lag1",
              "receiving_yards_avg3",
              "receiving_yards_avg5",
              "receiving_yards_std5",

              "receptions_lag1",
              "receptions_avg3",
              "receptions_avg5",
              "receptions_std5",

              "position",
              "recent_team"
          ]

          numeric_features = [
              x
              for x in feature_cols
              if x not in [
                  "position",
                  "recent_team"
              ]
          ]

          categorical_features = [
              "position",
              "recent_team"
          ]

          specs = {

              "passing_yards": [
                  "QB"
              ],

              "rushing_yards": [
                  "QB",
                  "RB",
                  "WR"
              ],

              "receiving_yards": [
                  "WR",
                  "TE",
                  "RB"
              ],

              "receptions": [
                  "WR",
                  "TE",
                  "RB"
              ]
          }

          # ==================================================
          # CURRENT WEEK PLAYER STATE
          # ==================================================

          #
          # IMPORTANT:
          #
          # We use each player's latest available 2026 row
          # BEFORE Week 3 as the state used to project Week 3.
          #
          # This prevents Week 3 results from leaking into
          # Week 3 projections if the workflow is rerun later.
          #

          current_pool = model_df[
              (model_df["season"] == SEASON) &
              (model_df["week"] < WEEK)
          ].copy()

          if current_pool.empty:
              raise RuntimeError(
                  "No pre-Week-3 player state found."
              )

          current = (
              current_pool
              .sort_values(
                  [
                      "player_id",
                      "week"
                  ]
              )
              .groupby(
                  "player_id"
              )
              .tail(1)
              .copy()
          )

          current = current[
              current["recent_team"].isin(
                  slate_teams
              )
          ].copy()

          current["game"] = (
              current["recent_team"]
              .map(team_to_game)
          )

          current = current.dropna(
              subset=[
                  "game"
              ]
          ).copy()

          print("")
          print(
              "CURRENT SLATE PLAYERS:",
              len(current)
          )

          if current.empty:
              raise RuntimeError(
                  "No current players matched the Week 3 slate."
              )

          # ==================================================
          # PREPROCESSOR FACTORY
          # ==================================================

          def make_model():

              preprocessor = ColumnTransformer(
                  transformers=[
                      (
                          "num",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="median"
                                      )
                                  ),
                                  (
                                      "scale",
                                      StandardScaler()
                                  )
                              ]
                          ),
                          numeric_features
                      ),
                      (
                          "cat",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="most_frequent"
                                      )
                                  ),
                                  (
                                      "onehot",
                                      OneHotEncoder(
                                          handle_unknown="ignore"
                                      )
                                  )
                              ]
                          ),
                          categorical_features
                      )
                  ]
              )

              return Pipeline(
                  steps=[
                      (
                          "prep",
                          preprocessor
                      ),
                      (
                          "model",
                          Ridge(
                              alpha=10.0
                          )
                      )
                  ]
              )

          # ==================================================
          # COMPRESS 20K DISTRIBUTION
          # ==================================================

          def compress_distribution(sims):

              values, counts = np.unique(
                  sims,
                  return_counts=True
              )

              histogram = [
                  [
                      int(value),
                      int(count)
                  ]
                  for value, count
                  in zip(values, counts)
              ]

              if (
                  sum(
                      count
                      for _, count
                      in histogram
                  )
                  != SIMS
              ):
                  raise RuntimeError(
                      "Histogram compression lost simulations."
                  )

              return histogram

          # ==================================================
          # TRAIN + SIMULATE FULL SLATE
          # ==================================================

          results = []

          for target, positions in specs.items():

              print("")
              print("-" * 70)
              print("BUILDING:", target)
              print("-" * 70)

              historical = model_df[
                  model_df["position"].isin(
                      positions
                  )
              ].copy()

              #
              # Do not train on the target week or later.
              # This keeps this Week 3 snapshot genuinely
              # pregame even if future data becomes available.
              #

              historical = historical[
                  (
                      historical["season"] < SEASON
                  ) |
                  (
                      (
                          historical["season"] == SEASON
                      ) &
                      (
                          historical["week"] < WEEK
                      )
                  )
              ].copy()

              if target == "passing_yards":

                  historical = historical[
                      historical["position"] == "QB"
                  ].copy()

              historical = historical.sort_values(
                  [
                      "season",
                      "week"
                  ]
              ).reset_index(
                  drop=True
              )

              if len(historical) < 200:
                  raise RuntimeError(
                      f"Not enough historical rows for {target}"
                  )

              split = int(
                  len(historical) *
                  0.80
              )

              fit_df = historical.iloc[
                  :split
              ].copy()

              calibration_df = historical.iloc[
                  split:
              ].copy()

              if (
                  fit_df.empty
                  or calibration_df.empty
              ):
                  raise RuntimeError(
                      f"Invalid train/calibration split for {target}"
                  )

              # ----------------------------------------------
              # CALIBRATION MODEL
              # ----------------------------------------------

              model = make_model()

              model.fit(
                  fit_df[
                      feature_cols
                  ],
                  fit_df[
                      target
                  ]
              )

              calibration_pred = model.predict(
                  calibration_df[
                      feature_cols
                  ]
              )

              residuals = (
                  calibration_df[
                      target
                  ].to_numpy(
                      dtype=float
                  )
                  -
                  calibration_pred
              )

              residuals = residuals[
                  np.isfinite(
                      residuals
                  )
              ]

              if len(residuals) < 100:
                  raise RuntimeError(
                      f"Insufficient residuals for {target}"
                  )

              print(
                  "CALIBRATION RESIDUALS:",
                  len(residuals)
              )

              print(
                  "RESIDUAL STD:",
                  round(
                      float(
                          np.std(
                              residuals
                          )
                      ),
                      3
                  )
              )

              # ----------------------------------------------
              # FINAL MODEL
              # ----------------------------------------------

              final_model = make_model()

              final_model.fit(
                  historical[
                      feature_cols
                  ],
                  historical[
                      target
                  ]
              )

              eligible = current[
                  current["position"].isin(
                      positions
                  )
              ].copy()

              if target == "passing_yards":

                  eligible = eligible[
                      eligible["position"] == "QB"
                  ].copy()

              if eligible.empty:

                  print(
                      "NO ELIGIBLE PLAYERS"
                  )

                  continue

              projections = final_model.predict(
                  eligible[
                      feature_cols
                  ]
              )

              retained = 0

              for i, (_, row) in enumerate(
                  eligible.iterrows()
              ):

                  projection = max(
                      0.0,
                      float(
                          projections[i]
                      )
                  )

                  # ------------------------------------------
                  # REMOVE LOW-INFORMATION PROPS
                  # BEFORE SPENDING SPACE ON OUTPUT
                  # ------------------------------------------

                  keep = True

                  if (
                      target == "passing_yards"
                      and projection < 25
                  ):
                      keep = False

                  if (
                      target == "rushing_yards"
                      and projection < 3
                  ):
                      keep = False

                  if (
                      target == "receiving_yards"
                      and projection < 5
                  ):
                      keep = False

                  if (
                      target == "receptions"
                      and projection < 0.5
                  ):
                      keep = False

                  if not keep:
                      continue

                  # ------------------------------------------
                  # 20,000 EMPIRICAL SIMULATIONS
                  # ------------------------------------------

                  sampled_errors = np.random.choice(
                      residuals,
                      size=SIMS,
                      replace=True
                  )

                  sims = (
                      projection
                      +
                      sampled_errors
                  )

                  sims = np.maximum(
                      sims,
                      0.0
                  )

                  sims = np.rint(
                      sims
                  ).astype(
                      int
                  )

                  histogram = compress_distribution(
                      sims
                  )

                  game_name = str(
                      row["game"]
                  )

                  result = {

                      "player_id":
                          str(
                              row["player_id"]
                          ),

                      "player":
                          str(
                              row[
                                  "player_display_name"
                              ]
                          ),

                      "team":
                          str(
                              row[
                                  "recent_team"
                              ]
                          ),

                      "position":
                          str(
                              row[
                                  "position"
                              ]
                          ),

                      "game":
                          game_name,

                      "prop":
                          target,

                      "projection":
                          round(
                              projection,
                              2
                          ),

                      "sim_mean":
                          round(
                              float(
                                  np.mean(
                                      sims
                                  )
                              ),
                              2
                          ),

                      "median":
                          round(
                              float(
                                  np.median(
                                      sims
                                  )
                              ),
                              2
                          ),

                      "p10":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      10
                                  )
                              ),
                              2
                          ),

                      "p25":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      25
                                  )
                              ),
                              2
                          ),

                      "p75":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      75
                                  )
                              ),
                              2
                          ),

                      "p90":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      90
                                  )
                              ),
                              2
                          ),

                      "simulation_count":
                          SIMS,

                      "simulation_histogram":
                          histogram,

                      "latest_data_week":
                          int(
                              row[
                                  "week"
                              ]
                          )
                  }

                  results.append(
                      result
                  )

                  retained += 1

                  print(
                      result["player"],
                      "|",
                      result["team"],
                      "|",
                      game_name,
                      "|",
                      target,
                      "| PROJ:",
                      result["projection"],
                      "| MEDIAN:",
                      result["median"],
                      "| HIST BINS:",
                      len(histogram)
                  )

              print(
                  "RETAINED",
                  target,
                  "PROPS:",
                  retained
              )

          # ==================================================
          # SORT OUTPUT
          # ==================================================

          game_order = {
              game["game"]: i
              for i, game
              in enumerate(games)
          }

          prop_order = {
              "passing_yards": 0,
              "rushing_yards": 1,
              "receiving_yards": 2,
              "receptions": 3
          }

          results.sort(
              key=lambda x: (
                  game_order.get(
                      x["game"],
                      999
                  ),
                  x["team"],
                  x["player"],
                  prop_order.get(
                      x["prop"],
                      999
                  )
              )
          )

          # ==================================================
          # OUTPUT JSON
          # ==================================================

          output = {

              "status":
                  "READY",

              "engine_version":
                  "JPRO_FULL_SLATE_V1",

              "season":
                  SEASON,

              "week":
                  WEEK,

              "slate":
                  f"{SEASON} Week {WEEK}",

              "game":
                  games[0]["game"]
                  if games
                  else "Current Slate",

              "games":
                  games,

              "simulations_per_prop":
                  SIMS,

              "distribution_format":
                  "COMPRESSED_EMPIRICAL_HISTOGRAM",

              "generated_at_utc":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "sportsbook_line_mode":
                  "MANUAL_IPHONE_INPUT",

              "sportsbook_lines_connected":
                  False,

              "projections":
                  results
          }

          with open(
              "data/jpro-current-projections.json",
              "w"
          ) as f:

              json.dump(
                  output,
                  f,
                  separators=(
                      ",",
                      ":"
                  )
              )

          # ==================================================
          # SUMMARY
          # ==================================================

          print("")
          print("=" * 70)
          print("JPRO FULL SLATE READY")
          print("=" * 70)

          print(
              "SLATE:",
              output["slate"]
          )

          print(
              "GAMES:",
              len(games)
          )

          print(
              "PLAYER PROPS:",
              len(results)
          )

          print(
              "SIMULATIONS PER PROP:",
              SIMS
          )

          print(
              "EMPIRICAL OUTCOMES REPRESENTED:",
              len(results) * SIMS
          )

          print("=" * 70)

          PY

      - name: Verify JPro full slate
        run: |
          python <<'PY'
          import json

          SIMS = 20000

          with open(
              "data/jpro-current-projections.json"
          ) as f:

              d = json.load(
                  f
              )

          print("=" * 70)
          print("JPRO FULL SLATE AUDIT")
          print("=" * 70)

          print(
              "STATUS:",
              d["status"]
          )

          print(
              "SLATE:",
              d["slate"]
          )

          print(
              "GAMES:",
              len(
                  d["games"]
              )
          )

          print(
              "PLAYER PROPS:",
              len(
                  d["projections"]
              )
          )

          print(
              "SIMULATIONS EACH:",
              d[
                  "simulations_per_prop"
              ]
          )

          if (
              not d["games"]
          ):
              raise RuntimeError(
                  "No games in output."
              )

          if (
              not d["projections"]
          ):
              raise RuntimeError(
                  "No projections in output."
              )

          print("")
          print("GAMES")
          print("-" * 70)

          for game in d["games"]:

              print(
                  game["game"]
              )

          print("")
          print("DISTRIBUTION PREVIEW")
          print("-" * 70)

          for x in d[
              "projections"
          ][:20]:

              histogram = x.get(
                  "simulation_histogram",
                  []
              )

              stored = sum(
                  int(
                      entry[1]
                  )
                  for entry
                  in histogram
              )

              print(
                  x["player"],
                  "|",
                  x["team"],
                  "|",
                  x["game"],
                  "|",
                  x["prop"],
                  "| PROJ:",
                  x["projection"],
                  "| MEDIAN:",
                  x["median"],
                  "| REPRESENTED SIMS:",
                  stored
              )

              if (
                  stored != SIMS
              ):
                  raise RuntimeError(
                      "Compressed simulation count mismatch."
                  )

          print("")
          print(
              "JPRO FULL SLATE AUDIT PASSED"
          )

          PY

      - name: Save JPro full slate
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: build Week 3 full slate"
          file_pattern: data/jpro-current-projections.json
