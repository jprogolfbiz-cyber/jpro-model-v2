name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy scikit-learn pyarrow

      - name: Build JPro betting distributions
        run: |
          mkdir -p data

          python <<'PY'
          import json
          import numpy as np
          import pandas as pd
          import nflreadpy as nfl

          from datetime import datetime, timezone
          from sklearn.compose import ColumnTransformer
          from sklearn.impute import SimpleImputer
          from sklearn.linear_model import Ridge
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          np.random.seed(20260921)

          SIMS = 20000
          TEAMS = ["NYG", "LA"]

          print("=" * 60)
          print("JPRO BETTING DISTRIBUTION ENGINE")
          print("=" * 60)

          # --------------------------------------------------
          # LOAD REAL NFL DATA
          # --------------------------------------------------

          df = nfl.load_player_stats(
              [2022, 2023, 2024, 2025, 2026]
          )

          if hasattr(df, "to_pandas"):
              df = df.to_pandas()

          df = pd.DataFrame(df)

          if (
              "recent_team" not in df.columns
              and "team" in df.columns
          ):
              df["recent_team"] = df["team"]

          targets = [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          required = [
              "player_id",
              "player_display_name",
              "position",
              "season",
              "week",
              "recent_team"
          ] + targets

          missing = [
              c for c in required
              if c not in df.columns
          ]

          if missing:
              raise RuntimeError(
                  f"Missing required columns: {missing}"
              )

          for col in targets:
              df[col] = pd.to_numeric(
                  df[col],
                  errors="coerce"
              ).fillna(0.0)

          df["season"] = pd.to_numeric(
              df["season"],
              errors="coerce"
          )

          df["week"] = pd.to_numeric(
              df["week"],
              errors="coerce"
          )

          df = df.dropna(
              subset=[
                  "player_id",
                  "season",
                  "week"
              ]
          ).copy()

          df = df.sort_values(
              ["player_id", "season", "week"]
          ).reset_index(drop=True)

          print("REAL NFL ROWS:", len(df))

          # --------------------------------------------------
          # LEAKAGE-SAFE FEATURES
          # --------------------------------------------------

          group = df.groupby(
              "player_id",
              group_keys=False
          )

          for stat in targets:

              df[f"{stat}_lag1"] = (
                  group[stat].shift(1)
              )

              df[f"{stat}_avg3"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                       .rolling(
                           3,
                           min_periods=1
                       )
                       .mean()
                  )
              )

              df[f"{stat}_avg5"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                       .rolling(
                           5,
                           min_periods=1
                       )
                       .mean()
                  )
              )

              df[f"{stat}_std5"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                       .rolling(
                           5,
                           min_periods=2
                       )
                       .std()
                  )
              )

          df["games_before"] = group.cumcount()

          model_df = df[
              df["games_before"] >= 3
          ].copy()

          # --------------------------------------------------
          # MODEL FEATURES
          # --------------------------------------------------

          feature_cols = [
              "season",
              "week",
              "games_before",

              "passing_yards_lag1",
              "passing_yards_avg3",
              "passing_yards_avg5",
              "passing_yards_std5",

              "rushing_yards_lag1",
              "rushing_yards_avg3",
              "rushing_yards_avg5",
              "rushing_yards_std5",

              "receiving_yards_lag1",
              "receiving_yards_avg3",
              "receiving_yards_avg5",
              "receiving_yards_std5",

              "receptions_lag1",
              "receptions_avg3",
              "receptions_avg5",
              "receptions_std5",

              "position",
              "recent_team"
          ]

          numeric_features = [
              x for x in feature_cols
              if x not in [
                  "position",
                  "recent_team"
              ]
          ]

          categorical_features = [
              "position",
              "recent_team"
          ]

          specs = {
              "passing_yards": ["QB"],

              "rushing_yards": [
                  "QB",
                  "RB",
                  "WR"
              ],

              "receiving_yards": [
                  "WR",
                  "TE",
                  "RB"
              ],

              "receptions": [
                  "WR",
                  "TE",
                  "RB"
              ]
          }

          # --------------------------------------------------
          # CURRENT NYG / LA PLAYERS
          # --------------------------------------------------

          current = (
              model_df[
                  model_df["season"] == 2026
              ]
              .sort_values(
                  ["player_id", "week"]
              )
              .groupby("player_id")
              .tail(1)
              .copy()
          )

          current = current[
              current["recent_team"].isin(
                  TEAMS
              )
          ].copy()

          print(
              "CURRENT NYG/LA PLAYERS:",
              len(current)
          )

          if current.empty:
              raise RuntimeError(
                  "No current NYG/LA players found."
              )

          # --------------------------------------------------
          # TRAIN + CREATE 20K DISTRIBUTIONS
          # --------------------------------------------------

          results = []

          for target, positions in specs.items():

              historical = model_df[
                  model_df["position"].isin(
                      positions
                  )
              ].copy()

              if target == "passing_yards":
                  historical = historical[
                      historical["position"] == "QB"
                  ]

              historical = historical.sort_values(
                  ["season", "week"]
              ).reset_index(drop=True)

              split = int(
                  len(historical) * 0.80
              )

              fit_df = historical.iloc[
                  :split
              ].copy()

              calibration_df = historical.iloc[
                  split:
              ].copy()

              preprocessor = ColumnTransformer(
                  transformers=[
                      (
                          "num",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="median"
                                      )
                                  ),
                                  (
                                      "scale",
                                      StandardScaler()
                                  )
                              ]
                          ),
                          numeric_features
                      ),
                      (
                          "cat",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="most_frequent"
                                      )
                                  ),
                                  (
                                      "onehot",
                                      OneHotEncoder(
                                          handle_unknown="ignore"
                                      )
                                  )
                              ]
                          ),
                          categorical_features
                      )
                  ]
              )

              model = Pipeline(
                  steps=[
                      (
                          "prep",
                          preprocessor
                      ),
                      (
                          "model",
                          Ridge(
                              alpha=10.0
                          )
                      )
                  ]
              )

              # ----------------------------------------------
              # CALIBRATION RESIDUALS
              # ----------------------------------------------

              model.fit(
                  fit_df[feature_cols],
                  fit_df[target]
              )

              calibration_pred = model.predict(
                  calibration_df[
                      feature_cols
                  ]
              )

              residuals = (
                  calibration_df[
                      target
                  ].to_numpy(dtype=float)
                  -
                  calibration_pred
              )

              residuals = residuals[
                  np.isfinite(residuals)
              ]

              if len(residuals) < 100:
                  raise RuntimeError(
                      f"Insufficient residuals for {target}"
                  )

              # ----------------------------------------------
              # FINAL MODEL FIT
              # ----------------------------------------------

              model.fit(
                  historical[feature_cols],
                  historical[target]
              )

              eligible = current[
                  current["position"].isin(
                      positions
                  )
              ].copy()

              if target == "passing_yards":
                  eligible = eligible[
                      eligible["position"] == "QB"
                  ]

              if eligible.empty:
                  continue

              projections = model.predict(
                  eligible[feature_cols]
              )

              for i, (_, row) in enumerate(
                  eligible.iterrows()
              ):

                  projection = max(
                      0.0,
                      float(projections[i])
                  )

                  # ------------------------------------------
                  # 20,000 EMPIRICAL SIMULATIONS
                  # ------------------------------------------

                  sampled_errors = np.random.choice(
                      residuals,
                      size=SIMS,
                      replace=True
                  )

                  sims = (
                      projection
                      + sampled_errors
                  )

                  sims = np.maximum(
                      sims,
                      0.0
                  )

                  # NFL yard/reception results settle as
                  # whole-number statistics.
                  sims = np.rint(
                      sims
                  ).astype(int)

                  simulation_values = (
                      sims.tolist()
                  )

                  result = {
                      "player_id":
                          str(row["player_id"]),

                      "player":
                          str(
                              row[
                                  "player_display_name"
                              ]
                          ),

                      "team":
                          str(
                              row["recent_team"]
                          ),

                      "position":
                          str(
                              row["position"]
                          ),

                      "prop":
                          target,

                      "projection":
                          round(
                              projection,
                              2
                          ),

                      "sim_mean":
                          round(
                              float(
                                  np.mean(sims)
                              ),
                              2
                          ),

                      "median":
                          round(
                              float(
                                  np.median(sims)
                              ),
                              2
                          ),

                      "p10":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      10
                                  )
                              ),
                              2
                          ),

                      "p25":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      25
                                  )
                              ),
                              2
                          ),

                      "p75":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      75
                                  )
                              ),
                              2
                          ),

                      "p90":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      90
                                  )
                              ),
                              2
                          ),

                      "simulation_count":
                          SIMS,

                      "simulation_values":
                          simulation_values,

                      "latest_data_week":
                          int(row["week"])
                  }

                  # ------------------------------------------
                  # REMOVE LOW-INFORMATION PROPS
                  # ------------------------------------------

                  keep = True

                  if (
                      target == "passing_yards"
                      and projection < 25
                  ):
                      keep = False

                  if (
                      target == "rushing_yards"
                      and projection < 3
                  ):
                      keep = False

                  if (
                      target == "receiving_yards"
                      and projection < 5
                  ):
                      keep = False

                  if (
                      target == "receptions"
                      and projection < 0.5
                  ):
                      keep = False

                  if keep:

                      results.append(
                          result
                      )

                      print(
                          result["player"],
                          "|",
                          target,
                          "| PROJ:",
                          result["projection"],
                          "| MEDIAN:",
                          result["median"],
                          "| STORED SIMS:",
                          len(
                              simulation_values
                          )
                      )

          # --------------------------------------------------
          # SAVE APP-FRIENDLY BETTING JSON
          # --------------------------------------------------

          output = {
              "status":
                  "READY",

              "game":
                  "NYG @ LA",

              "season":
                  2026,

              "simulations_per_prop":
                  SIMS,

              "generated_at_utc":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "sportsbook_line_mode":
                  "MANUAL_IPHONE_INPUT",

              "sportsbook_lines_connected":
                  False,

              "projections":
                  results
          }

          with open(
              "data/jpro-current-projections.json",
              "w"
          ) as f:
              json.dump(
                  output,
                  f,
                  separators=(",", ":")
              )

          print("")
          print("=" * 60)
          print("JPRO BETTING DISTRIBUTIONS READY")
          print("=" * 60)

          print(
              "GAME:",
              output["game"]
          )

          print(
              "PLAYER PROPS:",
              len(results)
          )

          print(
              "SIMULATIONS PER PROP:",
              SIMS
          )

          print(
              "TOTAL STORED OUTCOMES:",
              len(results) * SIMS
          )

          print("=" * 60)

          PY

      - name: Verify JPro distributions
        run: |
          python <<'PY'
          import json

          with open(
              "data/jpro-current-projections.json"
          ) as f:
              d = json.load(f)

          print("=" * 60)
          print("JPRO DISTRIBUTION AUDIT")
          print("=" * 60)

          print(
              "STATUS:",
              d["status"]
          )

          print(
              "GAME:",
              d["game"]
          )

          print(
              "PLAYER PROPS:",
              len(
                  d["projections"]
              )
          )

          print(
              "SIMULATIONS EACH:",
              d[
                  "simulations_per_prop"
              ]
          )

          print("")
          print("DISTRIBUTION PREVIEW")
          print("-" * 60)

          for x in d["projections"][:15]:

              stored = len(
                  x[
                      "simulation_values"
                  ]
              )

              print(
                  x["player"],
                  "|",
                  x["prop"],
                  "| PROJ:",
                  x["projection"],
                  "| MEDIAN:",
                  x["median"],
                  "| STORED SIMS:",
                  stored
              )

              if stored != 20000:
                  raise RuntimeError(
                      "Simulation count mismatch"
                  )

          print("")
          print(
              "JPRO DISTRIBUTION AUDIT PASSED"
          )

          PY

      - name: Save JPro betting distributions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: add 20K betting distributions"
          file_pattern: data/jpro-current-projections.json
