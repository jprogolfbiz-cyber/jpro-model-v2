name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NFL data tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow

      - name: Verify NFL data connection
        run: |
          python - <<'PY'
          import nflreadpy as nfl

          print("JPRO CLOUD ENGINE STARTED")
          print("nflreadpy imported successfully")
          print("JPRO NFL DATA CONNECTION READY")
          PY

      - name: Create JPro status
        run: |
          mkdir -p data
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          status = {
              "engine": "JPro Cloud Engine",
              "cloud": "READY",
              "python": "READY",
              "nfl_data_tools": "READY",
              "real_model_outputs": "LOCKED",
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          with open("data/engine-status.json", "w") as f:
              json.dump(status, f, indent=2)
          PY

      - name: Save JPro status
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: activate cloud data engine"
          file_pattern: data/engine-status.json
