name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy scikit-learn

      # ============================================================
      # 3D-1
      # OPPORTUNITY / USAGE DATA AUDIT
      # ============================================================

      - name: Audit JPro opportunity data
        run: |
          python <<'PY'
          import pandas as pd
          import nflreadpy as nfl

          print("=" * 72)
          print("JPRO OPPORTUNITY DATA AUDIT")
          print("=" * 72)

          df = nfl.load_player_stats([2025, 2026])

          if hasattr(df, "to_pandas"):
              df = df.to_pandas()

          df = pd.DataFrame(df)

          print("")
          print("ROWS:", len(df))
          print("COLUMNS:", len(df.columns))

          wanted = [
              "player_id",
              "player_display_name",
              "player_name",
              "position",
              "position_group",
              "team",
              "recent_team",
              "season",
              "week",

              "attempts",
              "completions",
              "passing_attempts",

              "carries",
              "rushing_attempts",

              "targets",
              "receptions",

              "target_share",
              "air_yards",
              "air_yards_share",
              "receiving_air_yards",
              "wopr",

              "rushing_yards",
              "receiving_yards",
              "passing_yards",

              "rushing_tds",
              "receiving_tds",
              "passing_tds",

              "fantasy_points",
              "fantasy_points_ppr"
          ]

          print("")
          print("=" * 72)
          print("AVAILABLE OPPORTUNITY COLUMNS")
          print("=" * 72)

          for col in wanted:
              if col in df.columns:
                  print("YES :", col)
              else:
                  print("NO  :", col)

          print("")
          print("=" * 72)
          print("OTHER POSSIBLE USAGE COLUMNS")
          print("=" * 72)

          keywords = [
              "target",
              "attempt",
              "carr",
              "snap",
              "route",
              "share",
              "air_yard",
              "touch",
              "red_zone",
              "inside",
              "goal",
              "rush",
              "receiv"
          ]

          extra = []

          for col in df.columns:
              lower = str(col).lower()

              if any(
                  keyword in lower
                  for keyword in keywords
              ):
                  extra.append(col)

          for col in sorted(set(extra)):
              print(col)

          print("")
          print("=" * 72)
          print("DRAKE LONDON SAMPLE")
          print("=" * 72)

          name_col = None

          for candidate in [
              "player_display_name",
              "player_name"
          ]:
              if candidate in df.columns:
                  name_col = candidate
                  break

          if name_col is None:
              print("No player-name column found.")

          else:
              drake = df[
                  df[name_col]
                  .astype(str)
                  .str.contains(
                      "Drake London",
                      case=False,
                      na=False
                  )
              ].copy()

              preview_cols = [
                  col for col in [
                      "season",
                      "week",
                      name_col,
                      "position",
                      "team",
                      "recent_team",
                      "targets",
                      "receptions",
                      "receiving_yards",
                      "air_yards",
                      "receiving_air_yards",
                      "target_share",
                      "air_yards_share",
                      "wopr",
                      "carries",
                      "rushing_attempts",
                      "rushing_yards"
                  ]
                  if col in drake.columns
              ]

              if drake.empty:
                  print("Drake London not found.")

              else:
                  sort_cols = [
                      col
                      for col in ["season", "week"]
                      if col in drake.columns
                  ]

                  if sort_cols:
                      drake = drake.sort_values(sort_cols)

                  print(
                      drake[preview_cols]
                      .tail(12)
                      .to_string(index=False)
                  )

          print("")
          print("=" * 72)
          print("JPRO OPPORTUNITY AUDIT COMPLETE")
          print("=" * 72)

          PY

      # ============================================================
      # BUILD JPRO ENGINE
      # FULL SLATE + 20K SIMS + ROLE + MATCHUP INTELLIGENCE
      # ============================================================

      - name: Build JPro matchup intelligence
        run: |
          mkdir -p data

          python <<'PY'
          import json
          import math
          import warnings

          import numpy as np
          import pandas as pd
          import nflreadpy as nfl

          from sklearn.linear_model import Ridge
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import Pipeline

          warnings.filterwarnings("ignore")

          SEASON = 2026
          WEEK = 3
          SIMS = 20000
          RNG = np.random.default_rng(42)

          print("=" * 72)
          print("JPRO MATCHUP INTELLIGENCE ENGINE")
          print("=" * 72)
          print("Season:", SEASON)
          print("Week:", WEEK)
          print("Simulations:", SIMS)

          # ========================================================
          # HELPERS
          # ========================================================

          def to_pandas(obj):
              if hasattr(obj, "to_pandas"):
                  return obj.to_pandas()

              return pd.DataFrame(obj)


          def clean_number(value, default=0.0):
              try:
                  value = float(value)

                  if math.isnan(value):
                      return default

                  if math.isinf(value):
                      return default

                  return value

              except Exception:
                  return default


          def clean_int(value, default=0):
              try:
                  return int(value)

              except Exception:
                  return default


          def first_existing(columns, choices):
              for choice in choices:
                  if choice in columns:
                      return choice

              return None


          def normalize_team(value):
              if pd.isna(value):
                  return ""

              return str(value).strip().upper()


          def percentile(values, pct):
              if len(values) == 0:
                  return 0.0

              return float(
                  np.percentile(
                      values,
                      pct
                  )
              )


          def compress_histogram(values):
              unique, counts = np.unique(
                  values.astype(int),
                  return_counts=True
              )

              return [
                  [
                      int(value),
                      int(count)
                  ]
                  for value, count
                  in zip(unique, counts)
              ]


          def safe_mean(series):
              series = pd.to_numeric(
                  series,
                  errors="coerce"
              ).dropna()

              if len(series) == 0:
                  return 0.0

              return float(series.mean())


          # ========================================================
          # LOAD SCHEDULE
          # ========================================================

          print("")
          print("Loading schedule...")

          schedule = to_pandas(
              nfl.load_schedules(
                  list(
                      range(
                          2022,
                          SEASON + 1
                      )
                  )
              )
          )

          print(
              "Schedule rows:",
              len(schedule)
          )

          season_col = first_existing(
              schedule.columns,
              ["season"]
          )

          week_col = first_existing(
              schedule.columns,
              ["week"]
          )

          home_col = first_existing(
              schedule.columns,
              ["home_team"]
          )

          away_col = first_existing(
              schedule.columns,
              ["away_team"]
          )

          game_type_col = first_existing(
              schedule.columns,
              ["game_type"]
          )

          if not all([
              season_col,
              week_col,
              home_col,
              away_col
          ]):
              raise RuntimeError(
                  "Required schedule columns missing."
              )

          # Prefer regular-season games where game_type exists.
          regular_schedule = schedule.copy()

          if game_type_col:
              possible_regular = regular_schedule[
                  regular_schedule[
                      game_type_col
                  ]
                  .astype(str)
                  .str.upper()
                  .isin([
                      "REG",
                      "REGULAR",
                      "R"
                  ])
              ]

              if len(possible_regular) > 0:
                  regular_schedule = possible_regular

          week_games = regular_schedule[
              (
                  pd.to_numeric(
                      regular_schedule[
                          season_col
                      ],
                      errors="coerce"
                  )
                  == SEASON
              )
              &
              (
                  pd.to_numeric(
                      regular_schedule[
                          week_col
                      ],
                      errors="coerce"
                  )
                  == WEEK
              )
          ].copy()

          if week_games.empty:
              raise RuntimeError(
                  f"No games found for {SEASON} Week {WEEK}."
              )

          games = []
          team_to_game = {}

          for _, row in week_games.iterrows():
              away = normalize_team(
                  row[away_col]
              )

              home = normalize_team(
                  row[home_col]
              )

              if not away or not home:
                  continue

              game_name = f"{away} @ {home}"

              games.append({
                  "game": game_name,
                  "away_team": away,
                  "home_team": home
              })

              team_to_game[away] = {
                  "game": game_name,
                  "opponent": home
              }

              team_to_game[home] = {
                  "game": game_name,
                  "opponent": away
              }

          print(
              "Slate games:",
              len(games)
          )

          for game in games:
              print(" -", game["game"])

          slate_teams = set(
              team_to_game.keys()
          )

          # ========================================================
          # HISTORICAL OPPONENT LOOKUP
          # ========================================================

          schedule_lookup = {}

          for _, row in regular_schedule.iterrows():
              try:
                  season = int(
                      row[season_col]
                  )

                  week = int(
                      row[week_col]
                  )

              except Exception:
                  continue

              home = normalize_team(
                  row[home_col]
              )

              away = normalize_team(
                  row[away_col]
              )

              if not home or not away:
                  continue

              schedule_lookup[
                  (
                      season,
                      week,
                      home
                  )
              ] = away

              schedule_lookup[
                  (
                      season,
                      week,
                      away
                  )
              ] = home

          # ========================================================
          # LOAD PLAYER STATS
          # ========================================================

          print("")
          print("Loading player stats...")

          stats = to_pandas(
              nfl.load_player_stats(
                  list(
                      range(
                          2022,
                          SEASON + 1
                      )
                  )
              )
          )

          print(
              "Player rows:",
              len(stats)
          )

          print(
              "Player columns:",
              len(stats.columns)
          )

          player_id_col = first_existing(
              stats.columns,
              [
                  "player_id",
                  "gsis_id"
              ]
          )

          player_name_col = first_existing(
              stats.columns,
              [
                  "player_display_name",
                  "player_name",
                  "name"
              ]
          )

          team_col = first_existing(
              stats.columns,
              [
                  "recent_team",
                  "team"
              ]
          )

          position_col = first_existing(
              stats.columns,
              [
                  "position",
                  "position_group"
              ]
          )

          if not all([
              player_id_col,
              player_name_col,
              team_col,
              position_col,
              "season",
              "week"
          ]):
              raise RuntimeError(
                  "Required player-stat columns missing."
              )

          stats = stats.copy()

          stats["team_jpro"] = (
              stats[team_col]
              .astype(str)
              .str.upper()
              .str.strip()
          )

          stats["position_jpro"] = (
              stats[position_col]
              .astype(str)
              .str.upper()
              .str.strip()
          )

          stats["player_id_jpro"] = (
              stats[player_id_col]
              .astype(str)
          )

          stats["player_name_jpro"] = (
              stats[player_name_col]
              .astype(str)
          )

          stats["season"] = pd.to_numeric(
              stats["season"],
              errors="coerce"
          )

          stats["week"] = pd.to_numeric(
              stats["week"],
              errors="coerce"
          )

          stats = stats[
              stats["season"].notna()
              &
              stats["week"].notna()
          ].copy()

          stats["season"] = (
              stats["season"]
              .astype(int)
          )

          stats["week"] = (
              stats["week"]
              .astype(int)
          )

          # ========================================================
          # TARGETS
          # ========================================================

          target_specs = {
              "passing_yards": {
                  "positions": ["QB"],
                  "min_projection": 25
              },

              "rushing_yards": {
                  "positions": [
                      "QB",
                      "RB",
                      "WR"
                  ],
                  "min_projection": 2
              },

              "receiving_yards": {
                  "positions": [
                      "RB",
                      "WR",
                      "TE"
                  ],
                  "min_projection": 2
              },

              "receptions": {
                  "positions": [
                      "RB",
                      "WR",
                      "TE"
                  ],
                  "min_projection": 0.25
              }
          }

          available_targets = {}

          for target, spec in target_specs.items():
              if target in stats.columns:
                  available_targets[
                      target
                  ] = spec

          if not available_targets:
              raise RuntimeError(
                  "No supported target columns found."
              )

          # ========================================================
          # SORT / CREATE LAG FEATURES
          # ========================================================

          stats = stats.sort_values(
              [
                  "player_id_jpro",
                  "season",
                  "week"
              ]
          ).reset_index(
              drop=True
          )

          feature_columns = []

          for target in available_targets:
              numeric_target = pd.to_numeric(
                  stats[target],
                  errors="coerce"
              )

              stats[target] = (
                  numeric_target
                  .fillna(0.0)
              )

              grouped = stats.groupby(
                  "player_id_jpro"
              )[target]

              lag1 = (
                  grouped.shift(1)
              )

              avg3 = (
                  grouped
                  .shift(1)
                  .rolling(
                      3,
                      min_periods=1
                  )
                  .mean()
                  .reset_index(
                      level=0,
                      drop=True
                  )
              )

              avg5 = (
                  grouped
                  .shift(1)
                  .rolling(
                      5,
                      min_periods=1
                  )
                  .mean()
                  .reset_index(
                      level=0,
                      drop=True
                  )
              )

              std5 = (
                  grouped
                  .shift(1)
                  .rolling(
                      5,
                      min_periods=2
                  )
                  .std()
                  .reset_index(
                      level=0,
                      drop=True
                  )
              )

              lag_col = f"{target}_lag1"
              avg3_col = f"{target}_avg3"
              avg5_col = f"{target}_avg5"
              std5_col = f"{target}_std5"

              stats[lag_col] = lag1
              stats[avg3_col] = avg3
              stats[avg5_col] = avg5
              stats[std5_col] = std5

              feature_columns.extend([
                  lag_col,
                  avg3_col,
                  avg5_col,
                  std5_col
              ])

          # Generic time/context features.
          stats["week_feature"] = (
              stats["week"]
              .astype(float)
          )

          stats["season_feature"] = (
              stats["season"]
              .astype(float)
          )

          feature_columns.extend([
              "week_feature",
              "season_feature"
          ])

          # ========================================================
          # CURRENT PRE-WEEK STATE
          # ========================================================

          pregame_2026 = stats[
              (
                  stats["season"] == SEASON
              )
              &
              (
                  stats["week"] < WEEK
              )
          ].copy()

          if pregame_2026.empty:
              raise RuntimeError(
                  "No current-season pregame rows available."
              )

          latest_current = (
              pregame_2026
              .sort_values(
                  [
                      "player_id_jpro",
                      "week"
                  ]
              )
              .groupby(
                  "player_id_jpro",
                  as_index=False
              )
              .tail(1)
              .copy()
          )

          latest_current = latest_current[
              latest_current[
                  "team_jpro"
              ].isin(
                  slate_teams
              )
          ].copy()

          print("")
          print(
              "Current slate player rows:",
              len(latest_current)
          )

          # ========================================================
          # ROLE INTELLIGENCE V1
          # Kept unchanged for this audit run.
          # 3D-2 will replace this after we inspect opportunity data.
          # ========================================================

          def player_stat_summary(
              player_rows,
              stat_name
          ):
              if stat_name not in player_rows.columns:
                  return {
                      "season_avg": 0.0,
                      "recent_avg": 0.0,
                      "last_game": 0.0,
                      "recent_std": 0.0,
                      "trend": 0.0
                  }

              ordered = (
                  player_rows
                  .sort_values("week")
              )

              values = pd.to_numeric(
                  ordered[stat_name],
                  errors="coerce"
              ).fillna(0.0)

              recent = values.tail(3)

              season_avg = (
                  float(values.mean())
                  if len(values)
                  else 0.0
              )

              recent_avg = (
                  float(recent.mean())
                  if len(recent)
                  else 0.0
              )

              last_game = (
                  float(values.iloc[-1])
                  if len(values)
                  else 0.0
              )

              recent_std = (
                  float(recent.std(ddof=0))
                  if len(recent) > 1
                  else 0.0
              )

              trend = (
                  recent_avg -
                  season_avg
              )

              return {
                  "season_avg":
                      season_avg,

                  "recent_avg":
                      recent_avg,

                  "last_game":
                      last_game,

                  "recent_std":
                      recent_std,

                  "trend":
                      trend
              }


          team_totals = {}

          for (
              team,
              week
          ), group in pregame_2026.groupby(
              [
                  "team_jpro",
                  "week"
              ]
          ):
              team_totals[
                  (
                      team,
                      int(week)
                  )
              ] = {
                  target:
                      float(
                          pd.to_numeric(
                              group[target],
                              errors="coerce"
                          )
                          .fillna(0)
                          .sum()
                      )
                  for target
                  in available_targets
              }


          def player_share(
              player_rows,
              stat_name
          ):
              shares = []

              for _, row in player_rows.iterrows():
                  team = row[
                      "team_jpro"
                  ]

                  week = int(
                      row["week"]
                  )

                  team_total = (
                      team_totals
                      .get(
                          (
                              team,
                              week
                          ),
                          {}
                      )
                      .get(
                          stat_name,
                          0.0
                      )
                  )

                  player_value = clean_number(
                      row.get(
                          stat_name,
                          0.0
                      )
                  )

                  if team_total > 0:
                      shares.append(
                          player_value /
                          team_total
                      )

              if not shares:
                  return 0.0

              return float(
                  np.mean(shares)
              )


          def role_label(score):
              if score >= 80:
                  return "FEATURED"

              if score >= 65:
                  return "STRONG"

              if score >= 50:
                  return "STABLE"

              if score >= 35:
                  return "ROTATIONAL"

              return "LIMITED"


          def build_role(player_id):
              rows = pregame_2026[
                  pregame_2026[
                      "player_id_jpro"
                  ] == player_id
              ].copy()

              if rows.empty:
                  return {
                      "role_score": 0.0,
                      "role_label": "UNKNOWN",
                      "games_sample": 0
                  }

              latest = (
                  rows
                  .sort_values("week")
                  .iloc[-1]
              )

              position = str(
                  latest[
                      "position_jpro"
                  ]
              ).upper()

              pass_summary = (
                  player_stat_summary(
                      rows,
                      "passing_yards"
                  )
              )

              rush_summary = (
                  player_stat_summary(
                      rows,
                      "rushing_yards"
                  )
              )

              rec_summary = (
                  player_stat_summary(
                      rows,
                      "receiving_yards"
                  )
              )

              catch_summary = (
                  player_stat_summary(
                      rows,
                      "receptions"
                  )
              )

              pass_share = (
                  player_share(
                      rows,
                      "passing_yards"
                  )
              )

              rush_share = (
                  player_share(
                      rows,
                      "rushing_yards"
                  )
              )

              rec_share = (
                  player_share(
                      rows,
                      "receiving_yards"
                  )
              )

              score = 0.0

              if position == "QB":
                  score = (
                      min(
                          pass_summary[
                              "recent_avg"
                          ] / 300.0,
                          1.0
                      )
                      * 55.0
                      +
                      min(
                          pass_share,
                          1.0
                      )
                      * 30.0
                      +
                      min(
                          rush_summary[
                              "recent_avg"
                          ] / 50.0,
                          1.0
                      )
                      * 15.0
                  )

              elif position == "RB":
                  score = (
                      min(
                          rush_summary[
                              "recent_avg"
                          ] / 90.0,
                          1.0
                      )
                      * 45.0
                      +
                      min(
                          rush_share / 0.65,
                          1.0
                      )
                      * 30.0
                      +
                      min(
                          rec_summary[
                              "recent_avg"
                          ] / 45.0,
                          1.0
                      )
                      * 15.0
                      +
                      min(
                          catch_summary[
                              "recent_avg"
                          ] / 5.0,
                          1.0
                      )
                      * 10.0
                  )

              elif position in [
                  "WR",
                  "TE"
              ]:
                  score = (
                      min(
                          rec_summary[
                              "recent_avg"
                          ] / 90.0,
                          1.0
                      )
                      * 45.0
                      +
                      min(
                          catch_summary[
                              "recent_avg"
                          ] / 7.0,
                          1.0
                      )
                      * 25.0
                      +
                      min(
                          rec_share / 0.35,
                          1.0
                      )
                      * 30.0
                  )

              score = float(
                  np.clip(
                      score,
                      0,
                      100
                  )
              )

              return {
                  "role_score":
                      round(
                          score,
                          2
                      ),

                  "role_label":
                      role_label(
                          score
                      ),

                  "games_sample":
                      int(
                          len(rows)
                      ),

                  "passing_yards_season_avg":
                      round(
                          pass_summary[
                              "season_avg"
                          ],
                          2
                      ),

                  "passing_yards_recent_avg":
                      round(
                          pass_summary[
                              "recent_avg"
                          ],
                          2
                      ),

                  "rushing_yards_season_avg":
                      round(
                          rush_summary[
                              "season_avg"
                          ],
                          2
                      ),

                  "rushing_yards_recent_avg":
                      round(
                          rush_summary[
                              "recent_avg"
                          ],
                          2
                      ),

                  "receiving_yards_season_avg":
                      round(
                          rec_summary[
                              "season_avg"
                          ],
                          2
                      ),

                  "receiving_yards_recent_avg":
                      round(
                          rec_summary[
                              "recent_avg"
                          ],
                          2
                      ),

                  "receptions_season_avg":
                      round(
                          catch_summary[
                              "season_avg"
                          ],
                          2
                      ),

                  "receptions_recent_avg":
                      round(
                          catch_summary[
                              "recent_avg"
                          ],
                          2
                      ),

                  "passing_yards_share":
                      round(
                          pass_share,
                          4
                      ),

                  "rushing_yards_share":
                      round(
                          rush_share,
                          4
                      ),

                  "receiving_yards_share":
                      round(
                          rec_share,
                          4
                      )
              }

          # ========================================================
          # OPPONENT ATTACHMENT
          # ========================================================

          def lookup_opponent(row):
              key = (
                  int(row["season"]),
                  int(row["week"]),
                  normalize_team(
                      row[
                          "team_jpro"
                      ]
                  )
              )

              return schedule_lookup.get(
                  key,
                  ""
              )


          stats[
              "opponent_jpro"
          ] = stats.apply(
              lookup_opponent,
              axis=1
          )

          # Pregame rows only.
          opponent_rows = stats[
              (
                  stats["season"] < SEASON
              )
              |
              (
                  (
                      stats["season"] == SEASON
                  )
                  &
                  (
                      stats["week"] < WEEK
                  )
              )
          ].copy()

          opponent_rows = opponent_rows[
              opponent_rows[
                  "opponent_jpro"
              ] != ""
          ].copy()

          # ========================================================
          # DEFENSIVE MATCHUP INTELLIGENCE
          # ========================================================

          matchup_specs = {
              "passing_yards": [
                  "QB"
              ],

              "rushing_yards": [
                  "QB",
                  "RB",
                  "WR"
              ],

              "receiving_yards": [
                  "RB",
                  "WR",
                  "TE"
              ],

              "receptions": [
                  "RB",
                  "WR",
                  "TE"
              ]
          }


          def defensive_game_totals(
              frame,
              stat_name,
              positions
          ):
              if stat_name not in frame.columns:
                  return pd.DataFrame(
                      columns=[
                          "season",
                          "week",
                          "opponent_jpro",
                          "allowed"
                      ]
                  )

              subset = frame[
                  frame[
                      "position_jpro"
                  ].isin(
                      positions
                  )
              ].copy()

              if subset.empty:
                  return pd.DataFrame(
                      columns=[
                          "season",
                          "week",
                          "opponent_jpro",
                          "allowed"
                      ]
                  )

              subset[
                  stat_name
              ] = pd.to_numeric(
                  subset[
                      stat_name
                  ],
                  errors="coerce"
              ).fillna(0.0)

              totals = (
                  subset
                  .groupby(
                      [
                          "season",
                          "week",
                          "opponent_jpro"
                      ],
                      as_index=False
                  )[stat_name]
                  .sum()
                  .rename(
                      columns={
                          stat_name:
                              "allowed"
                      }
                  )
              )

              return totals


          matchup_tables = {}

          for stat_name, positions in matchup_specs.items():
              if stat_name not in stats.columns:
                  continue

              matchup_tables[
                  stat_name
              ] = defensive_game_totals(
                  opponent_rows,
                  stat_name,
                  positions
              )


          def matchup_label(score):
              if score >= 65:
                  return "FAVORABLE"

              if score <= 35:
                  return "TOUGH"

              return "NEUTRAL"


          def build_matchup(
              defense,
              stat_name
          ):
              table = matchup_tables.get(
                  stat_name
              )

              if table is None or table.empty:
                  return {
                      "matchup_score": 50.0,
                      "matchup_label": "NEUTRAL",
                      "allowed_per_game": 0.0,
                      "league_per_game": 0.0,
                      "allowed_vs_league_ratio": 1.0,
                      "current_season_allowed": 0.0,
                      "historical_allowed": 0.0,
                      "current_season_games": 0,
                      "method":
                          "SHRUNK_DEFENSIVE_PRODUCTION"
                  }

              defense = normalize_team(
                  defense
              )

              current_games = table[
                  (
                      table[
                          "opponent_jpro"
                      ] == defense
                  )
                  &
                  (
                      table[
                          "season"
                      ] == SEASON
                  )
              ]

              # Historical baseline intentionally excludes 2026.
              # This avoids double-counting the same current games.
              historical_games = table[
                  (
                      table[
                          "opponent_jpro"
                      ] == defense
                  )
                  &
                  (
                      table[
                          "season"
                      ] < SEASON
                  )
              ]

              league_current = table[
                  table[
                      "season"
                  ] == SEASON
              ]

              league_history = table[
                  table[
                      "season"
                  ] < SEASON
              ]

              current_avg = (
                  safe_mean(
                      current_games[
                          "allowed"
                      ]
                  )
                  if len(current_games)
                  else 0.0
              )

              historical_avg = (
                  safe_mean(
                      historical_games[
                          "allowed"
                      ]
                  )
                  if len(historical_games)
                  else 0.0
              )

              league_current_avg = (
                  safe_mean(
                      league_current[
                          "allowed"
                      ]
                  )
                  if len(league_current)
                  else 0.0
              )

              league_history_avg = (
                  safe_mean(
                      league_history[
                          "allowed"
                      ]
                  )
                  if len(league_history)
                  else 0.0
              )

              current_n = len(
                  current_games
              )

              # Early season gets partial weight.
              # Maximum current-season weight is 65%.
              current_weight = min(
                  current_n / 6.0,
                  0.65
              )

              if current_n == 0:
                  current_weight = 0.0

              historical_weight = (
                  1.0 -
                  current_weight
              )

              if historical_avg <= 0:
                  historical_avg = (
                      league_history_avg
                      if league_history_avg > 0
                      else league_current_avg
                  )

              if current_avg <= 0:
                  current_avg = (
                      historical_avg
                  )

              blended_allowed = (
                  current_avg
                  * current_weight
                  +
                  historical_avg
                  * historical_weight
              )

              league_reference = (
                  league_current_avg
                  * current_weight
                  +
                  league_history_avg
                  * historical_weight
              )

              if league_reference <= 0:
                  league_reference = (
                      blended_allowed
                      if blended_allowed > 0
                      else 1.0
                  )

              ratio = (
                  blended_allowed /
                  league_reference
              )

              score = (
                  50.0 +
                  (
                      ratio - 1.0
                  )
                  * 100.0
              )

              score = float(
                  np.clip(
                      score,
                      0,
                      100
                  )
              )

              return {
                  "matchup_score":
                      round(
                          score,
                          2
                      ),

                  "matchup_label":
                      matchup_label(
                          score
                      ),

                  "allowed_per_game":
                      round(
                          blended_allowed,
                          2
                      ),

                  "league_per_game":
                      round(
                          league_reference,
                          2
                      ),

                  "allowed_vs_league_ratio":
                      round(
                          ratio,
                          4
                      ),

                  "current_season_allowed":
                      round(
                          current_avg,
                          2
                      ),

                  "historical_allowed":
                      round(
                          historical_avg,
                          2
                      ),

                  "current_season_games":
                      int(
                          current_n
                      ),

                  "method":
                      "SHRUNK_DEFENSIVE_PRODUCTION"
              }

          # ========================================================
          # MODEL + SIMULATION
          # ========================================================

          projections = []

          for target, spec in available_targets.items():

              print("")
              print(
                  "Building:",
                  target
              )

              target_features = [
                  f"{target}_lag1",
                  f"{target}_avg3",
                  f"{target}_avg5",
                  f"{target}_std5",
                  "week_feature",
                  "season_feature"
              ]

              model_rows = stats[
                  stats[
                      "position_jpro"
                  ].isin(
                      spec[
                          "positions"
                      ]
                  )
              ].copy()

              model_rows = model_rows[
                  model_rows[
                      target
                  ].notna()
              ].copy()

              model_rows = model_rows[
                  model_rows[
                      f"{target}_lag1"
                  ].notna()
              ].copy()

              if len(model_rows) < 100:
                  print(
                      "Skipping - insufficient rows."
                  )
                  continue

              X = (
                  model_rows[
                      target_features
                  ]
                  .replace(
                      [
                          np.inf,
                          -np.inf
                      ],
                      np.nan
                  )
                  .fillna(0.0)
              )

              y = pd.to_numeric(
                  model_rows[target],
                  errors="coerce"
              ).fillna(0.0)

              split = int(
                  len(model_rows)
                  * 0.80
              )

              split = max(
                  1,
                  min(
                      split,
                      len(model_rows) - 1
                  )
              )

              train_X = X.iloc[
                  :split
              ]

              train_y = y.iloc[
                  :split
              ]

              valid_X = X.iloc[
                  split:
              ]

              valid_y = y.iloc[
                  split:
              ]

              validation_model = Pipeline([
                  (
                      "scale",
                      StandardScaler()
                  ),
                  (
                      "ridge",
                      Ridge(
                          alpha=10.0
                      )
                  )
              ])

              validation_model.fit(
                  train_X,
                  train_y
              )

              if len(valid_X):
                  valid_predictions = (
                      validation_model
                      .predict(
                          valid_X
                      )
                  )

                  residuals = (
                      valid_y.to_numpy()
                      -
                      valid_predictions
                  )

              else:
                  residuals = (
                      train_y.to_numpy()
                      -
                      validation_model.predict(
                          train_X
                      )
                  )

              residuals = np.asarray(
                  residuals,
                  dtype=float
              )

              residuals = residuals[
                  np.isfinite(
                      residuals
                  )
              ]

              if len(residuals) < 20:
                  residuals = np.array(
                      [0.0]
                  )

              final_model = Pipeline([
                  (
                      "scale",
                      StandardScaler()
                  ),
                  (
                      "ridge",
                      Ridge(
                          alpha=10.0
                      )
                  )
              ])

              final_model.fit(
                  X,
                  y
              )

              current_rows = latest_current[
                  latest_current[
                      "position_jpro"
                  ].isin(
                      spec[
                          "positions"
                      ]
                  )
              ].copy()

              for _, row in current_rows.iterrows():

                  team = normalize_team(
                      row[
                          "team_jpro"
                      ]
                  )

                  game_info = (
                      team_to_game
                      .get(team)
                  )

                  if not game_info:
                      continue

                  feature_values = pd.DataFrame(
                      [
                          {
                              feature:
                                  clean_number(
                                      row.get(
                                          feature,
                                          0.0
                                      )
                                  )
                              for feature
                              in target_features
                          }
                      ]
                  )

                  projection = float(
                      final_model.predict(
                          feature_values
                      )[0]
                  )

                  projection = max(
                      projection,
                      0.0
                  )

                  if (
                      projection
                      <
                      spec[
                          "min_projection"
                      ]
                  ):
                      continue

                  sampled_residuals = (
                      RNG.choice(
                          residuals,
                          size=SIMS,
                          replace=True
                      )
                  )

                  simulations = (
                      projection
                      +
                      sampled_residuals
                  )

                  simulations = np.clip(
                      simulations,
                      0,
                      None
                  )

                  simulations = np.rint(
                      simulations
                  ).astype(int)

                  histogram = (
                      compress_histogram(
                          simulations
                      )
                  )

                  if (
                      sum(
                          count
                          for _, count
                          in histogram
                      )
                      != SIMS
                  ):
                      raise RuntimeError(
                          "Histogram simulation-count audit failed."
                      )

                  player_id = str(
                      row[
                          "player_id_jpro"
                      ]
                  )

                  opponent = game_info[
                      "opponent"
                  ]

                  role = build_role(
                      player_id
                  )

                  matchup = build_matchup(
                      opponent,
                      target
                  )

                  projections.append({
                      "game":
                          game_info[
                              "game"
                          ],

                      "team":
                          team,

                      "opponent":
                          opponent,

                      "player_id":
                          player_id,

                      "player":
                          str(
                              row[
                                  "player_name_jpro"
                              ]
                          ),

                      "position":
                          str(
                              row[
                                  "position_jpro"
                              ]
                          ),

                      "prop":
                          target,

                      "projection":
                          round(
                              projection,
                              2
                          ),

                      "median":
                          round(
                              percentile(
                                  simulations,
                                  50
                              ),
                              2
                          ),

                      "p10":
                          round(
                              percentile(
                                  simulations,
                                  10
                              ),
                              2
                          ),

                      "p25":
                          round(
                              percentile(
                                  simulations,
                                  25
                              ),
                              2
                          ),

                      "p75":
                          round(
                              percentile(
                                  simulations,
                                  75
                              ),
                              2
                          ),

                      "p90":
                          round(
                              percentile(
                                  simulations,
                                  90
                              ),
                              2
                          ),

                      "simulation_histogram":
                          histogram,

                      "simulation_count":
                          SIMS,

                      "role":
                          role,

                      "matchup":
                          matchup
                  })

          # ========================================================
          # SORT OUTPUT
          # ========================================================

          game_order = {
              game[
                  "game"
              ]: index
              for index, game
              in enumerate(games)
          }

          prop_order = {
              "passing_yards": 0,
              "rushing_yards": 1,
              "receiving_yards": 2,
              "receptions": 3
          }

          projections = sorted(
              projections,
              key=lambda x: (
                  game_order.get(
                      x["game"],
                      999
                  ),
                  x["team"],
                  x["player"],
                  prop_order.get(
                      x["prop"],
                      99
                  )
              )
          )

          # ========================================================
          # OUTPUT
          # ========================================================

          output = {
              "status":
                  "READY",

              "engine_version":
                  "JPRO_MATCHUP_INTELLIGENCE_V1",

              "season":
                  SEASON,

              "week":
                  WEEK,

              "slate":
                  f"{SEASON} Week {WEEK}",

              "games_count":
                  len(games),

              "player_props_count":
                  len(projections),

              "simulations_each":
                  SIMS,

              "role_intelligence":
                  True,

              "matchup_intelligence":
                  True,

              "role_version":
                  "V1_AWAITING_OPPORTUNITY_UPGRADE",

              "games":
                  games,

              "projections":
                  projections
          }

          output_path = (
              "data/"
              "jpro-current-projections.json"
          )

          with open(
              output_path,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  separators=(
                      ",",
                      ":"
                  )
              )

          print("")
          print("=" * 72)
          print("JPRO BUILD COMPLETE")
          print("=" * 72)

          print(
              "Status:",
              output[
                  "status"
              ]
          )

          print(
              "Slate:",
              output[
                  "slate"
              ]
          )

          print(
              "Games:",
              output[
                  "games_count"
              ]
          )

          print(
              "Player props:",
              output[
                  "player_props_count"
              ]
          )

          print(
              "Simulations each:",
              output[
                  "simulations_each"
              ]
          )

          print(
              "Saved:",
              output_path
          )

          PY

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify JPro matchup intelligence
        run: |
          python <<'PY'
          import json
          import statistics

          path = (
              "data/"
              "jpro-current-projections.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(
                  file
              )

          print("=" * 72)
          print("JPRO MATCHUP INTELLIGENCE VERIFY")
          print("=" * 72)

          projections = data.get(
              "projections",
              []
          )

          games = data.get(
              "games",
              []
          )

          print(
              "Engine:",
              data.get(
                  "engine_version"
              )
          )

          print(
              "Status:",
              data.get(
                  "status"
              )
          )

          print(
              "Slate:",
              data.get(
                  "slate"
              )
          )

          print(
              "Games:",
              len(games)
          )

          print(
              "Player props:",
              len(projections)
          )

          print(
              "Simulations each:",
              data.get(
                  "simulations_each"
              )
          )

          if not projections:
              raise RuntimeError(
                  "No projections found."
              )

          bad_histograms = []

          role_count = 0
          matchup_count = 0
          matchup_scores = []

          for prop in projections:

              histogram = prop.get(
                  "simulation_histogram",
                  []
              )

              total = sum(
                  int(entry[1])
                  for entry in histogram
              )

              if total != 20000:
                  bad_histograms.append(
                      (
                          prop.get(
                              "player"
                          ),
                          prop.get(
                              "prop"
                          ),
                          total
                      )
                  )

              role = prop.get(
                  "role"
              )

              if role:
                  role_count += 1

              matchup = prop.get(
                  "matchup"
              )

              if matchup:
                  matchup_count += 1

                  score = float(
                      matchup.get(
                          "matchup_score",
                          0
                      )
                  )

                  if (
                      score < 0
                      or
                      score > 100
                  ):
                      raise RuntimeError(
                          "Matchup score outside 0-100."
                      )

                  matchup_scores.append(
                      score
                  )

          if bad_histograms:
              raise RuntimeError(
                  f"Histogram audit failed: {bad_histograms[:5]}"
              )

          print("")
          print(
              "Props with role data:",
              role_count
          )

          print(
              "Props with matchup data:",
              matchup_count
          )

          if matchup_scores:

              print(
                  "Matchup score min:",
                  round(
                      min(
                          matchup_scores
                      ),
                      2
                  )
              )

              print(
                  "Matchup score max:",
                  round(
                      max(
                          matchup_scores
                      ),
                      2
                  )
              )

              print(
                  "Matchup score avg:",
                  round(
                      statistics.mean(
                          matchup_scores
                      ),
                      2
                  )
              )

          print("")
          print("=" * 72)
          print("MATCHUP PREVIEW")
          print("=" * 72)

          for prop in projections[:25]:

              role = prop.get(
                  "role",
                  {}
              )

              matchup = prop.get(
                  "matchup",
                  {}
              )

              print("")
              print(
                  prop.get(
                      "player"
                  ),
                  "|",
                  prop.get(
                      "team"
                  ),
                  "vs",
                  prop.get(
                      "opponent"
                  )
              )

              print(
                  "  PROP:",
                  prop.get(
                      "prop"
                  )
              )

              print(
                  "  PROJECTION:",
                  prop.get(
                      "projection"
                  )
              )

              print(
                  "  ROLE:",
                  role.get(
                      "role_label"
                  ),
                  role.get(
                      "role_score"
                  )
              )

              print(
                  "  MATCHUP:",
                  matchup.get(
                      "matchup_label"
                  ),
                  matchup.get(
                      "matchup_score"
                  )
              )

              print(
                  "  ALLOWED:",
                  matchup.get(
                      "allowed_per_game"
                  ),
                  "| LEAGUE:",
                  matchup.get(
                      "league_per_game"
                  )
              )

              print(
                  "  2026 GAMES:",
                  matchup.get(
                      "current_season_games"
                  )
              )

          print("")
          print("=" * 72)
          print("VERIFY COMPLETE")
          print("=" * 72)

          PY

