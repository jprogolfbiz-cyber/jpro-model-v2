          def lookup_opponent(row):

              key = (
                  int(
                      row["season"]
                  ),
                  int(
                      row["week"]
                  ),
                  normalize_team(
                      row[
                          "team_jpro"
                      ]
                  )
              )

              return schedule_lookup.get(
                  key,
                  ""
              )

          stats["opponent_jpro"] = (
              stats.apply(
                  lookup_opponent,
                  axis=1
              )
          )

          opponent_rows = stats[
              (
                  stats["season"]
                  < SEASON
              )
              |
              (
                  (
                      stats["season"]
                      == SEASON
                  )
                  &
                  (
                      stats["week"]
                      < WEEK
                  )
              )
          ].copy()

          opponent_rows = opponent_rows[
              opponent_rows[
                  "opponent_jpro"
