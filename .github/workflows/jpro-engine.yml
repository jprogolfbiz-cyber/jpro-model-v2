          def defensive_game_totals(
              frame,
              stat_name,
              positions
          ):

              if stat_name not in frame.columns:

                  return pd.DataFrame(
                      columns=[
                          "season",
                          "week",
                          "opponent_jpro",
                          "allowed"
                      ]
                  )

              subset = frame[
                  frame[
                      "position_jpro"
                  ].isin(
                      positions
                  )
              ].copy()

              if subset.empty:

                  return pd.DataFrame(
                      columns=[
                          "season",
                          "week",
                          "opponent_jpro",
                          "allowed"
                      ]
                  )

              subset[stat_name] = (
                  pd.to_numeric(
                      subset[
                          stat_name
                      ],
                      errors="coerce"
                  )
                  .fillna(0.0)
              )

              return (
                  subset
                  .groupby(
                      [
                          "season",
                          "week",
                          "opponent_jpro"
                      ],
                      as_index=False
                  )[stat_name]
                  .sum()
                  .rename(
                      columns={
                          stat_name:
                              "allowed"
                      }
                  )
              )

          matchup_tables = {}

          for (
              stat_name,
              positions
          ) in matchup_specs.items():

              if stat_name in stats.columns:

                  matchup_tables[
                      stat_name
                  ] = defensive_game_totals(
                      opponent_rows,
                      stat_name,
                      positions
                  )

          def matchup_label(score):

              if score >= 65:
                  return "FAVORABLE"

              if score <= 35:
                  return "TOUGH"

              return "NEUTRAL"

          def build_matchup(
              defense,
              stat_name
          ):

              table = matchup_tables.get(
                  stat_name
              )

              if (
                  table is None
                  or table.empty
              ):

                  return {
                      "matchup_score":
                          50.0,

                      "matchup_label":
                          "NEUTRAL",

                      "allowed_per_game":
                          0.0,

                      "league_per_game":
                          0.0,

                      "allowed_vs_league_ratio":
                          1.0,

                      "current_season_allowed":
                          0.0,

                      "historical_allowed":
                          0.0,

                      "current_season_games":
                          0,

                      "method":
                          "SHRUNK_DEFENSIVE_PRODUCTION"
                  }

              defense = normalize_team(
                  defense
              )

              current_games = table[
                  (
                      table[
                          "opponent_jpro"
                      ]
                      == defense
                  )
                  &
                  (
                      table["season"]
                      == SEASON
                  )
              ]

              historical_games = table[
                  (
                      table[
                          "opponent_jpro"
                      ]
                      == defense
                  )
                  &
                  (
                      table["season"]
                      < SEASON
                  )
              ]

              league_current = table[
                  table["season"]
                  == SEASON
              ]

              league_history = table[
                  table["season"]
                  < SEASON
              ]

              current_avg = (
                  safe_mean(
                      current_games[
                          "allowed"
                      ]
                  )
                  if len(
                      current_games
                  )
                  else 0.0
              )

              historical_avg = (
                  safe_mean(
                      historical_games[
                          "allowed"
                      ]
                  )
                  if len(
                      historical_games
                  )
                  else 0.0
              )

              league_current_avg = (
                  safe_mean(
                      league_current[
                          "allowed"
                      ]
                  )
                  if len(
                      league_current
                  )
                  else 0.0
              )

              league_history_avg = (
                  safe_mean(
                      league_history[
                          "allowed"
                      ]
                  )
                  if len(
                      league_history
                  )
                  else 0.0
              )

              current_n = len(
                  current_games
              )

              current_weight = min(
                  current_n / 6.0,
                  0.65
              )

              if current_n == 0:
                  current_weight = 0.0

              historical_weight = (
                  1.0
                  - current_weight
              )

              if historical_avg <= 0:

                  historical_avg = (
                      league_history_avg
                      if league_history_avg > 0
                      else league_current_avg
                  )

              if current_avg <= 0:
                  current_avg = (
                      historical_avg
                  )

              blended_allowed = (
                  current_avg
                  * current_weight
                  +
                  historical_avg
                  * historical_weight
              )

              league_reference = (
                  league_current_avg
                  * current_weight
                  +
                  league_history_avg
                  * historical_weight
              )

              if league_reference <= 0:

                  league_reference = (
                      blended_allowed
                      if blended_allowed > 0
                      else 1.0
                  )

              ratio = (
                  blended_allowed
                  / league_reference
              )

              score = (
                  50.0
                  +
                  (
                      ratio - 1.0
                  )
                  * 100.0
              )

              score = float(
                  np.clip(
                      score,
                      0,
                      100
                  )
              )

              return {
                  "matchup_score":
                      round(
                          score,
                          2
                      ),

                  "matchup_label":
                      matchup_label(
                          score
                      ),

                  "allowed_per_game":
                      round(
                          blended_allowed,
                          2
                      ),

                  "league_per_game":
                      round(
                          league_reference,
                          2
                      ),

                  "allowed_vs_league_ratio":
                      round(
                          ratio,
                          4
                      ),

                  "current_season_allowed":
                      round(
                          current_avg,
                          2
                      ),

                  "historical_allowed":
                      round(
                          historical_avg,
                          2
                      ),

                  "current_season_games":
                      int(
