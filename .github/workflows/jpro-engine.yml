name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # GET JPRO
      # ============================================================

      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # MARKET ENGINE V1
      #
      # IMPORTANT:
      # This engine DOES NOT rebuild Role V2.
      #
      # It reads the already-saved:
      #
      # data/jpro-current-projections.json
      #
      # That file already contains:
      # - Week 3 slate
      # - 20,000 simulations
      # - Role Intelligence V2
      # - Matchup Intelligence
      #
      # This step adds:
      # - model probability by line
      # - fair American odds
      # - alternate-line ladder
      # - push probability
      # - market-ready metadata
      # - JPro Picks framework
      #
      # No sportsbook odds are fabricated.
      # ============================================================

      - name: Build JPro Market Engine V1
        run: |
          python <<'PY'
          import json
          import math
          import os

          PATH = "data/jpro-current-projections.json"

          print("=" * 72)
          print("JPRO MARKET ENGINE V1")
          print("=" * 72)

          # ========================================================
          # LOAD EXISTING ROLE V2 ENGINE
          # ========================================================

          if not os.path.exists(PATH):
              raise RuntimeError(
                  "Missing data/jpro-current-projections.json. "
                  "Run the Role V2 engine first."
              )

          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          projections = data.get(
              "projections",
              []
          )

          if not projections:
              raise RuntimeError(
                  "No projections found in JPro data."
              )

          role_version = data.get(
              "role_version"
          )

          if role_version != "OPPORTUNITY_BLEND_V2":
              raise RuntimeError(
                  "Role V2 not detected. "
                  f"Found role_version={role_version}"
              )

          print(
              "Source engine:",
              data.get("engine_version")
          )

          print(
              "Role version:",
              role_version
          )

          print(
              "Slate:",
              data.get("slate")
          )

          print(
              "Games:",
              data.get("games_count")
          )

          print(
              "Player props:",
              len(projections)
          )

          print(
              "Simulations each:",
              data.get("simulations_each")
          )

          # ========================================================
          # HELPERS
          # ========================================================

          def clean_number(
              value,
              default=0.0
          ):
              try:
                  number = float(value)

                  if (
                      math.isnan(number)
                      or
                      math.isinf(number)
                  ):
                      return default

                  return number

              except Exception:
                  return default

          def probability_to_american(
              probability
          ):
              probability = clean_number(
                  probability
              )

              if (
                  probability <= 0
                  or
                  probability >= 1
              ):
                  if probability >= 1:
                      return -100000

                  return 100000

              if probability >= 0.5:

                  odds = (
                      -100
                      * probability
                      / (
                          1
                          - probability
                      )
                  )

              else:

                  odds = (
                      100
                      * (
                          1
                          - probability
                      )
                      / probability
                  )

              return int(
                  round(odds)
              )

          def american_to_probability(
              odds
          ):
              odds = clean_number(
                  odds
              )

              if odds == 0:
                  return 0.0

              if odds < 0:

                  return (
                      abs(odds)
                      /
                      (
                          abs(odds)
                          + 100
                      )
                  )

              return (
                  100
                  /
                  (
                      odds
                      + 100
                  )
              )

          def histogram_total(
              histogram
          ):
              return sum(
                  int(count)
                  for _, count
                  in histogram
              )

          def line_probabilities(
              histogram,
              line
          ):
              total = histogram_total(
                  histogram
              )

              if total <= 0:

                  return {
                      "over_probability": 0.0,
                      "under_probability": 0.0,
                      "push_probability": 0.0
                  }

              over_count = 0
              under_count = 0
              push_count = 0

              line = float(line)

              for (
                  value,
                  count
              ) in histogram:

                  value = float(value)
                  count = int(count)

                  if value > line:
                      over_count += count

                  elif value < line:
                      under_count += count

                  else:
                      push_count += count

              return {
                  "over_probability":
                      over_count / total,

                  "under_probability":
                      under_count / total,

                  "push_probability":
                      push_count / total
              }

          def market_edge(
              model_probability,
              american_odds
          ):
              implied = (
                  american_to_probability(
                      american_odds
                  )
              )

              edge = (
                  model_probability
                  - implied
              )

              return {
                  "model_probability":
                      round(
                          model_probability,
                          4
                      ),

                  "sportsbook_implied_probability":
                      round(
                          implied,
                          4
                      ),

                  "probability_difference":
                      round(
                          edge,
                          4
                      ),

                  "probability_difference_pct":
                      round(
                          edge * 100,
                          2
                      )
              }

          # ========================================================
          # LINE GENERATION
          #
          # These are MODEL EVALUATION LINES.
          #
          # They are NOT being claimed as current sportsbook lines.
          #
          # The purpose is to prepare the app so that when a real
          # sportsbook line is entered, the exact same 20K
          # distribution can immediately evaluate it.
          # ========================================================

          PROP_SETTINGS = {

              "passing_yards": {
                  "step": 25,
                  "minimum": 100,
                  "maximum": 400
              },

              "rushing_yards": {
                  "step": 10,
                  "minimum": 10,
                  "maximum": 150
              },

              "receiving_yards": {
                  "step": 10,
                  "minimum": 10,
                  "maximum": 150
              },

              "receptions": {
                  "step": 1,
                  "minimum": 1,
                  "maximum": 12
              }
          }

          def build_candidate_lines(
              prop_name,
              median
          ):
              settings = PROP_SETTINGS.get(
                  prop_name
              )

              if not settings:
                  return []

              step = settings["step"]
              minimum = settings["minimum"]
              maximum = settings["maximum"]

              median = clean_number(
                  median
              )

              center = (
                  round(
                      median / step
                  )
                  * step
              )

              raw_lines = [
                  center - (3 * step),
                  center - (2 * step),
                  center - step,
                  center,
                  center + step,
                  center + (2 * step),
                  center + (3 * step)
              ]

              lines = []

              for line in raw_lines:

                  line = max(
                      minimum,
                      min(
                          maximum,
                          line
                      )
                  )

                  if (
                      prop_name
                      == "receptions"
                  ):
                      line = float(
                          round(line)
                      )

                  else:
                      line = float(line)

                  if line not in lines:
                      lines.append(line)

              return sorted(lines)

          # ========================================================
          # MARKET CONFIDENCE
          #
          # This is NOT a guarantee.
          #
          # It describes how strongly the simulation distribution
          # leans to one side of an entered/evaluated line.
          # ========================================================

          def probability_band(
              probability
          ):
              probability = clean_number(
                  probability
              )

              if probability >= 0.75:
                  return "VERY_HIGH_MODEL_PROBABILITY"

              if probability >= 0.65:
                  return "HIGH_MODEL_PROBABILITY"

              if probability >= 0.57:
                  return "MODERATE_MODEL_PROBABILITY"

              if probability >= 0.52:
                  return "SLIGHT_MODEL_LEAN"

              return "NO_MODEL_LEAN"

          # ========================================================
          # BUILD MARKET DATA
          # ========================================================

          market_ready_count = 0
          line_count = 0

          for prop in projections:

              histogram = prop.get(
                  "simulation_histogram",
                  []
              )

              simulation_count = int(
                  prop.get(
                      "simulation_count",
                      0
                  )
              )

              actual_count = (
                  histogram_total(
                      histogram
                  )
              )

              if actual_count <= 0:
                  prop["market"] = {
                      "status":
                          "NO_SIMULATION_DATA"
                  }

                  continue

              if (
                  simulation_count
                  and
                  actual_count
                  != simulation_count
              ):
                  raise RuntimeError(
                      "Simulation histogram count "
                      f"mismatch for "
                      f"{prop.get('player')} "
                      f"{prop.get('prop')}: "
                      f"{actual_count} vs "
                      f"{simulation_count}"
                  )

              prop_name = prop.get(
                  "prop"
              )

              median = clean_number(
                  prop.get(
                      "median"
                  )
              )

              candidate_lines = (
                  build_candidate_lines(
                      prop_name,
                      median
                  )
              )

              line_ladder = []

              for line in candidate_lines:

                  probabilities = (
                      line_probabilities(
                          histogram,
                          line
                      )
                  )

                  over_probability = (
                      probabilities[
                          "over_probability"
                      ]
                  )

                  under_probability = (
                      probabilities[
                          "under_probability"
                      ]
                  )

                  push_probability = (
                      probabilities[
                          "push_probability"
                      ]
                  )

                  over_fair_odds = (
                      probability_to_american(
                          over_probability
                      )
                  )

                  under_fair_odds = (
                      probability_to_american(
                          under_probability
                      )
                  )

                  if (
                      over_probability
                      >
                      under_probability
                  ):

                      model_lean = "OVER"

                      strongest_probability = (
                          over_probability
                      )

                  elif (
                      under_probability
                      >
                      over_probability
                  ):

                      model_lean = "UNDER"

                      strongest_probability = (
                          under_probability
                      )

                  else:

                      model_lean = "NONE"

                      strongest_probability = (
                          over_probability
                      )

                  line_ladder.append({

                      "line":
                          line,

                      "over_probability":
                          round(
                              over_probability,
                              4
                          ),

                      "under_probability":
                          round(
                              under_probability,
                              4
                          ),

                      "push_probability":
                          round(
                              push_probability,
                              4
                          ),

                      "over_probability_pct":
                          round(
                              over_probability
                              * 100,
                              1
                          ),

                      "under_probability_pct":
                          round(
                              under_probability
                              * 100,
                              1
                          ),

                      "push_probability_pct":
                          round(
                              push_probability
                              * 100,
                              1
                          ),

                      "over_fair_american_odds":
                          over_fair_odds,

                      "under_fair_american_odds":
                          under_fair_odds,

                      "model_lean":
                          model_lean,

                      "model_probability_band":
                          probability_band(
                              strongest_probability
                          )
                  })

                  line_count += 1

              # ====================================================
              # REFERENCE LINE
              #
              # Closest generated line to simulation median.
              # This is only a model reference point.
              # ====================================================

              reference = None

              if line_ladder:

                  reference = min(
                      line_ladder,
                      key=lambda item:
                          abs(
                              clean_number(
                                  item["line"]
                              )
                              - median
                          )
                  )

              role = prop.get(
                  "role",
                  {}
              )

              matchup = prop.get(
                  "matchup",
                  {}
              )

              prop["market"] = {

                  "status":
                      "MARKET_READY",

                  "method":
                      "EMPIRICAL_20K_DISTRIBUTION_V1",

                  "sportsbook_line":
                      None,

                  "sportsbook_over_odds":
                      None,

                  "sportsbook_under_odds":
                      None,

                  "sportsbook":
                      None,

                  "has_real_market":
                      False,

                  "model_reference_line":
                      (
                          reference.get(
                              "line"
                          )
                          if reference
                          else None
                      ),

                  "model_reference_lean":
                      (
                          reference.get(
                              "model_lean"
                          )
                          if reference
                          else "NONE"
                      ),

                  "model_reference_probability":
                      (
                          max(
                              clean_number(
                                  reference.get(
                                      "over_probability"
                                  )
                              ),
                              clean_number(
                                  reference.get(
                                      "under_probability"
                                  )
                              )
                          )
                          if reference
                          else 0.0
                      ),

                  "line_ladder":
                      line_ladder,

                  "role_score":
                      clean_number(
                          role.get(
                              "role_score"
                          )
                      ),

                  "role_label":
                      role.get(
                          "role_label",
                          "UNKNOWN"
                      ),

                  "matchup_score":
                      clean_number(
                          matchup.get(
                              "matchup_score"
                          ),
                          50.0
                      ),

                  "matchup_label":
                      matchup.get(
                          "matchup_label",
                          "NEUTRAL"
                      ),

                  "jpro_pick":
                      False,

                  "jpro_pick_reason":
                      (
                          "Waiting for a real "
                          "sportsbook line and price."
                      )
              }

              market_ready_count += 1

          # ========================================================
          # JPRO PICKS
          #
          # EMPTY BY DESIGN.
          #
          # We do not promote a bet without:
          # 1. Real sportsbook line
          # 2. Real sportsbook price
          # 3. Model probability
          # 4. Implied probability comparison
          # ========================================================

          jpro_picks = []

          # ========================================================
          # OUTPUT METADATA
          # ========================================================

          data[
              "engine_version"
          ] = (
              "JPRO_MARKET_ENGINE_V1"
          )

          data[
              "market_engine"
          ] = True

          data[
              "market_version"
          ] = (
              "EMPIRICAL_20K_MARKET_V1"
          )

          data[
              "market_ready_props"
          ] = market_ready_count

          data[
              "market_lines_evaluated"
          ] = line_count

          data[
              "real_sportsbook_feed"
          ] = False

          data[
              "market_input_mode"
          ] = (
              "MANUAL_LINE_AND_PRICE"
          )

          data[
              "jpro_picks_enabled"
          ] = True

          data[
              "jpro_picks"
          ] = jpro_picks

          data[
              "jpro_picks_count"
          ] = len(
              jpro_picks
          )

          data[
              "jpro_pick_requirements"
          ] = {
              "requires_real_line":
                  True,

              "requires_real_price":
                  True,

              "probability_source":
                  "20K_EMPIRICAL_SIMULATION",

              "edge_definition":
                  (
                      "model probability minus "
                      "sportsbook implied probability"
                  )
          }

          # ========================================================
          # SAVE
          # ========================================================

          with open(
              PATH,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  data,
                  file,
                  separators=(",", ":")
              )

          print("")
          print("=" * 72)
          print("JPRO MARKET ENGINE BUILD COMPLETE")
          print("=" * 72)

          print(
              "Engine:",
              data.get(
                  "engine_version"
              )
          )

          print(
              "Role version:",
              data.get(
                  "role_version"
              )
          )

          print(
              "Market version:",
              data.get(
                  "market_version"
              )
          )

          print(
              "Market-ready props:",
              market_ready_count
          )

          print(
              "Lines evaluated:",
              line_count
          )

          print(
              "JPro Picks:",
              len(
                  jpro_picks
              )
          )

          print("")
          print(
              "NOTE: JPro Picks are empty "
              "until a real sportsbook "
              "line + price is supplied."
          )

          PY

      # ============================================================
      # VERIFY MARKET ENGINE V1
      # ============================================================

      - name: Verify JPro Market Engine V1
        run: |
          python <<'PY'
          import json

          PATH = (
              "data/"
              "jpro-current-projections.json"
          )

          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(
                  file
              )

          print("=" * 72)
          print("JPRO MARKET ENGINE V1 VERIFY")
          print("=" * 72)

          projections = data.get(
              "projections",
              []
          )

          if (
              data.get(
                  "engine_version"
              )
              !=
              "JPRO_MARKET_ENGINE_V1"
          ):
              raise RuntimeError(
                  "Market Engine V1 "
                  "not detected."
              )

          if (
              data.get(
                  "role_version"
              )
              !=
              "OPPORTUNITY_BLEND_V2"
          ):
              raise RuntimeError(
                  "Role V2 was not preserved."
              )

          if not projections:
              raise RuntimeError(
                  "No projections found."
              )

          print(
              "Engine:",
              data.get(
                  "engine_version"
              )
          )

          print(
              "Role version:",
              data.get(
                  "role_version"
              )
          )

          print(
              "Market version:",
              data.get(
                  "market_version"
              )
          )

          print(
              "Slate:",
              data.get(
                  "slate"
              )
          )

          print(
              "Games:",
              data.get(
                  "games_count"
              )
          )

          print(
              "Player props:",
              len(
                  projections
              )
          )

          print(
              "Market-ready props:",
              data.get(
                  "market_ready_props"
              )
          )

          print(
              "Lines evaluated:",
              data.get(
                  "market_lines_evaluated"
              )
          )

          print(
              "JPro Picks:",
              data.get(
                  "jpro_picks_count"
              )
          )

          # ========================================================
          # AUDITS
          # ========================================================

          market_ready = 0
          role_v2 = 0
          matchup_ready = 0
          bad_probability_rows = []
          bad_histograms = []

          for prop in projections:

              histogram = prop.get(
                  "simulation_histogram",
                  []
              )

              total = sum(
                  int(count)
                  for _, count
                  in histogram
              )

              expected = int(
                  prop.get(
                      "simulation_count",
                      0
                  )
              )

              if (
                  expected
                  and
                  total != expected
              ):

                  bad_histograms.append(
                      (
                          prop.get(
                              "player"
                          ),
                          prop.get(
                              "prop"
                          ),
                          total,
                          expected
                      )
                  )

              role = prop.get(
                  "role",
                  {}
              )

              if (
                  role.get(
                      "role_method"
                  )
                  ==
                  "OPPORTUNITY_BLEND_V2"
              ):
                  role_v2 += 1

              if prop.get(
                  "matchup"
              ):
                  matchup_ready += 1

              market = prop.get(
                  "market",
                  {}
              )

              if (
                  market.get(
                      "status"
                  )
                  ==
                  "MARKET_READY"
              ):

                  market_ready += 1

              for row in market.get(
                  "line_ladder",
                  []
              ):

                  over = float(
                      row.get(
                          "over_probability",
                          0
                      )
                  )

                  under = float(
                      row.get(
                          "under_probability",
                          0
                      )
                  )

                  push = float(
                      row.get(
                          "push_probability",
                          0
                      )
                  )

                  if (
                      over < 0
                      or over > 1
                      or under < 0
                      or under > 1
                      or push < 0
                      or push > 1
                  ):

                      bad_probability_rows.append(
                          (
                              prop.get(
                                  "player"
                              ),
                              prop.get(
                                  "prop"
                              ),
                              row.get(
                                  "line"
                              )
                          )
                      )

                  total_probability = (
                      over
                      +
                      under
                      +
                      push
                  )

                  if (
                      abs(
                          total_probability
                          - 1.0
                      )
                      > 0.001
                  ):

                      bad_probability_rows.append(
                          (
                              prop.get(
                                  "player"
                              ),
                              prop.get(
                                  "prop"
                              ),
                              row.get(
                                  "line"
                              )
                          )
                      )

          if bad_histograms:

              raise RuntimeError(
                  "Histogram verification "
                  f"failed: "
                  f"{bad_histograms[:5]}"
              )

          if bad_probability_rows:

              raise RuntimeError(
                  "Probability verification "
                  f"failed: "
                  f"{bad_probability_rows[:5]}"
              )

          if (
              market_ready
              != len(
                  projections
              )
          ):

              raise RuntimeError(
                  "Not every projection "
                  "is market-ready."
              )

          if (
              role_v2
              != len(
                  projections
              )
          ):

              raise RuntimeError(
                  "Role V2 missing from "
                  "one or more props."
              )

          print("")
          print(
              "20K histograms verified:",
              len(
                  projections
              )
          )

          print(
              "Role V2 verified:",
              role_v2
          )

          print(
              "Matchup data verified:",
              matchup_ready
          )

          print(
              "Market-ready verified:",
              market_ready
          )

          # ========================================================
          # MARKET PREVIEW
          # ========================================================

          print("")
          print("=" * 72)
          print("MARKET ENGINE PREVIEW")
          print("=" * 72)

          preview_count = 0

          for prop in projections:

              if preview_count >= 12:
                  break

              market = prop.get(
                  "market",
                  {}
              )

              ladder = market.get(
                  "line_ladder",
                  []
              )

              if not ladder:
                  continue

              print("")
              print(
                  prop.get(
                      "player"
                  ),
                  "|",
                  prop.get(
                      "team"
                  ),
                  "vs",
                  prop.get(
                      "opponent"
                  )
              )

              print(
                  "  PROP:",
                  prop.get(
                      "prop"
                  )
              )

              print(
                  "  PROJECTION:",
                  prop.get(
                      "projection"
                  )
              )

              print(
                  "  MEDIAN:",
                  prop.get(
                      "median"
                  )
              )

              print(
                  "  ROLE:",
                  prop.get(
                      "role",
                      {}
                  ).get(
                      "role_label"
                  ),
                  prop.get(
                      "role",
                      {}
                  ).get(
                      "role_score"
                  )
              )

              print(
                  "  MATCHUP:",
                  prop.get(
                      "matchup",
                      {}
                  ).get(
                      "matchup_label"
                  ),
                  prop.get(
                      "matchup",
                      {}
                  ).get(
                      "matchup_score"
                  )
              )

              print(
                  "  REFERENCE LINE:",
                  market.get(
                      "model_reference_line"
                  )
              )

              print(
                  "  REFERENCE LEAN:",
                  market.get(
                      "model_reference_lean"
                  )
              )

              print(
                  "  ALT LINE LADDER:"
              )

              for row in ladder:

                  print(
                      "   ",
                      row.get(
                          "line"
                      ),
                      "| OVER",
                      row.get(
                          "over_probability_pct"
                      ),
                      "%",
                      "| UNDER",
                      row.get(
                          "under_probability_pct"
                      ),
                      "%",
                      "| FAIR O",
                      row.get(
                          "over_fair_american_odds"
                      ),
                      "| FAIR U",
                      row.get(
                          "under_fair_american_odds"
                      )
                  )

