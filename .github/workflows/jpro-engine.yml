                  )

                  continue

              X = (
                  model_rows[
                      target_features
                  ]
                  .replace(
                      [
                          np.inf,
                          -np.inf
                      ],
                      np.nan
                  )
                  .fillna(0.0)
              )

              y = pd.to_numeric(
                  model_rows[target],
                  errors="coerce"
              ).fillna(0.0)

              split = int(
                  len(model_rows)
                  * 0.80
              )

              split = max(
                  1,
                  min(
                      split,
                      len(model_rows) - 1
                  )
              )

              train_X = X.iloc[
                  :split
              ]

              train_y = y.iloc[
                  :split
              ]

              valid_X = X.iloc[
                  split:
              ]

              valid_y = y.iloc[
                  split:
              ]

              validation_model = Pipeline([
                  (
                      "scale",
                      StandardScaler()
                  ),
                  (
                      "ridge",
                      Ridge(
                          alpha=10.0
                      )
                  )
              ])

              validation_model.fit(
                  train_X,
                  train_y
              )

              if len(valid_X):

                  valid_predictions = (
                      validation_model
                      .predict(
                          valid_X
                      )
                  )

                  residuals = (
                      valid_y.to_numpy()
                      -
                      valid_predictions
                  )

              else:

                  residuals = (
                      train_y.to_numpy()
                      -
                      validation_model
                      .predict(
                          train_X
                      )
                  )

              residuals = np.asarray(
                  residuals,
                  dtype=float
              )

              residuals = residuals[
                  np.isfinite(
                      residuals
                  )
              ]

              if len(residuals) < 20:

                  residuals = np.array(
                      [0.0]
                  )

              final_model = Pipeline([
                  (
                      "scale",
                      StandardScaler()
                  ),
                  (
                      "ridge",
                      Ridge(
                          alpha=10.0
                      )
                  )
              ])

              final_model.fit(
                  X,
                  y
              )

              current_rows = (
                  latest_current[
                      latest_current[
                          "position_jpro"
                      ].isin(
                          spec[
                              "positions"
                          ]
                      )
                  ]
                  .copy()
              )

              for _, row in (
                  current_rows.iterrows()
              ):

                  team = normalize_team(
                      row[
                          "team_jpro"
                      ]
                  )

                  game_info = (
                      team_to_game.get(
                          team
                      )
                  )

                  if not game_info:
                      continue

                  feature_values = (
                      pd.DataFrame([
                          {
                              feature:
                                  clean_number(
                                      row.get(
                                          feature,
                                          0.0
                                      )
                                  )
                              for feature
                              in target_features
                          }
                      ])
                  )

                  projection = float(
                      final_model
                      .predict(
                          feature_values
                      )[0]
                  )

                  projection = max(
                      projection,
                      0.0
                  )

                  if (
                      projection
                      <
                      spec[
                          "min_projection"
                      ]
                  ):
                      continue

                  sampled_residuals = (
                      RNG.choice(
                          residuals,
                          size=SIMS,
                          replace=True
                      )
                  )

                  simulations = (
                      projection
                      +
                      sampled_residuals
                  )

                  simulations = np.clip(
                      simulations,
                      0,
                      None
                  )

                  simulations = np.rint(
                      simulations
                  ).astype(int)

                  histogram = (
                      compress_histogram(
                          simulations
                      )
                  )

                  histogram_total = sum(
                      count
                      for _, count
                      in histogram
                  )

                  if (
                      histogram_total
                      != SIMS
                  ):

                      raise RuntimeError(
                          "Histogram "
                          "simulation-count "
                          "audit failed."
                      )

                  player_id = str(
                      row[
                          "player_id_jpro"
                      ]
                  )

                  opponent = (
                      game_info[
                          "opponent"
                      ]
                  )

                  role = build_role(
                      player_id
                  )

                  matchup = build_matchup(
                      opponent,
                      target
                  )

                  projections.append({
                      "game":
                          game_info[
                              "game"
                          ],

                      "team":
                          team,

                      "opponent":
                          opponent,

