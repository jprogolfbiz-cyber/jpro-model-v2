name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy pyarrow

      - name: Build current JPro game layer
        run: |
          mkdir -p data

          python <<'PY'
          import json
          import pandas as pd
          import nflreadpy as nfl
          from datetime import datetime, timezone

          print("=" * 60)
          print("JPRO CURRENT GAME LAYER")
          print("=" * 60)

          # -------------------------------------------------------
          # 1. LOAD CURRENT 2026 NFL SCHEDULE
          # -------------------------------------------------------
          schedule = nfl.load_schedules([2026])

          if hasattr(schedule, "to_pandas"):
              schedule = schedule.to_pandas()

          schedule = pd.DataFrame(schedule)

          print("2026 SCHEDULE ROWS:", len(schedule))
          print("SCHEDULE COLUMNS:", len(schedule.columns))

          # -------------------------------------------------------
          # 2. LOCATE SEPTEMBER 21, 2026 GAMES
          # -------------------------------------------------------
          date_col = None

          for candidate in [
              "gameday",
              "game_date",
              "date"
          ]:
              if candidate in schedule.columns:
                  date_col = candidate
                  break

          if date_col is None:
              raise RuntimeError(
                  "Could not locate schedule date column."
              )

          schedule["_jpro_date"] = pd.to_datetime(
              schedule[date_col],
              errors="coerce"
          ).dt.date

          target_date = pd.Timestamp(
              "2026-09-21"
          ).date()

          tonight = schedule[
              schedule["_jpro_date"] == target_date
          ].copy()

          print(
              "GAMES FOUND FOR 2026-09-21:",
              len(tonight)
          )

          if tonight.empty:
              raise RuntimeError(
                  "No NFL games found for 2026-09-21. "
                  "JPro will not invent a matchup."
              )

          # -------------------------------------------------------
          # 3. NORMALIZE GAME FIELDS
          # -------------------------------------------------------
          away_col = next(
              (
                  c for c in [
                      "away_team",
                      "away"
                  ]
                  if c in tonight.columns
              ),
              None
          )

          home_col = next(
              (
                  c for c in [
                      "home_team",
                      "home"
                  ]
                  if c in tonight.columns
              ),
              None
          )

          if away_col is None or home_col is None:
              raise RuntimeError(
                  "Could not identify home/away team columns."
              )

          games = []

          for _, row in tonight.iterrows():

              game = {
                  "game_id": str(
                      row.get(
                          "game_id",
                          ""
                      )
                  ),
                  "date": str(
                      target_date
                  ),
                  "away_team": str(
                      row[away_col]
                  ),
                  "home_team": str(
                      row[home_col]
                  )
              }

              for field in [
                  "gametime",
                  "weekday",
                  "location",
                  "roof",
                  "surface",
                  "temp",
                  "wind",
                  "spread_line",
                  "total_line"
              ]:
                  if field in tonight.columns:
                      value = row.get(field)

                      if pd.isna(value):
                          value = None

                      elif hasattr(
                          value,
                          "item"
                      ):
                          value = value.item()

                      game[field] = value

              games.append(game)

              print(
                  "FOUND GAME:",
                  game["away_team"],
                  "@",
                  game["home_team"]
              )

          # -------------------------------------------------------
          # 4. LOAD REAL NFL PLAYER STATS
          # -------------------------------------------------------
          stats = nfl.load_player_stats(
              [2024, 2025, 2026]
          )

          if hasattr(stats, "to_pandas"):
              stats = stats.to_pandas()

          stats = pd.DataFrame(stats)

          if (
              "recent_team" not in stats.columns
              and "team" in stats.columns
          ):
              stats["recent_team"] = stats["team"]

          required = [
              "player_id",
              "player_display_name",
              "position",
              "season",
              "week",
              "recent_team"
          ]

          missing = [
              c for c in required
              if c not in stats.columns
          ]

          if missing:
              raise RuntimeError(
                  f"Missing player fields: {missing}"
              )

          stats["season"] = pd.to_numeric(
              stats["season"],
              errors="coerce"
          )

          stats["week"] = pd.to_numeric(
              stats["week"],
              errors="coerce"
          )

          stats = stats.dropna(
              subset=[
                  "player_id",
                  "season",
                  "week"
              ]
          )

          # Most recent known row for each player.
          latest = (
              stats
              .sort_values(
                  ["season", "week"]
              )
              .groupby(
                  "player_id",
                  as_index=False
              )
              .tail(1)
              .copy()
          )

          tonight_teams = set()

          for game in games:
              tonight_teams.add(
                  game["away_team"]
              )
              tonight_teams.add(
                  game["home_team"]
              )

          current_players = latest[
              latest["recent_team"].isin(
                  tonight_teams
              )
          ].copy()

          skill_positions = [
              "QB",
              "RB",
              "WR",
              "TE"
          ]

          current_players = current_players[
              current_players["position"].isin(
                  skill_positions
              )
          ].copy()

          print(
              "CURRENT SKILL PLAYERS FOUND:",
              len(current_players)
          )

          # -------------------------------------------------------
          # 5. BUILD CURRENT PLAYER OBJECTS
          # -------------------------------------------------------
          players = []

          for _, row in current_players.iterrows():

              players.append({
                  "player_id": str(
                      row["player_id"]
                  ),
                  "player": str(
                      row["player_display_name"]
                  ),
                  "position": str(
                      row["position"]
                  ),
                  "team": str(
                      row["recent_team"]
                  ),
                  "latest_data_season": int(
                      row["season"]
                  ),
                  "latest_data_week": int(
                      row["week"]
                  )
              })

          players = sorted(
              players,
              key=lambda x: (
                  x["team"],
                  x["position"],
                  x["player"]
              )
          )

          # -------------------------------------------------------
          # 6. PROVENANCE + GATES
          # -------------------------------------------------------
          latest_season = (
              max(
                  [
                      p["latest_data_season"]
                      for p in players
                  ]
              )
              if players
              else None
          )

          current_data_available = (
              latest_season == 2026
          )

          output = {
              "status": (
                  "READY"
                  if current_data_available
                  else "HOLD"
              ),
              "generated_at_utc": (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              ),
              "target_date": "2026-09-21",
              "source": "nflverse via nflreadpy",
              "games": games,
              "teams": sorted(
                  list(tonight_teams)
              ),
              "players": players,
              "gates": {
                  "schedule_found": (
                      len(games) > 0
                  ),
                  "players_found": (
                      len(players) > 0
                  ),
                  "current_2026_player_data": (
                      current_data_available
                  ),
                  "sportsbook_lines_connected": False,
                  "predictions_unlocked": False
              }
          }

          with open(
              "data/jpro-current-game.json",
              "w"
          ) as f:
              json.dump(
                  output,
                  f,
                  indent=2,
                  default=str
              )

          print("=" * 60)
          print("JPRO CURRENT GAME LAYER COMPLETE")
          print("GAMES:", len(games))
          print("TEAMS:", ", ".join(sorted(tonight_teams)))
          print("SKILL PLAYERS:", len(players))
          print(
              "LATEST PLAYER DATA SEASON:",
              latest_season
          )
          print(
              "CURRENT 2026 PLAYER DATA:",
              current_data_available
          )
          print(
              "PREDICTIONS:",
              "LOCKED — CURRENT GAME LAYER ONLY"
          )
          print("=" * 60)
          PY

      - name: Show current game
        run: |
          cat data/jpro-current-game.json

      - name: Save current JPro game
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: current game layer"
          file_pattern: data/jpro-current-game.json
