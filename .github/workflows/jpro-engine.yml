name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NFL data tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow

      - name: Pull real NFL player data
        run: |
          mkdir -p data

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import nflreadpy as nfl

          print("JPRO REAL NFL DATA PULL STARTING")

          seasons = [2023, 2024, 2025]
          weekly = nfl.load_player_stats(seasons)

          rows = weekly.height
          columns = weekly.columns

          print(f"REAL NFL ROWS DOWNLOADED: {rows}")
          print(f"COLUMNS FOUND: {len(columns)}")

          if rows <= 0:
              raise RuntimeError("JPro received zero NFL rows")

          status = {
              "engine": "JPro Cloud Engine",
              "status": "REAL_DATA_CONNECTED",
              "source": "nflverse via nflreadpy",
              "seasons_requested": seasons,
              "rows_downloaded": rows,
              "columns_found": len(columns),
              "sample_columns": columns[:25],
              "model_outputs": "LOCKED",
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          with open("data/engine-status.json", "w") as f:
              json.dump(status, f, indent=2)

          print("JPRO REAL NFL DATA CONNECTION VERIFIED")
          PY

      - name: Show downloaded data status
        run: cat data/engine-status.json

      - name: Save JPro data status
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: connect real NFL data"
          file_pattern: data/engine-status.json
