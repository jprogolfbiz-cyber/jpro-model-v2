name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow scikit-learn numpy joblib

      - name: Train JPro models
        run: |
          mkdir -p data models

          python - <<'PY'
          import json
          import joblib
          import numpy as np
          import nflreadpy as nfl
          import polars as pl

          from datetime import datetime, timezone
          from sklearn.linear_model import Ridge
          from sklearn.metrics import mean_absolute_error, mean_squared_error

          print("JPRO MODEL TRAINING STARTING")

          seasons = [2023, 2024, 2025]
          df = nfl.load_player_stats(seasons)

          required = [
              "player_id",
              "player_display_name",
              "position",
              "season",
              "week",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions",
              "targets",
              "carries",
              "rushing_tds",
              "receiving_tds"
          ]

          missing = [c for c in required if c not in df.columns]

          if missing:
              raise RuntimeError(
                  "Missing required columns: " + ", ".join(missing)
              )

          df = df.sort(["player_id", "season", "week"])

          stat_cols = [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions",
              "targets",
              "carries",
              "rushing_tds",
              "receiving_tds"
          ]

          feature_names = []

          for col in stat_cols:
              lag1 = f"{col}_lag1"
              avg3 = f"{col}_avg3"
              avg5 = f"{col}_avg5"

              df = df.with_columns(
                  pl.col(col)
                  .shift(1)
                  .over("player_id")
                  .alias(lag1),

                  pl.col(col)
                  .shift(1)
                  .rolling_mean(window_size=3)
                  .over("player_id")
                  .alias(avg3),

                  pl.col(col)
                  .shift(1)
                  .rolling_mean(window_size=5)
                  .over("player_id")
                  .alias(avg5)
              )

              feature_names.extend([
                  lag1,
                  avg3,
                  avg5
              ])

          usable = df.drop_nulls(feature_names)

          print(f"TRAINING TABLE ROWS: {usable.height}")
          print(f"FEATURE COUNT: {len(feature_names)}")

          # Chronological holdout:
          # Train = 2023 + 2024
          # Test = unseen 2025 season

          train = usable.filter(
              pl.col("season") < 2025
          )

          test = usable.filter(
              pl.col("season") == 2025
          )

          print(f"TRAIN ROWS: {train.height}")
          print(f"UNSEEN TEST ROWS: {test.height}")

          if train.height == 0 or test.height == 0:
              raise RuntimeError(
                  "Chronological train/test split failed."
              )

          targets = {
              "passing_yards": ["QB"],
              "rushing_yards": ["QB", "RB"],
              "receiving_yards": ["WR", "TE", "RB"],
              "receptions": ["WR", "TE", "RB"]
          }

          results = {}

          for target, positions in targets.items():

              train_target = train.filter(
                  pl.col("position").is_in(positions)
              )

              test_target = test.filter(
                  pl.col("position").is_in(positions)
              )

              print("")
              print(f"PREPARING MODEL: {target}")
              print(
                  f"POSITION FILTER: {', '.join(positions)}"
              )
              print(
                  f"TARGET TRAIN ROWS: {train_target.height}"
              )
              print(
                  f"TARGET TEST ROWS: {test_target.height}"
              )

              if (
                  train_target.height < 100
                  or test_target.height < 50
              ):
                  print(
                      f"SKIPPING {target}: insufficient rows"
                  )
                  continue

              Xtr = train_target.select(
                  feature_names
              ).to_numpy()

              Xte = test_target.select(
                  feature_names
              ).to_numpy()

              ytr = train_target.select(
                  target
              ).to_numpy().ravel()

              yte = test_target.select(
                  target
              ).to_numpy().ravel()

              Xtr = np.asarray(
                  Xtr,
                  dtype=np.float64
              )

              Xte = np.asarray(
                  Xte,
                  dtype=np.float64
              )

              ytr = np.asarray(
                  ytr,
                  dtype=np.float64
              )

              yte = np.asarray(
                  yte,
                  dtype=np.float64
              )

              model = Ridge(alpha=10.0)

              model.fit(
                  Xtr,
                  ytr
              )

              pred = model.predict(Xte)

              mae = float(
                  mean_absolute_error(
                      yte,
                      pred
                  )
              )

              rmse = float(
                  np.sqrt(
                      mean_squared_error(
                          yte,
                          pred
                      )
                  )
              )

              # Simple historical-mean baseline.
              baseline_prediction = np.full(
                  len(yte),
                  np.mean(ytr),
                  dtype=np.float64
              )

              baseline_mae = float(
                  mean_absolute_error(
                      yte,
                      baseline_prediction
                  )
              )

              improvement = float(
                  (
                      baseline_mae - mae
                  )
                  / baseline_mae
                  * 100
              )

              model_path = (
                  f"models/{target}.joblib"
              )

              joblib.dump(
                  {
                      "model": model,
                      "features": feature_names,
                      "target": target,
                      "positions": positions
                  },
                  model_path
              )

              results[target] = {
                  "train_rows": int(
                      train_target.height
                  ),
                  "test_rows": int(
                      test_target.height
                  ),
                  "mae": round(mae, 3),
                  "rmse": round(rmse, 3),
                  "baseline_mae": round(
                      baseline_mae,
                      3
                  ),
                  "baseline_improvement_pct":
                      round(improvement, 2)
              }

              print("")
              print(f"MODEL: {target}")
              print(
                  f"TRAIN ROWS: "
                  f"{train_target.height}"
              )
              print(
                  f"UNSEEN TEST ROWS: "
                  f"{test_target.height}"
              )
              print(
                  f"MAE: {mae:.3f}"
              )
              print(
                  f"RMSE: {rmse:.3f}"
              )
              print(
                  f"BASELINE MAE: "
                  f"{baseline_mae:.3f}"
              )
              print(
                  "IMPROVEMENT VS BASELINE: "
                  f"{improvement:.2f}%"
              )

          if not results:
              raise RuntimeError(
                  "No JPro models were trained."
              )

          report = {
              "engine": "JPro Cloud Engine",
              "status":
                  "MODELS_TRAINED_VALIDATION_PENDING",
              "source":
                  "nflverse via nflreadpy",
              "training_seasons": [
                  2023,
                  2024
              ],
              "unseen_test_season": 2025,
              "training_table_rows":
                  int(usable.height),
              "feature_count":
                  len(feature_names),
              "models":
                  results,
              "predictions_unlocked":
                  False,
              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }

          with open(
              "data/model-training-report.json",
              "w"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2
              )

          print("")
          print("==============================")
          print("JPRO MODEL TRAINING COMPLETE")
          print("==============================")

          for target, metrics in results.items():
              print(
                  target.upper(),
                  "| MAE:",
                  metrics["mae"],
                  "| BASELINE:",
                  metrics["baseline_mae"],
                  "| IMPROVEMENT:",
                  str(
                      metrics[
                          "baseline_improvement_pct"
                      ]
                  ) + "%"
              )

          print("")
          print(
              "PREDICTIONS REMAIN LOCKED "
              "UNTIL VALIDATION"
          )
          PY

      - name: Show JPro model results
        run: cat data/model-training-report.json

      - name: Save JPro model results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: train first real models"
          file_pattern: data/model-training-report.json
