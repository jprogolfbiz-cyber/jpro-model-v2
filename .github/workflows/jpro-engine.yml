name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pyarrow scikit-learn numpy

      - name: Validate JPro models
        run: |
          mkdir -p data

          python - <<'PY'
          import json
          import numpy as np
          import nflreadpy as nfl
          import polars as pl

          from datetime import datetime, timezone
          from sklearn.linear_model import Ridge
          from sklearn.metrics import mean_absolute_error, mean_squared_error

          print("JPRO CHRONOLOGICAL VALIDATION STARTING")

          seasons = [2023, 2024, 2025]
          df = nfl.load_player_stats(seasons)

          required = [
              "player_id",
              "position",
              "season",
              "week",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions",
              "targets",
              "carries",
              "rushing_tds",
              "receiving_tds"
          ]

          missing = [c for c in required if c not in df.columns]

          if missing:
              raise RuntimeError(
                  "Missing required columns: " + ", ".join(missing)
              )

          df = df.sort(["player_id", "season", "week"])

          stat_cols = [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions",
              "targets",
              "carries",
              "rushing_tds",
              "receiving_tds"
          ]

          feature_names = []

          for col in stat_cols:
              lag1 = f"{col}_lag1"
              avg3 = f"{col}_avg3"
              avg5 = f"{col}_avg5"

              df = df.with_columns(
                  pl.col(col)
                  .shift(1)
                  .over("player_id")
                  .alias(lag1),

                  pl.col(col)
                  .shift(1)
                  .rolling_mean(window_size=3)
                  .over("player_id")
                  .alias(avg3),

                  pl.col(col)
                  .shift(1)
                  .rolling_mean(window_size=5)
                  .over("player_id")
                  .alias(avg5)
              )

              feature_names.extend([
                  lag1,
                  avg3,
                  avg5
              ])

          usable = df.drop_nulls(feature_names)

          print(f"USABLE ROWS: {usable.height}")
          print(f"FEATURES: {len(feature_names)}")

          targets = {
              "passing_yards": ["QB"],
              "rushing_yards": ["QB", "RB"],
              "receiving_yards": ["WR", "TE", "RB"],
              "receptions": ["WR", "TE", "RB"]
          }

          # Each 2025 block is predicted using ONLY data
          # available before that block.
          folds = [
              {
                  "name": "2025_W1_W6",
                  "test_start": 1,
                  "test_end": 6
              },
              {
                  "name": "2025_W7_W12",
                  "test_start": 7,
                  "test_end": 12
              },
              {
                  "name": "2025_W13_PLUS",
                  "test_start": 13,
                  "test_end": 30
              }
          ]

          results = {}

          for target, positions in targets.items():

              print("")
              print("=" * 50)
              print(f"VALIDATING: {target}")
              print("=" * 50)

              fold_results = []

              all_actual = []
              all_pred = []
              all_baseline = []

              for fold in folds:

                  start = fold["test_start"]
                  end = fold["test_end"]

                  # Historical seasons always allowed.
                  historical_train = usable.filter(
                      pl.col("season") < 2025
                  )

                  # For later folds, allow only earlier
                  # 2025 weeks into training.
                  if start > 1:
                      earlier_2025 = usable.filter(
                          (pl.col("season") == 2025)
                          & (pl.col("week") < start)
                      )

                      train = pl.concat(
                          [historical_train, earlier_2025],
                          how="vertical"
                      )
                  else:
                      train = historical_train

                  test = usable.filter(
                      (pl.col("season") == 2025)
                      & (pl.col("week") >= start)
                      & (pl.col("week") <= end)
                  )

                  train_target = train.filter(
                      pl.col("position").is_in(positions)
                  )

                  test_target = test.filter(
                      pl.col("position").is_in(positions)
                  )

                  if (
                      train_target.height < 100
                      or test_target.height < 20
                  ):
                      print(
                          f"{fold['name']} SKIPPED "
                          "- insufficient rows"
                      )
                      continue

                  Xtr = np.asarray(
                      train_target
                      .select(feature_names)
                      .to_numpy(),
                      dtype=np.float64
                  )

                  Xte = np.asarray(
                      test_target
                      .select(feature_names)
                      .to_numpy(),
                      dtype=np.float64
                  )

                  ytr = np.asarray(
                      train_target
                      .select(target)
                      .to_numpy()
                      .ravel(),
                      dtype=np.float64
                  )

                  yte = np.asarray(
                      test_target
                      .select(target)
                      .to_numpy()
                      .ravel(),
                      dtype=np.float64
                  )

                  model = Ridge(alpha=10.0)
                  model.fit(Xtr, ytr)

                  pred = model.predict(Xte)

                  # Baseline uses only training data.
                  baseline_value = float(np.mean(ytr))

                  baseline_pred = np.full(
                      len(yte),
                      baseline_value,
                      dtype=np.float64
                  )

                  mae = float(
                      mean_absolute_error(yte, pred)
                  )

                  rmse = float(
                      np.sqrt(
                          mean_squared_error(yte, pred)
                      )
                  )

                  baseline_mae = float(
                      mean_absolute_error(
                          yte,
                          baseline_pred
                      )
                  )

                  improvement = (
                      (
                          baseline_mae - mae
                      )
                      / baseline_mae
                      * 100
                      if baseline_mae > 0
                      else 0.0
                  )

                  residuals = yte - pred

                  residual_mean = float(
                      np.mean(residuals)
                  )

                  residual_std = float(
                      np.std(residuals)
                  )

                  fold_result = {
                      "fold": fold["name"],
                      "train_rows":
                          int(train_target.height),
                      "test_rows":
                          int(test_target.height),
                      "mae":
                          round(mae, 3),
                      "rmse":
                          round(rmse, 3),
                      "baseline_mae":
                          round(baseline_mae, 3),
                      "improvement_pct":
                          round(improvement, 2),
                      "residual_mean":
                          round(residual_mean, 3),
                      "residual_std":
                          round(residual_std, 3)
                  }

                  fold_results.append(fold_result)

                  all_actual.extend(yte.tolist())
                  all_pred.extend(pred.tolist())
                  all_baseline.extend(
                      baseline_pred.tolist()
                  )

                  print("")
                  print(f"FOLD: {fold['name']}")
                  print(
                      f"TEST ROWS: "
                      f"{test_target.height}"
                  )
                  print(f"MAE: {mae:.3f}")
                  print(
                      f"BASELINE MAE: "
                      f"{baseline_mae:.3f}"
                  )
                  print(
                      "IMPROVEMENT: "
                      f"{improvement:.2f}%"
                  )
                  print(
                      "RESIDUAL MEAN: "
                      f"{residual_mean:.3f}"
                  )
                  print(
                      "RESIDUAL STD: "
                      f"{residual_std:.3f}"
                  )

              if not fold_results:
                  print(
                      f"NO VALID FOLDS FOR {target}"
                  )
                  continue

              actual = np.asarray(
                  all_actual,
                  dtype=np.float64
              )

              predictions = np.asarray(
                  all_pred,
                  dtype=np.float64
              )

              baselines = np.asarray(
                  all_baseline,
                  dtype=np.float64
              )

              overall_mae = float(
                  mean_absolute_error(
                      actual,
                      predictions
                  )
              )

              overall_rmse = float(
                  np.sqrt(
                      mean_squared_error(
                          actual,
                          predictions
                      )
                  )
              )

              overall_baseline_mae = float(
                  mean_absolute_error(
                      actual,
                      baselines
                  )
              )

              overall_improvement = (
                  (
                      overall_baseline_mae
                      - overall_mae
                  )
                  / overall_baseline_mae
                  * 100
                  if overall_baseline_mae > 0
                  else 0.0
              )

              residuals = actual - predictions

              overall_residual_mean = float(
                  np.mean(residuals)
              )

              overall_residual_std = float(
                  np.std(residuals)
              )

              positive_folds = sum(
                  1
                  for f in fold_results
                  if f["improvement_pct"] > 0
              )

              stable = (
                  positive_folds
                  == len(fold_results)
              )

              results[target] = {
                  "folds": fold_results,
                  "overall_test_rows":
                      int(len(actual)),
                  "overall_mae":
                      round(overall_mae, 3),
                  "overall_rmse":
                      round(overall_rmse, 3),
                  "overall_baseline_mae":
                      round(
                          overall_baseline_mae,
                          3
                      ),
                  "overall_improvement_pct":
                      round(
                          overall_improvement,
                          2
                      ),
                  "residual_mean":
                      round(
                          overall_residual_mean,
                          3
                      ),
                  "residual_std":
                      round(
                          overall_residual_std,
                          3
                      ),
                  "positive_folds":
                      positive_folds,
                  "total_folds":
                      len(fold_results),
                  "stable_vs_baseline":
                      stable
              }

          if not results:
              raise RuntimeError(
                  "No validation results generated."
              )

          report = {
              "engine": "JPro Cloud Engine",
              "status":
                  "CHRONOLOGICAL_VALIDATION_COMPLETE",
              "method":
                  "rolling chronological 2025 holdout",
              "training_source":
                  "nflverse via nflreadpy",
              "feature_count":
                  len(feature_names),
              "models":
                  results,
              "predictions_unlocked":
                  False,
              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }

          with open(
              "data/validation-report.json",
              "w"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2
              )

          print("")
          print("=" * 60)
          print("JPRO VALIDATION SUMMARY")
          print("=" * 60)

          for target, metrics in results.items():
              print(
                  target.upper(),
                  "| MAE:",
                  metrics["overall_mae"],
                  "| BASELINE:",
                  metrics[
                      "overall_baseline_mae"
                  ],
                  "| IMPROVEMENT:",
                  str(
                      metrics[
                          "overall_improvement_pct"
                      ]
                  ) + "%",
                  "| POSITIVE FOLDS:",
                  str(
                      metrics["positive_folds"]
                  )
                  + "/"
                  + str(
                      metrics["total_folds"]
                  ),
                  "| RESIDUAL STD:",
                  metrics["residual_std"]
              )

          print("")
          print(
              "VALIDATION COMPLETE - "
              "DO NOT UNLOCK PREDICTIONS YET"
          )
          PY

      - name: Show JPro validation results
        run: cat data/validation-report.json

      - name: Save JPro validation results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: chronological validation"
          file_pattern: data/validation-report.json
