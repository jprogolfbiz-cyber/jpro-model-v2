name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy scikit-learn pyarrow

      # ============================================================
      # 3D-2 ROLE INTELLIGENCE V2
      # Opportunity-first + prior/current blending
      # ============================================================

      - name: Build JPro Role V2 intelligence
        run: |
          mkdir -p data

          python <<'PY'
          import json
          import math
          import warnings

          import numpy as np
          import pandas as pd
          import nflreadpy as nfl

          from sklearn.linear_model import Ridge
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import Pipeline

          warnings.filterwarnings("ignore")

          SEASON = 2026
          WEEK = 3
          PRIOR_SEASON = SEASON - 1
          SIMS = 20000
          RNG = np.random.default_rng(42)

          print("=" * 72)
          print("JPRO ROLE INTELLIGENCE V2")
          print("=" * 72)
          print("Season:", SEASON)
          print("Week:", WEEK)
          print("Prior season:", PRIOR_SEASON)
          print("Simulations:", SIMS)
          print("Role method: OPPORTUNITY_BLEND_V2")

          # ========================================================
          # HELPERS
          # ========================================================

          def to_pandas(obj):
              if hasattr(obj, "to_pandas"):
                  return obj.to_pandas()
              return pd.DataFrame(obj)

          def clean_number(value, default=0.0):
              try:
                  value = float(value)

                  if math.isnan(value) or math.isinf(value):
                      return default

                  return value

              except Exception:
                  return default

          def first_existing(columns, choices):
              for choice in choices:
                  if choice in columns:
                      return choice

              return None

          def normalize_team(value):
              if pd.isna(value):
                  return ""

              return str(value).strip().upper()

          def percentile(values, pct):
              if len(values) == 0:
                  return 0.0

              return float(
                  np.percentile(
                      values,
                      pct
                  )
              )

          def compress_histogram(values):
              unique, counts = np.unique(
                  values.astype(int),
                  return_counts=True
              )

              return [
                  [int(value), int(count)]
                  for value, count
                  in zip(unique, counts)
              ]

          def safe_mean(series):
              series = pd.to_numeric(
                  series,
                  errors="coerce"
              ).dropna()

              if len(series) == 0:
                  return 0.0

              return float(series.mean())

          def mean_column(frame, column):
              if (
                  column not in frame.columns
                  or frame.empty
              ):
                  return 0.0

              values = pd.to_numeric(
                  frame[column],
                  errors="coerce"
              ).dropna()

              if len(values) == 0:
                  return 0.0

              return float(values.mean())

          def recent_mean(
              frame,
              column,
              games=3
          ):
              if (
                  column not in frame.columns
                  or frame.empty
              ):
                  return 0.0

              ordered = frame.sort_values(
                  ["season", "week"]
              )

              values = pd.to_numeric(
                  ordered[column],
                  errors="coerce"
              ).dropna().tail(games)

              if len(values) == 0:
                  return 0.0

              return float(values.mean())

          def blend_value(
              prior_value,
              current_value,
              prior_games,
              current_games
          ):
              prior_value = clean_number(
                  prior_value
              )

              current_value = clean_number(
                  current_value
              )

              if current_games <= 0:
                  return prior_value

              if prior_games <= 0:
                  return current_value

              # Week 3 with two current games:
              # 2 / 6 = 33.3% current
              # 66.7% established prior role.
              #
              # Current season gradually takes over.
              current_weight = min(
                  current_games / 6.0,
                  0.80
              )

              prior_weight = (
                  1.0 - current_weight
              )

              return (
                  prior_value * prior_weight
                  +
                  current_value * current_weight
              )

          def scaled(value, benchmark):
              if benchmark <= 0:
                  return 0.0

              return float(
                  np.clip(
                      clean_number(value)
                      / benchmark,
                      0,
                      1
                  )
              )

          # ========================================================
          # LOAD SCHEDULE
          # ========================================================

          print("")
          print("Loading schedule...")

          schedule = to_pandas(
              nfl.load_schedules(
                  list(
                      range(
                          2022,
                          SEASON + 1
                      )
                  )
              )
          )

          print(
              "Schedule rows:",
              len(schedule)
          )

          season_col = first_existing(
              schedule.columns,
              ["season"]
          )

          week_col = first_existing(
              schedule.columns,
              ["week"]
          )

          home_col = first_existing(
              schedule.columns,
              ["home_team"]
          )

          away_col = first_existing(
              schedule.columns,
              ["away_team"]
          )

          game_type_col = first_existing(
              schedule.columns,
              ["game_type"]
          )

          if not all([
              season_col,
              week_col,
              home_col,
              away_col
          ]):
              raise RuntimeError(
                  "Required schedule columns missing."
              )

          regular_schedule = (
              schedule.copy()
          )

          if game_type_col:

              possible_regular = (
                  regular_schedule[
                      regular_schedule[
                          game_type_col
                      ]
                      .astype(str)
                      .str.upper()
                      .isin([
                          "REG",
                          "REGULAR",
                          "R"
                      ])
                  ]
              )

              if len(possible_regular) > 0:
                  regular_schedule = (
                      possible_regular
                  )

          week_games = regular_schedule[
              (
                  pd.to_numeric(
                      regular_schedule[
                          season_col
                      ],
                      errors="coerce"
                  )
                  == SEASON
              )
              &
              (
                  pd.to_numeric(
                      regular_schedule[
                          week_col
                      ],
                      errors="coerce"
                  )
                  == WEEK
              )
          ].copy()

          if week_games.empty:
              raise RuntimeError(
                  f"No games found for "
                  f"{SEASON} Week {WEEK}."
              )

          games = []
          team_to_game = {}

          for _, row in week_games.iterrows():

              away = normalize_team(
                  row[away_col]
              )

              home = normalize_team(
                  row[home_col]
              )

              if not away or not home:
                  continue

              game_name = (
                  f"{away} @ {home}"
              )

              games.append({
                  "game": game_name,
                  "away_team": away,
                  "home_team": home
              })

              team_to_game[away] = {
                  "game": game_name,
                  "opponent": home
              }

              team_to_game[home] = {
                  "game": game_name,
                  "opponent": away
              }

          print(
              "Slate games:",
              len(games)
          )

          for game in games:
              print(
                  " -",
                  game["game"]
              )

          slate_teams = set(
              team_to_game.keys()
          )

          # ========================================================
          # HISTORICAL OPPONENT LOOKUP
          # ========================================================

          schedule_lookup = {}

          for _, row in (
              regular_schedule.iterrows()
          ):

              try:
                  season = int(
                      row[season_col]
                  )

                  week = int(
                      row[week_col]
                  )

              except Exception:
                  continue

              home = normalize_team(
                  row[home_col]
              )

              away = normalize_team(
                  row[away_col]
              )

              if not home or not away:
                  continue

              schedule_lookup[
                  (
                      season,
                      week,
                      home
                  )
              ] = away

              schedule_lookup[
                  (
                      season,
                      week,
                      away
                  )
              ] = home

          # ========================================================
          # LOAD PLAYER STATS
          # ========================================================

          print("")
          print("Loading player stats...")

          stats = to_pandas(
              nfl.load_player_stats(
                  list(
                      range(
                          2022,
                          SEASON + 1
                      )
                  )
              )
          )

          print(
              "Player rows:",
              len(stats)
          )

          print(
              "Player columns:",
              len(stats.columns)
          )

          player_id_col = first_existing(
              stats.columns,
              [
                  "player_id",
                  "gsis_id"
              ]
          )

          player_name_col = first_existing(
              stats.columns,
              [
                  "player_display_name",
                  "player_name",
                  "name"
              ]
          )

          team_col = first_existing(
              stats.columns,
              [
                  "recent_team",
                  "team"
              ]
          )

          position_col = first_existing(
              stats.columns,
              [
                  "position",
                  "position_group"
              ]
          )

          if not all([
              player_id_col,
              player_name_col,
              team_col,
              position_col,
              "season",
              "week"
          ]):
              raise RuntimeError(
                  "Required player-stat columns missing."
              )

          stats = stats.copy()

          stats["team_jpro"] = (
              stats[team_col]
              .astype(str)
              .str.upper()
              .str.strip()
          )

          stats["position_jpro"] = (
              stats[position_col]
              .astype(str)
              .str.upper()
              .str.strip()
          )

          stats["player_id_jpro"] = (
              stats[player_id_col]
              .astype(str)
          )

          stats["player_name_jpro"] = (
              stats[player_name_col]
              .astype(str)
          )

          stats["season"] = pd.to_numeric(
              stats["season"],
              errors="coerce"
          )

          stats["week"] = pd.to_numeric(
              stats["week"],
              errors="coerce"
          )

          stats = stats[
              stats["season"].notna()
              &
              stats["week"].notna()
          ].copy()

          stats["season"] = (
              stats["season"]
              .astype(int)
          )

          stats["week"] = (
              stats["week"]
              .astype(int)
          )

          # Opportunity columns confirmed
          # by the successful 3D-1 audit.
          opportunity_columns = [
              "attempts",
              "carries",
              "targets",
              "receptions",
              "target_share",
              "air_yards_share",
              "receiving_air_yards",
              "passing_yards",
              "rushing_yards",
              "receiving_yards"
          ]

          for column in opportunity_columns:

              if column in stats.columns:

                  stats[column] = (
                      pd.to_numeric(
                          stats[column],
                          errors="coerce"
                      )
                  )

          # ========================================================
          # TARGET SPECS
          # ========================================================

          target_specs = {
              "passing_yards": {
                  "positions": ["QB"],
                  "min_projection": 25
              },

              "rushing_yards": {
                  "positions": [
                      "QB",
                      "RB",
                      "WR"
                  ],
                  "min_projection": 2
              },

              "receiving_yards": {
                  "positions": [
                      "RB",
                      "WR",
                      "TE"
                  ],
                  "min_projection": 2
              },

              "receptions": {
                  "positions": [
                      "RB",
                      "WR",
                      "TE"
                  ],
                  "min_projection": 0.25
              }
          }

          available_targets = {
              target: spec
              for target, spec
              in target_specs.items()
              if target in stats.columns
          }

          if not available_targets:
              raise RuntimeError(
                  "No supported target columns found."
              )

          # ========================================================
          # LEAKAGE-SAFE LAG FEATURES
          # ========================================================

          stats = stats.sort_values(
              [
                  "player_id_jpro",
                  "season",
                  "week"
              ]
          ).reset_index(
              drop=True
          )

          for target in available_targets:

              stats[target] = pd.to_numeric(
                  stats[target],
                  errors="coerce"
              ).fillna(0.0)

              grouped = stats.groupby(
                  "player_id_jpro"
              )[target]

              stats[
                  f"{target}_lag1"
              ] = grouped.shift(1)

              stats[
                  f"{target}_avg3"
              ] = (
                  grouped
                  .shift(1)
                  .rolling(
                      3,
                      min_periods=1
                  )
                  .mean()
                  .reset_index(
                      level=0,
                      drop=True
                  )
              )

              stats[
                  f"{target}_avg5"
              ] = (
                  grouped
                  .shift(1)
                  .rolling(
                      5,
                      min_periods=1
                  )
                  .mean()
                  .reset_index(
                      level=0,
                      drop=True
                  )
              )

              stats[
                  f"{target}_std5"
              ] = (
                  grouped
                  .shift(1)
                  .rolling(
                      5,
                      min_periods=2
                  )
                  .std()
                  .reset_index(
                      level=0,
                      drop=True
                  )
              )

          stats["week_feature"] = (
              stats["week"]
              .astype(float)
          )

          stats["season_feature"] = (
              stats["season"]
              .astype(float)
          )

          # ========================================================
          # CURRENT PREGAME STATE
          # ========================================================

          pregame_2026 = stats[
              (
                  stats["season"]
                  == SEASON
              )
              &
              (
                  stats["week"]
                  < WEEK
              )
          ].copy()

          if pregame_2026.empty:
              raise RuntimeError(
                  "No current-season "
                  "pregame rows available."
              )

          latest_current = (
              pregame_2026
              .sort_values([
                  "player_id_jpro",
                  "week"
              ])
              .groupby(
                  "player_id_jpro",
                  as_index=False
              )
              .tail(1)
              .copy()
          )

          latest_current = latest_current[
              latest_current[
                  "team_jpro"
              ].isin(
                  slate_teams
              )
          ].copy()

          print("")
          print(
              "Current slate player rows:",
              len(latest_current)
          )

          # ========================================================
          # ROLE INTELLIGENCE V2
          # ========================================================

          def player_stat_summary(
              player_rows,
              stat_name
          ):

              if (
                  stat_name
                  not in player_rows.columns
              ):
                  return {
                      "season_avg": 0.0,
                      "recent_avg": 0.0,
                      "last_game": 0.0,
                      "recent_std": 0.0,
                      "trend": 0.0
                  }

              ordered = (
                  player_rows
                  .sort_values([
                      "season",
                      "week"
                  ])
              )

              values = pd.to_numeric(
                  ordered[stat_name],
                  errors="coerce"
              ).fillna(0.0)

              recent = values.tail(3)

              season_avg = (
                  float(values.mean())
                  if len(values)
                  else 0.0
              )

              recent_avg = (
                  float(recent.mean())
                  if len(recent)
                  else 0.0
              )

              last_game = (
                  float(
                      values.iloc[-1]
                  )
                  if len(values)
                  else 0.0
              )

              recent_std = (
                  float(
                      recent.std(
                          ddof=0
                      )
                  )
                  if len(recent) > 1
                  else 0.0
              )

              return {
                  "season_avg":
                      season_avg,

                  "recent_avg":
                      recent_avg,

                  "last_game":
                      last_game,

                  "recent_std":
                      recent_std,

                  "trend":
                      recent_avg
                      - season_avg
              }

          def role_label(score):

              if score >= 80:
                  return "FEATURED"

              if score >= 65:
                  return "STRONG"

              if score >= 50:
                  return "STABLE"

              if score >= 35:
                  return "ROTATIONAL"

              return "LIMITED"

          def build_role(player_id):

              player_all = stats[
                  stats[
                      "player_id_jpro"
                  ]
                  == player_id
              ].copy()

              current = player_all[
                  (
                      player_all["season"]
                      == SEASON
                  )
                  &
                  (
                      player_all["week"]
                      < WEEK
                  )
              ].copy()

              prior = player_all[
                  player_all["season"]
                  == PRIOR_SEASON
              ].copy()

              if (
                  current.empty
                  and prior.empty
              ):
                  return {
                      "role_score": 0.0,
                      "role_label": "UNKNOWN",
                      "role_method":
                          "OPPORTUNITY_BLEND_V2",
                      "games_sample": 0,
                      "current_games": 0,
                      "prior_games": 0
                  }

              source = (
                  current
                  if not current.empty
                  else prior
              )

              latest = (
                  source
                  .sort_values([
                      "season",
                      "week"
                  ])
                  .iloc[-1]
              )

              position = str(
                  latest[
                      "position_jpro"
                  ]
              ).upper()

              current_games = int(
                  len(current)
              )

              prior_games = int(
                  len(prior)
              )

              # --------------------------------------------
              # Keep production summaries because the
              # current app UI already reads these keys.
              # --------------------------------------------

              summary_rows = (
                  current
                  if not current.empty
                  else prior
              )

              pass_summary = (
                  player_stat_summary(
                      summary_rows,
                      "passing_yards"
                  )
              )

              rush_summary = (
                  player_stat_summary(
                      summary_rows,
                      "rushing_yards"
                  )
              )

              rec_summary = (
                  player_stat_summary(
                      summary_rows,
                      "receiving_yards"
                  )
              )

              catch_summary = (
                  player_stat_summary(
                      summary_rows,
                      "receptions"
                  )
              )

              # --------------------------------------------
              # OPPORTUNITY DATA
              # --------------------------------------------

              prior_targets = mean_column(
                  prior,
                  "targets"
              )

              current_targets = mean_column(
                  current,
                  "targets"
              )

              prior_target_share = mean_column(
                  prior,
                  "target_share"
              )

              current_target_share = mean_column(
                  current,
                  "target_share"
              )

              prior_air_share = mean_column(
                  prior,
                  "air_yards_share"
              )

              current_air_share = mean_column(
                  current,
                  "air_yards_share"
              )

              prior_air_yards = mean_column(
                  prior,
                  "receiving_air_yards"
              )

              current_air_yards = mean_column(
                  current,
                  "receiving_air_yards"
              )

              prior_carries = mean_column(
                  prior,
                  "carries"
              )

              current_carries = mean_column(
                  current,
                  "carries"
              )

              prior_attempts = mean_column(
                  prior,
                  "attempts"
              )

              current_attempts = mean_column(
                  current,
                  "attempts"
              )

              # --------------------------------------------
              # BLEND ESTABLISHED + CURRENT ROLE
              # --------------------------------------------

              blended_targets = blend_value(
                  prior_targets,
                  current_targets,
                  prior_games,
                  current_games
              )

              blended_target_share = (
                  blend_value(
                      prior_target_share,
                      current_target_share,
                      prior_games,
                      current_games
                  )
              )

              blended_air_share = (
                  blend_value(
                      prior_air_share,
                      current_air_share,
                      prior_games,
                      current_games
                  )
              )

              blended_air_yards = (
                  blend_value(
                      prior_air_yards,
                      current_air_yards,
                      prior_games,
                      current_games
                  )
              )

              blended_carries = blend_value(
                  prior_carries,
                  current_carries,
                  prior_games,
                  current_games
              )

              blended_attempts = blend_value(
                  prior_attempts,
                  current_attempts,
                  prior_games,
                  current_games
              )

              recent_targets = recent_mean(
                  current,
                  "targets",
                  3
              )

              recent_carries = recent_mean(
                  current,
                  "carries",
                  3
              )

              recent_attempts = recent_mean(
                  current,
                  "attempts",
                  3
              )

              # --------------------------------------------
              # ROLE SCORE
              #
              # Opportunity is primary.
              # Production does NOT determine role.
              # --------------------------------------------

              score = 0.0

              if position == "QB":

                  score = (
                      scaled(
                          blended_attempts,
                          36.0
                      )
                      * 75.0
                      +
                      scaled(
                          blended_carries,
                          7.0
                      )
                      * 15.0
                      +
                      scaled(
                          recent_attempts,
                          36.0
                      )
                      * 10.0
                  )

              elif position == "RB":

                  score = (
                      scaled(
                          blended_carries,
                          18.0
                      )
                      * 55.0
                      +
                      scaled(
                          blended_targets,
                          6.0
                      )
                      * 25.0
                      +
                      scaled(
                          recent_carries,
                          18.0
                      )
                      * 10.0
                      +
                      scaled(
                          recent_targets,
                          6.0
                      )
                      * 10.0
                  )

              elif position == "WR":

                  score = (
                      scaled(
                          blended_targets,
                          9.0
                      )
                      * 40.0
                      +
                      scaled(
                          blended_target_share,
                          0.27
                      )
                      * 30.0
                      +
                      scaled(
                          blended_air_share,
                          0.35
                      )
                      * 20.0
                      +
                      scaled(
                          recent_targets,
                          9.0
                      )
                      * 10.0
                  )

              elif position == "TE":

                  score = (
                      scaled(
                          blended_targets,
                          7.0
                      )
                      * 45.0
                      +
                      scaled(
                          blended_target_share,
                          0.22
                      )
                      * 30.0
                      +
                      scaled(
                          blended_air_share,
                          0.25
                      )
                      * 15.0
                      +
                      scaled(
                          recent_targets,
                          7.0
                      )
                      * 10.0
                  )

              score = float(
                  np.clip(
                      score,
                      0,
                      100
                  )
              )

              if current_games > 0:

                  current_weight = min(
                      current_games / 6.0,
                      0.80
                  )

              else:
                  current_weight = 0.0

              if prior_games > 0:

                  prior_weight = (
                      1.0
                      - current_weight
                  )

              else:
                  prior_weight = 0.0

              return {
                  "role_score":
                      round(
                          score,
                          2
                      ),

                  "role_label":
                      role_label(
                          score
                      ),

                  "role_method":
                      "OPPORTUNITY_BLEND_V2",

                  "games_sample":
                      current_games,

                  "current_games":
                      current_games,

                  "prior_games":
                      prior_games,

                  "current_weight":
                      round(
                          current_weight,
                          3
                      ),

                  "prior_weight":
                      round(
                          prior_weight,
                          3
                      ),

                  "targets_prior_avg":
                      round(
                          prior_targets,
                          2
                      ),

                  "targets_current_avg":
                      round(
                          current_targets,
                          2
                      ),

                  "targets_blended_avg":
                      round(
                          blended_targets,
                          2
                      ),

                  "targets_recent_avg":
                      round(
                          recent_targets,
                          2
                      ),

                  "target_share_prior":
                      round(
                          prior_target_share,
                          4
                      ),

                  "target_share_current":
                      round(
                          current_target_share,
                          4
                      ),

                  "target_share_blended":
                      round(
                          blended_target_share,
                          4
                      ),

                  "air_yards_share_prior":
                      round(
                          prior_air_share,
                          4
                      ),

                  "air_yards_share_current":
                      round(
                          current_air_share,
                          4
                      ),

                  "air_yards_share_blended":
                      round(
                          blended_air_share,
                          4
                      ),

                  "receiving_air_yards_prior_avg":
                      round(
                          prior_air_yards,
