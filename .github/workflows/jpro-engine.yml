name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy scikit-learn pyarrow

      - name: Run JPro 20K simulation engine
        run: |
          mkdir -p data models

          python <<'PY'
          import json
          import math
          import numpy as np
          import pandas as pd
          import nflreadpy as nfl

          from sklearn.compose import ColumnTransformer
          from sklearn.impute import SimpleImputer
          from sklearn.linear_model import Ridge
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          np.random.seed(20260921)

          print("=" * 55)
          print("JPRO 20K SIMULATION ENGINE")
          print("=" * 55)

          # ---------------------------------------------------------
          # 1. LOAD REAL NFL PLAYER DATA
          # ---------------------------------------------------------
          df = nfl.load_player_stats([2022, 2023, 2024, 2025])

          if hasattr(df, "to_pandas"):
              df = df.to_pandas()

          df = pd.DataFrame(df)

          print("REAL NFL ROWS:", len(df))
          print("RAW COLUMNS:", len(df.columns))

          # nflverse schema compatibility
          if "recent_team" not in df.columns and "team" in df.columns:
              df["recent_team"] = df["team"]

          required = [
              "player_id",
              "player_display_name",
              "position",
              "season",
              "week",
              "recent_team",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          missing = [c for c in required if c not in df.columns]

          if missing:
              raise RuntimeError(
                  f"JPro schema audit failed. Missing columns: {missing}"
              )

          # ---------------------------------------------------------
          # 2. CLEAN + SORT
          # ---------------------------------------------------------
          numeric_targets = [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          for col in numeric_targets:
              df[col] = pd.to_numeric(df[col], errors="coerce").fillna(0.0)

          df["season"] = pd.to_numeric(df["season"], errors="coerce")
          df["week"] = pd.to_numeric(df["week"], errors="coerce")

          df = df.dropna(
              subset=[
                  "player_id",
                  "season",
                  "week"
              ]
          ).copy()

          df = df.sort_values(
              ["player_id", "season", "week"]
          ).reset_index(drop=True)

          # ---------------------------------------------------------
          # 3. LEAKAGE-SAFE FEATURES
          # Every rolling feature is SHIFTED one game.
          # ---------------------------------------------------------
          group = df.groupby("player_id", group_keys=False)

          for stat in numeric_targets:
              df[f"{stat}_lag1"] = group[stat].shift(1)

              df[f"{stat}_avg3"] = group[stat].transform(
                  lambda x: x.shift(1).rolling(
                      3,
                      min_periods=1
                  ).mean()
              )

              df[f"{stat}_avg5"] = group[stat].transform(
                  lambda x: x.shift(1).rolling(
                      5,
                      min_periods=1
                  ).mean()
              )

              df[f"{stat}_std5"] = group[stat].transform(
                  lambda x: x.shift(1).rolling(
                      5,
                      min_periods=2
                  ).std()
              )

          df["games_before"] = group.cumcount()

          # Require some prior history.
          train_df = df[df["games_before"] >= 3].copy()

          print("LEAKAGE-SAFE ROWS:", len(train_df))

          # ---------------------------------------------------------
          # 4. MODEL CONFIGURATION
          # ---------------------------------------------------------
          model_specs = {
              "passing_yards": {
                  "positions": ["QB"]
              },
              "rushing_yards": {
                  "positions": ["QB", "RB", "WR"]
              },
              "receiving_yards": {
                  "positions": ["WR", "TE", "RB"]
              },
              "receptions": {
                  "positions": ["WR", "TE", "RB"]
              }
          }

          feature_cols = [
              "season",
              "week",
              "games_before",

              "passing_yards_lag1",
              "passing_yards_avg3",
              "passing_yards_avg5",
              "passing_yards_std5",

              "rushing_yards_lag1",
              "rushing_yards_avg3",
              "rushing_yards_avg5",
              "rushing_yards_std5",

              "receiving_yards_lag1",
              "receiving_yards_avg3",
              "receiving_yards_avg5",
              "receiving_yards_std5",

              "receptions_lag1",
              "receptions_avg3",
              "receptions_avg5",
              "receptions_std5",

              "position",
              "recent_team"
          ]

          numeric_features = [
              c for c in feature_cols
              if c not in ["position", "recent_team"]
          ]

          categorical_features = [
              "position",
              "recent_team"
          ]

          # ---------------------------------------------------------
          # 5. TRAIN + GENERATE 20,000-SIM DISTRIBUTIONS
          # ---------------------------------------------------------
          output = {
              "status": "READY",
              "engine": "JPro 20K",
              "simulations_per_player_prop": 20000,
              "data_source": "nflverse via nflreadpy",
              "models": {},
              "players": []
          }

          latest_rows = (
              train_df
              .sort_values(["season", "week"])
              .groupby("player_id")
              .tail(1)
              .copy()
          )

          print("PLAYERS AVAILABLE FOR SIM:", len(latest_rows))

          for target, spec in model_specs.items():

              target_df = train_df[
                  train_df["position"].isin(spec["positions"])
              ].copy()

              # Avoid training on meaningless zero-only rows.
              if target == "passing_yards":
                  target_df = target_df[
                      target_df["position"] == "QB"
                  ]

              X = target_df[feature_cols]
              y = target_df[target].astype(float)

              preprocessor = ColumnTransformer(
                  transformers=[
                      (
                          "num",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="median"
                                      )
                                  ),
                                  (
                                      "scale",
                                      StandardScaler()
                                  )
                              ]
                          ),
                          numeric_features
                      ),
                      (
                          "cat",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="most_frequent"
                                      )
                                  ),
                                  (
                                      "onehot",
                                      OneHotEncoder(
                                          handle_unknown="ignore"
                                      )
                                  )
                              ]
                          ),
                          categorical_features
                      )
                  ]
              )

              model = Pipeline(
                  steps=[
                      ("prep", preprocessor),
                      (
                          "model",
                          Ridge(
                              alpha=10.0
                          )
                      )
                  ]
              )

              # Chronological 80/20 residual calibration.
              target_df = target_df.sort_values(
                  ["season", "week"]
              ).reset_index(drop=True)

              split = int(len(target_df) * 0.80)

              fit_df = target_df.iloc[:split].copy()
              test_df = target_df.iloc[split:].copy()

              model.fit(
                  fit_df[feature_cols],
                  fit_df[target]
              )

              test_pred = model.predict(
                  test_df[feature_cols]
              )

              residuals = (
                  test_df[target].to_numpy(dtype=float)
                  - test_pred
              )

              residuals = residuals[
                  np.isfinite(residuals)
              ]

              if len(residuals) < 100:
                  raise RuntimeError(
                      f"Not enough residuals for {target}"
                  )

              residual_mean = float(
                  np.mean(residuals)
              )

              residual_std = float(
                  np.std(residuals, ddof=1)
              )

              # Refit on all available historical rows after
              # calibration statistics have been measured.
              model.fit(
                  target_df[feature_cols],
                  target_df[target]
              )

              output["models"][target] = {
                  "training_rows": int(len(target_df)),
                  "calibration_rows": int(len(residuals)),
                  "residual_mean": round(
                      residual_mean,
                      4
                  ),
                  "residual_std": round(
                      residual_std,
                      4
                  )
              }

              eligible = latest_rows[
                  latest_rows["position"].isin(
                      spec["positions"]
                  )
              ].copy()

              if target == "passing_yards":
                  eligible = eligible[
                      eligible["position"] == "QB"
                  ]

              if eligible.empty:
                  continue

              projections = model.predict(
                  eligible[feature_cols]
              )

              for idx, (_, row) in enumerate(
                  eligible.iterrows()
              ):
                  projection = float(
                      max(0.0, projections[idx])
                  )

                  # Empirical residual bootstrap:
                  # simulation uncertainty comes from actual
                  # unseen historical model errors.
                  sampled_errors = np.random.choice(
                      residuals,
                      size=20000,
                      replace=True
                  )

                  sims = (
                      projection
                      + sampled_errors
                  )

                  # Yardage/receptions cannot be negative.
                  sims = np.maximum(sims, 0.0)

                  percentiles = {
                      "p10": round(
                          float(np.percentile(sims, 10)),
                          2
                      ),
                      "p25": round(
                          float(np.percentile(sims, 25)),
                          2
                      ),
                      "median": round(
                          float(np.percentile(sims, 50)),
                          2
                      ),
                      "p75": round(
                          float(np.percentile(sims, 75)),
                          2
                      ),
                      "p90": round(
                          float(np.percentile(sims, 90)),
                          2
                      )
                  }

                  player_result = {
                      "player_id": str(
                          row["player_id"]
                      ),
                      "player": str(
                          row["player_display_name"]
                      ),
                      "position": str(
                          row["position"]
                      ),
                      "team": str(
                          row["recent_team"]
                      ),
                      "prop": target,
                      "projection": round(
                          projection,
                          2
                      ),
                      "sim_mean": round(
                          float(np.mean(sims)),
                          2
                      ),
                      "sim_std": round(
                          float(np.std(sims)),
                          2
                      ),
                      "percentiles": percentiles,
                      "simulations": 20000
                  }

                  output["players"].append(
                      player_result
                  )

              print(
                  target.upper(),
                  "| TRAIN ROWS:",
                  len(target_df),
                  "| PLAYERS SIMULATED:",
                  len(eligible),
                  "| RESIDUAL STD:",
                  round(residual_std, 3)
              )

          # ---------------------------------------------------------
          # 6. SAVE JPRO OUTPUT
          # ---------------------------------------------------------
          with open(
              "data/jpro-20k.json",
              "w"
          ) as f:
              json.dump(
                  output,
                  f,
                  indent=2
              )

          summary = {
              "status": "READY",
              "simulations_per_player_prop": 20000,
              "player_prop_distributions": len(
                  output["players"]
              ),
              "models": list(
                  output["models"].keys()
              )
          }

          with open(
              "data/jpro-20k-status.json",
              "w"
          ) as f:
              json.dump(
                  summary,
                  f,
                  indent=2
              )

          print("=" * 55)
          print("JPRO 20K ENGINE COMPLETE")
          print(
              "PLAYER-PROP DISTRIBUTIONS:",
              len(output["players"])
          )
          print(
              "SIMULATIONS EACH: 20,000"
          )
          print("=" * 55)
          PY

      - name: Show JPro 20K status
        run: |
          cat data/jpro-20k-status.json

      - name: Save JPro 20K results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "JPro: 20K simulation distributions"
          file_pattern: data/jpro-20k*.json
