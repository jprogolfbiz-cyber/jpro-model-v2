name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JPro tools
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas numpy scikit-learn pyarrow

      - name: Build JPro matchup intelligence
        run: |
          mkdir -p data

          python <<'PY'
          import json
          import numpy as np
          import pandas as pd
          import nflreadpy as nfl

          from datetime import datetime, timezone
          from sklearn.compose import ColumnTransformer
          from sklearn.impute import SimpleImputer
          from sklearn.linear_model import Ridge
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          # ==================================================
          # SETTINGS
          # ==================================================

          np.random.seed(20260922)

          SEASON = 2026
          WEEK = 3
          SIMS = 20000

          print("=" * 72)
          print("JPRO MODEL V2 — MATCHUP INTELLIGENCE ENGINE")
          print("=" * 72)

          # ==================================================
          # LOAD SCHEDULE
          # ==================================================

          schedule = nfl.load_schedules(
              [2022, 2023, 2024, 2025, 2026]
          )

          if hasattr(schedule, "to_pandas"):
              schedule = schedule.to_pandas()

          schedule = pd.DataFrame(schedule)

          required_schedule = [
              "season",
              "week",
              "away_team",
              "home_team"
          ]

          missing_schedule = [
              c for c in required_schedule
              if c not in schedule.columns
          ]

          if missing_schedule:
              raise RuntimeError(
                  f"Missing schedule columns: {missing_schedule}"
              )

          schedule["season"] = pd.to_numeric(
              schedule["season"],
              errors="coerce"
          )

          schedule["week"] = pd.to_numeric(
              schedule["week"],
              errors="coerce"
          )

          # ==================================================
          # TARGET WEEK
          # ==================================================

          week_games = schedule[
              (schedule["season"] == SEASON) &
              (schedule["week"] == WEEK)
          ].copy()

          if "game_type" in week_games.columns:

              regular = week_games[
                  week_games["game_type"]
                  .astype(str)
                  .str.upper()
                  .isin([
                      "REG",
                      "REGULAR",
                      "REGULAR SEASON"
                  ])
              ].copy()

              if not regular.empty:
                  week_games = regular

          week_games = week_games.dropna(
              subset=[
                  "away_team",
                  "home_team"
              ]
          ).copy()

          if week_games.empty:
              raise RuntimeError(
                  f"No games found for {SEASON} Week {WEEK}"
              )

          games = []
          team_to_game = {}
          team_to_opponent = {}

          for _, row in week_games.iterrows():

              away = str(
                  row["away_team"]
              ).strip()

              home = str(
                  row["home_team"]
              ).strip()

              game_name = f"{away} @ {home}"

              game = {
                  "game": game_name,
                  "away_team": away,
                  "home_team": home
              }

              if (
                  "gameday" in week_games.columns
                  and pd.notna(row.get("gameday"))
              ):
                  game["gameday"] = str(
                      row.get("gameday")
                  )

              if (
                  "gametime" in week_games.columns
                  and pd.notna(row.get("gametime"))
              ):
                  game["gametime"] = str(
                      row.get("gametime")
                  )

              if (
                  "weekday" in week_games.columns
                  and pd.notna(row.get("weekday"))
              ):
                  game["weekday"] = str(
                      row.get("weekday")
                  )

              games.append(game)

              team_to_game[away] = game_name
              team_to_game[home] = game_name

              team_to_opponent[away] = home
              team_to_opponent[home] = away

          slate_teams = sorted(
              team_to_game.keys()
          )

          print("TARGET GAMES:", len(games))

          for game in games:
              print("GAME:", game["game"])

          # ==================================================
          # LOAD PLAYER STATS
          # ==================================================

          df = nfl.load_player_stats(
              [2022, 2023, 2024, 2025, 2026]
          )

          if hasattr(df, "to_pandas"):
              df = df.to_pandas()

          df = pd.DataFrame(df)

          if (
              "recent_team" not in df.columns
              and "team" in df.columns
          ):
              df["recent_team"] = df["team"]

          targets = [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          required = [
              "player_id",
              "player_display_name",
              "position",
              "season",
              "week",
              "recent_team"
          ] + targets

          missing = [
              c for c in required
              if c not in df.columns
          ]

          if missing:
              raise RuntimeError(
                  f"Missing player columns: {missing}"
              )

          for col in targets:

              df[col] = pd.to_numeric(
                  df[col],
                  errors="coerce"
              ).fillna(0.0)

          df["season"] = pd.to_numeric(
              df["season"],
              errors="coerce"
          )

          df["week"] = pd.to_numeric(
              df["week"],
              errors="coerce"
          )

          df = df.dropna(
              subset=[
                  "player_id",
                  "season",
                  "week",
                  "recent_team"
              ]
          ).copy()

          df["recent_team"] = (
              df["recent_team"]
              .astype(str)
              .str.strip()
          )

          df = df.sort_values(
              [
                  "player_id",
                  "season",
                  "week"
              ]
          ).reset_index(
              drop=True
          )

          print("REAL NFL ROWS:", len(df))

          # ==================================================
          # ATTACH EACH HISTORICAL PLAYER ROW TO OPPONENT
          # ==================================================

          schedule_lookup = {}

          for _, row in schedule.iterrows():

              if (
                  pd.isna(row.get("season"))
                  or pd.isna(row.get("week"))
                  or pd.isna(row.get("away_team"))
                  or pd.isna(row.get("home_team"))
              ):
                  continue

              season = int(row["season"])
              week = int(row["week"])

              away = str(
                  row["away_team"]
              ).strip()

              home = str(
                  row["home_team"]
              ).strip()

              schedule_lookup[
                  (season, week, away)
              ] = home

              schedule_lookup[
                  (season, week, home)
              ] = away

          def lookup_opponent(row):

              try:

                  key = (
                      int(row["season"]),
                      int(row["week"]),
                      str(row["recent_team"]).strip()
                  )

                  return schedule_lookup.get(
                      key
                  )

              except:
                  return None

          df["opponent"] = df.apply(
              lookup_opponent,
              axis=1
          )

          matched_opponents = int(
              df["opponent"].notna().sum()
          )

          print(
              "PLAYER ROWS WITH OPPONENT:",
              matched_opponents
          )

          # ==================================================
          # PREGAME SNAPSHOT
          # ==================================================

          pregame_2026 = df[
              (df["season"] == SEASON) &
              (df["week"] < WEEK)
          ].copy()

          # ==================================================
          # LEAKAGE-SAFE MODEL FEATURES
          # ==================================================

          group = df.groupby(
              "player_id",
              group_keys=False
          )

          for stat in targets:

              df[f"{stat}_lag1"] = (
                  group[stat].shift(1)
              )

              df[f"{stat}_avg3"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                      .rolling(
                          3,
                          min_periods=1
                      )
                      .mean()
                  )
              )

              df[f"{stat}_avg5"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                      .rolling(
                          5,
                          min_periods=1
                      )
                      .mean()
                  )
              )

              df[f"{stat}_std5"] = (
                  group[stat].transform(
                      lambda x:
                      x.shift(1)
                      .rolling(
                          5,
                          min_periods=2
                      )
                      .std()
                  )
              )

          df["games_before"] = (
              group.cumcount()
          )

          model_df = df[
              df["games_before"] >= 3
          ].copy()

          # ==================================================
          # MODEL FEATURES
          # ==================================================

          feature_cols = [
              "season",
              "week",
              "games_before",

              "passing_yards_lag1",
              "passing_yards_avg3",
              "passing_yards_avg5",
              "passing_yards_std5",

              "rushing_yards_lag1",
              "rushing_yards_avg3",
              "rushing_yards_avg5",
              "rushing_yards_std5",

              "receiving_yards_lag1",
              "receiving_yards_avg3",
              "receiving_yards_avg5",
              "receiving_yards_std5",

              "receptions_lag1",
              "receptions_avg3",
              "receptions_avg5",
              "receptions_std5",

              "position",
              "recent_team"
          ]

          numeric_features = [
              x for x in feature_cols
              if x not in [
                  "position",
                  "recent_team"
              ]
          ]

          categorical_features = [
              "position",
              "recent_team"
          ]

          specs = {
              "passing_yards": ["QB"],

              "rushing_yards": [
                  "QB",
                  "RB",
                  "WR"
              ],

              "receiving_yards": [
                  "WR",
                  "TE",
                  "RB"
              ],

              "receptions": [
                  "WR",
                  "TE",
                  "RB"
              ]
          }

          # ==================================================
          # CURRENT PLAYER STATE
          # ==================================================

          current_pool = model_df[
              (model_df["season"] == SEASON) &
              (model_df["week"] < WEEK)
          ].copy()

          if current_pool.empty:
              raise RuntimeError(
                  "No pregame player state found."
              )

          current = (
              current_pool
              .sort_values([
                  "player_id",
                  "week"
              ])
              .groupby("player_id")
              .tail(1)
              .copy()
          )

          current = current[
              current["recent_team"].isin(
                  slate_teams
              )
          ].copy()

          current["game"] = (
              current["recent_team"]
              .map(team_to_game)
          )

          current["opponent"] = (
              current["recent_team"]
              .map(team_to_opponent)
          )

          current = current.dropna(
              subset=[
                  "game",
                  "opponent"
              ]
          ).copy()

          print(
              "CURRENT SLATE PLAYERS:",
              len(current)
          )

          # ==================================================
          # HELPERS
          # ==================================================

          def safe_float(value):

              try:

                  value = float(value)

                  if np.isfinite(value):
                      return value

              except:
                  pass

              return 0.0

          def round2(value):

              return round(
                  safe_float(value),
                  2
              )

          # ==================================================
          # ROLE INTELLIGENCE
          # ==================================================

          def role_label(score):

              if score >= 80:
                  return "FEATURED"

              if score >= 65:
                  return "STRONG"

              if score >= 50:
                  return "STABLE"

              if score >= 35:
                  return "ROTATIONAL"

              return "LIMITED"

          def player_role(
              player_id,
              team,
              position
          ):

              history = pregame_2026[
                  pregame_2026["player_id"]
                  == player_id
              ].sort_values(
                  "week"
              ).copy()

              if history.empty:

                  return {
                      "role_score": 0,
                      "role_label": "UNKNOWN",
                      "games_sample": 0
                  }

              recent = history.tail(3)

              role = {
                  "games_sample":
                      int(len(history))
              }

              for stat in targets:

                  values = history[
                      stat
                  ].to_numpy(
                      dtype=float
                  )

                  recent_values = recent[
                      stat
                  ].to_numpy(
                      dtype=float
                  )

                  season_avg = (
                      float(np.mean(values))
                      if len(values)
                      else 0.0
                  )

                  recent_avg = (
                      float(np.mean(recent_values))
                      if len(recent_values)
                      else 0.0
                  )

                  last_game = (
                      float(values[-1])
                      if len(values)
                      else 0.0
                  )

                  consistency = (
                      float(np.std(recent_values))
                      if len(recent_values) > 1
                      else 0.0
                  )

                  trend = (
                      recent_avg -
                      season_avg
                  )

                  role[
                      f"{stat}_season_avg"
                  ] = round2(
                      season_avg
                  )

                  role[
                      f"{stat}_recent_avg"
                  ] = round2(
                      recent_avg
                  )

                  role[
                      f"{stat}_last_game"
                  ] = round2(
                      last_game
                  )

                  role[
                      f"{stat}_recent_std"
                  ] = round2(
                      consistency
                  )

                  role[
                      f"{stat}_trend"
                  ] = round2(
                      trend
                  )

              team_history = pregame_2026[
                  pregame_2026["recent_team"]
                  == team
              ].copy()

              team_weeks = sorted(
                  history["week"]
                  .dropna()
                  .unique()
                  .tolist()
              )

              team_history = team_history[
                  team_history["week"].isin(
                      team_weeks
                  )
              ].copy()

              for stat in targets:

                  player_total = safe_float(
                      history[stat].sum()
                  )

                  team_total = safe_float(
                      team_history[stat].sum()
                  )

                  share = (
                      player_total / team_total
                      if team_total > 0
                      else 0.0
                  )

                  role[
                      f"{stat}_team_share"
                  ] = round2(
                      share
                  )

              if position == "QB":

                  score = (
                      min(
                          role["passing_yards_recent_avg"] / 300,
                          1
                      ) * 45
                      +
                      min(
                          role["passing_yards_team_share"],
                          1
                      ) * 40
                      +
                      min(
                          role["rushing_yards_recent_avg"] / 50,
                          1
                      ) * 15
                  )

              elif position == "RB":

                  score = (
                      min(
                          role["rushing_yards_recent_avg"] / 100,
                          1
                      ) * 35
                      +
                      min(
                          role["rushing_yards_team_share"] / .70,
                          1
                      ) * 30
                      +
                      min(
                          role["receiving_yards_recent_avg"] / 50,
                          1
                      ) * 20
                      +
                      min(
                          role["receptions_recent_avg"] / 5,
                          1
                      ) * 15
                  )

              elif position in ["WR", "TE"]:

                  score = (
                      min(
                          role["receiving_yards_recent_avg"] / 100,
                          1
                      ) * 40
                      +
                      min(
                          role["receptions_recent_avg"] / 8,
                          1
                      ) * 30
                      +
                      min(
                          role["receiving_yards_team_share"] / .40,
                          1
                      ) * 30
                  )

              else:
                  score = 0.0

              score = max(
                  0.0,
                  min(
                      100.0,
                      score
                  )
              )

              role["role_score"] = round(
                  score,
                  1
              )

              role["role_label"] = role_label(
                  score
              )

              return role

          role_cache = {}

          for _, row in current.iterrows():

              player_id = str(
                  row["player_id"]
              )

              role_cache[player_id] = player_role(
                  player_id,
                  str(row["recent_team"]),
                  str(row["position"])
              )

          print(
              "ROLE PROFILES:",
              len(role_cache)
          )

          # ==================================================
          # OPPONENT DEFENSIVE PRODUCTION
          # ==================================================
          #
          # Measures offensive production accumulated
          # AGAINST each defense before the target game.
          #
          # 2026 data receives more weight, while prior
          # seasons provide a stabilizing baseline.
          # ==================================================

          opponent_rows = df[
              df["opponent"].notna()
          ].copy()

          opponent_rows = opponent_rows[
              (
                  opponent_rows["season"] < SEASON
              )
              |
              (
                  (
                      opponent_rows["season"] == SEASON
                  )
                  &
                  (
                      opponent_rows["week"] < WEEK
                  )
              )
          ].copy()

          # Only positions relevant to player props.
          opponent_rows = opponent_rows[
              opponent_rows["position"].isin(
                  ["QB", "RB", "WR", "TE"]
              )
          ].copy()

          def defensive_game_totals(
              rows,
              defense,
              stat,
              positions,
              season_filter=None
          ):

              sample = rows[
                  (rows["opponent"] == defense) &
                  (rows["position"].isin(positions))
              ].copy()

              if season_filter is not None:

                  sample = sample[
                      sample["season"] == season_filter
                  ].copy()

              if sample.empty:
                  return np.array([], dtype=float)

              game_totals = (
                  sample.groupby(
                      [
                          "season",
                          "week",
                          "recent_team"
                      ]
                  )[stat]
                  .sum()
                  .to_numpy(
                      dtype=float
                  )
              )

              return game_totals

          def league_game_average(
              rows,
              stat,
              positions,
              season_filter=None
          ):

              sample = rows[
                  rows["position"].isin(
                      positions
                  )
              ].copy()

              if season_filter is not None:

                  sample = sample[
                      sample["season"] == season_filter
                  ].copy()

              if sample.empty:
                  return 0.0

              totals = (
                  sample.groupby(
                      [
                          "season",
                          "week",
                          "recent_team"
                      ]
                  )[stat]
                  .sum()
              )

              if totals.empty:
                  return 0.0

              return float(
                  totals.mean()
              )

          matchup_specs = {
              "passing_yards": ["QB"],

              "rushing_yards": [
                  "QB",
                  "RB",
                  "WR"
              ],

              "receiving_yards": [
                  "RB",
                  "WR",
                  "TE"
              ],

              "receptions": [
                  "RB",
                  "WR",
                  "TE"
              ]
          }

          matchup_cache = {}

          for defense in slate_teams:

              matchup_cache[defense] = {}

              for stat, positions in matchup_specs.items():

                  current_games = defensive_game_totals(
                      opponent_rows,
                      defense,
                      stat,
                      positions,
                      SEASON
                  )

                  historical_games = defensive_game_totals(
                      opponent_rows,
                      defense,
                      stat,
                      positions,
                      None
                  )

                  league_current = league_game_average(
                      opponent_rows,
                      stat,
                      positions,
                      SEASON
                  )

                  league_all = league_game_average(
                      opponent_rows,
                      stat,
                      positions,
                      None
                  )

                  current_avg = (
                      float(
                          np.mean(current_games)
                      )
                      if len(current_games)
                      else 0.0
                  )

                  historical_avg = (
                      float(
                          np.mean(historical_games)
                      )
                      if len(historical_games)
                      else 0.0
                  )

                  # ------------------------------------------
                  # SHRINK EARLY-SEASON DATA
                  # ------------------------------------------
                  #
                  # Week 3 only gives us two current-season
                  # games. Use current season as the primary
                  # signal, but stabilize it with historical
                  # defensive production.
                  # ------------------------------------------

                  current_n = len(
                      current_games
                  )

                  current_weight = min(
                      current_n / 6.0,
                      .65
                  )

                  if current_n == 0:
                      current_weight = 0.0

                  historical_weight = (
                      1.0 -
                      current_weight
                  )

                  if historical_avg <= 0:

                      historical_avg = (
                          league_all
                      )

                  if current_avg <= 0:

                      current_avg = (
                          historical_avg
                      )

                  blended_allowed = (
                      current_avg *
                      current_weight
                      +
                      historical_avg *
                      historical_weight
                  )

                  league_reference = (
                      league_current *
                      current_weight
                      +
                      league_all *
                      historical_weight
                  )

                  if league_reference <= 0:
                      league_reference = 1.0

                  ratio = (
                      blended_allowed /
                      league_reference
                  )

                  # Ratio > 1 means this defense has allowed
                  # more production than league baseline.
                  #
                  # Convert it into a centered 0-100 matchup
                  # score where ~50 is neutral.
                  score = (
                      50.0 +
                      (
                          ratio - 1.0
                      ) * 100.0
                  )

                  score = max(
                      0.0,
                      min(
                          100.0,
                          score
                      )
                  )

                  if score >= 65:
                      label = "FAVORABLE"

                  elif score <= 35:
                      label = "TOUGH"

                  else:
                      label = "NEUTRAL"

                  matchup_cache[
                      defense
                  ][stat] = {

                      "matchup_score":
                          round(
                              score,
                              1
                          ),

                      "matchup_label":
                          label,

                      "allowed_per_game":
                          round2(
                              blended_allowed
                          ),

                      "league_per_game":
                          round2(
                              league_reference
                          ),

                      "allowed_vs_league_ratio":
                          round(
                              ratio,
                              3
                          ),

                      "current_season_allowed":
                          round2(
                              current_avg
                          ),

                      "historical_allowed":
                          round2(
                              historical_avg
                          ),

                      "current_season_games":
                          int(
                              current_n
                          ),

                      "method":
                          "SHRUNK_DEFENSIVE_PRODUCTION"
                  }

          print(
              "DEFENSE PROFILES:",
              len(matchup_cache)
          )

          # ==================================================
          # MODEL FACTORY
          # ==================================================

          def make_model():

              preprocessor = ColumnTransformer(
                  transformers=[
                      (
                          "num",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="median"
                                      )
                                  ),
                                  (
                                      "scale",
                                      StandardScaler()
                                  )
                              ]
                          ),
                          numeric_features
                      ),
                      (
                          "cat",
                          Pipeline(
                              steps=[
                                  (
                                      "imputer",
                                      SimpleImputer(
                                          strategy="most_frequent"
                                      )
                                  ),
                                  (
                                      "onehot",
                                      OneHotEncoder(
                                          handle_unknown="ignore"
                                      )
                                  )
                              ]
                          ),
                          categorical_features
                      )
                  ]
              )

              return Pipeline(
                  steps=[
                      (
                          "prep",
                          preprocessor
                      ),
                      (
                          "model",
                          Ridge(
                              alpha=10.0
                          )
                      )
                  ]
              )

          # ==================================================
          # COMPRESS 20K DISTRIBUTION
          # ==================================================

          def compress_distribution(sims):

              values, counts = np.unique(
                  sims,
                  return_counts=True
              )

              histogram = [
                  [
                      int(value),
                      int(count)
                  ]
                  for value, count
                  in zip(
                      values,
                      counts
                  )
              ]

              if sum(
                  count
                  for _, count
                  in histogram
              ) != SIMS:

                  raise RuntimeError(
                      "Histogram compression failed."
                  )

              return histogram

          # ==================================================
          # TRAIN + SIMULATE
          # ==================================================

          results = []

          for target, positions in specs.items():

              print("")
              print("-" * 72)
              print("MODELING:", target)
              print("-" * 72)

              historical = model_df[
                  model_df["position"].isin(
                      positions
                  )
              ].copy()

              historical = historical[
                  (
                      historical["season"] < SEASON
                  )
                  |
                  (
                      (
                          historical["season"] == SEASON
                      )
                      &
                      (
                          historical["week"] < WEEK
                      )
                  )
              ].copy()

              if target == "passing_yards":

                  historical = historical[
                      historical["position"] == "QB"
                  ].copy()

              historical = historical.sort_values(
                  [
                      "season",
                      "week"
                  ]
              ).reset_index(
                  drop=True
              )

              if len(historical) < 200:
                  raise RuntimeError(
                      f"Insufficient history for {target}"
                  )

              split = int(
                  len(historical) * .80
              )

              fit_df = historical.iloc[
                  :split
              ].copy()

              calibration_df = historical.iloc[
                  split:
              ].copy()

              calibration_model = make_model()

              calibration_model.fit(
                  fit_df[feature_cols],
                  fit_df[target]
              )

              calibration_pred = (
                  calibration_model.predict(
                      calibration_df[
                          feature_cols
                      ]
                  )
              )

              residuals = (
                  calibration_df[
                      target
                  ].to_numpy(
                      dtype=float
                  )
                  -
                  calibration_pred
              )

              residuals = residuals[
                  np.isfinite(
                      residuals
                  )
              ]

              if len(residuals) < 100:
                  raise RuntimeError(
                      f"Insufficient residuals for {target}"
                  )

              final_model = make_model()

              final_model.fit(
                  historical[
                      feature_cols
                  ],
                  historical[
                      target
                  ]
              )

              eligible = current[
                  current["position"].isin(
                      positions
                  )
              ].copy()

              if target == "passing_yards":

                  eligible = eligible[
                      eligible["position"] == "QB"
                  ].copy()

              if eligible.empty:
                  continue

              projections = final_model.predict(
                  eligible[
                      feature_cols
                  ]
              )

              for i, (_, row) in enumerate(
                  eligible.iterrows()
              ):

                  projection = max(
                      0.0,
                      float(
                          projections[i]
                      )
                  )

                  # ------------------------------------------
                  # LOW-INFORMATION FILTER
                  # ------------------------------------------

                  if (
                      target == "passing_yards"
                      and projection < 25
                  ):
                      continue

                  if (
                      target == "rushing_yards"
                      and projection < 3
                  ):
                      continue

                  if (
                      target == "receiving_yards"
                      and projection < 5
                  ):
                      continue

                  if (
                      target == "receptions"
                      and projection < .5
                  ):
                      continue

                  # ------------------------------------------
                  # 20K EMPIRICAL DISTRIBUTION
                  # ------------------------------------------

                  sampled_errors = np.random.choice(
                      residuals,
                      size=SIMS,
                      replace=True
                  )

                  sims = (
                      projection +
                      sampled_errors
                  )

                  sims = np.maximum(
                      sims,
                      0
                  )

                  sims = np.rint(
                      sims
                  ).astype(int)

                  histogram = compress_distribution(
                      sims
                  )

                  player_id = str(
                      row["player_id"]
                  )

                  team = str(
                      row["recent_team"]
                  )

                  opponent = str(
                      row["opponent"]
                  )

                  role = role_cache.get(
                      player_id,
                      {}
                  )

                  matchup = (
                      matchup_cache
                      .get(
                          opponent,
                          {}
                      )
                      .get(
                          target,
                          {}
                      )
                  )

                  result = {

                      "player_id":
                          player_id,

                      "player":
                          str(
                              row[
                                  "player_display_name"
                              ]
                          ),

                      "team":
                          team,

                      "opponent":
                          opponent,

                      "position":
                          str(
                              row["position"]
                          ),

                      "game":
                          str(
                              row["game"]
                          ),

                      "prop":
                          target,

                      "projection":
                          round(
                              projection,
                              2
                          ),

                      "sim_mean":
                          round(
                              float(
                                  np.mean(sims)
                              ),
                              2
                          ),

                      "median":
                          round(
                              float(
                                  np.median(sims)
                              ),
                              2
                          ),

                      "p10":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      10
                                  )
                              ),
                              2
                          ),

                      "p25":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      25
                                  )
                              ),
                              2
                          ),

                      "p75":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      75
                                  )
                              ),
                              2
                          ),

                      "p90":
                          round(
                              float(
                                  np.percentile(
                                      sims,
                                      90
                                  )
                              ),
                              2
                          ),

                      "simulation_count":
                          SIMS,

                      "simulation_histogram":
                          histogram,

                      "latest_data_week":
                          int(
                              row["week"]
                          ),

                      "role":
                          role,

                      "matchup":
                          matchup
                  }

                  results.append(
                      result
                  )

          # ==================================================
          # SORT OUTPUT
          # ==================================================

          game_order = {
              game["game"]: i
              for i, game
              in enumerate(games)
          }

          prop_order = {
              "passing_yards": 0,
              "rushing_yards": 1,
              "receiving_yards": 2,
              "receptions": 3
          }

          results.sort(
              key=lambda x: (
                  game_order.get(
                      x["game"],
                      999
                  ),
                  x["team"],
                  x["player"],
                  prop_order.get(
                      x["prop"],
                      999
                  )
              )
          )

          # ==================================================
          # OUTPUT
          # ==================================================

          output = {

              "status":
                  "READY",

              "engine_version":
                  "JPRO_MATCHUP_INTELLIGENCE_V1",

              "season":
                  SEASON,

              "week":
                  WEEK,

              "slate":
                  f"{SEASON} Week {WEEK}",

              "game":
                  games[0]["game"]
                  if games
                  else "Current Slate",

              "games":
                  games,

              "simulations_per_prop":
                  SIMS,

              "distribution_format":
                  "COMPRESSED_EMPIRICAL_HISTOGRAM",

              "role_intelligence":
                  True,

              "matchup_intelligence":
                  True,

              "matchup_method":
                  "SHRUNK_DEFENSIVE_PRODUCTION",

              "generated_at_utc":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "sportsbook_line_mode":
                  "MANUAL_IPHONE_INPUT",

              "sportsbook_lines_connected":
                  False,

              "projections":
                  results
          }

          with open(
              "data/jpro-current-projections.json",
              "w"
          ) as f:

              json.dump(
                  output,
                  f,
                  separators=(
                      ",",
                      ":"
                  )
              )

          print("")
          print("=" * 72)
          print("JPRO MATCHUP INTELLIGENCE READY")
          print("=" * 72)

          print(
              "GAMES:",
              len(games)
          )

          print(
              "PLAYER PROPS:",
              len(results)
          )

          print(
              "ROLE PROFILES:",
              len(role_cache)
          )

          print(
              "DEFENSE PROFILES:",
              len(matchup_cache)
          )

          print(
              "SIMS PER PROP:",
              SIMS
          )

          print("=" * 72)

          PY

      - name: Verify JPro matchup intelligence
        run: |
          python <<'PY'
          import json

          SIMS = 20000

          with open(
              "data/jpro-current-projections.json"
          ) as f:

              d = json.load(f)

          print("=" * 72)
          print("JPRO MATCHUP INTELLIGENCE AUDIT")
          print("=" * 72)

          print(
              "ENGINE:",
              d.get("engine_version")
          )

          print(
              "SLATE:",
              d.get("slate")
          )

          print(
              "GAMES:",
              len(
                  d.get(
                      "games",
                      []
                  )
              )
          )

          projections = d.get(
              "projections",
              []
          )

          print(
              "PLAYER PROPS:",
              len(projections)
          )

          if not d.get(
              "role_intelligence"
          ):
              raise RuntimeError(
                  "Role intelligence missing."
              )

          if not d.get(
              "matchup_intelligence"
          ):
              raise RuntimeError(
                  "Matchup intelligence missing."
              )

          if not projections:
              raise RuntimeError(
                  "No projections."
              )

          role_count = 0
          matchup_count = 0

          scores = []

          for x in projections:

              histogram = x.get(
                  "simulation_histogram",
                  []
              )

              represented = sum(
                  int(entry[1])
                  for entry
                  in histogram
              )

              if represented != SIMS:
                  raise RuntimeError(
                      "20K distribution mismatch."
                  )

              role = x.get(
                  "role",
                  {}
              )

              if (
                  "role_score" in role
                  and
                  "role_label" in role
              ):
                  role_count += 1

              matchup = x.get(
                  "matchup",
                  {}
              )

              if (
                  "matchup_score" in matchup
                  and
                  "matchup_label" in matchup
              ):

                  matchup_count += 1

                  score = float(
                      matchup[
                          "matchup_score"
                      ]
                  )

                  if not (
                      0 <= score <= 100
                  ):
                      raise RuntimeError(
                          "Invalid matchup score."
                      )

                  scores.append(score)

          print(
              "PROPS WITH ROLE DATA:",
              role_count
          )

          print(
              "PROPS WITH MATCHUP DATA:",
              matchup_count
          )

          if matchup_count == 0:
              raise RuntimeError(
                  "No matchup profiles attached."
              )

          if scores:

              print(
                  "MATCHUP SCORE RANGE:",
                  round(min(scores), 1),
                  "to",
                  round(max(scores), 1)
              )

              print(
                  "MATCHUP SCORE AVG:",
                  round(
                      sum(scores) /
                      len(scores),
                      1
                  )
              )

          print("")
          print("MATCHUP PREVIEW")
          print("-" * 72)

          shown = 0

          for x in projections:

              matchup = x.get(
                  "matchup",
                  {}
              )

              if not matchup:
                  continue

              print(
                  x["player"],
                  "|",
                  x["team"],
                  "vs",
                  x["opponent"],
                  "|",
                  x["prop"],
                  "| MATCHUP:",
                  matchup.get(
                      "matchup_label"
                  ),
                  matchup.get(
                      "matchup_score"
                  ),
                  "| ALLOWED:",
                  matchup.get(
                      "allowed_per_game"
                  ),
                  "| LEAGUE:",
                  matchup.get(
                      "league_per_game"
                  ),
                  "| RATIO:",
                  matchup.get(
                      "allowed_vs_league_ratio"
                  ),
                  "| 2026 GAMES:",
                  matchup.get(
                      "current_season_games"
                  )
              )

              shown += 1

              if shown >= 25:
                  break

          print("")
          print(
              "JPRO MATCHUP INTELLIGENCE AUDIT PASSED"
          )

          PY

