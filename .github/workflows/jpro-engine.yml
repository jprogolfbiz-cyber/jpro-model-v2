name: JPro Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jpro-engine:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # GET JPRO
      # ============================================================

      - name: Get JPro
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # INSPECT CURRENT JPRO DATA STRUCTURE
      #
      # READ ONLY.
      # DOES NOT MODIFY OR SAVE ANYTHING.
      # ============================================================

      - name: Inspect JPro Market Data
        run: |
          python <<'PY'
          import json
          import os
          from pprint import pprint

          PATH = "data/jpro-current-projections.json"

          print("=" * 80)
          print("JPRO MARKET DATA DIAGNOSTIC")
          print("=" * 80)

          if not os.path.exists(PATH):
              raise RuntimeError(
                  f"Missing required file: {PATH}"
              )

          with open(
              PATH,
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          print("")
          print("TOP LEVEL KEYS:")
          print(sorted(data.keys()))

          projections = data.get(
              "projections",
              []
          )

          print("")
          print(
              "PROJECTIONS:",
              len(projections)
          )

          if not projections:
              raise RuntimeError(
                  "No projections found."
              )

          # ========================================================
          # FIRST PROJECTION STRUCTURE
          # ========================================================

          first = projections[0]

          print("")
          print("=" * 80)
          print("FIRST PROJECTION KEYS")
          print("=" * 80)

          print(
              sorted(
                  first.keys()
              )
          )

          # ========================================================
          # FIND MARKET-RELATED KEYS ACROSS PROJECTIONS
          # ========================================================

          market_keys = set()

          for prop in projections:

              for key in prop.keys():

                  key_lower = str(
                      key
                  ).lower()

                  if any(
                      word in key_lower
                      for word in [
                          "market",
                          "line",
                          "ladder",
                          "reference",
                          "fair",
                          "prob",
                          "pick"
                      ]
                  ):
                      market_keys.add(
                          key
                      )

          print("")
          print("=" * 80)
          print("MARKET-RELATED PROJECTION KEYS")
          print("=" * 80)

          if market_keys:

              for key in sorted(
                  market_keys
              ):
                  print(key)

          else:

              print(
                  "NONE FOUND AT PROJECTION LEVEL"
              )

          # ========================================================
          # FIND AUSTIN HOOPER
          # ========================================================

          hooper = [
              prop
              for prop in projections
              if "austin hooper"
              in str(
                  prop.get(
                      "player",
                      ""
                  )
              ).lower()
          ]

          print("")
          print("=" * 80)
          print("AUSTIN HOOPER RECORDS")
          print("=" * 80)

          print(
              "FOUND:",
              len(hooper)
          )

          for index, prop in enumerate(
              hooper,
              start=1
          ):

              print("")
              print("-" * 80)

              print(
                  "AUSTIN HOOPER RECORD",
                  index
              )

              print("-" * 80)

              print(
                  "PLAYER:",
                  prop.get(
                      "player"
                  )
              )

              print(
                  "TEAM:",
                  prop.get(
                      "team"
                  )
              )

              print(
                  "OPPONENT:",
                  prop.get(
                      "opponent"
                  )
              )

              print(
                  "PROP:",
                  prop.get(
                      "prop"
                  )
              )

              print(
                  "PROJECTION:",
                  prop.get(
                      "projection"
                  )
              )

              print(
                  "MEDIAN:",
                  prop.get(
                      "median"
                  )
              )

              print("")
              print(
                  "ALL TOP-LEVEL KEYS:"
              )

              print(
                  sorted(
                      prop.keys()
                  )
              )

              print("")
              print(
                  "MARKET-RELATED VALUES:"
              )

              found_market_value = False

              for key, value in prop.items():

                  key_lower = str(
                      key
                  ).lower()

                  if any(
                      word in key_lower
                      for word in [
                          "market",
                          "line",
                          "ladder",
                          "reference",
                          "fair",
                          "prob",
                          "pick"
                      ]
                  ):

                      found_market_value = True

                      print("")
                      print(
                          "KEY:",
                          key
                      )

                      pprint(
                          value,
                          width=120,
                          sort_dicts=False
                      )

              if not found_market_value:

                  print(
                      "NO MARKET-RELATED VALUES "
                      "FOUND ON THIS RECORD"
                  )

          # ========================================================
          # SEARCH NESTED DICTIONARIES
          # ========================================================

          print("")
          print("=" * 80)
          print("NESTED DICTIONARY STRUCTURE")
          print("=" * 80)

          nested_keys = {}

          for prop in projections[:100]:

              for key, value in prop.items():

                  if isinstance(
                      value,
                      dict
                  ):

                      if key not in nested_keys:

                          nested_keys[key] = set()

                      nested_keys[
                          key
                      ].update(
                          value.keys()
                      )

          for key in sorted(
              nested_keys.keys()
          ):

              print("")
              print(
                  "OBJECT:",
                  key
              )

              print(
                  "KEYS:",
                  sorted(
                      nested_keys[
                          key
                      ]
                  )
              )

          # ========================================================
          # TOP-LEVEL MARKET OBJECTS
          # ========================================================

          print("")
          print("=" * 80)
          print("TOP-LEVEL MARKET / PICK OBJECTS")
          print("=" * 80)

          found_top_level = False

          for key, value in data.items():

              key_lower = str(
                  key
              ).lower()

              if any(
                  word in key_lower
                  for word in [
                      "market",
                      "pick",
                      "line",
                      "ladder"
                  ]
              ):

                  found_top_level = True

                  print("")
                  print(
                      "TOP LEVEL KEY:",
                      key
                  )

                  if isinstance(
                      value,
                      list
                  ):

                      print(
                          "TYPE: list"
                      )

                      print(
                          "COUNT:",
                          len(value)
                      )

                      if value:

                          print(
                              "FIRST ITEM:"
                          )

                          pprint(
                              value[0],
                              width=120,
                              sort_dicts=False
                          )

                  elif isinstance(
                      value,
                      dict
                  ):

                      print(
                          "TYPE: dict"
                      )

                      print(
                          "KEYS:",
                          sorted(
                              value.keys()
                          )
                      )

                      pprint(
                          value,
                          width=120,
                          sort_dicts=False
                      )

                  else:

                      print(
                          "VALUE:",
                          value
                      )

          if not found_top_level:

              print(
                  "NO TOP-LEVEL MARKET OBJECTS FOUND"
              )

          # ========================================================
          # SEARCH RECURSIVELY FOR REFERENCE / ALT LINE KEYS
          # ========================================================

          print("")
          print("=" * 80)
          print("RECURSIVE MARKET KEY SEARCH")
          print("=" * 80)

          matches = []

          def walk(
              obj,
              path="root"
          ):

              if isinstance(
                  obj,
                  dict
              ):

                  for key, value in obj.items():

                      current_path = (
                          path
                          + "."
                          + str(key)
                      )

                      key_lower = str(
                          key
                      ).lower()

                      if any(
                          word in key_lower
                          for word in [
                              "reference_line",
                              "market_line",
                              "alt_line",
                              "ladder",
                              "fair_over",
                              "fair_under"
                          ]
                      ):

                          matches.append(
                              (
                                  current_path,
                                  value
                              )
                          )

                      walk(
                          value,
                          current_path
                      )

              elif isinstance(
                  obj,
                  list
              ):

                  # Limit recursion through massive simulation arrays.
                  for index, value in enumerate(
                      obj[:50]
                  ):

                      walk(
                          value,
                          path
                          + "["
                          + str(index)
                          + "]"
                      )

          # Search first 30 projections plus top-level metadata.
          search_object = {
              "top_level": {
                  key: value
                  for key, value in data.items()
                  if key != "projections"
              },
              "projections":
                  projections[:30]
          }

          walk(
              search_object
          )

          print(
              "MATCHES FOUND:",
              len(matches)
          )

          for index, (
              path,
              value
          ) in enumerate(
              matches[:100],
              start=1
          ):

              print("")
              print(
                  "MATCH",
                  index
              )

              print(
                  "PATH:",
                  path
              )

              print(
                  "VALUE:"
              )

              pprint(
                  value,
                  width=120,
                  sort_dicts=False
              )

          print("")
          print("=" * 80)
          print("DIAGNOSTIC COMPLETE - NO FILES MODIFIED")
          print("=" * 80)

          PY
