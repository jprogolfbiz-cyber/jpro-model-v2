          print("")
          print("=" * 72)
          print("JPRO OPPORTUNITY REDISTRIBUTION V1.6.1 VERIFIED")
          print("=" * 72)

          print(
              "V1.5.1 AVAILABILITY SOURCE: VERIFIED"
