name: JPro Opportunity Redistribution V1.6.2

on:

  workflow_dispatch:

permissions:

  contents: write

jobs:

  opportunity-engine:

    runs-on: ubuntu-latest

    steps:

      - name: Get JPro

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      # ============================================================

      # JPRO OPPORTUNITY REDISTRIBUTION V1.6.2

      #

      # PURPOSE:

      #

      # Diagnose every player currently blocked by the permanent

      # Availability Gate V1.5.1.

      #

      # This workflow DOES NOT:

      # - change projections

      # - change 20K distributions

      # - change Role V2

      # - change matchup intelligence

      # - change JPro Picks

      #

      # We first need to know WHY each player is blocked before

      # allowing that player to trigger opportunity redistribution.

      #

      # Example:

      #

      # OUT / INACTIVE:

      # Potentially valid redistribution trigger.

      #

      # DEVELOPMENT_PLAYER:

      # Should NOT redistribute NFL workload.

      #

      # CURRENT_PLAYER_TEAM_MISMATCH:

      # Should NOT redistribute workload for the stale team.

      #

      # CURRENT_ROSTER_UNAVAILABLE:

      # Needs further classification before redistribution.

      # ============================================================

      - name: Diagnose Blocked Players V1.6.2

        run: |

          python <<'PY'

          import json

          import os

          from collections import Counter, defaultdict

          PATH = "data/jpro-current-projections.json"

          OUTPUT = "data/jpro-availability-diagnostic.json"

          EXPECTED_SIMS = 20000

          print("=" * 78)

          print("JPRO BLOCKED PLAYER DIAGNOSTIC V1.6.2")

          print("=" * 78)

          # --------------------------------------------------------

          # LOAD

          # --------------------------------------------------------

          if not os.path.exists(PATH):

              raise RuntimeError(

                  f"Missing required file: {PATH}"

              )

          with open(PATH, "r", encoding="utf-8") as f:

              data = json.load(f)

          projections = data.get("projections", [])

          if not projections:

              raise RuntimeError(

                  "No projections found."

              )

          print("Projection rows:", len(projections))

          # --------------------------------------------------------

          # VERIFY AVAILABILITY GATE

          # --------------------------------------------------------

          gate = data.get(

              "jpro_availability_gate",

              {}

          )

          gate_version = gate.get("version")

          gate_status = gate.get("status")

          print(

              "Availability gate:",

              gate_version

          )

          print(

              "Availability status:",

              gate_status

          )

          if gate_status != "ACTIVE":

              raise RuntimeError(

                  "Availability gate is not ACTIVE."

              )

          if gate_version not in {

              "JPRO_AVAILABILITY_GATE_V1.5",

              "JPRO_AVAILABILITY_GATE_V1.5.1"

          }:

              raise RuntimeError(

                  "Unexpected availability gate version: "

                  + str(gate_version)

              )

          # --------------------------------------------------------

          # HELPERS

          # --------------------------------------------------------

          def clean(value):

              if value is None:

                  return None

              return str(value).strip()

          def upper(value):

              value = clean(value)

              if value is None:

                  return None

              return value.upper()

          def get_nested(prop):

              value = prop.get("availability")

              if isinstance(value, dict):

                  return value

              return {}

          def first_value(prop, nested, keys):

              for key in keys:

                  if key in prop:

                      value = prop.get(key)

                      if value is not None:

                          return value, "projection." + key

              for key in keys:

                  if key in nested:

                      value = nested.get(key)

                      if value is not None:

                          return value, "availability." + key

              return None, None

          STATUS_KEYS = [

              "model_player_status",

              "availability_status",

              "current_player_status",

              "roster_status",

              "status",

              "game_status",

              "injury_status"

          ]

          ELIGIBLE_KEYS = [

              "availability_eligible",

              "current_roster_eligible",

              "jpro_eligible",

              "eligible"

          ]

          REASON_KEYS = [

              "availability_reason",

              "block_reason",

              "blocked_reason",

              "reason",

              "roster_reason"

          ]

          SOURCE_KEYS = [

              "availability_source",

              "source",

              "roster_source"

          ]

          # --------------------------------------------------------

          # CLASSIFY REDISTRIBUTION SAFETY

          # --------------------------------------------------------

          CONFIRMED_TRIGGER_STATUSES = {

              "OUT",

              "INACTIVE",

              "INA",

              "IR",

              "PUP",

              "SUSPENDED"

          }

          NON_TRIGGER_STATUSES = {

              "DEVELOPMENT_PLAYER",

              "CURRENT_PLAYER_TEAM_MISMATCH",

              "TEAM_MISMATCH",

              "PRACTICE_SQUAD",

              "DEVELOPMENT",

              "RETIRED",

              "RELEASED",

              "WAIVED"

          }

          REVIEW_STATUSES = {

              "CURRENT_ROSTER_UNAVAILABLE",

              "UNAVAILABLE",

              "DOUBTFUL",

              "QUESTIONABLE",

              "UNKNOWN",

              "BLOCKED"

          }

          def trigger_classification(status):

              s = upper(status)

              if s in CONFIRMED_TRIGGER_STATUSES:

                  return "POTENTIAL_CONFIRMED_TRIGGER"

              if s in NON_TRIGGER_STATUSES:

                  return "DO_NOT_REDISTRIBUTE"

              if s in REVIEW_STATUSES:

                  return "REQUIRES_REVIEW"

              return "UNCLASSIFIED"

          # --------------------------------------------------------

          # COLLECT UNIQUE PLAYERS

          # --------------------------------------------------------

          players = {}

          for prop in projections:

              player_key = (

                  prop.get("player_id")

                  or (

                      str(prop.get("player"))

                      + "|"

                      + str(prop.get("team"))

                  )

              )

              if player_key not in players:

                  players[player_key] = {

                      "player_id": prop.get("player_id"),

                      "player": prop.get("player"),

                      "position": prop.get("position"),

                      "team": prop.get("team"),

                      "opponent": prop.get("opponent"),

                      "game": prop.get("game"),

                      "props": [],

                      "rows": []

                  }

              players[player_key]["props"].append(

                  prop.get("prop")

              )

              players[player_key]["rows"].append(

                  prop

              )

          print(

              "Unique projected players:",

              len(players)

          )

          # --------------------------------------------------------

          # ANALYZE EACH PLAYER

          # --------------------------------------------------------

          blocked_players = []

          eligible_players = []

          raw_status_counts = Counter()

          classification_counts = Counter()

          for player_key, player in players.items():

              rows = player["rows"]

              # All rows for a player should agree.

              # Capture every status encountered so inconsistencies

              # become visible rather than silently ignored.

              row_diagnostics = []

              any_blocked = False

              any_eligible = False

              for prop in rows:

                  gate_info = prop.get(

                      "jpro_availability_v15",

                      {}

                  )

                  if not isinstance(gate_info, dict):

                      gate_info = {}

                  gate_eligible = gate_info.get(

                      "eligible"

                  )

                  gate_row_status = gate_info.get(

                      "status"

                  )

                  nested = get_nested(prop)

                  raw_status, status_source = first_value(

                      prop,

                      nested,

                      STATUS_KEYS

                  )

                  raw_eligible, eligible_source = first_value(

                      prop,

                      nested,

                      ELIGIBLE_KEYS

                  )

                  raw_reason, reason_source = first_value(

                      prop,

                      nested,

                      REASON_KEYS

                  )

                  raw_source, source_source = first_value(

                      prop,

                      nested,

                      SOURCE_KEYS

                  )

                  # Permanent gate status is the authoritative

                  # eligibility decision.

                  if gate_eligible is True:

                      any_eligible = True

                  elif gate_eligible is False:

                      any_blocked = True

                  else:

                      # Fail closed for diagnostic purposes.

                      any_blocked = True

                  effective_status = (

                      gate_row_status

                      or raw_status

                      or "UNKNOWN"

                  )

                  row_diagnostics.append({

                      "prop": prop.get("prop"),

                      "gate_eligible":

                          gate_eligible,

                      "gate_status":

                          gate_row_status,

                      "raw_status":

                          raw_status,

                      "raw_status_source":

                          status_source,

                      "raw_eligible":

                          raw_eligible,

                      "raw_eligible_source":

                          eligible_source,

                      "reason":

                          raw_reason,

                      "reason_source":

                          reason_source,

                      "source":

                          raw_source,

                      "source_field":

                          source_source,

                      "effective_status":

                          upper(effective_status)

                  })

              # ----------------------------------------------------

              # PLAYER-LEVEL CONSISTENCY

              # ----------------------------------------------------

              statuses = sorted({

                  row.get("effective_status")

                  for row in row_diagnostics

                  if row.get("effective_status")

              })

              gate_statuses = sorted({

                  upper(row.get("gate_status"))

                  for row in row_diagnostics

                  if row.get("gate_status")

              })

              raw_statuses = sorted({

                  upper(row.get("raw_status"))

                  for row in row_diagnostics

                  if row.get("raw_status")

              })

              if any_blocked and any_eligible:

                  player_gate_state = "MIXED"

              elif any_blocked:

                  player_gate_state = "BLOCKED"

              else:

                  player_gate_state = "ELIGIBLE"

              if len(statuses) == 1:

                  effective_status = statuses[0]

              elif len(statuses) > 1:

                  effective_status = "MIXED_STATUS"

              else:

                  effective_status = "UNKNOWN"

              classification = trigger_classification(

                  effective_status

              )

              if player_gate_state == "BLOCKED":

                  raw_status_counts[

                      effective_status

                  ] += 1

                  classification_counts[

                      classification

                  ] += 1

              result = {

                  "player_id":

                      player["player_id"],

                  "player":

                      player["player"],

                  "position":

                      player["position"],

                  "team":

                      player["team"],

                  "opponent":

                      player["opponent"],

                  "game":

                      player["game"],

                  "projection_props":

                      sorted({

                          p

                          for p in player["props"]

                          if p is not None

                      }),

                  "projection_row_count":

                      len(rows),

                  "player_gate_state":

                      player_gate_state,

                  "effective_status":

                      effective_status,

                  "gate_statuses":

                      gate_statuses,

                  "raw_statuses":

                      raw_statuses,

                  "redistribution_classification":

                      classification,

                  "row_diagnostics":

                      row_diagnostics

              }

              if player_gate_state == "BLOCKED":

                  blocked_players.append(result)

              else:

                  eligible_players.append(result)

          # --------------------------------------------------------

          # SORT BLOCKED PLAYERS

          # --------------------------------------------------------

          priority = {

              "POTENTIAL_CONFIRMED_TRIGGER": 0,

              "REQUIRES_REVIEW": 1,

              "UNCLASSIFIED": 2,

              "DO_NOT_REDISTRIBUTE": 3

          }

          blocked_players.sort(

              key=lambda x: (

                  priority.get(

                      x[

                          "redistribution_classification"

                      ],

                      9

                  ),

                  str(x.get("team") or ""),

                  str(x.get("player") or "")

              )

          )

          # --------------------------------------------------------

          # VALIDATE 20K DISTRIBUTIONS REMAIN

          # --------------------------------------------------------

          verified_20k = 0

          for prop in projections:

              histogram = prop.get(

                  "simulation_histogram",

                  []

              )

              if not histogram:

                  continue

              total = sum(

                  int(row[1])

                  for row in histogram

                  if isinstance(row, list)

                  and len(row) >= 2

              )

              if total == EXPECTED_SIMS:

                  verified_20k += 1

          # --------------------------------------------------------

          # ROLE V2 COUNT

          # --------------------------------------------------------

          role_v2 = 0

          for prop in projections:

              role = prop.get("role", {})

              if (

                  isinstance(role, dict)

                  and role.get("role_method")

                  == "OPPORTUNITY_BLEND_V2"

              ):

                  role_v2 += 1

          # --------------------------------------------------------

          # EXISTING PICKS

          # --------------------------------------------------------

          candidates = data.get(

              "jpro_picks_candidates",

              []

          )

          # --------------------------------------------------------

          # OUTPUT DIAGNOSTIC FILE

          # --------------------------------------------------------

          diagnostic = {

              "version":

                  "JPRO_AVAILABILITY_DIAGNOSTIC_V1.6.2",

              "status":

                  "DIAGNOSTIC_COMPLETE",

              "source_file":

                  PATH,

              "availability_gate_version":

                  gate_version,

              "availability_gate_status":

                  gate_status,

              "projection_rows":

                  len(projections),

              "unique_projected_players":

                  len(players),

              "eligible_unique_players":

                  len(eligible_players),

              "blocked_unique_players":

                  len(blocked_players),

              "verified_20k_distributions":

                  verified_20k,

              "role_v2_records":

                  role_v2,

              "jpro_candidate_count":

                  len(candidates),

              "blocked_status_counts":

                  dict(raw_status_counts),

              "redistribution_classification_counts":

                  dict(classification_counts),

              "confirmed_trigger_statuses":

                  sorted(

                      CONFIRMED_TRIGGER_STATUSES

                  ),

              "non_trigger_statuses":

                  sorted(

                      NON_TRIGGER_STATUSES

                  ),

              "review_statuses":

                  sorted(

                      REVIEW_STATUSES

                  ),

              "blocked_players":

                  blocked_players,

              "important_note":

                  (

                      "This diagnostic does not alter projections. "

                      "A blocked roster record is not automatically "

                      "an injury redistribution trigger."

                  )

          }

          with open(

              OUTPUT,

              "w",

              encoding="utf-8"

          ) as f:

              json.dump(

                  diagnostic,

                  f,

                  indent=2

              )

          # --------------------------------------------------------

          # PRINT REPORT

          # --------------------------------------------------------

          print("")

          print("=" * 78)

          print("BLOCKED PLAYER SUMMARY")

          print("=" * 78)

          print(

              "Blocked unique players:",

              len(blocked_players)

          )

          print(

              "Eligible unique players:",

              len(eligible_players)

          )

          print(

              "20K distributions preserved:",

              verified_20k

          )

          print(

              "Role V2 records preserved:",

              role_v2

          )

          print(

              "JPro Picks candidates preserved:",

              len(candidates)

          )

          print("")

          print("BLOCKED STATUS COUNTS")

          for status, count in sorted(

              raw_status_counts.items()

          ):

              print(

                  " ",

                  status,

                  ":",

                  count

              )

          print("")

          print("REDISTRIBUTION CLASSIFICATIONS")

          for classification, count in sorted(

              classification_counts.items()

          ):

              print(

                  " ",

                  classification,

                  ":",

                  count

              )

          print("")

          print("=" * 78)

          print("ALL BLOCKED PLAYERS")

          print("=" * 78)

          if not blocked_players:

              print("No blocked players found.")

          for i, player in enumerate(

              blocked_players,

              start=1

          ):

              print("")

              print(

                  f"#{i}",

                  player.get("player"),

                  "|",

                  player.get("team"),

                  "|",

                  player.get("position")

              )

              print(

                  "  GAME:",

                  player.get("game")

              )

              print(

                  "  OPPONENT:",

                  player.get("opponent")

              )

              print(

                  "  GATE STATE:",

                  player.get(

                      "player_gate_state"

                  )

              )

              print(

                  "  EFFECTIVE STATUS:",

                  player.get(

                      "effective_status"

                  )

              )

              print(

                  "  GATE STATUSES:",

                  player.get(

                      "gate_statuses"

                  )

              )

              print(

                  "  RAW STATUSES:",

                  player.get(

                      "raw_statuses"

                  )

              )

              print(

                  "  REDISTRIBUTION:",

                  player.get(

                      "redistribution_classification"

                  )

              )

              print(

                  "  PROPS:",

                  ", ".join(

                      player.get(

                          "projection_props",

                          []

                      )

                  )

              )

              print(

                  "  ROWS:",

                  player.get(

                      "projection_row_count"

                  )

              )

              # Print compact row evidence.

              for row in player.get(

                  "row_diagnostics",

                  []

              )[:4]:

                  print(

                      "    -",

                      row.get("prop"),

                      "| gate_status=",

                      row.get("gate_status"),

                      "| raw_status=",

                      row.get("raw_status"),

                      "| reason=",

                      row.get("reason")

                  )

          print("")

          print("=" * 78)

          print("JPRO AVAILABILITY DIAGNOSTIC V1.6.2 COMPLETE")

          print("=" * 78)

          print("")

          print("Saved:", OUTPUT)

          print("")

          print(

              "NO PROJECTIONS WERE MODIFIED."

          )

          print(

              "NO 20K DISTRIBUTIONS WERE MODIFIED."

          )

          print(

              "NO JPRO PICKS WERE MODIFIED."

          )

          PY

      # ============================================================

      # VERIFY DIAGNOSTIC

      # ============================================================

      - name: Verify Availability Diagnostic V1.6.2

        run: |

          python <<'PY'

          import json

          import os

          PATH = "data/jpro-current-projections.json"

          DIAGNOSTIC = "data/jpro-availability-diagnostic.json"

          EXPECTED_SIMS = 20000

          print("=" * 78)

          print("VERIFY JPRO AVAILABILITY DIAGNOSTIC V1.6.2")

          print("=" * 78)

          if not os.path.exists(PATH):

              raise RuntimeError(

                  "Projection file missing."

              )

          if not os.path.exists(DIAGNOSTIC):

              raise RuntimeError(

                  "Diagnostic file missing."

              )

          with open(PATH, "r", encoding="utf-8") as f:

              data = json.load(f)

          with open(

              DIAGNOSTIC,

              "r",

              encoding="utf-8"

          ) as f:

              diagnostic = json.load(f)

          if (

              diagnostic.get("version")

              != "JPRO_AVAILABILITY_DIAGNOSTIC_V1.6.2"

          ):

              raise RuntimeError(

                  "Wrong diagnostic version."

              )

          if (

              diagnostic.get("status")

              != "DIAGNOSTIC_COMPLETE"

          ):

              raise RuntimeError(

                  "Diagnostic did not complete."

              )

          projections = data.get(

              "projections",

              []

          )

          if not projections:

              raise RuntimeError(

                  "No projections."

              )

          # --------------------------------------------------------

          # VERIFY 20K DISTRIBUTIONS

          # --------------------------------------------------------

          verified_20k = 0

          for prop in projections:

              histogram = prop.get(

                  "simulation_histogram",

                  []

              )

              if not histogram:

                  continue

              total = sum(

                  int(row[1])

                  for row in histogram

                  if isinstance(row, list)

                  and len(row) >= 2

              )

              if total != EXPECTED_SIMS:

                  raise RuntimeError(

                      "20K distribution changed for "

                      + str(prop.get("player"))

                      + " / "

                      + str(prop.get("prop"))

                  )

              verified_20k += 1

          # --------------------------------------------------------

          # VERIFY ROLE V2

          # --------------------------------------------------------

          role_v2 = sum(

              1

              for prop in projections

              if isinstance(

                  prop.get("role"),

                  dict

              )

              and prop.get(

                  "role",

                  {}

              ).get("role_method")

              == "OPPORTUNITY_BLEND_V2"

          )

          # --------------------------------------------------------

          # VERIFY AVAILABILITY GATE

          # --------------------------------------------------------

          gate = data.get(

              "jpro_availability_gate",

              {}

          )

          if gate.get("status") != "ACTIVE":

              raise RuntimeError(

                  "Availability gate no longer active."

              )

          # --------------------------------------------------------

          # VERIFY PICKS STILL PRESENT

          # --------------------------------------------------------

          candidates = data.get(

              "jpro_picks_candidates",

              []

          )

          if not candidates:

              raise RuntimeError(

                  "JPro Picks candidates disappeared."

              )

          # --------------------------------------------------------

          # VERIFY BLOCKED COUNT

          # --------------------------------------------------------

          blocked = diagnostic.get(

              "blocked_players",

              []

          )

          blocked_count = diagnostic.get(

              "blocked_unique_players",

              0

          )

          if len(blocked) != blocked_count:

              raise RuntimeError(

                  "Blocked player count mismatch."

              )

          # Every blocked player must have a classification.

          for player in blocked:

              classification = player.get(

                  "redistribution_classification"

              )

              if classification not in {

                  "POTENTIAL_CONFIRMED_TRIGGER",

                  "REQUIRES_REVIEW",

                  "DO_NOT_REDISTRIBUTE",

                  "UNCLASSIFIED"

              }:

                  raise RuntimeError(

                      "Invalid redistribution classification "

                      "for "

                      + str(player.get("player"))

                  )

          print(

              "Projection rows:",

              len(projections)

          )

          print(

              "20K distributions:",

              verified_20k

          )

          print(

              "Role V2 records:",

              role_v2

          )

          print(

              "Availability gate:",

              gate.get("version")

          )

          print(

              "Availability status:",

              gate.get("status")

          )

          print(

              "JPro Picks candidates:",

              len(candidates)

          )

          print(

              "Blocked unique players:",

              blocked_count

          )

          print("")

          print("=" * 78)

          print("BLOCKED PLAYER CLASSIFICATIONS")

          print("=" * 78)

          counts = diagnostic.get(

              "redistribution_classification_counts",

              {}

          )

          for key, value in sorted(

              counts.items()

          ):

              print(

                  key + ":",

                  value

              )

          print("")

          print("=" * 78)

          print("BLOCKED PLAYERS")

          print("=" * 78)

          for i, player in enumerate(

              blocked,

              start=1

          ):

              print(

                  f"{i}.",

                  player.get("player"),

                  "|",

                  player.get("team"),

                  "|",

                  player.get("position"),

                  "| STATUS:",

                  player.get("effective_status"),

                  "| CLASS:",

                  player.get(

                      "redistribution_classification"

                  )

              )

          print("")

          print("=" * 78)

          print("JPRO AVAILABILITY DIAGNOSTIC V1.6.2 VERIFIED")

          print("=" * 78)

          print(

              "PROJECTIONS UNCHANGED: YES"

          )

          print(

              "20K DISTRIBUTIONS PRESERVED: YES"

          )

          print(

              "ROLE V2 PRESERVED: YES"

          )

          print(

              "JPRO PICKS PRESERVED: YES"

          )

          print("")

          print(

              "NEXT: use these exact statuses to determine "

              "which blocked players can trigger redistribution."

          )

          PY

      # ============================================================

      # SAVE DIAGNOSTIC

      # ============================================================

      - name: Save Availability Diagnostic V1.6.2

        run: |

          git config user.name "JPro Opportunity Engine"

          git config user.email "actions@github.com"

          git add data/jpro-availability-diagnostic.json

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Add availability diagnostic V1.6.2"

            git push

          fi
