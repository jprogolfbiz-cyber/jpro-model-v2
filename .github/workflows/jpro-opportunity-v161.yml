          import json
          import os

          CURRENT_PATH = "data/jpro-current-projections.json"
          OUTPUT_PATH = "data/jpro-opportunity-redistribution-v161.json"

          EXPECTED_SIMS = 20000

          print("=" * 72)
          print("VERIFY JPRO OPPORTUNITY REDISTRIBUTION V1.6.1")
          print("=" * 72)

          if not os.path.exists(
              OUTPUT_PATH
          ):
              raise RuntimeError(
                  "V1.6.1 audit file missing."
              )

          with open(
              OUTPUT_PATH,
              "r",
              encoding="utf-8"
          ) as f:
              audit = json.load(f)

          with open(
              CURRENT_PATH,
              "r",
              encoding="utf-8"
          ) as f:
              current = json.load(f)

          if (
              audit.get("version")
              != "JPRO_OPPORTUNITY_REDISTRIBUTION_V1.6.1"
          ):
              raise RuntimeError(
                  "Wrong V1.6.1 version."
              )

          if (
              audit.get("status")
              != "AUDIT_READY"
          ):
              raise RuntimeError(
                  "V1.6.1 audit is not ready."
              )

          if (
              audit.get("mode")
              != "AUDIT_ONLY"
          ):
              raise RuntimeError(
                  "V1.6.1 unexpectedly left audit-only mode."
              )

          if (
              audit.get(
                  "availability_source"
              )
              != "JPRO_AVAILABILITY_GATE_V1.5.1"
          ):
              raise RuntimeError(
                  "Wrong availability source."
              )

          if audit.get(
              "projection_changes_applied"
          ):
              raise RuntimeError(
                  "V1.6.1 modified projections."
              )

          if audit.get(
              "simulation_changes_applied"
          ):
              raise RuntimeError(
                  "V1.6.1 modified simulations."
              )

          projections = current.get(
              "projections",
              []
          )

          if not projections:
              raise RuntimeError(
                  "Current projections missing."
              )

          # --------------------------------------------------------
          # VERIFY 20K DISTRIBUTIONS PRESERVED
          # --------------------------------------------------------

          verified_20k = 0

          for prop in projections:

              histogram = prop.get(
                  "simulation_histogram",
                  []
              )

              if not histogram:
                  continue

              total = sum(
                  int(row[1])
                  for row in histogram
                  if isinstance(row, list)
                  and len(row) >= 2
              )

              if total == EXPECTED_SIMS:
                  verified_20k += 1

          if verified_20k == 0:
              raise RuntimeError(
                  "20K distributions missing."
              )

          # --------------------------------------------------------
          # VERIFY ROLE V2 PRESERVED
          # --------------------------------------------------------

          role_v2 = 0

          for prop in projections:

              role = prop.get(
                  "role",
                  {}
              )

              if (
                  isinstance(role, dict)
                  and role.get(
                      "role_method"
                  )
                  == "OPPORTUNITY_BLEND_V2"
              ):
                  role_v2 += 1

          if role_v2 == 0:
              raise RuntimeError(
                  "Role V2 missing."
              )

          # --------------------------------------------------------
          # VERIFY CURRENT TRIGGER LOGIC
          # --------------------------------------------------------

          trigger_players = audit.get(
              "trigger_players",
              []
          )

          ignored = audit.get(
              "ignored_blocked_players",
              []
          )

          for player in trigger_players:

              if (
                  player.get("status")
                  != "CURRENT_ROSTER_UNAVAILABLE"
              ):
                  raise RuntimeError(
                      "Invalid redistribution trigger: "
                      + str(
                          player.get(
                              "player"
                          )
                      )
                      + " / "
                      + str(
                          player.get(
                              "status"
                          )
                      )
                  )

          for player in ignored:

              if (
                  player.get("status")
                  == "CURRENT_ROSTER_UNAVAILABLE"
              ):
                  raise RuntimeError(
                      "Current-roster unavailable player "
                      "was incorrectly ignored: "
                      + str(
                          player.get(
                              "player"
                          )
                      )
                  )

          # --------------------------------------------------------
          # VERIFY BENEFICIARIES
          # --------------------------------------------------------

          proposed = audit.get(
              "proposed_adjustments",
              []
          )

          for row in proposed:

              if not row.get(
                  "beneficiary_currently_eligible"
              ):
                  raise RuntimeError(
                      "Ineligible beneficiary found: "
                      + str(
                          row.get(
                              "beneficiary"
                          )
                      )
                  )

              if (
                  row.get(
                      "trigger_availability_status"
                  )
                  != "CURRENT_ROSTER_UNAVAILABLE"
              ):
                  raise RuntimeError(
                      "Adjustment triggered by invalid "
                      "availability status."
                  )

              if row.get(
                  "projection_adjustment_applied"
              ):
                  raise RuntimeError(
                      "Projection adjustment was applied "
                      "during audit."
                  )

              if row.get(
                  "simulation_adjustment_applied"
              ):
                  raise RuntimeError(
                      "Simulation adjustment was applied "
                      "during audit."
                  )

              if (
                  row.get(
                      "trigger_player_id"
                  )
                  and row.get(
                      "beneficiary_player_id"
                  )
                  and str(
                      row.get(
                          "trigger_player_id"
                      )
                  )
                  == str(
                      row.get(
                          "beneficiary_player_id"
                      )
                  )
              ):
                  raise RuntimeError(
                      "Self-beneficiary relationship found."
                  )

          # --------------------------------------------------------
          # COUNTS
          # --------------------------------------------------------

          print(
              "Current projection rows:",
              len(projections)
          )

          print(
